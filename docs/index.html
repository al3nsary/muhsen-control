/* ============================================================
   معاينة التطبيق — ومعالجة المهمّة بصفة الميدان

   طلبتَها مرّتين: أن ترى كيف تظهر المهمّة للمحسن وللّيدر في جوّاله،
   وأن تُعالجها بصفته لترى الإجراء نفسه. فهنا هاتفٌ داخل الدرج يرسم
   شاشة التطبيق بعينها من بيانات المهمّة نفسها — لا صورةً ولا محاكاة.

   وله وضعان: **معاينة** يُقرأ ولا يُلمس، و**معالجة بصفته** تعمل أزراره
   فعلًا. وكلّ فعلٍ في الوضع الثاني يُسجَّل في سجلّ المهمّة باسم من نُفِّذ
   بصفته ومعه «من الكنترول» — فلا يُنسب إلى الميدان ما لم يفعله.
   ============================================================ */

const APP_ST = {
  pending_assign: { t:'بانتظار التسكين', c:'wait' },
  assigned:       { t:'مُسكَّنة',        c:'grey' },
  running:        { t:'جارية الآن',      c:'live' },
  done:           { t:'منجزة',           c:'live' },
  cancelled:      { t:'ملغاة',           c:'no'   }
};
const appStOf = t => APP_ST[t.status] || APP_ST.assigned;

/* بصفة من نُعاين؟ الليدر يرى كلّ شيء، والمحسن يرى دوره وحده */
const avAs = t => (S.avq && S.avq[t.id]) || 'leader';
const avLive = t => !!(S.avq && S.avq[t.id + ':live']);

/* المحسن الذي نتقمّصه حين نعاين بصفة محسن */
function avMuhsen(t) {
  const pick = S.avq && S.avq[t.id + ':m'];
  const team = t.assigned.map(userById).filter(Boolean);
  return (pick && team.find(u => u.id === pick)) || team[0] || null;
}

/* ---------- شاشة التطبيق داخل هاتف ---------- */
function appScreen(t) {
  const L = userById(t.leaderId) || {};
  const asLead = avAs(t) === 'leader';
  const me = asLead ? L : avMuhsen(t);
  const live = avLive(t);
  const st = appStOf(t);
  const done = t.status === 'done', running = tState(t) === 'live';
  const doneSubs = t.subs.filter(s => s.done).length;
  const att = t.attended.length;
  const attMe = me ? t.attended.indexOf(me.id) >= 0 : false;
  const act = (a, extra) => live ? ' data-a="' + a + '" data-id="' + t.id + '"' + (extra || '') : ' disabled';

  return '<div class="phone' + (live ? ' live' : '') + '">' +
    '<div class="pbar">' + icon('i-back','s16') +
      '<b>تفاصيل المهمة</b>' +
      (me ? avatar(me, 'sm') : '<span></span>') + '</div>' +
    '<div class="pbody">' +

      /* بطاقة الخدمة — كما في التطبيق: عنوان ووصف ومكان ومصغّرة */
      '<div class="pc gold"><div class="prow2">' +
        '<span class="sp"><b>' + E(t.title) + '</b>' +
          '<span class="ps">' + E(t.desc || '') + '</span>' +
          '<span class="ps dim">' + E(t.place) + '</span>' +
          '<span class="ps dim">' + E(t.city) + '</span></span>' +
        '<span class="pthumb bg-' + (CAT[t.kind] || {}).photo + '"></span>' +
      '</div>' +
      '<div class="prow3">' + pill(st.t, st.c) +
        '<span class="ps dim">' + E((orgById(t.orgId) || {}).ar || '') + ' · ' + E(t.kt) + '</span>' +
      '</div></div>' +

      /* البيانات الأربع */
      '<div class="pmeta">' +
        '<div><span>رقم المهمة</span><b>' + AR(t.code) + '</b></div>' +
        '<div><span>التاريخ</span><b>' + hijri(t.start) + '</b></div>' +
        '<div><span>الوقت</span><b class="num">' + t12(t.start) + '</b></div>' +
        '<div><span>المدة</span><b class="num">' + AR(t.durH) + ' ساعات</b></div>' +
      '</div>' +

      /* الحضور: ما يراه صاحب الصفة عن نفسه */
      (me && !done ? (attMe
        ? '<div class="pn ok">' + icon('i-checkc','s14') + '<span>حضورك مُثبَت</span></div>'
        : '<button class="pcta sm"' + act('avattend', ' data-s="' + me.id + '"') + '>' +
          icon('i-target','s16') + '<span><b>إثبات الحضور</b><i>' +
          (running ? 'المهمة بدأت — أثبت حضورك الآن' : 'يُفتح التحضير قبل المهمة بساعتين') +
          '</i></span></button>') : '') +

      /* البدء والإنهاء — للّيدر وحده، كما في التطبيق */
      (asLead && !done && !running
        ? '<button class="pcta"' + act('avstart') + '>' + icon('i-play','s20') +
          '<span><b>بدء المهمة</b><i>وتبدأ تلقائيًّا ' + t12(t.start) + ' على كل حال</i></span></button>' : '') +
      (!asLead && !done
        ? '<div class="pn">' + icon('i-info','s14') +
          '<span>الليدر هو من يبدأ المهمة ويؤشّر على الإنجاز.</span></div>' : '') +
      (t.autoStarted ? '<div class="pn bad">' + icon('i-warn','s14') +
        '<span>بدأها النظام تلقائيًّا — حان وقتها ولم يبدأها ليدرها.</span></div>' : '') +

      /* المهام الفرعية — يؤشّر عليها الليدر، ويراها المحسن */
      '<div class="plbl">المهام الفرعية<small>' + AR(doneSubs) + ' من ' + AR(t.subs.length) + '</small></div>' +
      '<div class="psubs">' + t.subs.map((s, i) => {
        const next = i === t.subs.findIndex(x => !x.done) && running;
        return '<div class="psub' + (s.done ? ' on' : '') + (next ? ' next' : '') + '">' +
          '<button class="pt"' + (asLead ? act('avsub', ' data-s="' + s.id + '"') : ' disabled') + '>' +
            '<span class="ptick">' + (s.done ? icon('i-check','s12') : '') + '</span>' +
            '<span class="sp">' + E(s.name) + '</span>' +
            (s.done ? '<span class="ps dim num">' + t12(s.at) + '</span>'
                    : next ? '<span class="ps gold">التالية</span>' : '') +
          '</button>' +
          (s.shot ? '<span class="pshot bg-' + s.shot.img + '"></span>' : '') +
        '</div>';
      }).join('') + '</div>' +

      /* الفريق */
      (asLead
        ? '<div class="plbl">المحسنون على المهمة<small>' + AR(att) + ' أثبتوا حضورهم</small></div>' +
          '<div class="pteam">' + t.assigned.map(userById).filter(Boolean).slice(0, 6).map(m =>
            '<div class="pmate">' + avatar(m, 'sm') +
            '<span class="sp"><b>' + E(m.name) + '</b><span class="ps dim">' + E(m.specialty || '') + '</span></span>' +
            (t.attended.indexOf(m.id) >= 0 ? pill('حاضر','live') : pill('لم يحضر','grey')) + '</div>').join('') +
          '</div>' : '') +

      /* الملاحظات كما تصل المحسن */
      (t.notes.length ? '<div class="plbl">ملاحظات المهمة</div>' +
        t.notes.slice(0, 3).map(n => '<div class="pn">' + icon('i-edit','s14') +
          '<span>' + E(n.text) + '</span></div>').join('') : '') +

      /* الإنهاء */
      (asLead && running
        ? '<button class="pcta stop"' + act('avend') + '>' + icon('i-stop','s20') +
          '<span><b>إنهاء المهمة</b><i>' + AR(doneSubs) + ' من ' + AR(t.subs.length) +
          ' مهمة فرعية منجزة</i></span></button>' : '') +
      (done ? '<div class="pn ok">' + icon('i-checkc','s14') +
        '<span>أُنجزت المهمة' + (t.closedBy === 'system' ? ' — أُغلقت من قبل النظام' : '') + '</span></div>' : '') +
    '</div>' +
    '<div class="ptabs"><span class="on">المهام</span><span>الفريق</span><span>الصور</span><span>حسابي</span></div>' +
  '</div>';
}

      icon('i-back','s16') + 'رجوع إلى المهمة</button>' };

/* الفاعل في وضع المعالجة — ومن يُنسب إليه الفعل */
function avWho(t) {
  const u = avAs(t) === 'leader' ? userById(t.leaderId) : avMuhsen(t);
  return u || { id:null, name:'الميدان' };
}
function avAct(t, text, kind) {
  const u = avWho(t);
  txLog(t, text + ' — بصفة ' + u.name + ' من الكنترول', kind || 'info');
  logIt('الكنترول عالج مهمة ' + t.title + ' بصفة ' + u.name + ': ' + text, 'task');
}

        '<span>' + E((u || {}).specialty || '') + ' · ' +
          (d.keepGroup ? 'ويبقى محسنًا في المهمة' : 'ليدر لهذه المهمة وحدها') + '</span></span>' +
        pill(d.state === 'accepted' ? 'مقبول' : d.state === 'pending' ? 'بانتظار' : 'مرفوض',

/* ============================================================
   تفصيل التقييم — ثلاثة مصادر كما في التطبيق
   ============================================================ */
const RATE_PARTS = {
  prep:  { ar:'التحضير والحضور', w:40 },
  start: { ar:'الالتزام بوقت البدء', w:20 },
  subs:  { ar:'إنجاز الخطوات', w:25 },
  close: { ar:'الإغلاق في وقته', w:15 }
};

/* يُحسب من الوقائع لا يُخترع — نفس معادلة التطبيق */
function rateOf(t) {
  const acc = t.assigned.length;
  const prep = acc ? t.attended.length / acc : 0;
  const start = t.autoStarted ? 0 : (t.startedAt && t.startedAt <= t.start) ? 1
    : t.startedAt ? Math.max(0, 1 - (t.startedAt - t.start) / HR) : (t.status === 'done' ? 1 : 0);
  const subs = t.subs.length ? t.subs.filter(s => s.done).length / t.subs.length : 0;
  const close = t.status !== 'done' ? 0 : (t.endedAt && t.endedAt > t.end)
    ? Math.max(0, 1 - (t.endedAt - t.end) / HR) : 1;
  const pct = prep * .40 + start * .20 + subs * .25 + close * .15;
  return { prep:Math.round(prep * 100), start:Math.round(start * 100),
    subs:Math.round(subs * 100), close:Math.round(close * 100),
    total:Math.round(pct * 100), stars:Math.max(1, Math.round(pct * 5 * 2) / 2) };
}

function rateDrawer(id) {
  const t = ensureTask(taskById(id)); if (!t) return;
  const r = rateOf(t);
  const seed = Number(String(t.code).replace(/\D/g, '')) || 1;
  const clamp = v => Math.max(1, Math.min(5, Math.round(v * 2) / 2));
  const sup = clamp(r.stars + ((seed % 5) - 2) * .5);
  const pil = clamp(r.stars + (((seed + 3) % 5) - 2) * .5);

  const bar = (k, v) => '<div style="margin-bottom:12px">' +
    '<div class="fl" style="justify-content:space-between"><span class="tiny">' + RATE_PARTS[k].ar +
      '<span class="faint"> · وزنه ' + AR(RATE_PARTS[k].w) + '٪</span></span>' +
      '<b class="tiny num">' + AR(v) + '٪</b></div>' +
    '<div class="meter' + (v >= 80 ? '' : v >= 50 ? ' gold' : ' red') + '" style="margin-top:5px">' +
      '<i data-w="' + v + '"></i></div></div>';

  S.drawer = { title:'تقييم المهمة', sub:t.title + ' · ' + t.kt, icon:'i-star',
    wide:!!S.dwide, expand:t.id, body:
    '<div class="card gold">' +
      head('المحصّلة', 'ثلاثة مصادر لا مصدر واحد',
        pill(AR(Math.round((r.stars + sup + pil) / 3 * 10) / 10) + ' من ٥', 'gold'), 'i-star') +
      '<div class="grid g3" style="gap:10px">' +
        '<span style="text-align:center"><div class="tiny faint">النظام</div>' +
          '<div style="margin-top:6px">' + stars(r.stars) + '</div></span>' +
        '<span style="text-align:center"><div class="tiny faint">المشرف</div>' +
          '<div style="margin-top:6px">' + stars(sup) + '</div></span>' +
        '<span style="text-align:center"><div class="tiny faint">الحجاج</div>' +
          '<div style="margin-top:6px">' + stars(pil) + '</div></span>' +
      '</div></div>' +

    '<div class="card">' +
      head('كيف حسبه النظام', 'أربعة مكوّنات بأوزانها — تُقرأ ولا تُساوَم', '', 'i-list') +
      Object.keys(RATE_PARTS).map(k => bar(k, r[k])).join('') +
      '<div class="tiny faint">المجموع الموزون ' + AR(r.total) + '٪ — أي ' +
        AR(r.stars) + ' من ٥ نجوم.</div>' +
    '</div>' +

    '<div class="card">' +
      head('ما وراء الأرقام', 'ملاحظتان تُقرآن مع النجوم', '', 'i-edit') +
      '<div class="evt info"><span class="dot"></span><span class="sp"><b>المشرف</b><p>' +
        (r.prep >= 80 ? 'التزم الفريق بالحضور قبل الموعد، والتنسيق مع الفندق كان مرتّبًا.'
          : 'تأخّر جزءٌ من الفريق عن التحضير، ونُبّه ليدر المجموعة.') + '</p></span></div>' +
      '<div class="evt info"><span class="dot"></span><span class="sp"><b>الحجاج</b><p>' +
        (pil >= 4 ? 'ثناءٌ على وضوح الإرشاد وحُسن التعامل في المجموعة.'
          : 'ملاحظاتٌ على الانتظار في نقطة التجمّع وطول مدّته.') + '</p></span></div>' +
    '</div>' +

    '<button class="btn l" data-a="tlopen" data-id="' + t.id + '">' +
      icon('i-back','s16') + 'رجوع إلى المهمة</button>' };
  renderDrawer();
}

/* ============================================================
   الخط الزمني للموسم — كل مهام كل الفرق في شاشة واحدة
   ترى التداخل والفجوة والضغط بنظرة، وتفتح أيّ مهمة بنقرة.
   ============================================================ */

function tlWindow() {
  const all = V.tasks;
  if (!all.length) return { a: now() - DAY, b: now() + DAY };
  const a = Math.min.apply(null, all.map(t => t.start)) - 4 * HR;
  const b = Math.max.apply(null, all.map(t => t.end)) + 4 * HR;
  return { a, b };
}

function screenTimeline() {
  const w = tlWindow(), span = w.b - w.a;
  const pct = ts => ((ts - w.a) / span) * 100;

  /* أعمدة الأيام */
  const days = [];
  for (let d = dayStart(w.a); d <= w.b; d += DAY) days.push(d);

  const zoom = S.tab.tlz || 'all';
  const rows = leaders().filter(L => zoom === 'all' || zoom === L.id);

  return '<div class="grid g4">' +
      kpi('مهام الموسم', '', 'عبر ' + AR(leaders().length) + ' فرق', '', 'i-tasks', V.tasks.length) +
      kpi('أيام التشغيل', '', 'من أول مهمة إلى آخرها', '', 'i-cal', days.length) +
      kpi('ذروة التزامن', '', 'أكثر عدد مهام في وقت واحد', 'warn', 'i-play', peakOverlap()) +
      kpi('متوسط التقييم', '', 'للمهام المنجزة', 'up', 'i-star',
        Number((V.tasks.filter(t => t.rating).reduce((a, t) => a + t.rating, 0) /
          Math.max(1, V.tasks.filter(t => t.rating).length)).toFixed(1))) +
    '</div>' +

    '<div class="card gold">' +
      head('الخط الزمني للموسم', 'كل مهمة بلونها ونوعها — والخط الأحمر هو الآن',
        '<span style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn ' + (zoom === 'all' ? 'p' : 'l') + ' sm" data-a="seg" data-k="tlz" data-v="all">كل الفرق</button>' +
        leaders().map(L => '<button class="btn ' + (zoom === L.id ? 'p' : 'l') + ' sm" ' +
          'data-a="seg" data-k="tlz" data-v="' + L.id + '">' + E(L.kt) + '</button>').join('') + '</span>') +

      '<div class="tl"><div class="tlgrid">' +
        '<div class="tlhead">' + days.map(d =>
          '<span>' + dayName(d).slice(0, 3) + ' ' + AR(new Date(d).getDate()) + '</span>').join('') + '</div>' +
        rows.map((L, ri) => {
          const ts = V.tasks.filter(t => t.leaderId === L.id).sort((a, b) => a.start - b.start);
          return '<div class="tlrow">' +
            '<span class="tlname">' + E(L.kt) + '<br><span class="tiny faint">' +
              E(L.name.split(' ')[0]) + '</span></span>' +
            '<span class="tlbar">' +
              ts.map((t, i) => {
                const c = CAT[t.kind] || {};
                const l = pct(t.start), wd = Math.max(0.7, pct(t.end) - l);
                const done = t.status === 'done';
                return '<span class="seg" data-a="tlopen" data-id="' + t.id + '" ' +
                  'title="' + E(t.title + ' — ' + hijri(t.start) + ' ' + t12(t.start)) + '" ' +
                  'style="inset-inline-end:' + l + '%;width:' + wd + '%;' +
                  'background:linear-gradient(150deg,' + (c.c || '#3A4A42') + ',' +
                  'color-mix(in srgb,' + (c.c || '#3A4A42') + ' 60%, #06110C));' +
                  'opacity:' + (done ? '.55' : '1') + ';' +
                  'animation-delay:' + (ri * 60 + i * 26) + 'ms">' +
                  (wd > 5 ? E(t.title.slice(0, 14)) : '') + '</span>';
              }).join('') +
              (now() >= w.a && now() <= w.b
                ? '<span class="now" style="inset-inline-end:' + pct(now()) + '%"></span>' : '') +
            '</span></div>';
        }).join('') +
      '</div></div>' +

      '<div class="tiny faint" style="margin-top:14px;display:flex;gap:14px;flex-wrap:wrap">' +
        Object.keys(CAT).map(k => '<span style="display:inline-flex;align-items:center;gap:6px">' +
          '<i style="width:9px;height:9px;border-radius:3px;background:' + CAT[k].c + ';display:block"></i>' +
          E(CAT[k].ar.split(' — ')[0]) + '</span>').join('') + '</div>' +
    '</div>';
}

/* أكثر عدد مهام متزامنة في الموسم */
function peakOverlap() {
  const pts = [];
  V.tasks.forEach(t => { pts.push([t.start, 1]); pts.push([t.end, -1]); });
  pts.sort((a, b) => a[0] - b[0]);
  let cur = 0, peak = 0;
  pts.forEach(p => { cur += p[1]; if (cur > peak) peak = cur; });
  return peak;
}

/* ============================================================
   الحركة والتفاعل — طبقة تعمل بعد كل رسم
   كل حركة هنا لها سبب وظيفي: تُسرّع القراءة أو تدلّ على تغيّر.
   ============================================================ */

/* ---------- الوضع الليلي والنهاري ---------- */
function applyTheme() {
  const t = S.theme || 'night';
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'day' ? '#F4F7F3' : '#060C09');
}
function toggleTheme() {
  S.theme = (S.theme === 'day') ? 'night' : 'day';
  applyTheme(); save();
  toast(S.theme === 'day' ? 'الوضع النهاري' : 'الوضع الليلي');
}

/* ---------- عدّ تصاعدي للأرقام ---------- */
function countUp(el) {
  const raw = el.getAttribute(String.fromCharCode(100,97,116,97,45,110));
  if (raw == null || raw === '') return;   /* بلا رقم: يُترك النص كما هو */
  const target = Number(raw);
  if (!isFinite(target)) return;
  const dec = /\./.test(raw) ? 1 : 0;
  const suffix = el.getAttribute('data-suffix') || '';
  const write = v => { el.textContent = AR(dec ? v.toFixed(1) : Math.round(v)) + suffix; };
  /* من طلب تقليل الحركة يرى الرقم النهائي فورًا */
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    write(target); return;
  }
  const dur = 850, t0 = performance.now();
  function step(t) {
    const p = Math.max(0, Math.min(1, (t - t0) / dur));   /* لا تقدّم سالبًا */
    write(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- ضوء يتبع المؤشّر على البطاقات ---------- */
function bindPointerLight(root) {
  root.querySelectorAll('.card').forEach(c => {
    c.addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect();
      c.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      c.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
  });
}

/* ---------- موجة ضغط على الأزرار ---------- */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.btn');
  if (!b) return;
  const r = b.getBoundingClientRect();
  const i = document.createElement('i');
  i.className = 'rip';
  i.style.left = (e.clientX - r.left) + 'px';
  i.style.top = (e.clientY - r.top) + 'px';
  b.appendChild(i);
  setTimeout(() => i.remove(), 560);
});

/* ---------- مؤشّر السكة الذهبي ينتقل بين الأزرار ---------- */
function moveRailMark() {
  const rail = document.querySelector('.rail'); if (!rail) return;
  let mark = rail.querySelector('.railmark');
  if (!mark) { mark = document.createElement('span'); mark.className = 'railmark'; rail.appendChild(mark); }
  const on = rail.querySelector('button.on');
  if (!on) { mark.style.opacity = 0; return; }
  const r = rail.getBoundingClientRect(), b = on.getBoundingClientRect();
  mark.style.opacity = 1;
  mark.style.top = (b.top - r.top + 12) + 'px';
  mark.style.height = (b.height - 24) + 'px';
}

/* ---------- تعبئة الأشرطة بعد الرسم ---------- */
function fillMeters(root) {
  root.querySelectorAll('.meter i[data-w], .bar2 i[data-w]').forEach(i => {
    requestAnimationFrame(() => { i.style.width = i.getAttribute('data-w') + '%'; });
  });
}

/* ---------- طبقة ما بعد الرسم ---------- */
/* الأعمدة تبدأ من الصفر ثم تنمو — الارتفاع يُكتب بعد الرسم لا معه */
function growBars(root) {
  requestAnimationFrame(() => {
    (root || document).querySelectorAll('.bar[data-h]').forEach(b => {
      b.style.height = b.dataset.h + '%';
    });
  });
}

/* عمق التمرير: الشريط العلوي يعرف أن تحته محتوى */
function bindScrollDepth(wrap) {
  const v = wrap.querySelector('.view'), top = wrap.querySelector('.top');
  if (!v || !top) return;
  const on = () => top.classList.toggle('deep', v.scrollTop > 6);
  v.addEventListener('scroll', on, { passive: true });
  on();
}

function afterRender() {
  const wrap = document.getElementById('stagewrap');
  wrap.querySelectorAll('[data-n]').forEach(countUp);
  bindPointerLight(wrap);
  fillMeters(wrap);
  growBars(wrap);
  bindScrollDepth(wrap);
  moveRailMark();
}

  clearInterval(wallTimer); wallTimer = null;
  if (!S.wall || !S.wallAuto) return;   /* الدوران بطلبك لا بذاته */
  let i = Math.max(0, WALL_CYCLE.indexOf(S.route.n));

   اختصارات لوحة المفاتيح
   ============================================================ */
document.addEventListener('keydown', e => {
  const typing = e.target && /input|textarea|select/i.test(e.target.tagName);

  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault(); S.palette = !S.palette; S.pq = ''; S.psel = 0; renderPalette(); return;
  }
  if (S.palette) {
    if (e.key === 'Escape') { S.palette = false; renderPalette(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); S.psel = (S.psel || 0) + 1; renderPalette(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); S.psel = Math.max(0, (S.psel || 0) - 1); renderPalette(); return; }
    if (e.key === 'Enter') { e.preventDefault(); runPalette(S.psel || 0); return; }
    return;
  }
  if (S.drawer && e.key === 'Escape') { S.drawer = null; renderDrawer(); return; }
  /* Esc مخرج عام: من الجدار أولًا، ثم إلى لوحة العمليات */
  if (e.key === 'Escape') {
    if (S.wall) { S.wall = false; S.wallAuto = false; render(); return; }
    if (S.wide) { S.wide = false; render(); return; }
    if (S.route.n !== 'ops') { S.route = { n: 'ops' }; render(); return; }
    return;
  }
  if (typing) return;

  if (e.key >= '1' && e.key <= '9') {
    const it = navItems()[Number(e.key) - 1];
    if (it) { S.route = { n: it.k }; render(); }
  }
  else if (e.key === 'b' || e.key === 'B') { S.wide = !S.wide; render(); }
  else if (e.key === 'f' || e.key === 'F') { S.wall = !S.wall; render(); }
  else if (e.key === 't' || e.key === 'T') { toggleTheme(); render(); }
  else if (e.key === '?') { showShortcuts(); }
});

/* اختيار تخصّص المحسن داخل التشكيل */
document.addEventListener('change', e => {
  const t = e.target;
  if (!t) return;
  /* مرفق: نحفظ وصفه لا محتواه — الاسم والحجم والنوع */
  const fk = t.getAttribute && t.getAttribute('data-file');
  if (fk) {
    const f = t.files && t.files[0];
    S.files = S.files || {};
    if (f) S.files[fk] = { name:f.name, size:f.size, type:f.type };
    save();
    if (S.drawer) { if (S.picker) paintPicker(); else repaintDrawer(); }
    return;
  }
  /* قوائم الفلترة */
  const gk = t.getAttribute && t.getAttribute('data-g');
  if (gk) {
    S.gate = S.gate || {};
    const map = { gorg:'orgId', ghotel:'hotelId', glead:'leaderId', guser:'userId',
      gct:'contractorId' };
    S.gate[map[gk]] = t.value || null;
    save(); renderGate(); return;
  }
  const fsel = t.getAttribute && t.getAttribute('data-f');
  if (fsel) { fltSet(fsel, t.getAttribute('data-fk'), t.value); save(); if (S.drawer) repaintDrawer(); else render(); return; }
  if (!t.classList || !t.classList.contains('spec')) return;
  const id = t.getAttribute('data-id'), d = draft();
  const m = d.members.find(x => x.id === id);
  if (m) { m.spec = t.value; save(); }
});

function render() {
  buildView();                       /* الرؤية قبل أي قراءة */
  let n = S.route.n;
  if (!maySee(n)) {                  /* شاشة غير ممنوحة: أوّل مسموحة أو صفحة المنع */
    const first = allowed()[0];
    if (first) { n = first; S.route = { n }; }
  }
  const fn = maySee(n) ? (SCREENS[n] || screenOps) : screenDenied;
  applyTheme();
  const room = document.getElementById('room');
  room.className = (S.wall ? 'wall' : '') + (S.wide && !S.wall ? ' wide' : '');

  const key = n + ':' + (S.route.id || '');
  const same = S._key === key;
  const wrap = document.getElementById('stagewrap');
  const prev = wrap.querySelector('.view');
  const keep = same && prev ? prev.scrollTop : 0;
  document.getElementById('sidewrap').innerHTML = sidebar();
  /* لا يُمسح صنف .stage وإلا فقد المسرح تخطيطه ولم يعمل أي تمرير */
  wrap.className = 'stage' + (same ? ' nofx' : '');
  wrap.innerHTML = topbar() + '<div class="view">' + fn() + '</div>';

  const v = wrap.querySelector('.view');
  if (v && keep) v.scrollTop = keep;
  S._key = key;

  const tw = document.getElementById('toastwrap');
  tw.innerHTML = S.toast
    ? '<div class="toast ' + (S.toast.kind || 'g') + '">' +
      icon(S.toast.kind === 'r' ? 'i-warn' : 'i-checkc', 's18') + '<span>' + E(S.toast.text) + '</span>' +
      '<i class="bar"></i></div>'
    : '';
  /* في جدار العرض: شريط تقدّم إن كان الدوران مفعّلًا، ومخرج ظاهر دائمًا */
  document.getElementById('wallbar').innerHTML = S.wall
    ? (S.wallAuto ? '<div class="wallbar"><i></i></div>' : '') +
      '<button class="wallexit" data-a="wall">' + icon('i-x','s16') +
        'الخروج من جدار العرض · Esc</button>' +
      '<button class="wallexit" style="inset-inline-start:auto;inset-inline-end:22px" ' +
        'data-a="wallauto">' + icon(S.wallAuto ? 'i-stop' : 'i-play','s16') +
        (S.wallAuto ? 'إيقاف الدوران' : 'دوران تلقائي') + '</button>'
    : '';
  afterRender();
  renderPalette();
  renderDrawer();
  syncWall();
  renderGate();
  save();
  if (S.toast) {
    const t = S.toast;
    setTimeout(() => { if (S.toast === t) { S.toast = null; render(); } }, 2800);
  }
}

document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, v = b.dataset.v;

  /* الحارس: من لا يملك التعديل لا يُنفّذ إجراءً — والاطّلاع مباح */
  if (!canEdit() && READ_ACTS.indexOf(a) < 0) {
    toast('صفتك للاطّلاع لا للتعديل — ' + curPerm().ar, 'r');
    return;
  }

  switch (a) {
    case 'go': S.route = { n: b.dataset.n, id }; break;
    case 'wide': S.wide = !S.wide; break;
    case 'wall': S.wall = !S.wall; if (!S.wall) S.wallAuto = false;
      toast(S.wall ? 'جدار العرض — Esc أو F للخروج' : 'عاد العرض العادي'); break;
    case 'wallauto': S.wallAuto = !S.wallAuto;
      toast(S.wallAuto ? 'يدور بين اللوحات كل ١٢ ثانية' : 'أُوقف الدوران'); break;
    case 'theme': toggleTheme(); break;
    case 'palette': S.palette = true; S.pq = ''; S.psel = 0; renderPalette(); return;
    case 'closepal': S.palette = false; renderPalette(); return;
    case 'palrun': runPalette(Number(v)); return;
    case 'closedrawer': S.drawer = null; S.picker = null; renderDrawer(); return;
    case 'shortcuts': showShortcuts(); return;
    case 'timeline': S.route = { n: 'timeline' }; break;
    case 'tlopen': taskDrawer(id); return;

    /* ═══ المهمّة كاملةً — ما يفعله الميدان تفعله الغرفة ═══ */
    case 'txfold': {
      S.open = S.open || {};
      const k = 'tx:' + id + ':' + v;
      S.open[k] = !S.open[k];
      save(); taskDrawer(id); return;
    }
    case 'txwide': S.dwide = !S.dwide; save(); taskDrawer(id); return;

    case 'txsub': {
      const t = ensureTask(taskById(id)); if (!t) return;
      const sb = t.subs.find(x => x.id === b.dataset.s); if (!sb) return;
      sb.done = !sb.done;
      sb.at = sb.done ? now() : null;
      sb.by = sb.done ? null : null;
      txLog(t, (sb.done ? 'أشّر الكنترول على إنجاز «' : 'أُلغي تأشير «') + sb.name + '»',

      logIt('المهمة ' + t.title + ' — ' + (sb.done ? 'أُنجزت' : 'أُلغيت') + ' خطوة «' + sb.name +
        '» من الكنترول', 'task');
      toast(sb.done ? 'أُنجزت: ' + sb.name : 'أُلغي تأشيرها');
      save(); taskDrawer(id); return;
    }

    case 'txreq': {
      const t = ensureTask(taskById(id)); if (!t) return;
      const r = t.reqs.find(x => x.id === b.dataset.s); if (!r) return;
      r.done = !r.done;
      r.by = r.done ? actorLabel() : null;
      r.at = r.done ? now() : null;
      txLog(t, (r.done ? 'تحقَّق الكنترول من «' : 'رُفع التحقّق عن «') + r.text + '» — ' +
        REQ_PH[r.ph].ar, r.done ? 'ok' : 'warn');
      save(); taskDrawer(id); return;
    }
    case 'txreqdel': {

      t.reqs = t.reqs.filter(x => x.id !== r.id);

    case 'txreqnew': S.txq = S.txq || {}; if (v) S.txq.ph = v; S.q.txrq = ''; txReqNew(id, v); return;
    case 'txreqph': S.txq = S.txq || {}; S.txq.ph = v; txReqNew(id, v); return;
    case 'txreqsave': {
      const t = ensureTask(taskById(id)); if (!t) return;
      const txt = (S.q.txrq || '').trim();

      S.q.txrq = ''; toast('أُضيف المتطلّب'); save(); taskDrawer(id); return;
    }
    case 'txtpl': txTplPick(id); return;

      save(); taskDrawer(id); return;

    case 'txfilenew': S.txq = S.txq || {}; S.q.txfn = ''; S.q.txfd = ''; txFileNew(id); return;
    case 'txfk': S.txq = S.txq || {}; S.txq.fk = v; txFileNew(id); return;

      toast(d.editing ? 'حُفظ التعديل' : 'شُكِّلت المجموعة وسُكِّنت ' + AR(n) + ' مهمة');
      break;
    }
    case 'qclear': S.q[b.dataset.k] = ''; break;
    case 'fclear': { const k = b.dataset.k; S.flt[k] = {}; S.q[k] = ''; break; }

    /* ─── نُسك: فتح حالة ─── */
    case 'nfsvc':  S.nform = S.nform || {}; S.nform.svc = v; nusukNew(); return;
    case 'nfpil':  S.nform = S.nform || {}; S.nform.pid = id; nusukNew(); return;
    case 'nfclr':  S.nform.pid = ''; S.q.npil = ''; nusukNew(); return;
    case 'nfsave': {
      const d = S.nform || {};
      if (!d.pid) { toast('اختر الحاجّ أوّلًا — ابحث باسمه أو رقم جوازه', 'r'); return; }
      const p = allPilgrimRows().find(x => x.id === d.pid); if (!p) return;
      const L = leaders().find(l => l.kt === p.kt) || {};
      const f = (S.files || {}).nusukNew || null;
      const c = { id:uid('N'), no:'NS-' + (4400 + S.nusuk.length), svc:d.svc || 'lost',

        openedBy:'الكنترول', state:'new', step:1, assignedTo:null, at:now(),
        note:(S.q.nnote || '').trim() || 'حالة فُتحت من غرفة العمليات',
        trail:[{ at:now(), by:'الكنترول', text:'فُتحت الحالة', file:f }] };
      S.nusuk.unshift(c);

      if (S.files) delete S.files.nusukNew;
      S.drawer = null; save(); render(); nusukDrawer(c.id);
      toast('فُتحت ' + c.no + ' — أسندها الآن');
      return;
    }
    case 'nopen': nusukDrawer(id); return;
    case 'nnew':  S.nform = { svc:'lost', pid:'', note:'' }; nusukNew(); return;
    case 'nassign': {
      const c = S.nusuk.find(x => x.id === id); if (!c) return;
      openPicker('nusuk', c.id, { title:'إسناد ' + c.no,
        note:'المرشّحون: فريق ' + c.kt + ' وليدره والاحتياط.',
        cands:candFor('nusuk', c) });
      return;
    }
    case 'nstep': {
      const c = S.nusuk.find(x => x.id === id); if (!c) return;
      const SV = NUSUK_SVC[c.svc];
      if (c.step >= SV.steps.length) { toast('بلغت آخر خطوة — أنهِ الحالة', 'r'); return; }
      const note = (S.q.nstepnote || '').trim();
      const f = (S.files || {}).nusukStep || null;
      c.trail = c.trail || [];
      c.trail.push({ at:now(), by:'الكنترول',
        text:SV.steps[c.step] + (note ? ' — ' + note : ''), file:f });
      c.step += 1;
      c.state = c.step >= SV.steps.length ? 'issued'
        : c.step >= 2 ? 'processing' : 'new';
      S.q.nstepnote = ''; if (S.files) delete S.files.nusukStep;
      logIt(c.no + ' — ' + SV.steps[c.step - 1], 'info');
      save(); nusukDrawer(c.id); toast(NUSUK_STATE[c.state].ar);
      return;
    }
    case 'nclose': {
      const c = S.nusuk.find(x => x.id === id); if (!c) return;
      c.state = 'delivered'; c.step = NUSUK_SVC[c.svc].steps.length;
      c.trail = c.trail || [];
      c.trail.push({ at:now(), by:'الكنترول', text:'أُنهيت الحالة وسُلّمت', file:null });
      logIt('أُنهيت ' + c.no + ' — ' + NUSUK_SVC[c.svc].ar, 'info');
      save(); nusukDrawer(c.id); toast('أُنهيت الحالة');
      return;
    }

    /* ─── إثراء: إسناد لمحسن ─── */
    case 'xassign': {
      const x = S.enrich.find(e => e.id === id); if (!x) return;
      openPicker('enrich', x.id, { title:'إسناد ' + siteById(x.siteId).ar,
        note:'المحسن يرافق الرحلة — والرقم بجانبه حِمله الحالي.',
        cands:candFor('enrich', x) });
      return;
    }

    /* ─── الامتثال ─── */
    case 'fnew':  S.fb = null; formBuilder(null); return;
    case 'fedit': S.fb = null; formBuilder(id); return;
    case 'fbscope': S.fb.scope = v; formBuilder(); return;
    case 'fbadd': {
      const q = (S.q.fbq || '').trim();
      if (!q) { toast('اكتب نصّ السؤال أوّلًا', 'r'); return; }
      const t2 = fOf('fb','qt') || 'yn';
      S.fb.qs.push({ id:'q' + (S.fb.qs.length + 1), q, t:t2,
        w:QT_NOSCORE.indexOf(t2) < 0 ? Number(fOf('fb','qw') || 2) : 0,
        req:!!fOf('fb','qr') });
      S.q.fbq = ''; formBuilder(); return;
    }
    case 'fbup': {
      const i = Number(v); if (i < 1) return;
      const a2 = S.fb.qs; const tmp = a2[i - 1]; a2[i - 1] = a2[i]; a2[i] = tmp;
      formBuilder(); return;
    }
    case 'fbdel': S.fb.qs.splice(Number(v), 1); formBuilder(); return;
    case 'fbsave': {
      const b2 = S.fb;
      if (!b2.title) { toast('اكتب عنوان القالب', 'r'); return; }
      if (!b2.qs.length) { toast('أضف سؤالًا واحدًا على الأقلّ', 'r'); return; }
      b2.intro = S.q.fbi || b2.intro || '';
      b2.pledge = S.q.fbp || b2.pledge || '';
      if (b2.editing) {
        const f = formById(b2.editing);
        Object.assign(f, { title:b2.title, scope:b2.scope, qs:b2.qs,
          intro:b2.intro, pledge:b2.pledge });
        logIt('عُدِّل قالب «' + f.title + '» — ' + AR(f.qs.length) + ' أسئلة', 'guide');
      } else {
        S.forms.push({ id:uid('F'), no:'FM-' + (201 + S.forms.length), title:b2.title,
          scope:b2.scope, icon:'i-clip', color:'#0B7A4B', by:'ctl', at:now(),
          qs:b2.qs, intro:b2.intro, pledge:b2.pledge });
        logIt('أُنشئ قالب «' + b2.title + '» بـ' + AR(b2.qs.length) + ' أسئلة', 'guide');
      }
      S.q.fbi = ''; S.q.fbp = '';
      S.fb = null; S.drawer = null; toast('حُفظ القالب');
      break;

    case 'fassign': formAssign(id); return;
    case 'fatarget': {
      const h = hotelById(id);
      S.pendForm.target = h.ar;
      openPicker('comply', id, { title:'من ينفّذه في ' + h.ar,
        note:'المرشّحون من مجموعات تسكن هذا الفندق ومشرفيه.',
        cands:candFor('comply', id) });
      return;
    }

    case 'tkopen2': ticketDrawer(id); return;
    case 'tkassign': {
      const k = S.tickets.find(x => x.id === id); if (!k) return;
      openPicker('ticket', k.id, { title:'إسناد ' + k.no, cands:candFor('ticket', k) });
      return;
    }
    case 'tkcat': { const k = S.tickets.find(x => x.id === id); if (k) k.cat = v;
      save(); ticketDrawer(id); return; }
    case 'tkpri': { const k = S.tickets.find(x => x.id === id); if (k) k.pri = v;

    case 'tkreply': {
      const k = S.tickets.find(x => x.id === id); if (!k) return;

      save(); ticketDrawer(id); toast('أُرسل الردّ');
      return;
    }
    case 'tkclose': { const k = S.tickets.find(x => x.id === id); if (!k) return;
      k.status = 'مغلقة'; k.thread = k.thread || [];

      logIt('أُغلقت تذكرة ' + k.no, 'ticket'); save(); ticketDrawer(id);

    case 'tkopen': { const k = S.tickets.find(x => x.id === id); if (!k) return;
      k.status = 'قيد المعالجة'; save(); ticketDrawer(id); toast('أُعيد فتحها'); return; }

    /* ─── التقارير ─── */
    case 'rpopen': reportDrawer(id); return;
    case 'rpassign': {
      const r = S.reports.find(x => x.id === id); if (!r) return;
      openPicker('report', r.id, { title:'إسناد ' + r.no, cands:candFor('report', r) });
      return;
    }
    case 'rpreply': {
      const r = S.reports.find(x => x.id === id); if (!r) return;
      const t = (S.q.rpreply || '').trim();
      if (!t) { toast('اكتب ردًّا', 'r'); return; }

      r.thread.push({ at:now(), by:'الكنترول', text:t, file:(S.files || {}).rpReply || null });
      r.status = 'قيد المعالجة'; S.q.rpreply = '';
      if (S.files) delete S.files.rpReply;

      save(); reportDrawer(id); toast('أُرسل الردّ'); return;
    }
    case 'rpclose': { const r = S.reports.find(x => x.id === id); if (!r) return;
      r.status = 'مغلق'; r.escalated = false;
      logIt('أُغلق تقرير ' + r.no, 'info'); save(); reportDrawer(id);
      toast('أُغلق التقرير'); return; }

    /* ─── ١) المشرف على الفندق: واحد لا أكثر ─── */
    case 'supassign':
    case 'supswap': {
      const cur = supOfHotel(id);
      openPicker('sup', id, { title:(cur ? 'تغيير مشرف ' : 'تسكين مشرف ') + hotelById(id).ar,
        note:'لكل فندق مشرف واحد. من يُختار يُزاح عن فندقه السابق إن كان له فندق، ' +
          'ومن يُزاح هنا يعود حرًّا.',
        cands:supervisors().filter(u => u.hotelId !== id) });
      return;
    }
    case 'suprm': {
      const sv = supOfHotel(id); if (!sv) return;
      sv.hotelId = null;
      S.groups.forEach(g => { if (g.hotelId === id) g.supervisorId = null; });
      logIt('أُزيل المشرف ' + sv.name + ' عن ' + hotelById(id).ar, 'assign');
      toast(sv.name + ' عاد حرًّا', 'r');
      break;
    }

    /* ─── ٢) الليدر على المجموعة ─── */
    case 'gleadswap': {
      const g = groupById(id); if (!g) return;
      openPicker('glead', g.id, { title:'ليدر ' + g.no,
        note:'لا يقود الليدر أكثر من مجموعتين. من يخرج هنا يعود إلى قائمة الليدرز.',
        cands:leaders().filter(l => l.id !== g.leaderId && groupsOf(l.id).length < 2) });
      return;
    }
    case 'ghotel': {
      const g = groupById(id); if (!g) return;
      S.pendHotel = g.id;
      S.drawer = { title:'سكن ' + g.no, sub:'المشرف يتبع الفندق تلقائيًّا', icon:'i-key',
        body:'<div class="plist">' + HOTELS.map(h => {
          const sv = supOfHotel(h.id);
          return '<button class="prow pick' + (g.hotelId === h.id ? ' on' : '') + '" ' +
            'data-a="ghotelset" data-id="' + h.id + '">' +
            '<span class="ico">' + icon('i-key','s16') + '</span>' +
            '<span class="nm" style="flex:1"><b>' + E(h.ar) + '</b>' +
            '<span>' + E(h.dist) + ' · ' + (sv ? 'المشرف ' + E(sv.name) : 'بلا مشرف') +
            '</span></span>' +
            pill(AR(S.groups.filter(x => x.hotelId === h.id).length) + ' مجموعة', 'grey') +
          '</button>';
        }).join('') + '</div>' };
      renderDrawer(); return;
    }
    case 'ghotelset': {
      const g = groupById(S.pendHotel); if (!g) return;
      g.hotelId = id;
      const sv = supOfHotel(id);
      g.supervisorId = sv ? sv.id : null;
      logIt('نُقلت ' + g.no + ' إلى ' + hotelById(id).ar, 'assign');

      const L = leaders().find(l => groupsOf(l.id).length < 2);
      if (!L) { toast('كل ليدر يقود مجموعتين', 'r'); return; }
      const o = orgById(L.orgId) || S.orgs[0];
      const g = { id:uid('G'), no:'GR-' + (101 + S.groups.length), leaderId:L.id,
        orgId:o.id, hotelId:null, supervisorId:null, members:[], at:now() };
      S.groups.push(g);
      logIt('أُنشئت مجموعة ' + g.no + ' بقيادة ' + L.name, 'assign');
      toast('أُنشئت ' + g.no + ' — أضف محسنيها وسكنها');
      break;
    }

    /* ─── ٣) المحسن في مقعده ─── */
    case 'mseatin': {
      const g = groupById(id); if (!g) return;
      if (g.members.length >= 5) { toast('المجموعة مكتملة', 'r'); return; }
      openPicker('mseat', g.id, { title:'مقعد في ' + g.no,
        note:'المتاحون وحدهم — ومعهم الاحتياط، فهو مشترك بين كل الفرق.',
        cands:freeMuhsens().concat(reserveTeam()) });
      return;
    }
    case 'mseatout': {
      const g = groupById(id); if (!g) return;
      const u = userById(v);
      g.members = g.members.filter(m => m.id !== v);
      if (u) { u.groupId = null; u.leaderId = null; u.kt = '—'; }
      S.tasks.forEach(t => { if (t.leaderId === g.leaderId)
        t.assigned = (t.assigned || []).filter(x => x !== v); });
      logIt('أُخرج ' + ((u || {}).name || '') + ' من ' + g.no, 'assign');
      toast(((u || {}).name || '') + ' عاد إلى المتاحين', 'r');
      break;
    }
    case 'staffopen': staffDrawer(id); return;
    case 'logout': S.auth = false; S.drawer = null; save(); render();
      toast('خرجتَ من الغرفة'); return;
    case 'grole': S.gate = S.gate || {}; S.gate.perm = v; save(); renderGate(); return;
    case 'pgtog': {
      const k = b.dataset.k;
      S.grants[k] = S.grants[k] || [];
      const i = S.grants[k].indexOf(v);
      if (i >= 0) S.grants[k].splice(i, 1); else S.grants[k].push(v);
      logIt((i >= 0 ? 'مُنعت' : 'مُنحت') + ' شاشة «' + (navOf(v) || {}).l +
        '» لصفة ' + permOf(k).ar, 'info');
      break;
    }
    case 'pgall': {
      S.grants[v] = navItems().map(x => x.k).filter(x => x !== 'perms');
      logIt('مُنحت كل الشاشات لصفة ' + permOf(v).ar, 'info');
      toast('مُنحت كل الشاشات — بلا تعديل'); break;
    }
    case 'pgdef': {
      delete S.grants[v];
      logIt('أُعيدت صفة ' + permOf(v).ar + ' إلى صلاحياتها الافتراضية', 'info');
      toast('عادت إلى الافتراضي — ' + AR(grantsOf(v).length) + ' شاشة'); break;
    }
    case 'pgnone': {
      S.grants[v] = [];
      logIt('مُنعت كل الشاشات عن صفة ' + permOf(v).ar, 'info');
      toast('لن ترى هذه الصفة شيئًا', 'r'); break;
    }
    case 'gin': {
      const g = S.gate || { perm:'admin' };
      S.actor = { perm:g.perm, orgId:g.orgId, hotelId:g.hotelId,
        leaderId:g.leaderId, userId:g.userId, contractorId:g.contractorId };
      S.auth = true;

      S.route = { n: first || 'ops' };
      save(); render();
      toast('دخلتَ بصفة ' + curPerm().ar + ' — ' + SCOPE_AR[curPerm().scope]);
      return;

    /* المنتقي: من يُسنَد إليه */
    case 'pickdo': {
      const p = S.picker; if (!p) return;
      const u = userById(id); if (!u) return;
      applyPick(p.kind, p.id, u);
      S.picker = null; S.drawer = null;
      break;
    }
    /* اعتماد دليل: النسخة تُرفع والتطبيق يقرأ المعتمد وحده */
    case 'gpub': {
      const g = S.guides.find(x => x.id === id); if (!g) return;
      g.status = 'معتمد'; g.ver += 1; g.at = now();
      logIt('اعتُمدت النسخة ' + AR(g.ver) + ' من دليل ' + (CAT[g.kind] || {}).ar, 'guide');
      toast('نُشر الدليل — يقرؤه الميدان الآن');
      break;
    }
    /* بثّ رسالة */
    case 'castsend': {
      const t = (S.q.ct || '').trim(), y = (S.q.cb || '').trim();
      if (!t) { toast('اكتب عنوانًا يُقرأ في الإشعار', 'r'); return; }
      const dest = S.tab.cdest || 'muhsen';
      const aud = S.tab['caud_' + dest] || 'all';
      const of = audN(dest, aud) || 1;
      const toAr = audAr(dest, aud);
      S.casts.unshift({ id: uid('C'), no: 'BR-' + (9100 + S.casts.length),

        kind: S.tab.ck || 'عادي', seen: 0, of, at: now() });
      logIt('بُثّت «' + t + '» إلى ' + CAST_DEST[dest].ar + ' — ' + toAr +
        ' (' + AR(of) + ' مستلمًا)', 'cast');
      S.q.ct = ''; S.q.cb = '';
      toast('بُثّت إلى ' + AR(of) + ' مستلمًا في ' + CAST_DEST[dest].ar);
      break;
    }
    case 'castclear': S.q.ct = ''; S.q.cb = ''; break;
    /* ─── تخصيص اللوحة ─── */
    case 'dashedit': dashEdit(); return;
    case 'dashtog': {
      const cur = dashKeys();
      const i = cur.indexOf(v);
      if (i >= 0) cur.splice(i, 1); else cur.push(v);
      S.dash = cur; save(); dashEdit(); return;
    }
    case 'dashoff': {
      S.dash = dashKeys().filter(x => x !== v); save(); dashEdit(); return;
    }
    case 'dashup': {
      const c = dashKeys(), i = Number(v);
      const t = c[i - 1]; c[i - 1] = c[i]; c[i] = t;
      S.dash = c; save(); dashEdit(); return;
    }
    case 'dashdn': {
      const c = dashKeys(), i = Number(v);
      const t = c[i + 1]; c[i + 1] = c[i]; c[i] = t;
      S.dash = c; save(); dashEdit(); return;
    }
    case 'dashreset': {
      S.dash = DASH_DEFAULT.slice(); save(); dashEdit();
      toast('عادت اللوحة إلى الافتراضي'); return;
    }
    case 'cfgtog': {
      S.cfg[v] = S.cfg[v] === false;
      logIt('غُيّر إعداد «' + v + '» إلى ' + (S.cfg[v] === false ? 'مطفأ' : 'مشغّل'), 'info');
      break;
    }
    case 'cfgsave': {
      S.cfg.name = (S.q.cfgname || '').trim() || 'مُحسن · الكنترول';
      S.cfg.season = (S.q.cfgseason || '').trim() || 'موسم حج ١٤٤٨ هـ';
      S.cfg.theme = S.tab.cfgtheme || 'sys';
      logIt('حُفظت إعدادات الموقع', 'info');
      toast('حُفظت'); break;
    }
    /* الشِفتات */
    case 'swok': {
      const w = S.swaps.find(x => x.id === id); if (!w) return;
      w.state = 'done'; w.reason = 'اعتُمد — وأُبلغ الطرفان';
      const a = userById(w.from) || {}, c = userById(w.to) || {};
      logIt('اعتُمد تبديل وردية بين ' + (a.name || '') + ' و' + (c.name || ''), 'shift');
      toast('اعتُمد التبديل');
      break;
    }
    case 'swno': {
      const w = S.swaps.find(x => x.id === id); if (!w) return;
      w.state = 'no'; w.reason = 'الوردية لا تحتمل نقصًا في هذا اليوم';
      logIt('رُفض طلب تبديل ' + w.no + ' — الوردية لا تحتمل نقصًا', 'shift');
      toast('رُفض الطلب — وسُجّل السبب', 'r');
      break;
    }

    case 'spok': {
      const s = S.support.find(x => x.id === id);
      if (!s || s.state !== 'pending') break;
      const t = taskById(s.taskId);
      const pool = reserveTeam().filter(m => t && t.assigned.indexOf(m.id) < 0);
      const take = pool.slice(0, s.count);
      if (t) take.forEach(m => t.assigned.push(m.id));
      s.state = 'done'; s.at2 = now();
      s.reason = 'توفّر ' + AR(take.length) + ' محسن في الاحتياط ضمن نطاق المهمة بلا تعارض في أوقاتهم.';
      pushFeed('ok', 'لُبّي طلب دعم',
        (t ? t.kt + ' · ' + t.title : '') + ' — أُسند ' + AR(take.length) + ' محسن');
      logIt('لُبّي طلب الدعم ' + s.no + ' بإسناد ' + AR(take.length) + ' محسن من الاحتياط', 'ok');
      toast('أُسند ' + AR(take.length) + ' محسن من الاحتياط');
      break;
    }
    case 'spno': {
      const s = S.support.find(x => x.id === id);
      if (!s || s.state !== 'pending') break;
      s.state = 'denied'; s.at2 = now();
      s.reason = 'لا يتوفّر محسن غير مرتبط في هذا التوقيت — أعد التوزيع من فريقك.';
      pushFeed('warn', 'اعتُذر عن طلب دعم', s.no + ' — لا احتياط متاح في التوقيت');
      logIt('اعتُذر عن طلب الدعم ' + s.no, 'warn');
      toast('أُبلغ الليدر بالاعتذار', 'r');
      break;
    }
    case 'roomapply': {
      const r = S.reports.find(x => x.id === id);
      if (!r || !r.room) break;
      r.status = 'مغلق'; r.applied = now();
      const arr = S.pilgrims[r.kt] || [];
      if (arr[0]) { arr[0].floor = r.room.floor; arr[0].room = r.room.no; }
      pushFeed('ok', 'حُدِّثت بيانات غرفة', r.kt + ' · ' + r.room.floor + ' · غرفة ' + r.room.no);
      logIt('حُدِّثت بيانات الغرفة من التقرير ' + r.no, 'ok');
      toast('حُدِّثت قاعدة البيانات');
      break;
    }
    case 'clock':
      S.clockOffset = v === '0' ? 0 : (S.clockOffset || 0) + Number(v);
      toast(S.clockOffset ? 'الإزاحة ' + AR(S.clockOffset) + ' دقيقة' : 'عاد الوقت الحقيقي');
      break;
    case 'reset': reset(); return;
    default: return;
  }
  render();
});

/* لوحة المفاتيح: تنقّل سريع بالأرقام */
document.addEventListener('keydown', e => {
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key >= '1' && e.key <= '9') {
    const it = navItems()[Number(e.key) - 1];
    if (it) { S.route = { n: it.k }; render(); }
  }
  if (e.key === 'b' || e.key === 'B') { S.wide = !S.wide; render(); }
});

/* ---------- إقلاع ---------- */
load();
if (!S.theme) {
  S.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'day' : 'night';
}
applyTheme();
render();

</script>
</body>
