/* ---------- لوحة القالب ---------- */
function formDash(id) {
  const f = formById(id); if (!f) return;
  const bs = subsOf(f.id).sort((a, b) => a.at - b.at);
  const avg = bs.length ? Math.round(bs.reduce((a, b) => a + b.score, 0) / bs.length) : 0;
  const targets = [...new Set(bs.map(b => b.target))];

  openDrawer(f.title, f.no + ' · ' + AR(bs.length) + ' زيارة · ' + AR(targets.length) + ' جهة', f.icon,
    '<div class="meta">' +
      '<div><span class="k">المتوسط</span><b class="num">' + AR(avg) + '٪</b></div>' +
      '<div><span class="k">زيارات</span><b class="num">' + AR(bs.length) + '</b></div>' +
      '<div><span class="k">أسئلة</span><b class="num">' + AR(f.qs.length) + '</b></div>' +
    '</div>' +

    '<div class="card">' + head('الجهات', 'ودرجة آخر زيارة لكلٍّ منها') +
      '<div class="plist">' + targets.map(tg => {
        const mine = bs.filter(b => b.target === tg);
        const last = mine[mine.length - 1];
        const first = mine[0];
        const delta = mine.length > 1 ? last.score - first.score : 0;
        return '<div class="prow">' +
          '<span class="ico">' + icon(f.icon,'s16') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(tg) + '</b>' +
          '<span>' + AR(mine.length) + ' زيارة · آخرها ' + ago(last.at) + '</span></span>' +
          (delta ? '<span class="delta ' + (delta > 0 ? 'up' : 'dn') + '">' +
            (delta > 0 ? '▲' : '▼') + ' ' + AR(Math.abs(delta)) + '</span>' : '') +
          '<span class="fl" style="gap:8px;min-width:120px">' +
            '<span class="meter' + (last.score < 70 ? ' red' : ' gold') + '" style="flex:1">' +
              '<i data-w="' + last.score + '"></i></span>' +
            '<b class="num">' + AR(last.score) + '٪</b></span></div>';
      }).join('') + '</div></div>' +

    '<div class="card">' + head('كل سؤال وإجاباته', 'من ' + AR(bs.length) + ' إدخالًا') +
      f.qs.map(q => {
        const vals = bs.map(b => (b.answers.find(a => a.id === q.id) || {}).v);
        let body;
        if (q.t === 'yn') {
          const yes = vals.filter(v => v === true).length;
          const pct = Math.round(yes / Math.max(1, vals.length) * 100);
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            '<span class="meter" style="flex:1"><i data-w="' + pct + '"></i></span>' +
            '<span class="tiny num">' + AR(yes) + ' نعم · ' + AR(vals.length - yes) + ' لا</span></div>';
        } else if (q.t === 'rate') {
          const a = [1,2,3,4,5].map(n => ({ l:AR(n), v:vals.filter(v => v === n).length }));
          body = chartBars({ data:a });
        } else if (q.t === 'num') {
          const nums = vals.filter(v => typeof v === 'number');
          const mean = nums.length ? Math.round(nums.reduce((x, y) => x + y, 0) / nums.length) : 0;
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            '<b class="num" style="font-size:22px">' + AR(mean) + '</b>' +
            '<span class="tiny faint">المتوسط · الأدنى ' + AR(Math.min.apply(null, nums.concat(0))) +
            ' · الأعلى ' + AR(Math.max.apply(null, nums.concat(0))) + '</span></div>';
        } else if (q.t === 'photo') {
          const n2 = vals.filter(Boolean).length;
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            '<span class="meter" style="flex:1"><i data-w="' +
            Math.round(n2 / Math.max(1, vals.length) * 100) + '"></i></span>' +
            '<span class="tiny num">' + AR(n2) + ' صورة من ' + AR(vals.length) + '</span></div>';
        } else if (q.t === 'sign') {
          const n2 = vals.filter(Boolean).length;
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            pill(AR(n2) + ' مُتعهَّد', 'live') +
            pill(AR(vals.length - n2) + ' بلا تعهّد', vals.length - n2 ? 'no' : 'grey') + '</div>';
        } else {
          body = '<div class="quote">' + E(String(vals[vals.length - 1] || '—')) + '</div>';
        }
        return '<div class="qblock"><div class="fl" style="gap:9px">' +
          '<b style="flex:1;font-size:12.5px">' + E(q.q) + '</b>' +
          pill(QT[q.t], 'grey') + '</div>' + body + '</div>';
      }).join('') + '</div>');
}

/* ---------- إدخال واحد ---------- */
function subDrawer(id) {
  const b = V.subs.find(x => x.id === id); if (!b) return;
  const f = formById(b.formId) || {}, by = userById(b.by) || {};
  const mine = subsOf(b.formId).filter(x => x.target === b.target).sort((a, c) => a.at - c.at);
  openDrawer(b.target, f.title + ' · الزيارة ' + AR(b.visit) + ' من ' + AR(b.of), f.icon,
    '<div class="fl" style="gap:13px">' + avatar(by, 'lg') +
      '<span class="nm" style="flex:1"><b style="font-size:15px">' + E(by.name || '') + '</b>' +
      '<span>' + E(b.kt) + ' · ' + hijri(b.at) + ' · ' + t12(b.at) + '</span></span>' +
      pill(AR(b.score) + '٪', b.score >= 85 ? 'live' : b.score >= 70 ? 'wait' : 'no') + '</div>' +

    '<div class="card">' + head('مسار الزيارات', 'هذه الجهة زُرِعت ' + AR(mine.length) + ' مرّة') +
      '<div class="visits">' + mine.map(v =>
        '<div class="vis' + (v.id === b.id ? ' on' : '') + '">' +
        '<b class="num">' + AR(v.visit) + '</b>' +
        '<span class="meter' + (v.score < 70 ? ' red' : ' gold') + '"><i data-w="' + v.score + '"></i></span>' +
        '<span class="tiny num">' + AR(v.score) + '٪</span></div>').join('') + '</div></div>' +

    '<div class="card">' + head('الإجابات', AR(f.qs.length) + ' سؤالًا') +
      '<div class="plist">' + f.qs.map(q => {
        const a = b.answers.find(x => x.id === q.id) || {};
        const v = q.t === 'yn' ? (a.v ? pill('نعم','live') : pill('لا','no'))
          : q.t === 'rate' ? stars(a.v || 0)
          : q.t === 'num' ? '<b class="num">' + AR(a.v) + '</b>'
          : q.t === 'photo' ? (a.v ? fileChip(a.v) : pill('بلا صورة','no'))
          : q.t === 'sign' ? (a.v ? pill('مُتعهَّد','live') : pill('بلا تعهّد','no'))
          : '<span class="tiny">' + E(String(a.v || '—')) + '</span>';
        return '<div class="prow" style="padding:10px 12px">' +
          '<span class="nm" style="flex:1"><b style="font-size:12.5px">' + E(q.q) + '</b>' +
          '<span>' + E(QT[q.t]) + (q.w ? ' · وزن ' + AR(q.w) : ' · لا يُحتسب') + '</span></span>' +
          '<span class="end">' + v + '</span></div>';
      }).join('') + '</div></div>');
}

/* ============================================================
   التشكيل والتسكين
   ثلاث لوحات مصدر — مشرفون · ليدرز · محسنون —
   وصندوق في الوسط تُبنى فيه المجموعة، ثم تُربط بجهة الحج.
   قاعدتان لا تُكسران:
     · المحسن لا ينضمّ لمجموعتين — يخرج من الإتاحة فور تسكينه.
     · الليدر يقود مجموعتين، ولكلٍّ محسنوها.
   ============================================================ */

const DRAFT0 = () => ({ leaderId:null, members:[], orgId:null, hotelId:null, supervisorId:null, editing:null });
const draft = () => (S.draft = S.draft || DRAFT0());

/* بطاقة شخص في لوحة المصدر */
function personCard(u, act, extra) {
  const g = u.groupId ? groupById(u.groupId) : null;
  return '<button class="pcard' + (act ? '' : ' off') + '" ' +
    (act ? 'data-a="' + act + '" data-id="' + u.id + '"' : 'disabled') + '>' +
    avatar(u, 'sm') +
    '<span class="nm"><b>' + E(u.name) + '</b>' +
      '<span>' + LTR(u.code) + (u.specialty ? ' · ' + E(u.specialty) : '') + '</span></span>' +
    (extra || (g ? pill(g.no, 'grey') : '')) + '</button>';
}

function screenBuild() {
  const d = draft();
  const q = qOf('bld');
  /* من وُضع في الصندوق خرج من الإتاحة فورًا — لا ينتظر الحفظ */
  let free = freeMuhsens().filter(u => !d.members.some(m => m.id === u.id));
  if (q) free = free.filter(u => (u.name + ' ' + u.code + ' ' + u.specialty).indexOf(q) >= 0);
  const L = d.leaderId ? userById(d.leaderId) : null;
  const org = d.orgId ? orgById(d.orgId) : null;
  const hotel = d.hotelId ? hotelById(d.hotelId) : null;
  const sv = d.supervisorId ? userById(d.supervisorId) : null;
  const ready = d.leaderId && d.members.length === 5 && d.orgId;

  return '<div class="grid g4">' +
      stat({ label:'مجموعات مشكَّلة', n:V.groups.length, ic:'i-users', cls:'up',

      stat({ label:'محسنون بلا مجموعة', n:free.length, ic:'i-user',

        series:[25,20,15,10,7,4,2,Math.max(0, freeMuhsens().length)] }) +
      stat({ label:'مشرفون', n:supervisors().length, ic:'i-shield',

      stat({ label:'جهات الحجّ', n:V.orgs.length, ic:'i-flag',
        sub:'بعثات وشركات', series:[1,2,3,3,4,4,5,V.orgs.length] }) +
    '</div>' +

    '<div class="board3">' +
      /* ═════ المصادر ═════ */
      '<div class="card src">' +
        head('المصادر', 'انقر لتضيفه إلى التشكيل', '', 'i-users') +
        '<div class="srcgrp"><span class="slab">' + icon('i-shield','s14') + 'مشرفون</span>' +
          supervisors().map(u => personCard(u, 'bsup',
            pill(hotelById(u.hotelId).ar || '—', d.supervisorId === u.id ? 'live' : 'gold'))).join('') +
        '</div>' +
        '<div class="srcgrp"><span class="slab">' + icon('i-star','s14') + 'ليدرز' +
          '<i class="cnt">' + AR(leaders().length) + '</i></span>' +
          leaders().map(u => {
            const gn = groupsOf(u.id).length;
            const same = d.leaderId === u.id;
            return personCard(u, gn >= 2 && !same ? null : 'blead',
              same ? pill('في التشكيل', 'live')

          }).join('') +
        '</div>' +
        '<div class="srcgrp"><span class="slab">' + icon('i-user','s14') + 'محسنون متاحون' +
          '<i class="cnt">' + AR(free.length) + '</i></span>' +
          '<div style="margin:0 0 9px">' + search('bld', 'ابحث في المتاحين…', freeMuhsens().length) + '</div>' +
          (free.length ? free.map(u => personCard(u, 'bmem')).join('')

        '</div>' +
      '</div>' +

      /* ═════ صندوق التشكيل ═════ */
      '<div class="card gold buildbox">' +
        head(d.editing ? 'تعديل ' + E(groupById(d.editing).no) : 'تشكيل مجموعة جديدة',

        '<div class="slot lead">' +
          '<span class="sl">الليدر</span>' +
          (L ? '<div class="fl" style="flex:1;gap:11px">' + avatar(L, 'sm') +

              '<span>' + LTR(L.code) + ' · ' + E(L.kt) + ' · ' + AR(L.pilgrims) + ' حاجًّا</span></span>' +
              '<button class="xbtn" data-a="bclrlead">' + icon('i-x','s14') + '</button></div>'
            : '<span class="ph">اختر ليدرًا من المصادر</span>') +
        '</div>' +

        '<div class="slots">' + [0,1,2,3,4].map(i => {

          return '<div class="slot' + (u ? ' full' : '') + '">' +

                '<span>' + LTR(u.code) + ' · ' + AR(u.age || 29) + ' سنة</span></span>' +
                '<select class="spec" data-a="bspec" data-id="' + u.id + '">' +

                '</select>' +
                '<button class="xbtn" data-a="bdel" data-id="' + u.id + '">' + icon('i-x','s14') + '</button></div>'

        '<div class="pickrow"><span class="sl">جهة الحجّ</span>' +
          '<div class="chips">' + V.orgs.map(o =>

        '<div class="pickrow"><span class="sl">السكن</span>' +
          '<div class="chips">' + HOTELS.map(h =>

            E(h.ar) + '</button>').join('') + '</div></div>' +

        (hotel ? '<div class="quote">' + E(hotel.ar) + ' · ' + E(hotel.dist) + ' · ' +
          AR(hotel.rooms) + ' غرفة' +
          (sv ? ' — المشرف ' + E(sv.name) : ' — بلا مشرف بعد') + '</div>' : '') +

        '<div class="fl" style="gap:10px;margin-top:16px">' +
          '<button class="btn p" style="flex:1"' + (ready ? '' : ' disabled') +
            ' data-a="bsave">' + icon('i-checkc','s16') +

        '</div>' +
        '<div class="tiny faint" style="margin-top:10px">' +
          'بالحفظ تُسكَّن كلّ مهام ' + (org ? E(org.kt) : 'الجهة') +
          ' على هذه المجموعة تلقائيًّا، ويخرج محسنوها من قوائم الإتاحة.</div>' +
      '</div>' +

      /* ═════ المجموعات القائمة ═════ */
      '<div class="card src">' +
        head('المجموعات القائمة', AR(V.groups.length) + ' مجموعة', '', 'i-checkc') +
        (V.groups.length ? V.groups.map(g => {
          const gl = userById(g.leaderId) || {}, go = orgById(g.orgId) || {};
          const gh = hotelById(g.hotelId), gs = g.supervisorId ? userById(g.supervisorId) : null;
          const tn = V.tasks.filter(t => t.leaderId === g.leaderId).length;
          return '<div class="gitem' + (d.editing === g.id ? ' on' : '') + '">' +
            '<div class="fl" style="gap:10px">' + avatar(gl, 'sm') +
              '<span class="nm" style="flex:1"><b>' + LTR(g.no) + ' · ' + E(gl.name || '') + '</b>' +
              '<span>' + E(go.kt || '') + ' · ' + E(go.ar || '') + '</span></span>' +
              pill(AR(g.members.length + 1), 'gold') + '</div>' +
            '<div class="faces">' + g.members.map(m => {
              const mu = userById(m.id);
              return mu ? '<span class="fw" title="' + E(mu.name + ' — ' + m.spec) + '">' +
                avatar(mu, 'sm') + '</span>' : '';
            }).join('') + '</div>' +
            '<div class="pfoot">' +
              '<span class="ok">' + E(gh.ar || '—') + (gs ? ' · ' + E(gs.name) : '') + '</span>' +
              '<span class="fl" style="gap:7px">' + pill(AR(tn) + ' مهمة', 'grey') +

    '</div>' +

    /* ═════ المشرفون على الفنادق ═════ */
    '<div class="card">' +
      head('المشرفون على الفنادق', 'المشرف يتبع الفندق لا الجهة — وقد يجتمع تحته ليدر بعثة وليدر شركة',
        '', 'i-shield') +
      '<div class="grid g2">' + HOTELS.map(h => {
        const sup = supervisors().filter(u => u.hotelId === h.id);
        const gs = V.groups.filter(g => g.hotelId === h.id);
        return '<div class="hotel">' +
          '<div class="fl" style="gap:11px;margin-bottom:11px">' +
            '<span class="ico">' + icon('i-key','s18') + '</span>' +
            '<span class="nm" style="flex:1"><b>' + E(h.ar) + '</b>' +
            '<span>' + E(h.city) + ' · ' + E(h.dist) + ' · ' + AR(h.rooms) + ' غرفة</span></span>' +

            '<span>' + LTR(u.code) + ' · مشرف سكن</span></span>' +

            : '<div class="tiny faint">بلا مشرف</div>') +

            const gl = userById(g.leaderId) || {}, go = orgById(g.orgId) || {};

              '<span class="tiny"><b>' + LTR(g.no) + '</b><br>' +

/* ============================================================
   التسكين التراتبي — ثلاث خطوات لا لوحة واحدة
     ١) المشرفون على الفنادق — مشرف واحد لكل فندق لا أكثر
     ٢) الليدرز على المجموعات — لكل مجموعة جهةٌ وسكنٌ وليدر
     ٣) المحسنون على الليدرز — خمسة لكل مجموعة
   ============================================================ */

const ASG_STEPS = [
  { k:'sup',  ar:'المشرفون على الفنادق', i:'i-key',   d:'مشرف واحد لكل فندق' },
  { k:'lead', ar:'الليدرز على المجموعات', i:'i-star',  d:'ليدر يقود مجموعتين لا ثلاثًا' },
  { k:'muh',  ar:'المحسنون على الليدرز',  i:'i-users', d:'خمسة لكل مجموعة — ولا يُثنّى محسن' }
];

function screenAssign() {
  const step = S.tab.asg || 'sup';
  const done = {
    sup:  HOTELS.filter(h => supOfHotel(h.id)).length,
    lead: S.groups.length,
    muh:  S.groups.filter(g => g.members.length === 5).length
  };
  const need = { sup: HOTELS.length, lead: S.groups.length || 1, muh: S.groups.length || 1 };

  return '<div class="asgsteps">' + ASG_STEPS.map((s, i) => {
    const pct = Math.round(done[s.k] / Math.max(1, need[s.k]) * 100);
    return '<button class="astep' + (s.k === step ? ' on' : '') + '" ' +
      'data-a="seg" data-k="asg" data-v="' + s.k + '">' +
      '<span class="an">' + AR(i + 1) + '</span>' +
      '<span class="ico" style="color:var(--gold2)">' + icon(s.i, 's18') + '</span>' +
      '<span class="nm"><b>' + E(s.ar) + '</b><span>' + E(s.d) + '</span></span>' +
      '<span class="ae"><b class="num">' + AR(done[s.k]) + '/' + AR(need[s.k]) + '</b>' +
        '<span class="meter' + (pct < 100 ? ' gold' : '') + '"><i data-w="' + pct + '"></i></span>' +
      '</span></button>';
  }).join('') + '</div>' +
    (step === 'sup' ? stepSup() : step === 'lead' ? stepLead() : stepMuh());
}

const supOfHotel = hid => supervisors().find(u => u.hotelId === hid) || null;

/* ══════════════ ١) المشرفون على الفنادق ══════════════ */
function stepSup() {
  const q = qOf('asup');
  const fs2 = fOf('asup','state');
  let list = HOTELS.slice();
  if (q) list = list.filter(h => h.ar.indexOf(q) >= 0);
  if (fs2) list = list.filter(h => fs2 === 'y' ? !!supOfHotel(h.id) : !supOfHotel(h.id));
  const free = supervisors().filter(u => !u.hotelId);

  return '<div class="grid g23">' +
    '<div class="card">' +
      head('الفنادق', 'لكل فندق مشرف واحد — لا اثنان',
        pill(AR(HOTELS.filter(h => supOfHotel(h.id)).length) + ' مُسكَّن', 'gold'), 'i-key') +
      filterBar('asup', [
        { k:'state', label:'التسكين', opts:[['y','له مشرف'],['n','بلا مشرف']] }
      ], list.length, HOTELS.length, 'ابحث باسم فندق…') +
      '<div class="plist">' + list.map(h => {
        const sv = supOfHotel(h.id);
        const gs = S.groups.filter(g => g.hotelId === h.id);
        return '<div class="prow" style="flex-wrap:wrap">' +
          '<span class="krail" style="background:' + (sv ? 'var(--live)' : 'var(--amber)') + '"></span>' +
          '<span class="ico">' + icon('i-key','s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(h.ar) + '</b>' +
          '<span>' + E(h.city) + ' · ' + E(h.dist) + ' · ' + AR(h.rooms) + ' غرفة</span></span>' +
          pill(AR(gs.length) + ' مجموعة', gs.length ? 'live' : 'grey') +
          '<div style="width:100%;margin-top:10px">' +
            (sv
              ? '<div class="fl" style="gap:10px;flex-wrap:wrap">' + avatar(sv, 'sm') +
                '<span class="nm" style="flex:1"><b>' + E(sv.name) + '</b>' +
                '<span>' + LTR(sv.code) + ' · مشرف سكن</span></span>' +
                '<button class="btn l sm" data-a="supswap" data-id="' + h.id + '">تغيير</button>' +
                '<button class="btn d sm" data-a="suprm" data-id="' + h.id + '">إزالة</button></div>'
              : '<div class="fl" style="gap:10px">' +
                '<span class="mchip">' + icon('i-warn','s14') + 'بلا مشرف</span>' +
                '<button class="btn p sm" data-a="supswap" data-id="' + h.id + '">تسكين مشرف</button></div>') +
          '</div></div>';
      }).join('') + '</div>' +
    '</div>' +

    '<div class="card gold">' +
      head('مشرفون بلا فندق', free.length ? 'متاحون للتسكين' : 'كلّهم مسكَّنون',
        pill(AR(free.length), free.length ? 'live' : 'grey'), 'i-shield') +
      (free.length ? '<div class="plist">' + free.map(u =>
        '<div class="prow">' + avatar(u, 'sm') +
        '<span class="nm" style="flex:1"><b>' + E(u.name) + '</b>' +
        '<span>' + LTR(u.code) + ' · ' + AR(u.age || 34) + ' سنة</span></span>' +

  let gs = S.groups.slice();
  if (fo) gs = gs.filter(g => g.orgId === fo);
  if (fh) gs = gs.filter(g => g.hotelId === fh);
  if (ft) gs = gs.filter(g => (orgById(g.orgId) || {}).type === ft);
  if (q) gs = gs.filter(g => (g.no + ' ' + (userById(g.leaderId) || {}).name +
    ' ' + (orgById(g.orgId) || {}).kt).indexOf(q) >= 0);
  const freeL = leaders().filter(l => groupsOf(l.id).length < 2);

  return '<div class="grid g23">' +
    '<div class="card">' +
      head('المجموعات وليدرزها', 'الليدر يقود مجموعتين لا ثلاثًا',
        pill(AR(gs.length) + ' من ' + AR(S.groups.length), 'gold'), 'i-star') +
      filterBar('alead', [
        { k:'org',   label:'الجهة', opts:optOrgs() },
        { k:'type',  label:'النوع', opts:optTypes() },
        { k:'hotel', label:'السكن', opts:optHotels() }
      ], gs.length, S.groups.length, 'ابحث برقم مجموعة أو ليدر أو KT…') +
      '<div class="plist">' + (gs.length ? gs.map(g => {
        const L = userById(g.leaderId) || {}, o = orgById(g.orgId) || {};
        const h = hotelById(g.hotelId), sv = g.supervisorId ? userById(g.supervisorId) : null;
        const n = groupsOf(g.leaderId).length;
        return '<div class="prow" style="flex-wrap:wrap">' +
          '<span class="krail" style="background:' +
            (o.type === 'بعثة' ? 'var(--blue)' : 'var(--gold)') + '"></span>' +
          avatar(L, 'sm') +
          '<span class="nm" style="flex:1"><b>' + LTR(g.no) + ' · ' + E(L.name || '—') + '</b>' +
          '<span>' + E(o.kt || '') + ' · ' + E(o.ar || '') + ' · ' + E(h.ar || 'بلا سكن') + '</span></span>' +
          pill(E(o.type || '—'), o.type === 'بعثة' ? 'blue' : 'gold') +
          pill(AR(g.members.length + 1) + '/٦', g.members.length === 5 ? 'live' : 'wait') +
          (n > 1 ? pill('يقود ' + AR(n), 'wait') : '') +
          '<div class="pfoot" style="width:100%">' +
            '<span class="ok">' + (sv ? 'المشرف ' + E(sv.name) : 'بلا مشرف — سكِّن مشرف الفندق أوّلًا') + '</span>' +
            '<span class="fl" style="gap:7px">' +
              '<button class="btn l sm" data-a="gleadswap" data-id="' + g.id + '">تغيير الليدر</button>' +

            '</span></div></div>';
      }).join('') : empty('لا مجموعة تطابق', 'وسّع الفلاتر', 'i-search')) + '</div>' +
    '</div>' +

    '<div class="card gold">' +
      head('ليدرز يقبلون مجموعة', AR(freeL.length) + ' ليدرًا',
        '<button class="btn p sm" data-a="gnew">' + icon('i-plus','s16') + 'مجموعة جديدة</button>',

}

/* ══════════════ ٣) المحسنون على الليدرز ══════════════ */
function stepMuh() {
  const q = qOf('amuh');
  const fo = fOf('amuh','org'), fh = fOf('amuh','hotel'), fst = fOf('amuh','full');
  let gs = S.groups.slice();
  if (fo) gs = gs.filter(g => g.orgId === fo);
  if (fh) gs = gs.filter(g => g.hotelId === fh);
  if (fst) gs = gs.filter(g => fst === 'y' ? g.members.length === 5 : g.members.length < 5);
  if (q) gs = gs.filter(g => (g.no + ' ' + (userById(g.leaderId) || {}).name).indexOf(q) >= 0 ||

  const free = freeMuhsens();
  const fq = qOf('afree');

  return '<div class="grid g23">' +

      head('المجموعات ومحسنوها', 'انقر مقعدًا فارغًا لتملأه، أو محسنًا لتُخرجه',
        pill(AR(gs.length) + ' مجموعة', 'gold'), 'i-users') +
      filterBar('amuh', [
        { k:'org',   label:'الجهة',  opts:optOrgs() },
        { k:'hotel', label:'السكن',  opts:optHotels() },
        { k:'full',  label:'الاكتمال', opts:[['y','مكتملة'],['n','ناقصة']] }
      ], gs.length, S.groups.length, 'ابحث بمجموعة أو ليدر أو محسن…') +
      (gs.length ? gs.map(g => {

          '<div class="fl" style="gap:10px;margin-bottom:11px">' + avatar(L, 'sm') +

            '<span>' + E(o.kt || '') + ' · ' + E(hotelById(g.hotelId).ar || '') + '</span></span>' +
            pill(AR(g.members.length) + '/٥', g.members.length === 5 ? 'live' : 'wait') + '</div>' +
          '<div class="seats">' + [0,1,2,3,4].map(i => {
            const m = g.members[i], u = m ? userById(m.id) : null;
            return u
              ? '<button class="seat full" data-a="mseatout" data-id="' + g.id +
                '" data-v="' + u.id + '" title="إخراجه من المجموعة">' + avatar(u, 'sm') +
                '<span class="nm"><b>' + E(u.name) + '</b>' +

              : '<button class="seat" data-a="mseatin" data-id="' + g.id + '">' +
                '<span class="plus">' + icon('i-plus','s16') + '</span>' +
                '<span class="nm"><b>مقعد فارغ</b><span>انقر لتملأه</span></span></button>';
          }).join('') + '</div></div>';
      }).join('') : empty('لا مجموعة تطابق', 'وسّع الفلاتر', 'i-search')) +
    '</div>' +

    '<div class="card gold src">' +
      head('محسنون بلا مجموعة', 'هؤلاء وحدهم متاحون',
        pill(AR(free.length), free.length ? 'live' : 'grey'), 'i-user') +
      '<div style="margin-bottom:11px">' + search('afree', 'ابحث في المتاحين…', free.length) + '</div>' +
      (freeList.length ? freeList.slice(0, 40).map(u =>
        '<div class="pcard" style="cursor:default">' + avatar(u, 'sm') +
        '<span class="nm"><b>' + E(u.name) + '</b>' +
        '<span>' + LTR(u.code) + ' · ' + E(u.specialty) + ' · ' + AR(u.age || 28) + ' سنة</span></span>' +
        '</div>').join('') +
        (freeList.length > 40 ? '<div class="tiny faint" style="margin-top:10px">و' +
          AR(freeList.length - 40) + ' آخرين — ضيّق البحث</div>' : '')

    '</div></div>';
}

/* ============================================================
   العفاشة — مقاولون لهم عمّال، يُتعاقد معهم
   ─────────────────────────────────────────────────────────────
   الدورة: يُضاف المقاول ← تصل رسالة نصية بدخوله ←
   يُرسَل له عقدٌ بتفاصيله ومرفقه ← يقبل أو يرفض،
   وللكنترول أن يوافق نيابةً عنه إن تُعوقد خارج النظام.
   ============================================================ */

const DEAL_ST = {
  draft:   { ar:'مسودة',            c:'grey' },
  sent:    { ar:'أُرسل — بانتظاره', c:'wait' },
  agreed:  { ar:'قُبل',              c:'live' },
  refused: { ar:'رُفض',              c:'no'   },
  offline: { ar:'مُعتمد خارج النظام', c:'blue' }
};
const SMS_ST = {
  queued:    { ar:'في الطابور',  c:'grey', i:'i-hour' },
  sent:      { ar:'أُرسلت',      c:'wait', i:'i-send' },
  delivered: { ar:'وصلت',        c:'live', i:'i-checkc' },
  failed:    { ar:'لم تصل',      c:'no',   i:'i-x' }
};

const openDeals = () => V.deals.filter(d => d.state === 'sent' || d.state === 'draft');
const dealById = id => S.deals.find(d => d.id === id);
const contractorById = id => S.contractors.find(c => c.id === id);
const dealsOf = cid => V.deals.filter(d => d.contractorId === cid);

function screenAfasha() {
  const q = qOf('afa');
  const fst = fOf('afa','state'), fsm = fOf('afa','sms');
  let list = V.contractors.slice();
  if (fst) list = list.filter(c => (lastDeal(c.id) || {}).state === fst);
  if (fsm) list = list.filter(c => c.sms === fsm);
  if (q) list = list.filter(c => (c.name + ' ' + c.company + ' ' + c.phone).indexOf(q) >= 0);
  const agreed = V.contractors.filter(c => {
    const d = lastDeal(c.id); return d && (d.state === 'agreed' || d.state === 'offline'); }).length;

  return '<div class="grid g4">' +
      stat({ label:'المقاولون', n:V.contractors.length, ic:'i-truck',
        sub:'لكلٍّ عمّاله', series:[2,4,6,8,10,12,13,V.contractors.length] }) +
      stat({ label:'متعاقَد معهم', n:agreed, ic:'i-checkc', cls:'up',
        sub:'قبلوا أو اعتُمدوا خارج النظام', series:[0,1,2,3,4,5,6,agreed] }) +
      stat({ label:'بانتظار ردّهم', n:V.deals.filter(d => d.state === 'sent').length, ic:'i-hour',
        cls:'warn', sub:'أُرسل العقد ولم يُبَتّ',
        series:[1,2,2,3,3,4,3,Math.max(1, V.deals.filter(d => d.state === 'sent').length)] }) +
      stat({ label:'رسائل لم تصل', n:V.contractors.filter(c => c.sms === 'failed').length,
        ic:'i-x', cls:'bad', sub:'تحتاج رقمًا صحيحًا', series:[0,1,0,1,1,2,1,1] }) +
    '</div>' +

    '<div class="card gold">' +
      head('مقاولو العفاشة', 'يُضاف المقاول فتصل رسالته، ثم يُرسَل له العقد',
        '<button class="btn p sm" data-a="cnew">' + icon('i-plus','s16') + 'مقاول جديد</button>',
        'i-truck') +
      filterBar('afa', [
        { k:'state', label:'العقد',   opts:Object.keys(DEAL_ST).map(k => [k, DEAL_ST[k].ar]) },
        { k:'sms',   label:'الرسالة', opts:Object.keys(SMS_ST).map(k => [k, SMS_ST[k].ar]) }
      ], list.length, V.contractors.length, 'ابحث باسم مقاول أو شركة أو رقم…') +

      (list.length ? '<div class="plist">' + list.map((c, i) => {
        const d = lastDeal(c.id), st = d ? DEAL_ST[d.state] : DEAL_ST.draft;
        const sm = SMS_ST[c.sms] || SMS_ST.queued;
        return '<div class="prow" style="flex-wrap:wrap;animation-delay:' + (i * 45) + 'ms">' +
          '<span class="krail" style="background:' +
            (d && (d.state === 'agreed' || d.state === 'offline') ? 'var(--live)'
              : d && d.state === 'refused' ? 'var(--red)' : 'var(--amber)') + '"></span>' +
          '<span class="ico">' + icon('i-truck','s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(c.name) + '</b>' +
          '<span>' + E(c.company) + ' · ' + LTR(c.phone) + ' · ' +
            AR(c.workers) + ' عاملًا</span></span>' +
          pill(st.ar, st.c) +
          '<span class="smsbox" title="حالة الرسالة النصية">' + icon(sm.i,'s14') +
            '<span>' + E(sm.ar) + '</span></span>' +
          '<span class="tiny faint">' + ago(c.at) + '</span>' +
          '<div class="pfoot" style="width:100%">' +
            '<span class="ok">' + LTR(c.user) + ' · ' +
              (d ? 'العقد ' + LTR(d.no) + (d.file ? ' · مرفق' : '') : 'بلا عقد بعد') + '</span>' +
            '<span class="fl" style="gap:7px">' +
              (c.sms === 'failed'
                ? '<button class="btn l sm" data-a="csms" data-id="' + c.id + '">إعادة الإرسال</button>' : '') +
              '<button class="btn l sm" data-a="copen" data-id="' + c.id + '">الملفّ</button>' +
              (!d || d.state === 'refused'
                ? '<button class="btn p sm" data-a="cdeal" data-id="' + c.id + '">إرسال عقد</button>'
                : d.state === 'sent'
                ? '<button class="btn p sm" data-a="cagree" data-id="' + d.id + '">موافقة نيابةً عنه</button>'
                : pill('مكتمل', 'live')) +
            '</span></div></div>';
      }).join('') + '</div>'
        : empty('لا مقاول يطابق', 'أضف مقاولًا أو وسّع الفلاتر', 'i-truck')) +
    '</div>';
}
const lastDeal = cid => S.deals.filter(d => d.contractorId === cid)
  .sort((a, b) => b.at - a.at)[0] || null;

        kvRow('i-user','اسم الدخول', c.user, true) +

        '<button class="btn l sm" data-a="csms" data-id="' + c.id + '">' +

      '</div>' +
      '<div class="quote" style="margin-top:12px">' + E(smsText(c)) + '</div>' +

              '<button class="btn d sm" data-a="crefuse" data-id="' + d.id + '">تسجيل رفضه</button></div>' : '') +

/* ============================================================
   النقل — عشرة باصات تنقل المحسنين طوال الموسم
   ─────────────────────────────────────────────────────────────
   الرحلة تتبع مهمّة: من نقطة الانطلاق إلى موقعها، ثم عودة.
   وللباص الواحد رحلات في اليوم، تُجدوَل وتُعاد جدولتها.
   ============================================================ */

const BUS_ST = {
  planned: { ar:'مجدولة',  c:'wait' },
  running: { ar:'جارية',   c:'live' },
  done:    { ar:'انتهت',   c:'grey' },
  late:    { ar:'متأخّرة', c:'no'   }
};
const tripsOf = bid => V.trips.filter(t => t.busId === bid);
const busById = id => S.buses.find(b => b.id === id);
const tripState = t => t.done ? 'done'
  : now() > t.at + 30 * MIN && !t.done ? 'late'
  : now() >= t.at ? 'running' : 'planned';

/* رحلات يومٍ بعينه مرتّبة */
function tripsOn(day) {
  const d0 = dayStart(day), d1 = d0 + DAY;
  return V.trips.filter(t => t.at >= d0 && t.at < d1).sort((a, b) => a.at - b.at);
}

function screenTransport() {
  const day = S.tab.trday ? Number(S.tab.trday) : dayStart(now());
  const q = qOf('trp');
  const fb = fOf('trp','bus'), fk = fOf('trp','kind');
  let list = tripsOn(day);
  if (fb) list = list.filter(t => t.busId === fb);
  if (fk) list = list.filter(t => t.kind === fk);
  if (q) list = list.filter(t => (t.from + ' ' + t.to + ' ' + t.no).indexOf(q) >= 0);
  const late = tripsOn(day).filter(t => tripState(t) === 'late').length;
  const seats = tripsOn(day).reduce((a, t) => a + t.cap, 0);
  const taken = tripsOn(day).reduce((a, t) => a + t.riders.length, 0);

  /* أيام الموسم: خمسة قبل وخمسة بعد */
  const days = [];
  for (let i = -3; i <= 4; i++) days.push(dayStart(now()) + i * DAY);

  return '<div class="grid g4">' +
      stat({ label:'الباصات', n:S.buses.length, ic:'i-bus',
        sub:'تنقل المحسنين طوال الموسم', series:[4,6,7,8,9,10,10,S.buses.length] }) +
      stat({ label:'رحلات اليوم', n:tripsOn(day).length, ic:'i-hist',
        sub:dayName(day) + ' · ' + hijri(day),
        series:[12,18,22,26,30,34,38,Math.max(1, tripsOn(day).length)] }) +
      stat({ label:'إشغال المقاعد', n:seats ? Math.round(taken / seats * 100) : 0, suffix:'٪',
        ic:'i-users', cls:'up', sub:AR(taken) + ' من ' + AR(seats) + ' مقعدًا',
        series:[42,50,58,63,70,74,78,seats ? Math.round(taken / seats * 100) : 0] }) +
      stat({ label:'متأخّرة', n:late, ic:'i-warn', cls:late ? 'bad' : 'up',
        sub:late ? 'تجاوزت موعدها بنصف ساعة' : 'كل الرحلات في وقتها',
        series:[2,1,2,1,1,0,1,late] }) +
    '</div>' +

    '<div class="card">' +
      head('يوم الجدول', 'اختر يومًا لترى رحلاته',
        pill(AR(tripsOn(day).length) + ' رحلة', 'gold'), 'i-cal') +
      '<div class="daystrip">' + days.map(d =>
        '<button class="dchip' + (d === day ? ' on' : '') + (d === dayStart(now()) ? ' today' : '') +
        '" data-a="seg" data-k="trday" data-v="' + d + '">' +
        '<b>' + E(dayName(d)) + '</b><span>' + hijri(d) + '</span>' +
        '<i>' + AR(tripsOn(d).length) + '</i></button>').join('') + '</div>' +
    '</div>' +

    '<div class="card gold">' +
      head('مسار اليوم', 'كل صفٍّ باصّ، وكل كتلة رحلة — والخطّ الأحمر هو الآن',
        '<button class="btn p sm" data-a="trnew">' + icon('i-plus','s16') + 'جدولة رحلة</button>',
        'i-bus') +
      busGantt(day) +
    '</div>' +

    '<div class="card">' +
      head('رحلات اليوم', 'مرتّبة بوقتها', '', 'i-hist') +
      filterBar('trp', [
        { k:'bus',  label:'الباص',  opts:S.buses.map(b => [b.id, b.no + ' · ' + b.plate]) },
        { k:'kind', label:'النوع',  opts:[['toTask','إلى مهمة'],['toHotel','إلى فندق'],
          ['airport','استقبال حجاج'],['back','عودة']] }
      ], list.length, tripsOn(day).length, 'ابحث بنقطة أو رقم رحلة…') +
      (list.length ? '<div class="plist">' + list.map((t, i) => {
        const b = busById(t.busId) || {}, st = BUS_ST[tripState(t)];
        const full = Math.round(t.riders.length / Math.max(1, t.cap) * 100);
        return '<div class="prow trow" data-a="tropen" data-id="' + t.id + '" ' +
          'style="flex-wrap:wrap;animation-delay:' + (i * 35) + 'ms">' +
          '<span class="krail" style="background:' + (b.color || 'var(--dim)') + '"></span>' +
          '<span class="ico" style="color:' + (b.color || 'var(--dim)') + '">' +
            icon('i-bus','s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(t.from) + ' ← ' + E(t.to) + '</b>' +
          '<span>' + LTR(t.no) + ' · ' + E(b.no || '') + ' · ' + E(t.driver) + '</span></span>' +
          '<span class="when"><b>' + t12(t.at) + '</b>' +
            '<span class="num">' + AR(t.dur) + ' دقيقة</span></span>' +
          '<span class="fl" style="gap:9px;min-width:140px">' +
            '<span class="meter" style="flex:1"><i data-w="' + full + '"></i></span>' +
            '<span class="tiny faint num">' + AR(t.riders.length) + '/' + AR(t.cap) + '</span></span>' +
          pill(st.ar, st.c) + '</div>';
      }).join('') + '</div>' : empty('لا رحلة في هذا اليوم', 'جدوِل رحلة من الأعلى', 'i-bus')) +
    '</div>' +

    '<div class="card">' +
      head('الأسطول', AR(S.buses.length) + ' باصات', '', 'i-bus') +
      '<div class="grid g3">' + S.buses.map(b => {
        const mine = tripsOn(day).filter(t => t.busId === b.id);
        const busy = mine.reduce((a, t) => a + t.dur, 0);
        return '<div class="busbox" style="--bc:' + b.color + '">' +
          '<div class="fl" style="gap:10px;margin-bottom:10px">' +
            '<span class="ico" style="color:' + b.color + '">' + icon('i-bus','s18') + '</span>' +
            '<span class="nm" style="flex:1"><b>' + E(b.no) + '</b>' +
            '<span>' + LTR(b.plate) + ' · ' + AR(b.cap) + ' مقعدًا</span></span>' +
            pill(AR(mine.length) + ' رحلة', mine.length ? 'live' : 'grey') + '</div>' +
          '<div class="tiny faint">' + E(b.driver) + ' · ' + LTR(b.phone) + '</div>' +
          '<div class="meter gold" style="margin-top:10px"><i data-w="' +
            Math.min(100, Math.round(busy / 600 * 100)) + '"></i></div>' +
          '<div class="tiny faint" style="margin-top:6px">' +
            AR(Math.round(busy / 60)) + ' ساعات تشغيل اليوم</div>' +
        '</div>';
      }).join('') + '</div>' +
    '</div>';
}

/* ---------- مسار اليوم: صفّ لكل باص ---------- */
function busGantt(day) {
  const d0 = dayStart(day);
  const H0 = 4, H1 = 24;                    /* اليوم يُعرض من الرابعة فجرًا */
  const span = (H1 - H0) * 60;
  const pos = ms => Math.max(0, Math.min(100,
    ((ms - d0) / MIN - H0 * 60) / span * 100));
  const nowPct = dayStart(now()) === d0 ? pos(now()) : -1;

  return '<div class="gantt">' +
    '<div class="ghead">' + Array.from({ length: 10 }, (_, i) => {
      const h = H0 + i * 2;
      return '<span style="inset-inline-start:' + ((h - H0) * 60 / span * 100) + '%">' +
        AR(h > 12 ? h - 12 : h) + (h >= 12 ? ' م' : ' ص') + '</span>';
    }).join('') + '</div>' +
    S.buses.map(b => {
      const mine = tripsOn(day).filter(t => t.busId === b.id);
      return '<div class="grow">' +
        '<span class="glabel" style="--bc:' + b.color + '"><b>' + E(b.no) + '</b>' +
          '<span>' + AR(mine.length) + '</span></span>' +
        '<span class="gtrack">' +
          (nowPct >= 0 ? '<i class="gnow" style="inset-inline-start:' + nowPct + '%"></i>' : '') +
          mine.map(t => {
            const l = pos(t.at), w = Math.max(1.4, t.dur / span * 100);
            const st = tripState(t);
            return '<button class="gtrip ' + st + '" data-a="tropen" data-id="' + t.id + '" ' +
              'style="inset-inline-start:' + l + '%;width:' + w + '%;--bc:' + b.color + '" ' +
              'title="' + E(t.from + ' ← ' + t.to + ' · ' + t12(t.at)) + '">' +
              '<span>' + E(t.to) + '</span></button>';
          }).join('') +
        '</span></div>';
    }).join('') +
  '</div>';
}

/* ---------- درج الرحلة ---------- */

          icon('i-checkc','s16') + 'إنهاء</button>') +

        '<button class="btn l sm" data-a="trider" data-id="' + t.id + '">إضافة راكب</button>') +
      (t.riders.length ? '<div class="plist">' + t.riders.map(rid => {
        const u = userById(rid); if (!u) return '';
        return '<div class="prow">' + avatar(u, 'sm') +
          '<span class="nm" style="flex:1"><b>' + E(u.name) + '</b>' +

/* ============================================================
   أدلة التنفيذ — تُبنى هنا وتُربط بالمهام وتُنشر إلى الأجهزة
   ─────────────────────────────────────────────────────────────
   الدليل يُربط بطريقين:
     · بالتصنيف — فيسري على كل مهام نوعه تلقائيًّا.
     · بمهمّة بعينها — فيَغلب على تصنيفها.
   ============================================================ */

const G_SCOPE = {
  hajj:   { ar:'نشاط حجّ',       i:'i-kaaba',  c:'#0B7A4B' },
  enrich: { ar:'مزار — إثراء',   i:'i-pin',    c:'#1B6E9C' },
  nusuk:  { ar:'خدمة نُسك',      i:'i-idcard', c:'#6B4E9E' },
  comply: { ar:'نموذج امتثال',   i:'i-clip',   c:'#B8791A' },
  free:   { ar:'دليل خاصّ',      i:'i-guide',  c:'#8A5A1E' }
};
const G_ST = {
  draft:  { ar:'مسودة',        c:'grey' },
  review: { ar:'قيد المراجعة', c:'wait' },
  live:   { ar:'معتمد',        c:'live' }
};
const MEDIA_KIND = {
  text:  { ar:'نص',    i:'i-list' },
  photo: { ar:'صور',   i:'i-photo' },
  video: { ar:'فيديو', i:'i-play' },
  pdf:   { ar:'PDF',   i:'i-doc' }
};

/* خيارات الهدف حسب التصنيف */
function gTargets(scope) {
  if (scope === 'hajj')   return Object.keys(CAT).map(k => [k, CAT[k].ar]);
  if (scope === 'enrich') return SITES.map(s => [s.id, s.ar]);
  if (scope === 'nusuk')  return Object.keys(NUSUK_SVC).map(k => [k, NUSUK_SVC[k].ar]);
  if (scope === 'comply') return V.forms.map(f => [f.id, f.title]);
  return [];
}
const gTargetAr = (scope, t) => {
  const o = gTargets(scope).find(x => x[0] === t);
  return o ? o[1] : '—';
};
/* دليل هذه المهمّة: الخاصّ أوّلًا ثم دليل تصنيفها */
function guideForTask(t) {
  const own = V.guides.find(g => g.taskId === t.id && g.status === 'live');
  if (own) return own;
  return V.guides.find(g => g.scope === 'hajj' && g.target === t.kind && g.status === 'live') || null;
}
const guideFor = (scope, target) =>
  V.guides.find(g => g.scope === scope && g.target === target && g.status === 'live') || null;

  const q = qOf('gd');
  const fs2 = fOf('gd','scope'), fst = fOf('gd','state');
  let list = V.guides.slice().sort((a, b) => b.at - a.at);
  if (fs2) list = list.filter(g => g.scope === fs2);
  if (fst) list = list.filter(g => g.status === fst);
  if (q) list = list.filter(g => (g.title + ' ' + gTargetAr(g.scope, g.target)).indexOf(q) >= 0);
  const live = V.guides.filter(g => g.status === 'live').length;

  return '<div class="grid g4">' +
      stat({ label:'أدلة معتمدة', n:live, ic:'i-checkc', cls:'up',

      stat({ label:'مسودات', n:V.guides.filter(g => g.status === 'draft').length, ic:'i-guide',
        cls:'warn', sub:'لا يراها أحد', series:[3,2,3,2,3,2,3,2] }) +
      stat({ label:'مرتبطة بمهمّة بعينها', n:V.guides.filter(g => g.taskId).length, ic:'i-tasks',
        sub:'تَغلب على دليل التصنيف', series:[0,1,1,2,2,3,3,3] }) +
      stat({ label:'وسائط مرفوعة', n:V.guides.reduce((a, g) => a + (g.media || []).length, 0),

    '</div>' +

    '<div class="card gold">' +
      head('أدلة التنفيذ', 'الدليل يُربط بتصنيف فيسري على كل مهامه، أو بمهمّة بعينها',

/* ============================================================
   الإشعارات — ثلاث وجهات، ولكلٍّ فئاتها
   تطبيق المحسن · تطبيق الحاجّ · الكنترول
   ============================================================ */

const CAST_DEST = {
  muhsen: { ar:'تطبيق المحسن', i:'i-user',   c:'#0B7A4B',
            d:'يصل الميدان في جهازه — ويوقظه إن كان مغلقًا' },
  hajj:   { ar:'تطبيق الحاجّ',  i:'i-users',  c:'#6B4E9E',
            d:'يصل الحاجّ بلغته — ويظهر في إشعاراته' },
  ctl:    { ar:'الكنترول',      i:'i-target', c:'#1B6E9C',
            d:'داخل غرفة العمليات لمن يحمل الصفة' }
};

/* فئات كل وجهة — تُبنى من البيانات الحيّة لا من قائمة ثابتة */
function castAud(dest) {
  if (dest === 'muhsen') return [
    ['all',      'كل المحسنين',      S.users.filter(u => u.role === 'muhsen' && !u.reserve).length],
    ['leaders',  'الليدرز',          leaders().length],
    ['sups',     'المشرفون',         supervisors().length],
    ['reserve',  'الفريق الاحتياطي', reserveTeam().length]
  ].concat(S.orgs.map(o => ['kt:' + o.kt, o.kt + ' · ' + o.ar,
      S.users.filter(u => u.kt === o.kt && u.role === 'muhsen').length]))
   .concat(SPECS.map(s => ['sp:' + s, 'تخصّص ' + s,
      S.users.filter(u => u.specialty === s && u.role === 'muhsen').length]));

  if (dest === 'hajj') return [
    ['all', 'كل الحجاج', allPilgrimRows().length],
    ['arrived',  'من وصلوا',      allPilgrimRows().filter(p => p.state === 'وصل').length],
    ['pending',  'من لم يصلوا',   allPilgrimRows().filter(p => p.state === 'لم يصل').length],
    ['care',     'حالات الرعاية', allPilgrimRows().filter(p => p.flag).length]
  ].concat(S.orgs.map(o => ['kt:' + o.kt, o.kt + ' · ' + o.ar,
      (S.pilgrims[o.kt] || []).length]))
   .concat(HOTELS.map(h => ['ht:' + h.id, 'نُزلاء ' + h.ar,
      S.groups.filter(g => g.hotelId === h.id).reduce((a, g) =>
        a + ((S.pilgrims[(orgById(g.orgId) || {}).kt] || []).length), 0)]));

  return [['all', 'كل مستخدمي الكنترول', PERMS.length]]
    .concat(PERMS.map(p => ['pm:' + p.k, 'صفة ' + p.ar, 1]));
}
const audAr = (dest, k) => (castAud(dest).find(x => x[0] === k) || [0, k])[1];
const audN  = (dest, k) => (castAud(dest).find(x => x[0] === k) || [0, 0, 0])[2] || 0;

function card(title, sub, body, ic, right) {
  return '<div class="card hov">' + head(title, sub, right || '', ic) +
    '<div class="wbody">' + body + '</div></div>';
}
function listCard(title, sub, ic, rows, emptyTxt, right) {
  return '<div class="card hov">' + head(title, sub, right || '', ic) +
    (rows.length ? '<div class="wbody plist">' + rows.join('') + '</div>'
      : '<div class="wbody">' + empty(emptyTxt || 'لا شيء', '', 'i-checkc') + '</div>') + '</div>';
}
function rowMini(ic, color, title, sub, right, act, id) {
  return '<div class="prow"' + (act ? ' data-a="' + act + '" data-id="' + id + '"' : '') +
    ' style="padding:10px 12px">' +
    '<span class="ico" style="color:' + (color || 'var(--dim)') + '">' + icon(ic,'s16') + '</span>' +
    '<span class="nm" style="flex:1"><b>' + E(title) + '</b>' +
    '<span>' + E(sub) + '</span></span>' + (right || '') + '</div>';
}
function rangeTasks() {
  const r = S.tab.rng || 'today';
  if (r === 'season') return V.tasks.slice();
  if (r === 'week') {
    const a = dayStart(now()) - 3 * DAY, b = a + 7 * DAY;
    return V.tasks.filter(t => t.start >= a && t.start < b);
  }
  return V.tasks.filter(t => dayStart(t.start) === dayStart(now()));
}

   المؤشّرات
   ============================================================ */
function wTasksKpi() {
  const s = rangeTasks(), d = s.filter(t => t.status === 'done');
  return stat({ label:'مهام المدة', n:s.length, delta:s.length - 8, ic:'i-tasks',
    sub:AR(d.length) + ' منجزة · ' + AR(runningTasks().length) + ' جارية',
    series:[6,8,7,11,9,13,10,Math.max(1, s.length)] });
}
function wDecideKpi() {
  const n = decisionItems().length;
  return stat({ label:'قرارات تنتظرك', n, delta:n ? n - 1 : 0, ic:'i-send',
    cls:n ? 'warn' : 'up', sub:AR(openSupport().length) + ' دعم · ' +
      AR(escalatedReports().length) + ' تقرير', series:[1,2,1,3,2,4,3,Math.max(1, n)] });
}
function wTicketsKpi() {
  const crit = V.tickets.filter(k => k.pri === 'حرجة' && k.status !== 'مغلقة').length;
  return stat({ label:'تذاكر مفتوحة', n:openTickets().length, delta:2, ic:'i-ticket',
    cls:crit ? 'bad' : '', sub:AR(crit) + ' حرجة · من الحجاج',
    series:[3,5,4,6,5,8,6,Math.max(1, openTickets().length)] });
}
function wStartKpi() {
  const s = rangeTasks(), auto = s.filter(t => t.autoStarted).length;
  const pct = s.length ? Math.round((1 - auto / s.length) * 100) : 100;
  return stat({ label:'التزام البدء', n:pct, suffix:'٪', delta:auto ? -auto : 0,
    ic:'i-play', cls:auto ? 'warn' : 'up',
    sub:auto ? AR(auto) + ' مهمة بدأها النظام' : 'كل المهام بدأها ليدرها',
    series:[88,90,86,92,89,94,91,pct] });
}
function wStaffKpi() {
  const n = V.users.filter(u => u.role === 'muhsen' && !u.reserve).length;

    sub:AR(leaders().length) + ' ليدرًا · ' + AR(supervisors().length) + ' مشرفًا',
    series:[40,70,100,120,140,150,158,n] });

/* كثافة الأسبوع: أيام × نوافذ ساعتين */
function wHeat() {
  const days = [], d0 = dayStart(now()) - 3 * DAY;
  for (let i = 0; i < 7; i++) days.push(d0 + i * DAY);
  let mx = 1;
  const grid = days.map(d => {
    const row = [];
    for (let h = 0; h < 24; h += 2) {
      const a = d + h * HR, b = a + 2 * HR;
      const n = V.tasks.filter(t => t.start < b && t.end > a).length;
      if (n > mx) mx = n;
      row.push({ n, at:a });
    }
    return { d, row };
  });
  return '<div class="card hov">' +
    head('كثافة الأسبوع', 'كل مربّع نافذة ساعتين — واللون كثافة المهام فيها',
      pill('الأعلى ' + AR(mx), 'gold'), 'i-hist') +
    '<div class="heat">' +
      '<div class="hhead"><span></span>' + Array.from({ length: 12 }, (_, i) =>
        '<span>' + AR(i * 2) + '</span>').join('') + '</div>' +
      grid.map(g => '<div class="hrow' + (g.d === dayStart(now()) ? ' today' : '') + '">' +
        '<span class="hl">' + E(dayName(g.d).slice(0, 3)) + '</span>' +
        g.row.map(c => '<span class="hc" style="--v:' + (c.n / mx).toFixed(2) + '" ' +
          'title="' + E(dayName(g.d) + ' · ' + AR(c.n) + ' مهمة') + '">' +
          (c.n ? AR(c.n) : '') + '</span>').join('') + '</div>').join('') +
    '</div></div>';
}

  const t1 = now() + 60 * MIN;
  const ts = V.tasks.filter(t => t.start > now() && t.start <= t1)
    .sort((a, b) => a.start - b.start);
  const tr = V.trips.filter(t => t.at > now() && t.at <= t1).sort((a, b) => a.at - b.at);
  const items = ts.map(t => ({ at:t.start, i:(CAT[t.kind] || {}).i || 'i-tasks',
      c:(CAT[t.kind] || {}).c, t:t.title, s:t.kt + ' · ' + t.place, a:'tlopen', id:t.id }))
    .concat(tr.map(t => ({ at:t.at, i:'i-bus', c:(busById(t.busId) || {}).color,
      t:'رحلة إلى ' + t.to, s:(busById(t.busId) || {}).no + ' · ' + AR(t.riders.length) + ' راكبًا',
      a:'tropen', id:t.id })))
    .sort((a, b) => a.at - b.at);
  return listCard('الساعة القادمة', AR(items.length) + ' حدثًا خلال ٦٠ دقيقة', 'i-hour',
    items.map(x => rowMini(x.i, x.c, x.t, x.s,
      '<span class="tiny faint num">' + t12(x.at) + '</span>', x.a, x.id)),
    'لا شيء خلال ساعة');
}

/* ============================================================
   المهمّة كاملةً — ما يراه المحسن في التطبيق يراه الكنترول هنا، وأكثر

   القاعدة: الكنترول هو الأصل. فكلّ ما يستطيعه الليدر والمحسن في
   الميدان يستطيعه الكنترول من هنا — يبدأ ويُغلق ويؤشّر ويسكّن ويرفع
   الملفات — ويُسجَّل كلّ ذلك باسم «النظام» في سجلّ المهمّة، فلا يختلط
   فعلُ الغرفة بفعل الميدان.
   ============================================================ */

/* ---------- ضمان البنية: المهمّة القديمة تُهاجَر ولا تُفقَد ---------- */
function ensureTask(t) {
  if (!t) return t;
  const c = CAT[t.kind] || {};
  if (!t.subs) t.subs = (c.subs || []).map((n, i) =>
    ({ id: t.id + '-S' + (i + 1), no: i + 1, name: n, done: false, at: null, by: null, shot: null }));
  if (!t.reqs)  t.reqs  = [];
  if (!t.files) t.files = [];
  if (!t.notes) t.notes = [];
  if (!t.hist)  t.hist  = [];
  if (!t.attended) t.attended = [];
  if (!t.assigned) t.assigned = [];
  return t;
}

/* ---------- بذر التفصيل: فرعيات وصور وعقود ومتطلّبات وسجلّ ---------- */
function seedTaskDetail(st) {
  st.reqtpl = REQ_PHS.length ? Object.keys(REQ_TPL).map((k, i) => ({
    id: 'RT' + (900 + i), kind: k, name: 'متطلّبات ' + (CAT[k] ? CAT[k].ar : k),
    items: REQ_PHS.reduce((a, ph) =>
      a.concat((REQ_TPL[k][ph] || []).map(x => ({ ph, text: x }))), []),
    at: Date.now() - (30 - i) * DAY
  })) : [];

  st.tasks.forEach((t, ti) => {
    ensureTask(t);
    const done = t.status === 'done';
    const c = CAT[t.kind] || {};

    /* المتطلّبات من قالب تصنيفها */
    const tpl = REQ_TPL[t.kind] || {};
    let ri = 0;
    t.reqs = REQ_PHS.reduce((a, ph) => a.concat((tpl[ph] || []).map(x => {
      ri++;
      /* المنجزة مشيَّكة كاملةً · الجارية شُيِّك ما قبلها وبعضُ خلالها · القادمة بعضُ ما قبلها */
      const live = now() >= t.start && !done;
      const ok = done ? true
        : live ? (ph === 'pre' || (ph === 'run' && ri % 2 === 0))
        : (ph === 'pre' && (ri + ti) % 3 !== 0);
      return { id: t.id + '-Q' + ri, ph, text: x, done: ok,
        by: ok ? 'الكنترول' : null, at: ok ? t.start - (24 - ri) * HR : null, note: '' };
    })), []);

    /* الفرعيات: المنجزة كلّها · الجارية إلى منتصفها */
    const live = now() >= t.start && now() < t.end && !done;
    const cut = done ? t.subs.length : live ? Math.ceil(t.subs.length * 0.55) : 0;
    t.subs.forEach((s, i) => {
      if (i < cut) {
        s.done = true;
        s.at = t.start + Math.round((i + 1) * (t.durH * HR) / (t.subs.length + 1));
        s.by = t.leaderId;
        /* صورة توثيق على بعض الخطوات — كما يرفعها الميدان */
        if ((i + ti) % 3 === 0) {
          const sd = SHOT_SEED[(ti * 3 + i) % SHOT_SEED.length];
          s.shot = { img: sd.img, at: s.at, by: t.leaderId, note: s.name };
        }
      }
    });

    /* العقود على مهام الاستقبال — والكنترول يزيد ما شاء */
    if (DOC_KINDS.indexOf(t.kind) >= 0) {
      t.files = Object.keys(DOCS).map((k, i) => ({
        id: t.id + '-F' + (i + 1), kind: 'contract', doc: k,
        name: DOCS[k].ar, ref: DOCS[k].ref + '-' + t.code + '-1447',
        note: DOCS[k].sub, size: 180000 + i * 40000, type: 'application/pdf',
        at: t.start - 6 * DAY, by: 'النظام'
      }));
    }

    /* السجلّ: يُبنى من الوقائع نفسها لا يُخترع */
    const h = [{ at: t.start - 12 * DAY, text: 'أُنشئت المهمة من كتالوج الأنشطة', kind: 'info' }];
    if (t.assigned.length) h.push({ at: t.start - 10 * DAY,
      text: 'سُكِّن ' + AR(t.assigned.length) + ' محسنًا تلقائيًّا من مجموعة ' + t.kt, kind: 'assign' });
    if (t.reqs.length) h.push({ at: t.start - 3 * DAY,
      text: 'رُبط قالب «متطلّبات ' + (c.ar || '') + '» — ' + AR(t.reqs.length) + ' شرطًا', kind: 'info' });
    if (t.files.length) h.push({ at: t.start - 6 * DAY,
      text: 'رُفع ' + AR(t.files.length) + ' عقدًا على المهمة', kind: 'file' });
    if (done || live) h.push({ at: t.startedAt || t.start,
      text: t.autoStarted ? 'بدأها النظام تلقائيًّا — لم يبدأها ليدرها' : 'بدأها الليدر في وقتها',
      kind: t.autoStarted ? 'warn' : 'ok' });
    if (done) h.push({ at: t.end, text: 'أُنهيت المهمة — ' + AR(t.subs.length) + ' خطوة منجزة', kind: 'ok' });
    t.hist = h.sort((a, b) => b.at - a.at);

    /* ملاحظات: على المهام التي بدأها النظام وعلى بعض المنجزة */
    t.notes = [];
    if (t.autoStarted) t.notes.push({ at: t.start + 5 * MIN, by: 'النظام',
      text: 'حان وقت المهمة ولم يبدأها ليدرها — بدأها النظام وتُحتسب في تقييمه.', kind: 'auto' });
    if (done && ti % 4 === 1) t.notes.push({ at: t.end - 40 * MIN, by: 'الكنترول',
      text: 'تأخّر وصول حافلة واحدة عشرين دقيقة — عولج ميدانيًّا ولم يتأثّر الجدول.', kind: 'note' });
  });

  /* التذاكر تُربط بمهام أصحابها — فيظهر عددها على سطر المهمة */
  st.tickets.forEach((k, i) => {
    const pool = st.tasks.filter(t => t.leaderId === k.leaderId);
    if (pool.length) k.taskId = pool[i % pool.length].id;
  });
}

/* ============================================================
   حسابات المهمّة
   ============================================================ */
const tPct = (a, b) => b ? Math.round(a / b * 100) : 0;
const subPct  = t => tPct((t.subs || []).filter(s => s.done).length, (t.subs || []).length);
const reqIn   = (t, ph) => (t.reqs || []).filter(r => r.ph === ph);
const reqPct  = (t, ph) => { const a = reqIn(t, ph); return tPct(a.filter(r => r.done).length, a.length); };
const prepPct = t => reqPct(t, 'pre');
const taskTickets = t => (V.tickets || []).filter(k => k.taskId === t.id);
function taskPilgrims(t) {
  const L = userById(t.leaderId);
  if (L && L.pilgrims) return L.pilgrims;
  return ((S.pilgrims || {})[t.kt] || []).length;
}

function tState(t) {
  if (t.status === 'cancelled') return 'cancelled';
  if (t.status === 'done') return 'done';
  if (t.startedAt || t.status === 'running') return now() < t.end ? 'live' : 'live';
  if (now() >= t.end) return 'over';
  if (now() >= t.start) return 'late';
  if (t.start - now() <= 2 * HR) return 'soon';
  return 'next';
}
const tsOf = t => TSTATE[tState(t)] || TSTATE.next;

/* ============================================================
   قطع صغيرة تُعاد في كل مكان
   ============================================================ */

/* حلقة نسبة — تُقرأ بلمحة ولا تحتاج رقمًا بجانبها */
function ring(pct, col, size) {
  const r = 15.9155, c = 2 * Math.PI * r, sz = size || 34;
  return '<span class="tring" style="width:' + sz + 'px;height:' + sz + 'px">' +
    '<svg viewBox="0 0 36 36" aria-hidden="true">' +
      '<circle cx="18" cy="18" r="' + r + '" class="rbg"/>' +
      '<circle cx="18" cy="18" r="' + r + '" class="rfg" stroke="' + col + '" ' +
        'stroke-dasharray="' + (c * pct / 100).toFixed(2) + ' ' + c.toFixed(2) + '"/>' +
    '</svg><b class="num">' + AR(pct) + '</b></span>';
}

/* رقاقة عدّ: أيقونة ورقم — تُصفّ في سطر المهمة */
const cnt = (ic, n, ttl, cls) =>
  '<span class="tcnt ' + (cls || '') + '" title="' + E(ttl) + '">' + icon(ic, 's14') +
  '<b class="num">' + AR(n) + '</b></span>';

/* صورة توثيق */
function shotTile(s, tid) {
  if (!s || !s.shot) return '';
  return '<button class="shot bg-' + s.shot.img + '" data-a="txphoto" data-id="' + tid +
    '" data-s="' + s.id + '" aria-label="إثبات ' + E(s.name) + '">' +
    '<span class="sh">' + icon('i-camera','s12') + '<b>' + t12(s.shot.at) + '</b></span></button>';
}

/* ============================================================
   سطر المهمّة في الجدول
   ============================================================ */
function taskRow(t) {
  ensureTask(t);
  const c = CAT[t.kind] || {}, L = userById(t.leaderId) || {}, st = tsOf(t);
  const pre = prepPct(t), don = subPct(t), tk = taskTickets(t).length;
  return '<div class="prow trow" data-a="tlopen" data-id="' + t.id + '">' +
    '<span class="krail" style="background:' + st.c + '"></span>' +
    '<span class="ico" style="color:' + (c.c || 'var(--dim)') + '">' +
      icon(c.i || 'i-tasks', 's18') + '</span>' +

    '<span class="nm" style="flex:1;min-width:150px"><b>' + E(t.title) + '</b>' +
      '<span>' + LTR(t.kt) + ' · ' + E(L.name || '') + ' · ' + E(t.city) + '</span></span>' +

    '<span class="when"><b>' + hijri(t.start) + '</b>' +
      '<span class="num">' + t12(t.start) + ' — ' + t12(t.end) + '</span></span>' +

    '<span class="tcnts">' +
      cnt('i-users', taskPilgrims(t), 'حجاج المجموعة') +
      cnt('i-assign', t.assigned.length, 'محسنون مسكَّنون') +
      cnt('i-checkc', t.attended.length, 'أثبتوا حضورهم', t.attended.length ? 'ok' : '') +
      (tk ? cnt('i-ticket', tk, 'تذاكر مرفوعة على المهمة', 'warn') : '') +
    '</span>' +

    '<span class="tprogs">' +
      '<span class="tp"><span class="tiny faint">الاستعداد</span>' +
        ring(pre, pre === 100 ? 'var(--ok)' : 'var(--gold2)', 30) + '</span>' +
      '<span class="tp"><span class="tiny faint">الإنجاز</span>' +
        ring(don, don === 100 ? 'var(--ok)' : st.c, 30) + '</span>' +
    '</span>' +

    '<span class="end">' +
      (t.status === 'done' && t.rating ? stars(t.rating) : pill(st.ar, st.p)) +
      (t.autoStarted ? '<div style="margin-top:6px">' + pill('بدأها النظام','no') + '</div>' : '') +
      (t.closedBy === 'system' ? '<div style="margin-top:6px">' + pill('أُغلقت من النظام','no') + '</div>' : '') +
    '</span></div>';
}

/* ============================================================
   جدول مهام الحجّ — بفلاتره الكاملة
   ============================================================ */
const optKinds  = () => Object.keys(CAT).map(k => [k, CAT[k].ar]);
const optStates = () => Object.keys(TSTATE).map(k => [k, TSTATE[k].ar]);
const optTaskCities = () => [...new Set(Object.keys(CAT).map(k => CAT[k].city))].map(c => [c, c]);
const optCountries  = () => [...new Set(V.orgs.map(o => o.country).filter(Boolean))].map(c => [c, c]);

/* المدى الزمني: حقلا تاريخ يمرّان على نفس مستمع الفلاتر */
/* قناع التاريخ يرسمه المتصفّح في ظلّ DOM لا نملكه، وبالعربية ينعكس ترتيب
   حروفه فيُقرأ رطانةً («موي/رهش/قنس»). فنُخفي قناعه ونكتب القيمة بأنفسنا،
   ونُبقي الحقل شفّافًا فوقها ليفتح منتقي المتصفّح عند النقر. */
function dayField(key, k, label) {
  const v = fOf(key, k), p = String(v || '').split('-');
  const shown = p.length === 3 ? AR(+p[2]) + ' / ' + AR(+p[1]) + ' / ' + AR(+p[0]) : 'اختر يومًا';
  return '<label class="fsel fdate' + (v ? ' on' : '') + '"><span>' + E(label) + '</span>' +
    '<b class="dv">' + shown + '</b>' +
    '<input type="date" data-f="' + key + '" data-fk="' + k + '" value="' + E(v) + '">' +
    '</label>';
}
const dnum = s => { const p = String(s || '').split('-'); return p.length === 3 ? Date.UTC(+p[0], +p[1] - 1, +p[2]) : 0; };
const dkey = ts => { const d = new Date(ts); return d.getFullYear() + '-' +
  String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function tabHajj() {
  const K = 'tsk';
  const all = V.tasks.slice().sort((a, b) => a.start - b.start);
  all.forEach(ensureTask);
  const q = qOf(K);
  let list = all;

  const g = k => fOf(K, k);
  if (g('kind'))  list = list.filter(t => t.kind === g('kind'));
  if (g('state')) list = list.filter(t => tState(t) === g('state'));
  if (g('city'))  list = list.filter(t => t.city === g('city'));
  if (g('kt'))    list = list.filter(t => t.kt === g('kt'));
  if (g('org'))   list = list.filter(t => t.orgId === g('org'));
  if (g('lead'))  list = list.filter(t => t.leaderId === g('lead'));
  if (g('country')) list = list.filter(t => (orgById(t.orgId) || {}).country === g('country'));
  if (g('day'))   list = list.filter(t => dkey(t.start) === g('day'));
  if (g('from'))  list = list.filter(t => t.start >= dnum(g('from')));
  if (g('to'))    list = list.filter(t => t.start <= dnum(g('to')) + DAY);
  if (q) list = list.filter(t => (t.title + ' ' + t.kt + ' ' + t.place + ' ' + t.city + ' ' +
    ((userById(t.leaderId) || {}).name || '')).indexOf(q) >= 0);

  const seg = S.tab.tf || 'all';
  if (seg === 'today') list = list.filter(t => dayStart(t.start) === dayStart(now()));
  else if (seg === 'live') list = list.filter(t => tState(t) === 'live');
  else if (seg === 'next') list = list.filter(t => ['next','soon'].indexOf(tState(t)) >= 0);
  else if (seg === 'risk') list = list.filter(t => ['late','over'].indexOf(tState(t)) >= 0);
  else if (seg === 'done') list = list.filter(t => t.status === 'done');

  const rated = all.filter(t => t.rating);
  const avg = rated.length ? (rated.reduce((a, t) => a + t.rating, 0) / rated.length).toFixed(1) : '0.0';
  const nPrep = all.filter(t => prepPct(t) < 100 && t.status !== 'done').length;

  return '<div class="grid g4">' +
      stat({ label:'مهام الموسم', n:all.length, ic:'i-tasks',
        sub:'المصدر الذي يقرأ منه التطبيق', series:[12,24,36,44,50,55,58,all.length] }) +
      stat({ label:'جارية الآن', n:all.filter(t => tState(t) === 'live').length, ic:'i-play',
        cls:'up', sub:'أخضر على الطرف', series:[0,1,2,1,3,2,1,Math.max(1, all.filter(t => tState(t) === 'live').length)] }) +
      stat({ label:'استعدادٌ ناقص', n:nPrep, ic:'i-shield', cls:nPrep ? 'down' : 'up',
        sub:'شروطٌ لم يُشيَّك عليها', series:[9,8,10,7,6,8,5,Math.max(1, nPrep)] }) +
      stat({ label:'منجزة', n:all.filter(t => t.status === 'done').length, ic:'i-checkc',
        cls:'up', sub:'بمتوسط تقييم ' + AR(avg), series:[4,9,14,19,23,26,28,30] }) +
    '</div>' +

    '<div class="card">' +
      head('جدول مهام الحجّ', 'كلّ ما في التطبيق — وزيادةُ ما يملكه الكنترول',
        pill(AR(list.length) + ' معروضة', 'gold'), 'i-kaaba') +

      '<div class="tools">' + segmented('tf',
        [['all','الكل'],['today','اليوم'],['live','جارية'],['next','قادمة'],['risk','متعثّرة'],['done','منجزة']], seg) +
      '</div>' +

      filterBar(K, [
        { k:'kind',    label:'نوع المهمة', opts:optKinds() },
        { k:'state',   label:'الحالة',     opts:optStates() },
        { k:'city',    label:'المدينة',    opts:optTaskCities() },
        { k:'kt',      label:'الـKT',      opts:optKT() },
        { k:'org',     label:'الجهة',      opts:optOrgs() },
        { k:'country', label:'الدولة',     opts:optCountries() },
        { k:'lead',    label:'الليدر',     opts:optLeaders() }
      ], list.length, all.length, 'ابحث باسم المهمة أو الليدر أو المكان…') +

      '<div class="fbar">' + dayField(K, 'day', 'يومٌ بعينه') +
        dayField(K, 'from', 'من تاريخ') + dayField(K, 'to', 'إلى تاريخ') +
        '<span class="fsp"></span>' +
        '<span class="tiny faint">الألوان على طرف كل صفّ: ' +
          Object.keys(TSTATE).filter(k => k !== 'cancelled').map(k =>
            '<i class="lgd" style="background:' + TSTATE[k].c + '"></i>' + TSTATE[k].ar).join(' · ') +
        '</span>' +
      '</div>' +

      (list.length ? '<div class="plist">' + list.map(taskRow).join('') + '</div>'
        : empty('لا مهام بهذه الفلاتر', 'امسح الفلاتر أو غيّر التصنيف', 'i-cal')) +
    '</div>';
}

/* ============================================================
   درج المهمّة — كلّ عناصرها
   ============================================================ */
const txOpen = (t, k) => !!(S.open && S.open['tx:' + t.id + ':' + k]);
function txFold(t, key, title, sub, body, ic, right) {
  const on = txOpen(t, key);
  return '<div class="xfold' + (on ? ' on' : '') + '">' +
    '<button class="xh" data-a="txfold" data-id="' + t.id + '" data-v="' + key + '">' +
      icon(ic || 'i-list','s16') +
      '<span class="sp"><b>' + title + '</b>' + (sub ? '<span class="tiny faint">' + sub + '</span>' : '') + '</span>' +
      (right || '') + icon('i-down','s16') + '</button>' +
    (on ? '<div class="xb">' + body + '</div>' : '') + '</div>';
}

function taskDrawer(id) {
  const t = ensureTask(taskById(id)); if (!t) return;
  const c = CAT[t.kind] || {}, L = userById(t.leaderId) || {}, org = orgById(t.orgId) || {};
  const st = tsOf(t), gd = guideForTask(t);
  const team = t.assigned.map(userById).filter(Boolean);
  const sp = (V.support || []).filter(s => s.taskId === t.id);
  const tks = taskTickets(t);
  const don = subPct(t), pre = prepPct(t);
  const closed = ['done','cancelled'].indexOf(t.status) >= 0;
  const live = tState(t) === 'live';

  S.drawer = {
    /* عنوان الدرج نصٌّ لا ترميز — renderDrawer يهرّبه، فالوسم يظهر حرفيًّا */
    title: t.title, sub: t.kt + ' · ' + (L.name || '') + ' · #' + t.code,
    icon: c.i || 'i-tasks', wide: !!S.dwide, expand: t.id,
    body:

    /* ── الرأس: الحالة والنسب والبيانات ── */
    '<div class="card xtop" style="--kc:' + st.c + '">' +
      '<div class="h"><span class="ico" style="color:' + st.c + '">' + icon(st.i,'s18') + '</span>' +
        '<span class="sp"><b>' + E(st.ar) + '</b>' +
        '<div class="tiny faint">' + E(t.desc || '') + '</div></span>' +
        pill(untilTxt(t.start), 'grey') + '</div>' +

      '<div class="xrings">' +
        '<span class="xr">' + ring(pre, pre === 100 ? 'var(--ok)' : 'var(--gold2)', 54) +
          '<span><b>الاستعداد المسبق</b><span class="tiny faint">' +
          AR(reqIn(t,'pre').filter(r => r.done).length) + ' من ' + AR(reqIn(t,'pre').length) + ' شرطًا</span></span></span>' +
        '<span class="xr">' + ring(don, don === 100 ? 'var(--ok)' : st.c, 54) +
          '<span><b>إنجاز المهمة</b><span class="tiny faint">' +
          AR(t.subs.filter(s => s.done).length) + ' من ' + AR(t.subs.length) + ' خطوة</span></span></span>' +
      '</div>' +

      '<div class="grid g2" style="gap:10px;margin-top:14px">' +
        '<span><div class="tiny faint">التاريخ</div><b>' + dayName(t.start) + ' · ' + hijri(t.start) + '</b></span>' +
        '<span><div class="tiny faint">الوقت</div><b class="num">' + t12(t.start) + ' — ' + t12(t.end) + '</b></span>' +

    /* ── تحكّم الكنترول ── */

          icon('i-assign','s14') + 'تسكين محسن</button>' +
        '<button class="btn l sm" data-a="txfilenew" data-id="' + t.id + '">' +
          icon('i-clip','s14') + 'رفع ملفّ أو عقد</button>' +
        '<button class="btn l sm" data-a="txreqnew" data-id="' + t.id + '">' +
          icon('i-shield','s14') + 'إضافة متطلّب</button>' +
        '<button class="btn l sm" data-a="txnote" data-id="' + t.id + '">' +
          icon('i-edit','s14') + 'ملاحظة</button>' +
      '</div>' +
      /* ثلاثة أبوابٍ إلى ما يراه الميدان: شاشته، وقيادته، وتقييمه */

    /* ── المتطلّبات: ثلاث مراحل ── */

          '<button class="req' + (r.done ? ' on' : '') + '" data-a="txreq" data-id="' + t.id +

            '<span class="tick">' + (r.done ? icon('i-check','s13') : '') + '</span>' +
            '<span class="sp"><b>' + E(r.text) + '</b>' +
            (r.done ? '<span class="tiny faint">شيَّك عليه ' + E(r.by || 'الكنترول') + ' · ' + t12(r.at) + '</span>'

          '<button class="btn l sm" data-a="txreqnew" data-id="' + t.id + '" data-v="' + ph + '">' +

            icon('i-list','s14') + 'ربط قالب</button>' +
        '</div>',
        REQ_PH[ph].i,
        ring(p, p === 100 ? 'var(--ok)' : REQ_PH[ph].c, 28));
    }).join('') +

    /* ── المهام الفرعية ── */
    txFold(t, 'subs', 'المهام الفرعية',
      AR(t.subs.filter(s => s.done).length) + ' من ' + AR(t.subs.length) + ' · وصورُ إثباتها',
      (t.subs.length ? '<div class="xsubs">' + t.subs.map(s =>
        '<div class="xsub' + (s.done ? ' on' : '') + '">' +
          '<button class="xt" data-a="txsub" data-id="' + t.id + '" data-s="' + s.id + '">' +
            '<span class="tick">' + (s.done ? icon('i-check','s13') : AR(s.no)) + '</span>' +
            '<span class="sp"><b>' + E(s.name) + '</b>' +
            (s.done ? '<span class="tiny faint">' + t12(s.at) + ' · ' +
                E((userById(s.by) || {}).name || 'النظام') + '</span>' : '') + '</span>' +
          '</button>' + shotTile(s, t.id) +
        '</div>').join('') + '</div>'
        : '<div class="tiny faint">لا خطوات لهذا التصنيف.</div>'),
      'i-list', ring(don, don === 100 ? 'var(--ok)' : st.c, 28)) +

    /* ── المسكَّنون ── */
    txFold(t, 'team', 'المحسنون على المهمة',

      (team.length ? '<div class="rows">' + team.map(m =>
        '<div class="row" style="padding:9px 4px">' + avatar(m) +
        '<span class="nm" style="flex:1"><b>' + E(m.name) + '</b><span>' + E(m.specialty || '') +
          (m.reserve ? ' · احتياط' : '') + '</span></span>' +
        '<button class="chipbtn' + (t.attended.indexOf(m.id) >= 0 ? ' on' : '') + '" ' +
          'data-a="txattend" data-id="' + t.id + '" data-s="' + m.id + '">' +
          icon(t.attended.indexOf(m.id) >= 0 ? 'i-checkc' : 'i-target','s13') +

        '<button class="chipbtn bad" data-a="txunassign" data-id="' + t.id + '" data-s="' + m.id + '">' +
          icon('i-x','s13') + 'سحب</button>' +
        '</div>').join('') + '</div>'
        : '<div class="tiny faint">لا أحد على هذه المهمة بعد.</div>') +
      '<button class="btn l sm" style="width:100%;margin-top:11px" data-a="txassign" data-id="' + t.id + '">' +
        icon('i-assign','s14') + 'تسكين محسن — ومعهم الاحتياط</button>',
      'i-users', pill(AR(team.length), 'grey')) +

    /* ── الملفات والعقود ── */
    txFold(t, 'files', 'الملفات والعقود',
      'العقود المبذورة وما يرفعه الكنترول — بلا حدّ',
      (t.files.length ? '<div class="xfiles">' + t.files.map(f =>
        '<div class="xfile">' +
          '<button class="fi" data-a="txfileopen" data-id="' + t.id + '" data-s="' + f.id + '">' +
            '<span class="ft">' + (/image/.test(f.type || '') ? icon('i-photo','s16') : '<b>PDF</b>') + '</span>' +
            '<span class="sp"><b>' + E(f.name) + '</b>' +
            '<span class="tiny faint">' + (f.ref ? LTR(f.ref) + ' · ' : '') + E(f.note || '') +
            ' · ' + E(f.by || 'الكنترول') + ' · ' + hijri(f.at) + '</span></span>' +
            (f.kind === 'contract' ? pill('عقد','gold') : pill('ملف','grey')) + '</button>' +
          '<button class="fx" data-a="txfiledel" data-id="' + t.id + '" data-s="' + f.id + '" ' +
            'aria-label="حذف">' + icon('i-x','s13') + '</button>' +
        '</div>').join('') + '</div>'
        : '<div class="tiny faint">لا ملفات على هذه المهمة.</div>') +
      '<button class="btn l sm" style="width:100%;margin-top:11px" data-a="txfilenew" data-id="' + t.id + '">' +
        icon('i-clip','s14') + 'رفع ملفّ أو عقد إضافي</button>',
      'i-file', pill(AR(t.files.length), t.files.length ? 'gold' : 'grey')) +

    /* ── دليل التنفيذ ── */
    txFold(t, 'guide', 'دليل التنفيذ',
      gd ? (gd.taskId ? 'دليل خاصّ بهذه المهمّة' : 'دليل تصنيفها') : 'لا دليل — تُنفَّذ بلا مرجع',
      (gd ? '<div class="prow" data-a="gdview" data-id="' + gd.id + '">' +
        '<span class="ico" style="color:var(--gold2)">' + icon('i-guide','s16') + '</span>' +
        '<span class="nm" style="flex:1"><b>' + E(gd.title) + '</b>' +
        '<span>' + AR((gd.steps||[]).length) + ' خطوة · ' + AR((gd.media||[]).length) +
        ' وسيطًا · ن' + AR(gd.ver) + '</span></span>' +
        (gd.taskId ? pill('خاصّ','gold') : pill('بالتصنيف','grey')) + '</div>'
        : '<div class="tiny faint">لا دليل لتصنيف هذه المهمّة بعد.</div>') +
      '<button class="btn l sm" style="width:100%;margin-top:11px" data-a="tguide" data-id="' + t.id + '">' +
        icon('i-guide','s14') + (gd && gd.taskId ? 'تغيير الدليل الخاصّ' : 'ربط دليل بهذه المهمّة') + '</button>',
      'i-guide') +

    /* ── التذاكر المرفوعة ── */
    (tks.length ? txFold(t, 'tkt', 'التذاكر المرفوعة على المهمة',
      AR(tks.length) + ' تذكرة من حجاج المجموعة',
      '<div class="rows">' + tks.map(k =>
        '<div class="row" style="padding:9px 4px;cursor:pointer" data-a="tkopen2" data-id="' + k.id + '">' +
        '<span class="nm" style="flex:1"><b>' + E(k.title) + '</b>' +
        '<span>' + LTR(k.no) + ' · ' + E(k.from) + ' · ' + untilTxt(k.at) + '</span></span>' +
        pill(k.pri, k.pri === 'حرجة' ? 'no' : 'wait') + pill(k.status, 'grey') + '</div>').join('') + '</div>',
      'i-ticket', pill(AR(tks.length), 'no')) : '') +

    /* ── طلبات الدعم ── */
    (sp.length ? txFold(t, 'sup', 'طلبات الدعم', AR(sp.length) + ' طلبًا من ليدر المجموعة',
      sp.map(s => '<div class="evt ' + (s.state === 'done' ? 'ok' : s.state === 'pending' ? 'warn' : 'bad') + '">' +
        '<span class="dot"></span><span class="sp"><b>' + LTR(s.no) + ' — ' + AR(s.count) + ' محسن</b>' +
        '<p>' + E(s.why) + (s.reason ? '<br>ردّك: ' + E(s.reason) : '') + '</p></span></div>').join(''),
      'i-send') : '') +

    /* ── الملاحظات ── */
    txFold(t, 'notes', 'ملاحظات المهمة', AR(t.notes.length) + ' ملاحظة',
      (t.notes.length ? t.notes.map(n =>
        '<div class="evt ' + (n.kind === 'auto' ? 'warn' : 'info') + '"><span class="dot"></span>' +
        '<span class="sp"><b>' + E(n.by || 'الكنترول') + '</b><p>' + E(n.text) + '</p>' +
        '<span class="tiny faint">' + t12(n.at) + ' · ' + hijri(n.at) + '</span></span></div>').join('')
        : '<div class="tiny faint">لا ملاحظات.</div>') +
      '<button class="btn l sm" style="width:100%;margin-top:11px" data-a="txnote" data-id="' + t.id + '">' +
        icon('i-edit','s14') + 'إضافة ملاحظة</button>',
      'i-edit', pill(AR(t.notes.length), 'grey')) +

    /* ── السجلّ ── */
    txFold(t, 'hist', 'سجلّ المهمة', AR(t.hist.length) + ' واقعة — من إنشائها إلى إغلاقها',
      '<div class="tline">' + t.hist.map(h =>
        '<div class="tl ' + (h.kind === 'warn' ? 'bad' : h.kind === 'ok' ? 'ok' : '') + '">' +
          '<span class="d"></span>' +
          '<span class="sp"><b>' + E(h.text) + '</b>' +
          '<span class="tiny faint">' + t12(h.at) + ' · ' + hijri(h.at) + '</span></span></div>').join('') +
      '</div>', 'i-hist') +

    '<button class="btn l" data-a="go" data-n="tasks">' + icon('i-tasks','s16') + 'عرض في جدول المهام</button>'
  };
  renderDrawer();
}

  S.drawer = { title:'إضافة متطلّب', sub:t.title, icon:'i-shield', wide:false, body:

/* ---------- تسجيل واقعة في سجلّ المهمة ---------- */

}
