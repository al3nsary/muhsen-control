    '</div>';
}

/* ---------- لوحة القالب ---------- */
function formDash(id) {
  const f = formById(id); if (!f) return;
  const bs = subsOf(f.id).sort((a, b) => a.at - b.at);
  const avg = bs.length ? Math.round(bs.reduce((a, b) => a + b.score, 0) / bs.length) : 0;
  const targets = [...new Set(bs.map(b => b.target))];

  openDrawer(f.title, f.no + ' · ' + AR(bs.length) + ' زيارة · ' + AR(targets.length) + ' جهة', f.icon,
    '<div class="meta">' +
      '<div><span class="k">المتوسط</span><b class="num">' + AR(avg) + '٪</b></div>' +
      '<div><span class="k">زيارات</span><b class="num">' + AR(bs.length) + '</b></div>' +
      '<div><span class="k">أسئلة</span><b class="num">' + AR(f.qs.length) + '</b></div>' +
    '</div>' +

    '<div class="card">' + head('الجهات', 'ودرجة آخر زيارة لكلٍّ منها') +
      '<div class="plist">' + targets.map(tg => {
        const mine = bs.filter(b => b.target === tg);
        const last = mine[mine.length - 1];
        const first = mine[0];
        const delta = mine.length > 1 ? last.score - first.score : 0;
        return '<div class="prow">' +
          '<span class="ico">' + icon(f.icon,'s16') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(tg) + '</b>' +
          '<span>' + AR(mine.length) + ' زيارة · آخرها ' + ago(last.at) + '</span></span>' +
          (delta ? '<span class="delta ' + (delta > 0 ? 'up' : 'dn') + '">' +
            (delta > 0 ? '▲' : '▼') + ' ' + AR(Math.abs(delta)) + '</span>' : '') +
          '<span class="fl" style="gap:8px;min-width:120px">' +
            '<span class="meter' + (last.score < 70 ? ' red' : ' gold') + '" style="flex:1">' +
              '<i data-w="' + last.score + '"></i></span>' +
            '<b class="num">' + AR(last.score) + '٪</b></span></div>';
      }).join('') + '</div></div>' +

    '<div class="card">' + head('كل سؤال وإجاباته', 'من ' + AR(bs.length) + ' إدخالًا') +
      f.qs.map(q => {
        const vals = bs.map(b => (b.answers.find(a => a.id === q.id) || {}).v);
        let body;
        if (q.t === 'yn') {
          const yes = vals.filter(v => v === true).length;
          const pct = Math.round(yes / Math.max(1, vals.length) * 100);
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            '<span class="meter" style="flex:1"><i data-w="' + pct + '"></i></span>' +
            '<span class="tiny num">' + AR(yes) + ' نعم · ' + AR(vals.length - yes) + ' لا</span></div>';
        } else if (q.t === 'rate') {
          const a = [1,2,3,4,5].map(n => ({ l:AR(n), v:vals.filter(v => v === n).length }));
          body = chartBars({ data:a });
        } else if (q.t === 'num') {
          const nums = vals.filter(v => typeof v === 'number');
          const mean = nums.length ? Math.round(nums.reduce((x, y) => x + y, 0) / nums.length) : 0;
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            '<b class="num" style="font-size:22px">' + AR(mean) + '</b>' +
            '<span class="tiny faint">المتوسط · الأدنى ' + AR(Math.min.apply(null, nums.concat(0))) +
            ' · الأعلى ' + AR(Math.max.apply(null, nums.concat(0))) + '</span></div>';
        } else if (q.t === 'photo') {
          const n2 = vals.filter(Boolean).length;
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            '<span class="meter" style="flex:1"><i data-w="' +
            Math.round(n2 / Math.max(1, vals.length) * 100) + '"></i></span>' +
            '<span class="tiny num">' + AR(n2) + ' صورة من ' + AR(vals.length) + '</span></div>';
        } else if (q.t === 'sign') {
          const n2 = vals.filter(Boolean).length;
          body = '<div class="fl" style="gap:10px;margin-top:8px">' +
            pill(AR(n2) + ' مُتعهَّد', 'live') +
            pill(AR(vals.length - n2) + ' بلا تعهّد', vals.length - n2 ? 'no' : 'grey') + '</div>';
        } else {
          body = '<div class="quote">' + E(String(vals[vals.length - 1] || '—')) + '</div>';
        }
        return '<div class="qblock"><div class="fl" style="gap:9px">' +
          '<b style="flex:1;font-size:12.5px">' + E(q.q) + '</b>' +
          pill(QT[q.t], 'grey') + '</div>' + body + '</div>';
      }).join('') + '</div>');
}

/* ---------- إدخال واحد ---------- */
function subDrawer(id) {
  const b = V.subs.find(x => x.id === id); if (!b) return;
  const f = formById(b.formId) || {}, by = userById(b.by) || {};
  const mine = subsOf(b.formId).filter(x => x.target === b.target).sort((a, c) => a.at - c.at);
  openDrawer(b.target, f.title + ' · الزيارة ' + AR(b.visit) + ' من ' + AR(b.of), f.icon,
    '<div class="fl" style="gap:13px">' + avatar(by, 'lg') +
      '<span class="nm" style="flex:1"><b style="font-size:15px">' + E(by.name || '') + '</b>' +
      '<span>' + E(b.kt) + ' · ' + hijri(b.at) + ' · ' + t12(b.at) + '</span></span>' +
      pill(AR(b.score) + '٪', b.score >= 85 ? 'live' : b.score >= 70 ? 'wait' : 'no') + '</div>' +

    '<div class="card">' + head('مسار الزيارات', 'هذه الجهة زُرِعت ' + AR(mine.length) + ' مرّة') +
      '<div class="visits">' + mine.map(v =>
        '<div class="vis' + (v.id === b.id ? ' on' : '') + '">' +
        '<b class="num">' + AR(v.visit) + '</b>' +
        '<span class="meter' + (v.score < 70 ? ' red' : ' gold') + '"><i data-w="' + v.score + '"></i></span>' +
        '<span class="tiny num">' + AR(v.score) + '٪</span></div>').join('') + '</div></div>' +

    '<div class="card">' + head('الإجابات', AR(f.qs.length) + ' سؤالًا') +
      '<div class="plist">' + f.qs.map(q => {
        const a = b.answers.find(x => x.id === q.id) || {};
        const v = q.t === 'yn' ? (a.v ? pill('نعم','live') : pill('لا','no'))
          : q.t === 'rate' ? stars(a.v || 0)
          : q.t === 'num' ? '<b class="num">' + AR(a.v) + '</b>'
          : q.t === 'photo' ? (a.v ? fileChip(a.v) : pill('بلا صورة','no'))
          : q.t === 'sign' ? (a.v ? pill('مُتعهَّد','live') : pill('بلا تعهّد','no'))
          : '<span class="tiny">' + E(String(a.v || '—')) + '</span>';
        return '<div class="prow" style="padding:10px 12px">' +
          '<span class="nm" style="flex:1"><b style="font-size:12.5px">' + E(q.q) + '</b>' +
          '<span>' + E(QT[q.t]) + (q.w ? ' · وزن ' + AR(q.w) : ' · لا يُحتسب') + '</span></span>' +
          '<span class="end">' + v + '</span></div>';
      }).join('') + '</div></div>');
}

/* ============================================================
   التشكيل والتسكين
   ثلاث لوحات مصدر — مشرفون · ليدرز · محسنون —
   وصندوق في الوسط تُبنى فيه المجموعة، ثم تُربط بجهة الحج.
   قاعدتان لا تُكسران:
     · المحسن لا ينضمّ لمجموعتين — يخرج من الإتاحة فور تسكينه.
     · الليدر يقود مجموعتين، ولكلٍّ محسنوها.
   ============================================================ */

const DRAFT0 = () => ({ leaderId:null, members:[], orgId:null, hotelId:null, supervisorId:null, editing:null });
const draft = () => (S.draft = S.draft || DRAFT0());

/* بطاقة شخص في لوحة المصدر */
function personCard(u, act, extra) {
  const g = u.groupId ? groupById(u.groupId) : null;
  return '<button class="pcard' + (act ? '' : ' off') + '" ' +
    (act ? 'data-a="' + act + '" data-id="' + u.id + '"' : 'disabled') + '>' +
    avatar(u, 'sm') +
    '<span class="nm"><b>' + E(u.name) + '</b>' +
      '<span>' + LTR(u.code) + (u.specialty ? ' · ' + E(u.specialty) : '') + '</span></span>' +
    (extra || (g ? pill(g.no, 'grey') : '')) + '</button>';
}

function screenBuild() {
  const d = draft();
  const q = qOf('bld');
  /* من وُضع في الصندوق خرج من الإتاحة فورًا — لا ينتظر الحفظ */
  let free = freeMuhsens().filter(u => !d.members.some(m => m.id === u.id));
  if (q) free = free.filter(u => (u.name + ' ' + u.code + ' ' + u.specialty).indexOf(q) >= 0);
  const L = d.leaderId ? userById(d.leaderId) : null;
  const org = d.orgId ? orgById(d.orgId) : null;
  const hotel = d.hotelId ? hotelById(d.hotelId) : null;
  const sv = d.supervisorId ? userById(d.supervisorId) : null;
  const ready = d.leaderId && d.members.length === 5 && d.orgId;

  return '<div class="grid g4">' +
      stat({ label:'مجموعات مشكَّلة', n:V.groups.length, ic:'i-users', cls:'up',
        sub:'تُسكَّن مهامها تلقائيًّا', series:[1,2,2,3,4,4,5,V.groups.length] }) +
      stat({ label:'محسنون بلا مجموعة', n:free.length, ic:'i-user',
        cls:free.length ? 'warn' : 'up', sub:'هؤلاء وحدهم متاحون للتشكيل',
        series:[25,20,15,10,7,4,2,Math.max(0, freeMuhsens().length)] }) +
      stat({ label:'مشرفون', n:supervisors().length, ic:'i-shield',
        sub:'على ' + AR(HOTELS.length) + ' فنادق', series:[1,2,2,3,3,4,4,supervisors().length] }) +
      stat({ label:'جهات الحجّ', n:V.orgs.length, ic:'i-flag',
        sub:'بعثات وشركات', series:[1,2,3,3,4,4,5,V.orgs.length] }) +
    '</div>' +

    '<div class="board3">' +
      /* ═════ المصادر ═════ */
      '<div class="card src">' +
        head('المصادر', 'انقر لتضيفه إلى التشكيل', '', 'i-users') +
        '<div class="srcgrp"><span class="slab">' + icon('i-shield','s14') + 'مشرفون</span>' +
          supervisors().map(u => personCard(u, 'bsup',
            pill(hotelById(u.hotelId).ar || '—', d.supervisorId === u.id ? 'live' : 'gold'))).join('') +
        '</div>' +
        '<div class="srcgrp"><span class="slab">' + icon('i-star','s14') + 'ليدرز' +
          '<i class="cnt">' + AR(leaders().length) + '</i></span>' +
          leaders().map(u => {
            const gn = groupsOf(u.id).length;
            const same = d.leaderId === u.id;
            return personCard(u, gn >= 2 && !same ? null : 'blead',
              same ? pill('في التشكيل', 'live')
                : gn >= 2 ? pill('مكتمل — مجموعتان', 'no')

          }).join('') +
        '</div>' +
        '<div class="srcgrp"><span class="slab">' + icon('i-user','s14') + 'محسنون متاحون' +
          '<i class="cnt">' + AR(free.length) + '</i></span>' +
          '<div style="margin:0 0 9px">' + search('bld', 'ابحث في المتاحين…', freeMuhsens().length) + '</div>' +
          (free.length ? free.map(u => personCard(u, 'bmem')).join('')
            : '<div class="tiny faint" style="padding:14px 6px">لا محسن متاح — كلّهم مسكَّنون.</div>') +
        '</div>' +
      '</div>' +

      /* ═════ صندوق التشكيل ═════ */
      '<div class="card gold buildbox">' +
        head(d.editing ? 'تعديل ' + E(groupById(d.editing).no) : 'تشكيل مجموعة جديدة',
          'ليدر واحد وخمسة محسنين — ستّة',
          '<span class="cnt2' + (ready ? ' ok' : '') + '">' +
            AR(d.members.length + (d.leaderId ? 1 : 0)) + ' / ٦</span>', 'i-users') +

        '<div class="slot lead">' +
          '<span class="sl">الليدر</span>' +
          (L ? '<div class="fl" style="flex:1;gap:11px">' + avatar(L, 'sm') +
              '<span class="nm" style="flex:1"><b>' + E(L.name) + '</b>' +
              '<span>' + LTR(L.code) + ' · ' + E(L.kt) + ' · ' + AR(L.pilgrims) + ' حاجًّا</span></span>' +
              '<button class="xbtn" data-a="bclrlead">' + icon('i-x','s14') + '</button></div>'
            : '<span class="ph">اختر ليدرًا من المصادر</span>') +
        '</div>' +

        '<div class="slots">' + [0,1,2,3,4].map(i => {
          const m = d.members[i];
          const u = m ? userById(m.id) : null;
          return '<div class="slot' + (u ? ' full' : '') + '">' +
            '<span class="sl">محسن ' + AR(i + 1) + '</span>' +
            (u ? '<div class="fl" style="flex:1;gap:10px">' + avatar(u, 'sm') +
                '<span class="nm" style="flex:1"><b>' + E(u.name) + '</b>' +
                '<span>' + LTR(u.code) + ' · ' + AR(u.age || 29) + ' سنة</span></span>' +
                '<select class="spec" data-a="bspec" data-id="' + u.id + '">' +
                  SPECS.map(s => '<option' + (s === m.spec ? ' selected' : '') + '>' + E(s) + '</option>').join('') +
                '</select>' +
                '<button class="xbtn" data-a="bdel" data-id="' + u.id + '">' + icon('i-x','s14') + '</button></div>'
              : '<span class="ph">فارغ</span>') +
          '</div>';
        }).join('') + '</div>' +

        '<div class="pickrow"><span class="sl">جهة الحجّ</span>' +
          '<div class="chips">' + V.orgs.map(o =>
            '<button class="chip2' + (d.orgId === o.id ? ' on' : '') + '" data-a="borg" data-id="' + o.id + '">' +
            E(o.kt) + ' · ' + E(o.ar) + '</button>').join('') + '</div></div>' +

        '<div class="pickrow"><span class="sl">السكن</span>' +
          '<div class="chips">' + HOTELS.map(h =>
            '<button class="chip2' + (d.hotelId === h.id ? ' on' : '') + '" data-a="bhotel" data-id="' + h.id + '">' +
            E(h.ar) + '</button>').join('') + '</div></div>' +

        (hotel ? '<div class="quote">' + E(hotel.ar) + ' · ' + E(hotel.dist) + ' · ' +
          AR(hotel.rooms) + ' غرفة' +
          (sv ? ' — المشرف ' + E(sv.name) : ' — بلا مشرف بعد') + '</div>' : '') +

        '<div class="fl" style="gap:10px;margin-top:16px">' +
          '<button class="btn p" style="flex:1"' + (ready ? '' : ' disabled') +
            ' data-a="bsave">' + icon('i-checkc','s16') +
            (d.editing ? 'حفظ التعديل' : 'حفظ المجموعة وتسكين مهامها') + '</button>' +
          '<button class="btn l" data-a="bclear">تفريغ</button>' +
        '</div>' +
        '<div class="tiny faint" style="margin-top:10px">' +
          'بالحفظ تُسكَّن كلّ مهام ' + (org ? E(org.kt) : 'الجهة') +
          ' على هذه المجموعة تلقائيًّا، ويخرج محسنوها من قوائم الإتاحة.</div>' +
      '</div>' +

      /* ═════ المجموعات القائمة ═════ */
      '<div class="card src">' +
        head('المجموعات القائمة', AR(V.groups.length) + ' مجموعة', '', 'i-checkc') +
        (V.groups.length ? V.groups.map(g => {
          const gl = userById(g.leaderId) || {}, go = orgById(g.orgId) || {};
          const gh = hotelById(g.hotelId), gs = g.supervisorId ? userById(g.supervisorId) : null;
          const tn = V.tasks.filter(t => t.leaderId === g.leaderId).length;
          return '<div class="gitem' + (d.editing === g.id ? ' on' : '') + '">' +
            '<div class="fl" style="gap:10px">' + avatar(gl, 'sm') +
              '<span class="nm" style="flex:1"><b>' + LTR(g.no) + ' · ' + E(gl.name || '') + '</b>' +
              '<span>' + E(go.kt || '') + ' · ' + E(go.ar || '') + '</span></span>' +
              pill(AR(g.members.length + 1), 'gold') + '</div>' +
            '<div class="faces">' + g.members.map(m => {
              const mu = userById(m.id);
              return mu ? '<span class="fw" title="' + E(mu.name + ' — ' + m.spec) + '">' +
                avatar(mu, 'sm') + '</span>' : '';
            }).join('') + '</div>' +
            '<div class="pfoot">' +
              '<span class="ok">' + E(gh.ar || '—') + (gs ? ' · ' + E(gs.name) : '') + '</span>' +
              '<span class="fl" style="gap:7px">' + pill(AR(tn) + ' مهمة', 'grey') +

      '</div>' +
    '</div>' +

    /* ═════ المشرفون على الفنادق ═════ */
    '<div class="card">' +
      head('المشرفون على الفنادق', 'المشرف يتبع الفندق لا الجهة — وقد يجتمع تحته ليدر بعثة وليدر شركة',
        '', 'i-shield') +
      '<div class="grid g2">' + HOTELS.map(h => {
        const sup = supervisors().filter(u => u.hotelId === h.id);
        const gs = V.groups.filter(g => g.hotelId === h.id);
        return '<div class="hotel">' +
          '<div class="fl" style="gap:11px;margin-bottom:11px">' +
            '<span class="ico">' + icon('i-key','s18') + '</span>' +
            '<span class="nm" style="flex:1"><b>' + E(h.ar) + '</b>' +
            '<span>' + E(h.city) + ' · ' + E(h.dist) + ' · ' + AR(h.rooms) + ' غرفة</span></span>' +

            '<button class="btn l sm" data-a="supassign" data-id="' + h.id + '">' +
              (sup.length ? 'تغيير المشرف' : 'تسكين مشرف') + '</button></div>' +
          (sup.length ? '<div class="plist">' + sup.map(u =>
            '<div class="prow" style="padding:9px 11px">' + avatar(u, 'sm') +
            '<span class="nm" style="flex:1"><b>' + E(u.name) + '</b>' +
            '<span>' + LTR(u.code) + ' · مشرف سكن</span></span>' +
            pill('مشرف', 'gold') + '</div>').join('') + '</div>'
            : '<div class="tiny faint">بلا مشرف</div>') +
          (gs.length ? '<div class="hgroups">' + gs.map(g => {
            const gl = userById(g.leaderId) || {}, go = orgById(g.orgId) || {};
            return '<span class="hchip">' + avatar(gl, 'sm') +
              '<span class="tiny"><b>' + LTR(g.no) + '</b><br>' +
              '<span class="faint">' + E(go.type || '') + ' · ' + E(go.kt || '') + '</span></span></span>';
          }).join('') + '</div>' : '') +
        '</div>';
      }).join('') + '</div>' +
    '</div>';

/* ============================================================
   التسكين التراتبي — ثلاث خطوات لا لوحة واحدة
     ١) المشرفون على الفنادق — مشرف واحد لكل فندق لا أكثر
     ٢) الليدرز على المجموعات — لكل مجموعة جهةٌ وسكنٌ وليدر
     ٣) المحسنون على الليدرز — خمسة لكل مجموعة
   ============================================================ */

const ASG_STEPS = [
  { k:'sup',  ar:'المشرفون على الفنادق', i:'i-key',   d:'مشرف واحد لكل فندق' },
  { k:'lead', ar:'الليدرز على المجموعات', i:'i-star',  d:'ليدر يقود مجموعتين لا ثلاثًا' },
  { k:'muh',  ar:'المحسنون على الليدرز',  i:'i-users', d:'خمسة لكل مجموعة — ولا يُثنّى محسن' }
];

function screenAssign() {
  const step = S.tab.asg || 'sup';
  const done = {
    sup:  HOTELS.filter(h => supOfHotel(h.id)).length,
    lead: S.groups.length,
    muh:  S.groups.filter(g => g.members.length === 5).length
  };
  const need = { sup: HOTELS.length, lead: S.groups.length || 1, muh: S.groups.length || 1 };

  return '<div class="asgsteps">' + ASG_STEPS.map((s, i) => {
    const pct = Math.round(done[s.k] / Math.max(1, need[s.k]) * 100);
    return '<button class="astep' + (s.k === step ? ' on' : '') + '" ' +
      'data-a="seg" data-k="asg" data-v="' + s.k + '">' +
      '<span class="an">' + AR(i + 1) + '</span>' +
      '<span class="ico" style="color:var(--gold2)">' + icon(s.i, 's18') + '</span>' +
      '<span class="nm"><b>' + E(s.ar) + '</b><span>' + E(s.d) + '</span></span>' +
      '<span class="ae"><b class="num">' + AR(done[s.k]) + '/' + AR(need[s.k]) + '</b>' +
        '<span class="meter' + (pct < 100 ? ' gold' : '') + '"><i data-w="' + pct + '"></i></span>' +
      '</span></button>';
  }).join('') + '</div>' +
    (step === 'sup' ? stepSup() : step === 'lead' ? stepLead() : stepMuh());
}

const supOfHotel = hid => supervisors().find(u => u.hotelId === hid) || null;

/* ══════════════ ١) المشرفون على الفنادق ══════════════ */
function stepSup() {
  const q = qOf('asup');
  const fs2 = fOf('asup','state');
  let list = HOTELS.slice();
  if (q) list = list.filter(h => h.ar.indexOf(q) >= 0);
  if (fs2) list = list.filter(h => fs2 === 'y' ? !!supOfHotel(h.id) : !supOfHotel(h.id));
  const free = supervisors().filter(u => !u.hotelId);

  return '<div class="grid g23">' +
    '<div class="card">' +
      head('الفنادق', 'لكل فندق مشرف واحد — لا اثنان',
        pill(AR(HOTELS.filter(h => supOfHotel(h.id)).length) + ' مُسكَّن', 'gold'), 'i-key') +
      filterBar('asup', [
        { k:'state', label:'التسكين', opts:[['y','له مشرف'],['n','بلا مشرف']] }
      ], list.length, HOTELS.length, 'ابحث باسم فندق…') +
      '<div class="plist">' + list.map(h => {
        const sv = supOfHotel(h.id);
        const gs = S.groups.filter(g => g.hotelId === h.id);
        return '<div class="prow" style="flex-wrap:wrap">' +
          '<span class="krail" style="background:' + (sv ? 'var(--live)' : 'var(--amber)') + '"></span>' +
          '<span class="ico">' + icon('i-key','s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(h.ar) + '</b>' +
          '<span>' + E(h.city) + ' · ' + E(h.dist) + ' · ' + AR(h.rooms) + ' غرفة</span></span>' +
          pill(AR(gs.length) + ' مجموعة', gs.length ? 'live' : 'grey') +
          '<div style="width:100%;margin-top:10px">' +
            (sv
              ? '<div class="fl" style="gap:10px;flex-wrap:wrap">' + avatar(sv, 'sm') +
                '<span class="nm" style="flex:1"><b>' + E(sv.name) + '</b>' +
                '<span>' + LTR(sv.code) + ' · مشرف سكن</span></span>' +
                '<button class="btn l sm" data-a="supswap" data-id="' + h.id + '">تغيير</button>' +

/* ══════════════ ٢) الليدرز على المجموعات ══════════════ */

  let gs = S.groups.slice();
  if (fo) gs = gs.filter(g => g.orgId === fo);
  if (fh) gs = gs.filter(g => g.hotelId === fh);
  if (ft) gs = gs.filter(g => (orgById(g.orgId) || {}).type === ft);
  if (q) gs = gs.filter(g => (g.no + ' ' + (userById(g.leaderId) || {}).name +
    ' ' + (orgById(g.orgId) || {}).kt).indexOf(q) >= 0);
  const freeL = leaders().filter(l => groupsOf(l.id).length < 2);

  return '<div class="grid g23">' +
    '<div class="card">' +
      head('المجموعات وليدرزها', 'الليدر يقود مجموعتين لا ثلاثًا',
        pill(AR(gs.length) + ' من ' + AR(S.groups.length), 'gold'), 'i-star') +
      filterBar('alead', [
        { k:'org',   label:'الجهة', opts:optOrgs() },
        { k:'type',  label:'النوع', opts:optTypes() },
        { k:'hotel', label:'السكن', opts:optHotels() }
      ], gs.length, S.groups.length, 'ابحث برقم مجموعة أو ليدر أو KT…') +
      '<div class="plist">' + (gs.length ? gs.map(g => {
        const L = userById(g.leaderId) || {}, o = orgById(g.orgId) || {};
        const h = hotelById(g.hotelId), sv = g.supervisorId ? userById(g.supervisorId) : null;
        const n = groupsOf(g.leaderId).length;
        return '<div class="prow" style="flex-wrap:wrap">' +
          '<span class="krail" style="background:' +
            (o.type === 'بعثة' ? 'var(--blue)' : 'var(--gold)') + '"></span>' +
          avatar(L, 'sm') +
          '<span class="nm" style="flex:1"><b>' + LTR(g.no) + ' · ' + E(L.name || '—') + '</b>' +
          '<span>' + E(o.kt || '') + ' · ' + E(o.ar || '') + ' · ' + E(h.ar || 'بلا سكن') + '</span></span>' +
          pill(E(o.type || '—'), o.type === 'بعثة' ? 'blue' : 'gold') +
          pill(AR(g.members.length + 1) + '/٦', g.members.length === 5 ? 'live' : 'wait') +
          (n > 1 ? pill('يقود ' + AR(n), 'wait') : '') +
          '<div class="pfoot" style="width:100%">' +
            '<span class="ok">' + (sv ? 'المشرف ' + E(sv.name) : 'بلا مشرف — سكِّن مشرف الفندق أوّلًا') + '</span>' +
            '<span class="fl" style="gap:7px">' +
              '<button class="btn l sm" data-a="gleadswap" data-id="' + g.id + '">تغيير الليدر</button>' +
              '<button class="btn l sm" data-a="ghotel" data-id="' + g.id + '">تغيير السكن</button>' +
            '</span></div></div>';
      }).join('') : empty('لا مجموعة تطابق', 'وسّع الفلاتر', 'i-search')) + '</div>' +
    '</div>' +

    '<div class="card gold">' +
      head('ليدرز يقبلون مجموعة', AR(freeL.length) + ' ليدرًا',
        '<button class="btn p sm" data-a="gnew">' + icon('i-plus','s16') + 'مجموعة جديدة</button>',

}

/* ══════════════ ٣) المحسنون على الليدرز ══════════════ */
function stepMuh() {
  const q = qOf('amuh');
  const fo = fOf('amuh','org'), fh = fOf('amuh','hotel'), fst = fOf('amuh','full');
  let gs = S.groups.slice();
  if (fo) gs = gs.filter(g => g.orgId === fo);

  if (q) gs = gs.filter(g => (g.no + ' ' + (userById(g.leaderId) || {}).name).indexOf(q) >= 0 ||

  const free = freeMuhsens();

  return '<div class="grid g23">' +

          '<div class="fl" style="gap:10px;margin-bottom:11px">' + avatar(L, 'sm') +
            '<span class="nm" style="flex:1"><b>' + LTR(g.no) + ' · ' + E(L.name || '') + '</b>' +
            '<span>' + E(o.kt || '') + ' · ' + E(hotelById(g.hotelId).ar || '') + '</span></span>' +
            pill(AR(g.members.length) + '/٥', g.members.length === 5 ? 'live' : 'wait') + '</div>' +
          '<div class="seats">' + [0,1,2,3,4].map(i => {
            const m = g.members[i], u = m ? userById(m.id) : null;
            return u
              ? '<button class="seat full" data-a="mseatout" data-id="' + g.id +
                '" data-v="' + u.id + '" title="إخراجه من المجموعة">' + avatar(u, 'sm') +
                '<span class="nm"><b>' + E(u.name) + '</b>' +

              : '<button class="seat" data-a="mseatin" data-id="' + g.id + '">' +
                '<span class="plus">' + icon('i-plus','s16') + '</span>' +
                '<span class="nm"><b>مقعد فارغ</b><span>انقر لتملأه</span></span></button>';
          }).join('') + '</div></div>';
      }).join('') : empty('لا مجموعة تطابق', 'وسّع الفلاتر', 'i-search')) +
    '</div>' +

    '<div class="card gold src">' +
      head('محسنون بلا مجموعة', 'هؤلاء وحدهم متاحون',
        pill(AR(free.length), free.length ? 'live' : 'grey'), 'i-user') +
      '<div style="margin-bottom:11px">' + search('afree', 'ابحث في المتاحين…', free.length) + '</div>' +
      (freeList.length ? freeList.slice(0, 40).map(u =>
        '<div class="pcard" style="cursor:default">' + avatar(u, 'sm') +
        '<span class="nm"><b>' + E(u.name) + '</b>' +
        '<span>' + LTR(u.code) + ' · ' + E(u.specialty) + ' · ' + AR(u.age || 28) + ' سنة</span></span>' +
        '</div>').join('') +
        (freeList.length > 40 ? '<div class="tiny faint" style="margin-top:10px">و' +
          AR(freeList.length - 40) + ' آخرين — ضيّق البحث</div>' : '')

    '</div></div>';
}

/* ============================================================
   العفاشة — مقاولون لهم عمّال، يُتعاقد معهم
   ─────────────────────────────────────────────────────────────
   الدورة: يُضاف المقاول ← تصل رسالة نصية بدخوله ←
   يُرسَل له عقدٌ بتفاصيله ومرفقه ← يقبل أو يرفض،
   وللكنترول أن يوافق نيابةً عنه إن تُعوقد خارج النظام.
   ============================================================ */

const DEAL_ST = {
  draft:   { ar:'مسودة',            c:'grey' },
  sent:    { ar:'أُرسل — بانتظاره', c:'wait' },
  agreed:  { ar:'قُبل',              c:'live' },
  refused: { ar:'رُفض',              c:'no'   },
  offline: { ar:'مُعتمد خارج النظام', c:'blue' }
};
const SMS_ST = {
  queued:    { ar:'في الطابور',  c:'grey', i:'i-hour' },
  sent:      { ar:'أُرسلت',      c:'wait', i:'i-send' },
  delivered: { ar:'وصلت',        c:'live', i:'i-checkc' },
  failed:    { ar:'لم تصل',      c:'no',   i:'i-x' }
};

const openDeals = () => V.deals.filter(d => d.state === 'sent' || d.state === 'draft');
const dealById = id => S.deals.find(d => d.id === id);
const contractorById = id => S.contractors.find(c => c.id === id);
const dealsOf = cid => V.deals.filter(d => d.contractorId === cid);

function screenAfasha() {
  const q = qOf('afa');
  const fst = fOf('afa','state'), fsm = fOf('afa','sms');
  let list = V.contractors.slice();
  if (fst) list = list.filter(c => (lastDeal(c.id) || {}).state === fst);
  if (fsm) list = list.filter(c => c.sms === fsm);
  if (q) list = list.filter(c => (c.name + ' ' + c.company + ' ' + c.phone).indexOf(q) >= 0);
  const agreed = V.contractors.filter(c => {
    const d = lastDeal(c.id); return d && (d.state === 'agreed' || d.state === 'offline'); }).length;

  return '<div class="grid g4">' +
      stat({ label:'المقاولون', n:V.contractors.length, ic:'i-truck',
        sub:'لكلٍّ عمّاله', series:[2,4,6,8,10,12,13,V.contractors.length] }) +
      stat({ label:'متعاقَد معهم', n:agreed, ic:'i-checkc', cls:'up',
        sub:'قبلوا أو اعتُمدوا خارج النظام', series:[0,1,2,3,4,5,6,agreed] }) +
      stat({ label:'بانتظار ردّهم', n:V.deals.filter(d => d.state === 'sent').length, ic:'i-hour',
        cls:'warn', sub:'أُرسل العقد ولم يُبَتّ',
        series:[1,2,2,3,3,4,3,Math.max(1, V.deals.filter(d => d.state === 'sent').length)] }) +
      stat({ label:'رسائل لم تصل', n:V.contractors.filter(c => c.sms === 'failed').length,
        ic:'i-x', cls:'bad', sub:'تحتاج رقمًا صحيحًا', series:[0,1,0,1,1,2,1,1] }) +
    '</div>' +

    '<div class="card gold">' +
      head('مقاولو العفاشة', 'يُضاف المقاول فتصل رسالته، ثم يُرسَل له العقد',
        '<button class="btn p sm" data-a="cnew">' + icon('i-plus','s16') + 'مقاول جديد</button>',
        'i-truck') +
      filterBar('afa', [
        { k:'state', label:'العقد',   opts:Object.keys(DEAL_ST).map(k => [k, DEAL_ST[k].ar]) },
        { k:'sms',   label:'الرسالة', opts:Object.keys(SMS_ST).map(k => [k, SMS_ST[k].ar]) }
      ], list.length, V.contractors.length, 'ابحث باسم مقاول أو شركة أو رقم…') +

      (list.length ? '<div class="plist">' + list.map((c, i) => {
        const d = lastDeal(c.id), st = d ? DEAL_ST[d.state] : DEAL_ST.draft;
        const sm = SMS_ST[c.sms] || SMS_ST.queued;
        return '<div class="prow" style="flex-wrap:wrap;animation-delay:' + (i * 45) + 'ms">' +
          '<span class="krail" style="background:' +
            (d && (d.state === 'agreed' || d.state === 'offline') ? 'var(--live)'
              : d && d.state === 'refused' ? 'var(--red)' : 'var(--amber)') + '"></span>' +
          '<span class="ico">' + icon('i-truck','s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(c.name) + '</b>' +
          '<span>' + E(c.company) + ' · ' + LTR(c.phone) + ' · ' +
            AR(c.workers) + ' عاملًا</span></span>' +
          pill(st.ar, st.c) +
          '<span class="smsbox" title="حالة الرسالة النصية">' + icon(sm.i,'s14') +
            '<span>' + E(sm.ar) + '</span></span>' +
          '<span class="tiny faint">' + ago(c.at) + '</span>' +
          '<div class="pfoot" style="width:100%">' +
            '<span class="ok">' + LTR(c.user) + ' · ' +
              (d ? 'العقد ' + LTR(d.no) + (d.file ? ' · مرفق' : '') : 'بلا عقد بعد') + '</span>' +
            '<span class="fl" style="gap:7px">' +
              (c.sms === 'failed'
                ? '<button class="btn l sm" data-a="csms" data-id="' + c.id + '">إعادة الإرسال</button>' : '') +
              '<button class="btn l sm" data-a="copen" data-id="' + c.id + '">الملفّ</button>' +
              (!d || d.state === 'refused'
                ? '<button class="btn p sm" data-a="cdeal" data-id="' + c.id + '">إرسال عقد</button>'
                : d.state === 'sent'
                ? '<button class="btn p sm" data-a="cagree" data-id="' + d.id + '">موافقة نيابةً عنه</button>'
                : pill('مكتمل', 'live')) +
            '</span></div></div>';
      }).join('') + '</div>'
        : empty('لا مقاول يطابق', 'أضف مقاولًا أو وسّع الفلاتر', 'i-truck')) +
    '</div>';
}
const lastDeal = cid => S.deals.filter(d => d.contractorId === cid)
  .sort((a, b) => b.at - a.at)[0] || null;

function contractorDrawer(id) {
  const c = contractorById(id); if (!c) return;

  const sm = SMS_ST[c.sms] || SMS_ST.queued;
  S.drawer = { title:c.name, sub:c.company, icon:'i-truck', body:
    '<div class="meta">' +
      '<div><span class="k">العمّال</span><b class="num">' + AR(c.workers) + '</b></div>' +
      '<div><span class="k">العقود</span><b class="num">' + AR(ds.length) + '</b></div>' +
      '<div><span class="k">منذ</span><b>' + ago(c.at) + '</b></div>' +
    '</div>' +

    '<div class="card">' + head('البيانات والدخول', 'صلاحيته: الموافقة على العقد فقط') +
      '<div class="kvlist">' +
        kvRow('i-phone','الجوال', c.phone, true) +
        kvRow('i-user','اسم الدخول', c.user, true) +
        kvRow('i-key','الرقم السرّي', c.pass, true) +
        kvRow('i-shield','الصفة', 'مقاول عفاشة') +
      '</div>' +
      '<div class="fl" style="gap:10px;margin-top:13px;flex-wrap:wrap">' +
        '<span class="smsbox ' + sm.c + '">' + icon(sm.i,'s14') +
          '<span>الرسالة: ' + E(sm.ar) + (c.smsAt ? ' · ' + ago(c.smsAt) : '') + '</span></span>' +
        '<button class="btn l sm" data-a="csms" data-id="' + c.id + '">' +
          icon('i-send','s14') + 'إعادة إرسال بيانات الدخول</button>' +
      '</div>' +
      '<div class="quote" style="margin-top:12px">' + E(smsText(c)) + '</div>' +
    '</div>' +

    '<div class="card">' + head('العقود', AR(ds.length) + ' عقدًا',
        '<button class="btn p sm" data-a="cdeal" data-id="' + c.id + '">عقد جديد</button>') +
      (ds.length ? '<div class="plist">' + ds.map(d => {
        const st = DEAL_ST[d.state];

/* ============================================================
   النقل — عشرة باصات تنقل المحسنين طوال الموسم
   ─────────────────────────────────────────────────────────────
   الرحلة تتبع مهمّة: من نقطة الانطلاق إلى موقعها، ثم عودة.
   وللباص الواحد رحلات في اليوم، تُجدوَل وتُعاد جدولتها.
   ============================================================ */

const BUS_ST = {
  planned: { ar:'مجدولة',  c:'wait' },
  running: { ar:'جارية',   c:'live' },
  done:    { ar:'انتهت',   c:'grey' },
  late:    { ar:'متأخّرة', c:'no'   }
};
const tripsOf = bid => V.trips.filter(t => t.busId === bid);
const busById = id => S.buses.find(b => b.id === id);
const tripState = t => t.done ? 'done'
  : now() > t.at + 30 * MIN && !t.done ? 'late'
  : now() >= t.at ? 'running' : 'planned';

/* رحلات يومٍ بعينه مرتّبة */
function tripsOn(day) {
  const d0 = dayStart(day), d1 = d0 + DAY;
  return V.trips.filter(t => t.at >= d0 && t.at < d1).sort((a, b) => a.at - b.at);
}

function screenTransport() {
  const day = S.tab.trday ? Number(S.tab.trday) : dayStart(now());
  const q = qOf('trp');
  const fb = fOf('trp','bus'), fk = fOf('trp','kind');
  let list = tripsOn(day);
  if (fb) list = list.filter(t => t.busId === fb);
  if (fk) list = list.filter(t => t.kind === fk);
  if (q) list = list.filter(t => (t.from + ' ' + t.to + ' ' + t.no).indexOf(q) >= 0);
  const late = tripsOn(day).filter(t => tripState(t) === 'late').length;
  const seats = tripsOn(day).reduce((a, t) => a + t.cap, 0);
  const taken = tripsOn(day).reduce((a, t) => a + t.riders.length, 0);

  /* أيام الموسم: خمسة قبل وخمسة بعد */
  const days = [];
  for (let i = -3; i <= 4; i++) days.push(dayStart(now()) + i * DAY);

  return '<div class="grid g4">' +
      stat({ label:'الباصات', n:S.buses.length, ic:'i-bus',
        sub:'تنقل المحسنين طوال الموسم', series:[4,6,7,8,9,10,10,S.buses.length] }) +
      stat({ label:'رحلات اليوم', n:tripsOn(day).length, ic:'i-hist',
        sub:dayName(day) + ' · ' + hijri(day),
        series:[12,18,22,26,30,34,38,Math.max(1, tripsOn(day).length)] }) +
      stat({ label:'إشغال المقاعد', n:seats ? Math.round(taken / seats * 100) : 0, suffix:'٪',
        ic:'i-users', cls:'up', sub:AR(taken) + ' من ' + AR(seats) + ' مقعدًا',
        series:[42,50,58,63,70,74,78,seats ? Math.round(taken / seats * 100) : 0] }) +
      stat({ label:'متأخّرة', n:late, ic:'i-warn', cls:late ? 'bad' : 'up',
        sub:late ? 'تجاوزت موعدها بنصف ساعة' : 'كل الرحلات في وقتها',
        series:[2,1,2,1,1,0,1,late] }) +
    '</div>' +

    '<div class="card">' +
      head('يوم الجدول', 'اختر يومًا لترى رحلاته',
        pill(AR(tripsOn(day).length) + ' رحلة', 'gold'), 'i-cal') +
      '<div class="daystrip">' + days.map(d =>
        '<button class="dchip' + (d === day ? ' on' : '') + (d === dayStart(now()) ? ' today' : '') +
        '" data-a="seg" data-k="trday" data-v="' + d + '">' +
        '<b>' + E(dayName(d)) + '</b><span>' + hijri(d) + '</span>' +
        '<i>' + AR(tripsOn(d).length) + '</i></button>').join('') + '</div>' +
    '</div>' +

    '<div class="card gold">' +
      head('مسار اليوم', 'كل صفٍّ باصّ، وكل كتلة رحلة — والخطّ الأحمر هو الآن',
        '<button class="btn p sm" data-a="trnew">' + icon('i-plus','s16') + 'جدولة رحلة</button>',
        'i-bus') +
      busGantt(day) +
    '</div>' +

    '<div class="card">' +
      head('رحلات اليوم', 'مرتّبة بوقتها', '', 'i-hist') +
      filterBar('trp', [
        { k:'bus',  label:'الباص',  opts:S.buses.map(b => [b.id, b.no + ' · ' + b.plate]) },
        { k:'kind', label:'النوع',  opts:[['toTask','إلى مهمة'],['toHotel','إلى فندق'],
          ['airport','استقبال حجاج'],['back','عودة']] }
      ], list.length, tripsOn(day).length, 'ابحث بنقطة أو رقم رحلة…') +
      (list.length ? '<div class="plist">' + list.map((t, i) => {
        const b = busById(t.busId) || {}, st = BUS_ST[tripState(t)];
        const full = Math.round(t.riders.length / Math.max(1, t.cap) * 100);
        return '<div class="prow trow" data-a="tropen" data-id="' + t.id + '" ' +
          'style="flex-wrap:wrap;animation-delay:' + (i * 35) + 'ms">' +
          '<span class="krail" style="background:' + (b.color || 'var(--dim)') + '"></span>' +
          '<span class="ico" style="color:' + (b.color || 'var(--dim)') + '">' +
            icon('i-bus','s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(t.from) + ' ← ' + E(t.to) + '</b>' +
          '<span>' + LTR(t.no) + ' · ' + E(b.no || '') + ' · ' + E(t.driver) + '</span></span>' +
          '<span class="when"><b>' + t12(t.at) + '</b>' +
            '<span class="num">' + AR(t.dur) + ' دقيقة</span></span>' +
          '<span class="fl" style="gap:9px;min-width:140px">' +
            '<span class="meter" style="flex:1"><i data-w="' + full + '"></i></span>' +
            '<span class="tiny faint num">' + AR(t.riders.length) + '/' + AR(t.cap) + '</span></span>' +
          pill(st.ar, st.c) + '</div>';
      }).join('') + '</div>' : empty('لا رحلة في هذا اليوم', 'جدوِل رحلة من الأعلى', 'i-bus')) +
    '</div>' +

    '<div class="card">' +
      head('الأسطول', AR(S.buses.length) + ' باصات', '', 'i-bus') +
      '<div class="grid g3">' + S.buses.map(b => {
        const mine = tripsOn(day).filter(t => t.busId === b.id);
        const busy = mine.reduce((a, t) => a + t.dur, 0);
        return '<div class="busbox" style="--bc:' + b.color + '">' +
          '<div class="fl" style="gap:10px;margin-bottom:10px">' +
            '<span class="ico" style="color:' + b.color + '">' + icon('i-bus','s18') + '</span>' +
            '<span class="nm" style="flex:1"><b>' + E(b.no) + '</b>' +
            '<span>' + LTR(b.plate) + ' · ' + AR(b.cap) + ' مقعدًا</span></span>' +
            pill(AR(mine.length) + ' رحلة', mine.length ? 'live' : 'grey') + '</div>' +
          '<div class="tiny faint">' + E(b.driver) + ' · ' + LTR(b.phone) + '</div>' +
          '<div class="meter gold" style="margin-top:10px"><i data-w="' +
            Math.min(100, Math.round(busy / 600 * 100)) + '"></i></div>' +
          '<div class="tiny faint" style="margin-top:6px">' +
            AR(Math.round(busy / 60)) + ' ساعات تشغيل اليوم</div>' +
        '</div>';
      }).join('') + '</div>' +
    '</div>';
}

/* ---------- مسار اليوم: صفّ لكل باص ---------- */
function busGantt(day) {
  const d0 = dayStart(day);
  const H0 = 4, H1 = 24;                    /* اليوم يُعرض من الرابعة فجرًا */
  const span = (H1 - H0) * 60;
  const pos = ms => Math.max(0, Math.min(100,
    ((ms - d0) / MIN - H0 * 60) / span * 100));
  const nowPct = dayStart(now()) === d0 ? pos(now()) : -1;

  return '<div class="gantt">' +
    '<div class="ghead">' + Array.from({ length: 10 }, (_, i) => {
      const h = H0 + i * 2;
      return '<span style="inset-inline-start:' + ((h - H0) * 60 / span * 100) + '%">' +
        AR(h > 12 ? h - 12 : h) + (h >= 12 ? ' م' : ' ص') + '</span>';
    }).join('') + '</div>' +
    S.buses.map(b => {
      const mine = tripsOn(day).filter(t => t.busId === b.id);
      return '<div class="grow">' +
        '<span class="glabel" style="--bc:' + b.color + '"><b>' + E(b.no) + '</b>' +
          '<span>' + AR(mine.length) + '</span></span>' +
        '<span class="gtrack">' +
          (nowPct >= 0 ? '<i class="gnow" style="inset-inline-start:' + nowPct + '%"></i>' : '') +
          mine.map(t => {
            const l = pos(t.at), w = Math.max(1.4, t.dur / span * 100);
            const st = tripState(t);
            return '<button class="gtrip ' + st + '" data-a="tropen" data-id="' + t.id + '" ' +
              'style="inset-inline-start:' + l + '%;width:' + w + '%;--bc:' + b.color + '" ' +
              'title="' + E(t.from + ' ← ' + t.to + ' · ' + t12(t.at)) + '">' +
              '<span>' + E(t.to) + '</span></button>';
          }).join('') +
        '</span></div>';
    }).join('') +
  '</div>';
}

      (t.riders.length ? '<div class="plist">' + t.riders.map(rid => {
        const u = userById(rid); if (!u) return '';

/* ============================================================
   أدلة التنفيذ — تُبنى هنا وتُربط بالمهام وتُنشر إلى الأجهزة
   ─────────────────────────────────────────────────────────────
   الدليل يُربط بطريقين:
     · بالتصنيف — فيسري على كل مهام نوعه تلقائيًّا.
     · بمهمّة بعينها — فيَغلب على تصنيفها.
   ============================================================ */

const G_SCOPE = {
  hajj:   { ar:'نشاط حجّ',       i:'i-kaaba',  c:'#0B7A4B' },
  enrich: { ar:'مزار — إثراء',   i:'i-pin',    c:'#1B6E9C' },
  nusuk:  { ar:'خدمة نُسك',      i:'i-idcard', c:'#6B4E9E' },
  comply: { ar:'نموذج امتثال',   i:'i-clip',   c:'#B8791A' },
  free:   { ar:'دليل خاصّ',      i:'i-guide',  c:'#8A5A1E' }
};
const G_ST = {
  draft:  { ar:'مسودة',        c:'grey' },
  review: { ar:'قيد المراجعة', c:'wait' },
  live:   { ar:'معتمد',        c:'live' }
};
const MEDIA_KIND = {
  text:  { ar:'نص',    i:'i-list' },
  photo: { ar:'صور',   i:'i-photo' },
  video: { ar:'فيديو', i:'i-play' },
  pdf:   { ar:'PDF',   i:'i-doc' }
};

/* خيارات الهدف حسب التصنيف */
function gTargets(scope) {
  if (scope === 'hajj')   return Object.keys(CAT).map(k => [k, CAT[k].ar]);
  if (scope === 'enrich') return SITES.map(s => [s.id, s.ar]);
  if (scope === 'nusuk')  return Object.keys(NUSUK_SVC).map(k => [k, NUSUK_SVC[k].ar]);
  if (scope === 'comply') return V.forms.map(f => [f.id, f.title]);
  return [];
}
const gTargetAr = (scope, t) => {
  const o = gTargets(scope).find(x => x[0] === t);
  return o ? o[1] : '—';
};
/* دليل هذه المهمّة: الخاصّ أوّلًا ثم دليل تصنيفها */
function guideForTask(t) {
  const own = V.guides.find(g => g.taskId === t.id && g.status === 'live');
  if (own) return own;
  return V.guides.find(g => g.scope === 'hajj' && g.target === t.kind && g.status === 'live') || null;
}
const guideFor = (scope, target) =>
  V.guides.find(g => g.scope === scope && g.target === target && g.status === 'live') || null;

/* ============================================================
   الخط الزمني للموسم — كل مهام كل الفرق في شاشة واحدة
   ترى التداخل والفجوة والضغط بنظرة، وتفتح أيّ مهمة بنقرة.
   ============================================================ */

function tlWindow() {
  const all = V.tasks;
  if (!all.length) return { a: now() - DAY, b: now() + DAY };
  const a = Math.min.apply(null, all.map(t => t.start)) - 4 * HR;
  const b = Math.max.apply(null, all.map(t => t.end)) + 4 * HR;
  return { a, b };
}

function screenTimeline() {
  const w = tlWindow(), span = w.b - w.a;
  const pct = ts => ((ts - w.a) / span) * 100;

  /* أعمدة الأيام */
  const days = [];
  for (let d = dayStart(w.a); d <= w.b; d += DAY) days.push(d);

  const zoom = S.tab.tlz || 'all';
  const rows = leaders().filter(L => zoom === 'all' || zoom === L.id);

  return '<div class="grid g4">' +
      kpi('مهام الموسم', '', 'عبر ' + AR(leaders().length) + ' فرق', '', 'i-tasks', V.tasks.length) +
      kpi('أيام التشغيل', '', 'من أول مهمة إلى آخرها', '', 'i-cal', days.length) +
      kpi('ذروة التزامن', '', 'أكثر عدد مهام في وقت واحد', 'warn', 'i-play', peakOverlap()) +
      kpi('متوسط التقييم', '', 'للمهام المنجزة', 'up', 'i-star',
        Number((V.tasks.filter(t => t.rating).reduce((a, t) => a + t.rating, 0) /
          Math.max(1, V.tasks.filter(t => t.rating).length)).toFixed(1))) +
    '</div>' +

    '<div class="card gold">' +
      head('الخط الزمني للموسم', 'كل مهمة بلونها ونوعها — والخط الأحمر هو الآن',
        '<span style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn ' + (zoom === 'all' ? 'p' : 'l') + ' sm" data-a="seg" data-k="tlz" data-v="all">كل الفرق</button>' +
        leaders().map(L => '<button class="btn ' + (zoom === L.id ? 'p' : 'l') + ' sm" ' +
          'data-a="seg" data-k="tlz" data-v="' + L.id + '">' + E(L.kt) + '</button>').join('') + '</span>') +

      '<div class="tl"><div class="tlgrid">' +
        '<div class="tlhead">' + days.map(d =>
          '<span>' + dayName(d).slice(0, 3) + ' ' + AR(new Date(d).getDate()) + '</span>').join('') + '</div>' +
        rows.map((L, ri) => {
          const ts = V.tasks.filter(t => t.leaderId === L.id).sort((a, b) => a.start - b.start);
          return '<div class="tlrow">' +
            '<span class="tlname">' + E(L.kt) + '<br><span class="tiny faint">' +
              E(L.name.split(' ')[0]) + '</span></span>' +
            '<span class="tlbar">' +
              ts.map((t, i) => {
                const c = CAT[t.kind] || {};
                const l = pct(t.start), wd = Math.max(0.7, pct(t.end) - l);

/* أكثر عدد مهام متزامنة في الموسم */
function peakOverlap() {
  const pts = [];
  V.tasks.forEach(t => { pts.push([t.start, 1]); pts.push([t.end, -1]); });
  pts.sort((a, b) => a[0] - b[0]);
  let cur = 0, peak = 0;
  pts.forEach(p => { cur += p[1]; if (cur > peak) peak = cur; });
  return peak;
}

/* ============================================================

   كل حركة هنا لها سبب وظيفي: تُسرّع القراءة أو تدلّ على تغيّر.
   ============================================================ */

/* ---------- الوضع الليلي والنهاري ---------- */
function applyTheme() {
  const t = S.theme || 'night';
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'day' ? '#F4F7F3' : '#060C09');
}
function toggleTheme() {
  S.theme = (S.theme === 'day') ? 'night' : 'day';
  applyTheme(); save();
  toast(S.theme === 'day' ? 'الوضع النهاري' : 'الوضع الليلي');
}

/* ---------- عدّ تصاعدي للأرقام ---------- */
function countUp(el) {
  const raw = el.getAttribute(String.fromCharCode(100,97,116,97,45,110));
  if (raw == null || raw === '') return;   /* بلا رقم: يُترك النص كما هو */
  const target = Number(raw);
  if (!isFinite(target)) return;
  const dec = /\./.test(raw) ? 1 : 0;
  const suffix = el.getAttribute('data-suffix') || '';
  const write = v => { el.textContent = AR(dec ? v.toFixed(1) : Math.round(v)) + suffix; };
  /* من طلب تقليل الحركة يرى الرقم النهائي فورًا */
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    write(target); return;
  }
  const dur = 850, t0 = performance.now();
  function step(t) {
    const p = Math.max(0, Math.min(1, (t - t0) / dur));   /* لا تقدّم سالبًا */
    write(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- ضوء يتبع المؤشّر على البطاقات ---------- */
function bindPointerLight(root) {
  root.querySelectorAll('.card').forEach(c => {
    c.addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect();
      c.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      c.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
  });
}

/* ---------- موجة ضغط على الأزرار ---------- */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.btn');
  if (!b) return;
  const r = b.getBoundingClientRect();
  const i = document.createElement('i');
  i.className = 'rip';
  i.style.left = (e.clientX - r.left) + 'px';
  i.style.top = (e.clientY - r.top) + 'px';
  b.appendChild(i);
  setTimeout(() => i.remove(), 560);
});

/* ---------- مؤشّر السكة الذهبي ينتقل بين الأزرار ---------- */
function moveRailMark() {
  const rail = document.querySelector('.rail'); if (!rail) return;
  let mark = rail.querySelector('.railmark');
  if (!mark) { mark = document.createElement('span'); mark.className = 'railmark'; rail.appendChild(mark); }
  const on = rail.querySelector('button.on');
  if (!on) { mark.style.opacity = 0; return; }
  const r = rail.getBoundingClientRect(), b = on.getBoundingClientRect();
  mark.style.opacity = 1;
  mark.style.top = (b.top - r.top + 12) + 'px';
  mark.style.height = (b.height - 24) + 'px';
}

/* ---------- تعبئة الأشرطة بعد الرسم ---------- */
function fillMeters(root) {
  root.querySelectorAll('.meter i[data-w], .bar2 i[data-w]').forEach(i => {
    requestAnimationFrame(() => { i.style.width = i.getAttribute('data-w') + '%'; });
  });
}

/* ---------- طبقة ما بعد الرسم ---------- */
/* الأعمدة تبدأ من الصفر ثم تنمو — الارتفاع يُكتب بعد الرسم لا معه */
function growBars(root) {
  requestAnimationFrame(() => {
    (root || document).querySelectorAll('.bar[data-h]').forEach(b => {
      b.style.height = b.dataset.h + '%';
    });
  });
}

/* عمق التمرير: الشريط العلوي يعرف أن تحته محتوى */
function bindScrollDepth(wrap) {
  const v = wrap.querySelector('.view'), top = wrap.querySelector('.top');
  if (!v || !top) return;
  const on = () => top.classList.toggle('deep', v.scrollTop > 6);
  v.addEventListener('scroll', on, { passive: true });
  on();
}

function afterRender() {
  const wrap = document.getElementById('stagewrap');
  wrap.querySelectorAll('[data-n]').forEach(countUp);
  bindPointerLight(wrap);
  fillMeters(wrap);
  growBars(wrap);
  bindScrollDepth(wrap);
  moveRailMark();
}

document.addEventListener('keydown', e => {
  const typing = e.target && /input|textarea|select/i.test(e.target.tagName);

  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault(); S.palette = !S.palette; S.pq = ''; S.psel = 0; renderPalette(); return;
  }
  if (S.palette) {
    if (e.key === 'Escape') { S.palette = false; renderPalette(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); S.psel = (S.psel || 0) + 1; renderPalette(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); S.psel = Math.max(0, (S.psel || 0) - 1); renderPalette(); return; }
    if (e.key === 'Enter') { e.preventDefault(); runPalette(S.psel || 0); return; }
    return;
  }
  if (S.drawer && e.key === 'Escape') { S.drawer = null; renderDrawer(); return; }
  /* Esc مخرج عام: من الجدار أولًا، ثم إلى لوحة العمليات */
  if (e.key === 'Escape') {
    if (S.wall) { S.wall = false; S.wallAuto = false; render(); return; }
    if (S.wide) { S.wide = false; render(); return; }
    if (S.route.n !== 'ops') { S.route = { n: 'ops' }; render(); return; }
    return;
  }
  if (typing) return;

  if (e.key >= '1' && e.key <= '9') {
    const it = navItems()[Number(e.key) - 1];
    if (it) { S.route = { n: it.k }; render(); }
  }
  else if (e.key === 'b' || e.key === 'B') { S.wide = !S.wide; render(); }
  else if (e.key === 'f' || e.key === 'F') { S.wall = !S.wall; render(); }
  else if (e.key === 't' || e.key === 'T') { toggleTheme(); render(); }
  else if (e.key === '?') { showShortcuts(); }
});

/* اختيار تخصّص المحسن داخل التشكيل */
document.addEventListener('change', e => {
  const t = e.target;
  if (!t) return;
  /* مرفق: نحفظ وصفه لا محتواه — الاسم والحجم والنوع */
  const fk = t.getAttribute && t.getAttribute('data-file');
  if (fk) {
    const f = t.files && t.files[0];
    S.files = S.files || {};
    if (f) S.files[fk] = { name:f.name, size:f.size, type:f.type };
    save();
    if (S.drawer) { if (S.picker) paintPicker(); else repaintDrawer(); }
    return;
  }
  /* قوائم الفلترة */
  const gk = t.getAttribute && t.getAttribute('data-g');
  if (gk) {
    S.gate = S.gate || {};
    const map = { gorg:'orgId', ghotel:'hotelId', glead:'leaderId', guser:'userId',
      gct:'contractorId' };
    S.gate[map[gk]] = t.value || null;
    save(); renderGate(); return;
  }
  const fsel = t.getAttribute && t.getAttribute('data-f');
  if (fsel) { fltSet(fsel, t.getAttribute('data-fk'), t.value); save(); if (S.drawer) repaintDrawer(); else render(); return; }
  if (!t.classList || !t.classList.contains('spec')) return;
  const id = t.getAttribute('data-id'), d = draft();
  const m = d.members.find(x => x.id === id);
  if (m) { m.spec = t.value; save(); }
});

  'closedrawer','shortcuts','timeline','tlopen','seg','sort','ktopen','pilopen','gdview','tropen','copen','whoami',

function render() {
  buildView();                       /* الرؤية قبل أي قراءة */
  let n = S.route.n;
  if (!maySee(n)) {                  /* شاشة غير ممنوحة: أوّل مسموحة أو صفحة المنع */
    const first = allowed()[0];
    if (first) { n = first; S.route = { n }; }

  applyTheme();
  const room = document.getElementById('room');
  room.className = (S.wall ? 'wall' : '') + (S.wide && !S.wall ? ' wide' : '');

  const key = n + ':' + (S.route.id || '');
  const same = S._key === key;
  const wrap = document.getElementById('stagewrap');
  const prev = wrap.querySelector('.view');
  const keep = same && prev ? prev.scrollTop : 0;
  document.getElementById('sidewrap').innerHTML = sidebar();
  /* لا يُمسح صنف .stage وإلا فقد المسرح تخطيطه ولم يعمل أي تمرير */
  wrap.className = 'stage' + (same ? ' nofx' : '');
  wrap.innerHTML = topbar() + '<div class="view">' + fn() + '</div>';

  const v = wrap.querySelector('.view');
  if (v && keep) v.scrollTop = keep;

  tw.innerHTML = S.toast

      '<i class="bar"></i></div>'
    : '';
  /* في جدار العرض: شريط تقدّم إن كان الدوران مفعّلًا، ومخرج ظاهر دائمًا */
  document.getElementById('wallbar').innerHTML = S.wall
    ? (S.wallAuto ? '<div class="wallbar"><i></i></div>' : '') +
      '<button class="wallexit" data-a="wall">' + icon('i-x','s16') +
        'الخروج من جدار العرض · Esc</button>' +
      '<button class="wallexit" style="inset-inline-start:auto;inset-inline-end:22px" ' +

        (S.wallAuto ? 'إيقاف الدوران' : 'دوران تلقائي') + '</button>'
    : '';
  afterRender();
  renderPalette();
  renderDrawer();
  syncWall();
  renderGate();
  save();
  if (S.toast) {
    const t = S.toast;
    setTimeout(() => { if (S.toast === t) { S.toast = null; render(); } }, 2800);

}

const val = id => { const e = document.getElementById(id); return e ? String(e.value).trim() : ''; };

document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, v = b.dataset.v;

  /* الحارس: من لا يملك التعديل لا يُنفّذ إجراءً — والاطّلاع مباح */
  if (!canEdit() && READ_ACTS.indexOf(a) < 0) {
    toast('صفتك للاطّلاع لا للتعديل — ' + curPerm().ar, 'r');
    return;
  }

  switch (a) {
    case 'go': S.route = { n: b.dataset.n, id }; break;
    case 'wide': S.wide = !S.wide; break;
    case 'wall': S.wall = !S.wall; if (!S.wall) S.wallAuto = false;
      toast(S.wall ? 'جدار العرض — Esc أو F للخروج' : 'عاد العرض العادي'); break;
    case 'wallauto': S.wallAuto = !S.wallAuto;
      toast(S.wallAuto ? 'يدور بين اللوحات كل ١٢ ثانية' : 'أُوقف الدوران'); break;
    case 'theme': toggleTheme(); break;
    case 'palette': S.palette = true; S.pq = ''; S.psel = 0; renderPalette(); return;
    case 'closepal': S.palette = false; renderPalette(); return;
    case 'palrun': runPalette(Number(v)); return;
    case 'closedrawer': S.drawer = null; S.picker = null; renderDrawer(); return;
    case 'shortcuts': showShortcuts(); return;
    case 'timeline': S.route = { n: 'timeline' }; break;
    case 'tlopen': taskDrawer(id); return;
    case 'seg': S.tab[b.dataset.k] = v; break;
    /* الحاوية تُفتح وتُطوى ولا تنتقل */
    case 'grp': {
      const p = b.dataset.n;
      S.open = S.open || {};
      const item = NAV.reduce((r, g) => r || g.items.find(x => x.p === p), null);
      S.open[p] = !grpOpen(item);
      save(); render(); return;
    }
    case 'gokid': {
      if (b.dataset.k) S.tab[b.dataset.k] = b.dataset.v;
      S.route = { n: b.dataset.n };
      break;
    }
    case 'whoami': whoDrawer(); return;

    /* ─── العفاشة ─── */
    case 'cnew': S.q.cn = ''; S.q.cc = ''; S.q.cp = ''; S.q.cw = ''; contractorNew(); return;
    case 'copen': contractorDrawer(id); return;
    case 'csave': {
      const n = (S.q.cn || '').trim(), co = (S.q.cc || '').trim(), ph = (S.q.cp || '').trim();
      if (!n || !ph) { toast('الاسم ورقم الجوال لا بدّ منهما', 'r'); return; }
      const seq = 401 + S.contractors.length;
      const c = { id:uid('CT'), name:n, company:co || '—',
        workers:Number(String(S.q.cw || '').replace(/\D/g, '')) || 10, phone:ph,
        user:'afasha' + seq, pass:'MC' + (7100 + S.contractors.length * 13),
        sms:'queued', smsAt:now(), at:now() };
      S.contractors.unshift(c);
      /* الرسالة تُرسَل فورًا، وحالتها تُحدَّث بعد لحظات كما في المزوّد */
      sendSms(c);
      logIt('أُضيف المقاول ' + n + ' وأُرسلت بيانات دخوله', 'info');
      S.drawer = null; toast('أُضيف — وأُرسلت رسالته');
      break;
    }
    case 'csms': {
      const c = contractorById(id); if (!c) return;
      c.sms = 'queued'; c.smsAt = now(); sendSms(c);
      logIt('أُعيد إرسال بيانات الدخول إلى ' + c.name, 'info');
      toast('أُعيد الإرسال');
      break;
    }
    case 'cdeal': dealNew(id); return;
    case 'dsend': {
      const c = contractorById(S.pendDeal); if (!c) return;
      const d = mkDeal(c, 'sent');
      logIt('أُرسل عقد ' + d.no + ' إلى ' + c.name, 'info');
      S.drawer = null; S.pendDeal = null;
      toast('أُرسل العقد — بانتظار ردّه');
      break;
    }
    case 'doffline': {
      const c = contractorById(S.pendDeal); if (!c) return;
      const d = mkDeal(c, 'offline');
      d.reason = 'وُقّع خارج النظام واعتمده الكنترول';
      logIt('اعتُمد عقد ' + d.no + ' مع ' + c.name + ' — وُقّع خارج النظام', 'info');
      S.drawer = null; S.pendDeal = null;
      toast('اعتُمد العقد');

      d.actAt = now();
      logIt('قُبل عقد ' + d.no + ' — ' + d.reason, 'info');
      toast('قُبل العقد');
      break;
    }
    case 'crefuse': {
      const d = dealById(id); if (!d) return;
      d.state = 'refused';
      d.reason = curPerm().scope === 'deal' ? 'رفضه المقاول' : 'سُجّل رفضه';
      d.actAt = now();
      logIt('رُفض عقد ' + d.no, 'info');
      toast('سُجّل الرفض', 'r');
      break;
    }

    /* ─── النقل ─── */
    case 'tropen': tripDrawer(id); return;
    case 'trmove': {
      const t = S.trips.find(x => x.id === id); if (!t) return;
      t.at += Number(v) * MIN;
      logIt('أُعيدت جدولة ' + t.no + ' ' + (Number(v) > 0 ? 'تأخيرًا' : 'تقديمًا') +

      return;

    case 'trdone': {
      const t = S.trips.find(x => x.id === id); if (!t) return;
      t.done = true; logIt('انتهت الرحلة ' + t.no, 'info');
      save(); tripDrawer(id); toast('انتهت'); return;
    }
    case 'trbus': {
      const t = S.trips.find(x => x.id === id); if (!t) return;
      S.pendTrip = id;
      S.drawer = { title:'باص ' + t.no, sub:'اختر باصًا آخر', icon:'i-bus',
        body:'<div class="plist">' + S.buses.map(b => {
          const busy = S.trips.filter(x => x.busId === b.id &&
            Math.abs(x.at - t.at) < 60 * MIN && x.id !== t.id).length;

            '<span class="nm" style="flex:1"><b>' + E(b.no) + '</b>' +
            '<span>' + LTR(b.plate) + ' · ' + E(b.driver) + ' · ' + AR(b.cap) + ' مقعدًا</span></span>' +
            (busy ? pill('تعارض ' + AR(busy), 'no') : pill('متاح', 'live')) + '</button>';
        }).join('') + '</div>' };
      renderDrawer(); return;
    }
    case 'trbusset': {
      const t = S.trips.find(x => x.id === S.pendTrip); if (!t) return;
      const b2 = busById(id);
      t.busId = id; t.driver = b2.driver; t.cap = b2.cap;
      if (t.riders.length > b2.cap) t.riders = t.riders.slice(0, b2.cap);
      logIt('نُقلت ' + t.no + ' إلى ' + b2.no, 'info');
      S.pendTrip = null; S.drawer = null; toast('الباص ' + b2.no);
      break;
    }
    case 'trider': {
      const t = S.trips.find(x => x.id === id); if (!t) return;
      if (t.riders.length >= t.cap) { toast('الباص مكتمل', 'r'); return; }
      const task = t.taskId ? taskById(t.taskId) : null;
      const cands = (task ? (task.assigned || []).map(userById).filter(Boolean)
        : S.users.filter(u => u.role === 'muhsen' && u.groupId))
        .filter(u => t.riders.indexOf(u.id) < 0);

    }
    case 'rpclose': { const r = S.reports.find(x => x.id === id); if (!r) return;
      r.status = 'مغلق'; r.escalated = false;
      logIt('أُغلق تقرير ' + r.no, 'info'); save(); reportDrawer(id);
      toast('أُغلق التقرير'); return; }

    /* ─── ١) المشرف على الفندق: واحد لا أكثر ─── */
    case 'supassign':
    case 'supswap': {
      const cur = supOfHotel(id);
      openPicker('sup', id, { title:(cur ? 'تغيير مشرف ' : 'تسكين مشرف ') + hotelById(id).ar,
        note:'لكل فندق مشرف واحد. من يُختار يُزاح عن فندقه السابق إن كان له فندق، ' +
          'ومن يُزاح هنا يعود حرًّا.',
        cands:supervisors().filter(u => u.hotelId !== id) });
      return;
    }
    case 'suprm': {
      const sv = supOfHotel(id); if (!sv) return;
      sv.hotelId = null;
      S.groups.forEach(g => { if (g.hotelId === id) g.supervisorId = null; });
      logIt('أُزيل المشرف ' + sv.name + ' عن ' + hotelById(id).ar, 'assign');
      toast(sv.name + ' عاد حرًّا', 'r');
      break;
    }

    /* ─── ٢) الليدر على المجموعة ─── */
    case 'gleadswap': {
      const g = groupById(id); if (!g) return;
      openPicker('glead', g.id, { title:'ليدر ' + g.no,
        note:'لا يقود الليدر أكثر من مجموعتين. من يخرج هنا يعود إلى قائمة الليدرز.',
        cands:leaders().filter(l => l.id !== g.leaderId && groupsOf(l.id).length < 2) });
      return;
    }
    case 'ghotel': {
      const g = groupById(id); if (!g) return;
      S.pendHotel = g.id;
      S.drawer = { title:'سكن ' + g.no, sub:'المشرف يتبع الفندق تلقائيًّا', icon:'i-key',
        body:'<div class="plist">' + HOTELS.map(h => {
          const sv = supOfHotel(h.id);
          return '<button class="prow pick' + (g.hotelId === h.id ? ' on' : '') + '" ' +
            'data-a="ghotelset" data-id="' + h.id + '">' +
            '<span class="ico">' + icon('i-key','s16') + '</span>' +
            '<span class="nm" style="flex:1"><b>' + E(h.ar) + '</b>' +
            '<span>' + E(h.dist) + ' · ' + (sv ? 'المشرف ' + E(sv.name) : 'بلا مشرف') +
            '</span></span>' +
            pill(AR(S.groups.filter(x => x.hotelId === h.id).length) + ' مجموعة', 'grey') +
          '</button>';
        }).join('') + '</div>' };
      renderDrawer(); return;
    }
    case 'ghotelset': {
      const g = groupById(S.pendHotel); if (!g) return;
      g.hotelId = id;
      const sv = supOfHotel(id);
      g.supervisorId = sv ? sv.id : null;
      logIt('نُقلت ' + g.no + ' إلى ' + hotelById(id).ar, 'assign');
      toast('السكن ' + hotelById(id).ar + (sv ? ' — المشرف ' + sv.name : ' — بلا مشرف'));
      S.pendHotel = null; S.drawer = null;
      break;
    }
    case 'gnew': {
      const L = leaders().find(l => groupsOf(l.id).length < 2);
      if (!L) { toast('كل ليدر يقود مجموعتين', 'r'); return; }
      const o = orgById(L.orgId) || S.orgs[0];
      const g = { id:uid('G'), no:'GR-' + (101 + S.groups.length), leaderId:L.id,
        orgId:o.id, hotelId:null, supervisorId:null, members:[], at:now() };
      S.groups.push(g);
      logIt('أُنشئت مجموعة ' + g.no + ' بقيادة ' + L.name, 'assign');
      toast('أُنشئت ' + g.no + ' — أضف محسنيها وسكنها');
      break;
    }

    /* ─── ٣) المحسن في مقعده ─── */
    case 'mseatin': {
      const g = groupById(id); if (!g) return;
      if (g.members.length >= 5) { toast('المجموعة مكتملة', 'r'); return; }
      openPicker('mseat', g.id, { title:'مقعد في ' + g.no,
        note:'المتاحون وحدهم — من دخل مجموعةً خرج من هذه القائمة.',
        cands:freeMuhsens() });
      return;
    }
    case 'mseatout': {
      const g = groupById(id); if (!g) return;
      const u = userById(v);
      g.members = g.members.filter(m => m.id !== v);
      if (u) { u.groupId = null; u.leaderId = null; u.kt = '—'; }
      S.tasks.forEach(t => { if (t.leaderId === g.leaderId)
        t.assigned = (t.assigned || []).filter(x => x !== v); });
      logIt('أُخرج ' + ((u || {}).name || '') + ' من ' + g.no, 'assign');
      toast(((u || {}).name || '') + ' عاد إلى المتاحين', 'r');
      break;
    }
    case 'staffopen': staffDrawer(id); return;
    case 'logout': S.auth = false; S.drawer = null; save(); render();
      toast('خرجتَ من الغرفة'); return;
    case 'grole': S.gate = S.gate || {}; S.gate.perm = v; save(); renderGate(); return;
    case 'pgtog': {
      const k = b.dataset.k;
      S.grants[k] = S.grants[k] || [];
      const i = S.grants[k].indexOf(v);
      if (i >= 0) S.grants[k].splice(i, 1); else S.grants[k].push(v);
      logIt((i >= 0 ? 'مُنعت' : 'مُنحت') + ' شاشة «' + (navOf(v) || {}).l +
        '» لصفة ' + permOf(k).ar, 'info');
      break;
    }
    case 'pgall': {
      S.grants[v] = navItems().map(x => x.k).filter(x => x !== 'perms');
      logIt('مُنحت كل الشاشات لصفة ' + permOf(v).ar, 'info');
      toast('مُنحت كل الشاشات — بلا تعديل'); break;
    }
    case 'pgdef': {
      delete S.grants[v];
      logIt('أُعيدت صفة ' + permOf(v).ar + ' إلى صلاحياتها الافتراضية', 'info');
      toast('عادت إلى الافتراضي — ' + AR(grantsOf(v).length) + ' شاشة'); break;
    }
    case 'pgnone': {
      S.grants[v] = [];
      logIt('مُنعت كل الشاشات عن صفة ' + permOf(v).ar, 'info');
      toast('لن ترى هذه الصفة شيئًا', 'r'); break;
    }
    case 'gin': {
      const g = S.gate || { perm:'admin' };
      S.actor = { perm:g.perm, orgId:g.orgId, hotelId:g.hotelId,
        leaderId:g.leaderId, userId:g.userId, contractorId:g.contractorId };
      S.auth = true;
      const first = allowed()[0];
      S.route = { n: first || 'ops' };
      save(); render();
      toast('دخلتَ بصفة ' + curPerm().ar + ' — ' + SCOPE_AR[curPerm().scope]);
      return;
    }
    /* المنتقي: من يُسنَد إليه */
    case 'pickdo': {
      const p = S.picker; if (!p) return;
      const u = userById(id); if (!u) return;
      applyPick(p.kind, p.id, u);
      S.picker = null; S.drawer = null;
      break;
    }
    /* اعتماد دليل: النسخة تُرفع والتطبيق يقرأ المعتمد وحده */
    case 'gpub': {
      const g = S.guides.find(x => x.id === id); if (!g) return;
      g.status = 'معتمد'; g.ver += 1; g.at = now();
      logIt('اعتُمدت النسخة ' + AR(g.ver) + ' من دليل ' + (CAT[g.kind] || {}).ar, 'guide');
      toast('نُشر الدليل — يقرؤه الميدان الآن');
      break;
    }
    /* بثّ رسالة */
    case 'castsend': {
      const t = (S.q.ct || '').trim(), y = (S.q.cb || '').trim();
      if (!t) { toast('اكتب عنوانًا يُقرأ في الإشعار', 'r'); return; }
      const to = S.tab.aud || CAST_AUD[0];
      const of = to.indexOf('الليدرز') >= 0 ? leaders().length
        : to.indexOf('الاحتياطي') >= 0 ? reserveTeam().length
        : to.indexOf('كل المحسنين') >= 0 ? S.users.filter(u => u.role === 'muhsen' && !u.reserve).length
        : 5;
      S.casts.unshift({ id: uid('C'), no: 'BR-' + (9100 + S.casts.length),
        to, title: t, body: y || '—', kind: S.tab.ck || 'عادي', seen: 0, of, at: now() });
      logIt('بُثّت رسالة «' + t + '» إلى ' + to, 'cast');
      S.q.ct = ''; S.q.cb = '';
      toast('بُثّت إلى ' + to);
      break;
    }
    case 'castclear': S.q.ct = ''; S.q.cb = ''; break;
    /* الشِفتات */
    case 'swok': {
      const w = S.swaps.find(x => x.id === id); if (!w) return;
      w.state = 'done'; w.reason = 'اعتُمد — وأُبلغ الطرفان';
      const a = userById(w.from) || {}, c = userById(w.to) || {};
      logIt('اعتُمد تبديل وردية بين ' + (a.name || '') + ' و' + (c.name || ''), 'shift');
      toast('اعتُمد التبديل');
      break;
    }
    case 'swno': {
      const w = S.swaps.find(x => x.id === id); if (!w) return;
      w.state = 'no'; w.reason = 'الوردية لا تحتمل نقصًا في هذا اليوم';
      logIt('رُفض طلب تبديل ' + w.no + ' — الوردية لا تحتمل نقصًا', 'shift');
      toast('رُفض الطلب — وسُجّل السبب', 'r');
      break;
    }

    case 'spok': {
      const s = S.support.find(x => x.id === id);
      if (!s || s.state !== 'pending') break;
      const t = taskById(s.taskId);
      const pool = reserveTeam().filter(m => t && t.assigned.indexOf(m.id) < 0);
      const take = pool.slice(0, s.count);
      if (t) take.forEach(m => t.assigned.push(m.id));
      s.state = 'done'; s.at2 = now();
      s.reason = 'توفّر ' + AR(take.length) + ' محسن في الاحتياط ضمن نطاق المهمة بلا تعارض في أوقاتهم.';
      pushFeed('ok', 'لُبّي طلب دعم',
        (t ? t.kt + ' · ' + t.title : '') + ' — أُسند ' + AR(take.length) + ' محسن');
      logIt('لُبّي طلب الدعم ' + s.no + ' بإسناد ' + AR(take.length) + ' محسن من الاحتياط', 'ok');
      toast('أُسند ' + AR(take.length) + ' محسن من الاحتياط');
      break;
    }
    case 'spno': {
      const s = S.support.find(x => x.id === id);
      if (!s || s.state !== 'pending') break;
      s.state = 'denied'; s.at2 = now();
      s.reason = 'لا يتوفّر محسن غير مرتبط في هذا التوقيت — أعد التوزيع من فريقك.';
      pushFeed('warn', 'اعتُذر عن طلب دعم', s.no + ' — لا احتياط متاح في التوقيت');
      logIt('اعتُذر عن طلب الدعم ' + s.no, 'warn');
      toast('أُبلغ الليدر بالاعتذار', 'r');
      break;
    }
    case 'roomapply': {
      const r = S.reports.find(x => x.id === id);
      if (!r || !r.room) break;
      r.status = 'مغلق'; r.applied = now();
      const arr = S.pilgrims[r.kt] || [];
      if (arr[0]) { arr[0].floor = r.room.floor; arr[0].room = r.room.no; }
      pushFeed('ok', 'حُدِّثت بيانات غرفة', r.kt + ' · ' + r.room.floor + ' · غرفة ' + r.room.no);
      logIt('حُدِّثت بيانات الغرفة من التقرير ' + r.no, 'ok');
      toast('حُدِّثت قاعدة البيانات');
      break;
    }
    case 'clock':
      S.clockOffset = v === '0' ? 0 : (S.clockOffset || 0) + Number(v);
      toast(S.clockOffset ? 'الإزاحة ' + AR(S.clockOffset) + ' دقيقة' : 'عاد الوقت الحقيقي');
      break;
    case 'reset': reset(); return;
    default: return;
  }
  render();
});

/* لوحة المفاتيح: تنقّل سريع بالأرقام */
document.addEventListener('keydown', e => {
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key >= '1' && e.key <= '9') {
    const it = navItems()[Number(e.key) - 1];
    if (it) { S.route = { n: it.k }; render(); }
  }
  if (e.key === 'b' || e.key === 'B') { S.wide = !S.wide; render(); }
});

/* ---------- إقلاع ---------- */
load();
if (!S.theme) {
  S.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'day' : 'night';
}
applyTheme();
render();

</script>
