  const a = S.actor || {}, p = curPerm();
  if (a.orgId)   { const o = orgById(a.orgId) || {}; return o.kt + ' · ' + o.ar; }
  if (a.hotelId) return (hotelById(a.hotelId) || {}).ar || '';
  const u = actorUser();
  return u ? (u.kt && u.kt !== '—' ? u.kt : u.code) : SCOPE_AR[p.scope];
}
function whoami() {
  const p = curPerm(), u = actorUser();
  return '<button class="who" data-a="whoami" title="هويتك ونطاقك">' +
    (u ? avatar(u, 'sm')
       : '<span class="ico sm" style="color:var(--gold2)">' + icon(p.i, 's16') + '</span>') +
    '<span class="nm"><b>' + E(u ? u.name : p.ar) + '</b>' +
    '<span>' + E(u ? p.ar : actorLabel()) + '</span></span>' +
    icon('i-fwd','s14') + '</button>';
}

/* ---------- لبنات مشتركة ---------- */
function kpi(lab, val, sub, cls, ic, num, suffix) {
  return '<div class="card kpi ' + (cls || '') + '">' +
    '<span class="lab">' + (ic ? icon(ic, 's14') : '') + E(lab) + '</span>' +
    '<b class="num" data-n="' + (num == null ? '' : num) + '"' +
      (suffix ? ' data-suffix="' + suffix + '"' : '') + '>' +
      (num == null ? val : AR(0)) + '</b>' +
    (sub ? '<span class="sub">' + E(sub) + '</span>' : '') +
    '<svg class="spark" viewBox="0 0 200 38" preserveAspectRatio="none">' +
      '<path d="M0 30 L28 24 L56 27 L84 16 L112 20 L140 10 L168 14 L200 6" ' +
      'fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/></svg></div>';
}
function head(t, sub, right, ic) {
  return '<div class="h">' + (ic ? icon(ic, 's16') : '') +
    '<span class="sp"><b>' + E(t) + '</b>' +
    (sub ? '<div class="tiny faint">' + E(sub) + '</div>' : '') + '</span>' +
    (right || '') + '</div>';
}
function empty(t, s, ic) {
  return '<div class="empty">' + icon(ic || 'i-info', 's26') +
    '<b>' + E(t) + '</b><div class="tiny" style="margin-top:6px">' + E(s || '') + '</div></div>';
}
/* الوجه المرسوم — نفس أفاتار التطبيق بحلقته الذهبية */
const avatar = (u, cls) => '<span class="av ' + (cls || '') + ' ' + (u.av || 'p1') + '">' +
  '<svg viewBox="0 0 44 44"><use href="#av-' + (u.g || 'm') + '"/></svg></span>';

/* النجوم — التقييم يُقرأ لا يُقاس */
function stars(v, size) {
  const full = Math.floor(v), half = v - full >= 0.5;
  let out = '<span class="stars ' + (size || '') + '">';
  for (let i = 1; i <= 5; i++) {
    const on = i <= full, hf = !on && i === full + 1 && half;
    out += icon('i-star', (size === 'lg' ? 's18 ' : 's14 ') + (on ? 'on' : hf ? 'half' : 'off'));
  }
  return out + '<b>' + AR(String(v).replace(/\.0$/, '')) + '</b></span>';
}

/* ============================================================
   مكوّنات النظام — لبنات تُعاد في كل شاشة
   كل مكوّن هنا يرجع نصًّا، وحركته تُشغَّل في afterRender.
   ============================================================ */

/* ---------- شريط أقسام بمؤشّر ينزلق ---------- */
function segmented(key, items, cur) {
  const i = Math.max(0, items.findIndex(x => x[0] === cur));
  return '<div class="sw" data-sw="' + key + '" style="--n:' + items.length + ';--i:' + i + '">' +
    '<span class="swmark"></span>' +
    items.map(x => '<button class="' + (x[0] === cur ? 'on' : '') + '" ' +
      'data-a="seg" data-k="' + key + '" data-v="' + x[0] + '">' + E(x[1]) +
      (x[2] != null ? '<i>' + AR(x[2]) + '</i>' : '') + '</button>').join('') +
  '</div>';
}

/* ---------- فارق عن المدة السابقة ---------- */
function delta(v) {
  if (v === 0 || v == null) return '<span class="delta flat">' + icon('i-list','s14') + 'بلا تغيّر</span>';
  const up = v > 0;
  return '<span class="delta ' + (up ? 'up' : 'dn') + '">' +
    '<svg class="ic s14" viewBox="0 0 24 24"><path d="M12 ' + (up ? '19V5M6 11l6-6 6 6' : '5v14M6 13l6 6 6-6') +
    '"/></svg>' + AR(Math.abs(v)) + '</span>';
}

/* ---------- بطاقة مؤشّر كاملة ---------- */
function stat(o) {
  return '<div class="card kpi hov ' + (o.cls || '') + '">' +
    '<span class="lab">' + icon(o.ic || 'i-hash','s14') + E(o.label) + '</span>' +
    '<div class="kv"><b class="num" data-n="' + o.n + '"' +
      (o.suffix ? ' data-suffix="' + o.suffix + '"' : '') + '>' + AR(0) + '</b>' +
      (o.delta != null ? delta(o.delta) : '') + '</div>' +
    '<span class="sub">' + E(o.sub || '') + '</span>' +
    '<svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none">' +
      '<path d="' + sparkPath(o.series || [4, 7, 5, 9, 6, 11, 8, 13]) + '" fill="none" ' +
      'stroke="currentColor" stroke-width="1.8"/></svg></div>';
}
function sparkPath(a) {
  const mx = Math.max.apply(null, a) || 1, n = a.length;
  return a.map((v, i) => (i ? 'L' : 'M') + (i / (n - 1) * 200).toFixed(1) + ' ' +
    (36 - (v / mx) * 30).toFixed(1)).join(' ');
}

/* ---------- رسم أعمدة ---------- */
function chartBars(o) {
  const mx = Math.max.apply(null, o.data.map(d => d.v)) || 1;
  return '<div class="chart">' +
    '<div class="bars">' + o.data.map((d, i) =>
      '<span class="barwrap" title="' + E(d.l + ': ' + AR(d.v)) + '">' +
        '<span class="bar' + (d.hot ? ' hot' : '') + '" data-h="' + Math.max(3, d.v / mx * 100) + '" ' +
          'style="animation-delay:' + (i * 45) + 'ms"><i></i></span>' +
        '<span class="bl">' + E(d.l) + '</span>' +
      '</span>').join('') + '</div>' +
    (o.foot ? '<div class="tiny faint" style="margin-top:10px">' + E(o.foot) + '</div>' : '') +
  '</div>';
}

/* ---------- قرص نسب ---------- */
function donut(o) {
  const tot = o.data.reduce((a, d) => a + d.v, 0) || 1;
  let acc = 0;
  const R = 54, C = 2 * Math.PI * R;
  const arcs = o.data.map((d, i) => {
    const frac = d.v / tot, len = frac * C, off = -acc * C;
    acc += frac;
    return '<circle class="arc" cx="70" cy="70" r="' + R + '" fill="none" stroke="' + d.c + '" ' +
      'stroke-width="15" stroke-linecap="butt" ' +
      'stroke-dasharray="' + len.toFixed(1) + ' ' + (C - len).toFixed(1) + '" ' +
      'stroke-dashoffset="' + off.toFixed(1) + '" ' +
      'style="animation-delay:' + (i * 110) + 'ms"/>';
  }).join('');
  return '<div class="donut">' +
    '<svg viewBox="0 0 140 140"><g transform="rotate(-90 70 70)">' + arcs + '</g></svg>' +
    '<span class="dc"><b class="num" data-n="' + tot + '">' + AR(0) + '</b>' +
      '<span>' + E(o.center || '') + '</span></span>' +
  '</div>' +
  '<div class="legend">' + o.data.map(d =>
    '<span><i style="background:' + d.c + '"></i>' + E(d.l) +
    '<b class="num">' + AR(d.v) + '</b></span>').join('') + '</div>';
}

/* ---------- جدول يُفرز ---------- */
function dataTable(o) {
  const sk = S.sort && S.sort[o.key] || {};
  const dir = sk.dir || 1, col = sk.col != null ? sk.col : (o.defaultCol || 0);
  const rows = o.rows.slice().sort((a, b) => {
    const A = a.sort[col], B = b.sort[col];
    if (A === B) return 0;
    return (A > B ? 1 : -1) * dir;
  });
  return '<div class="tbl">' +
    '<div class="th" style="grid-template-columns:' + o.cols.map(c => c.w || '1fr').join(' ') + '">' +
      o.cols.map((c, i) => '<button class="' + (i === col ? 'on' : '') + '" ' +
        'data-a="sort" data-k="' + o.key + '" data-v="' + i + '">' + E(c.t) +
        (i === col ? '<svg class="ic s14" viewBox="0 0 24 24"><path d="M12 ' +
          (dir > 0 ? '19V5M6 11l6-6 6 6' : '5v14M6 13l6 6 6-6') + '"/></svg>' : '') +
        '</button>').join('') + '</div>' +
    '<div class="tb' + (rows.length > 12 ? ' bulk' : '') + '">' + (rows.length ? rows.map((r, i) =>
      '<div class="tr" style="grid-template-columns:' + o.cols.map(c => c.w || '1fr').join(' ') + ';' +
        'animation-delay:' + (rows.length > 12 ? 0 : Math.min(i * 26, 300)) + 'ms"' +
        (r.act ? ' data-a="' + r.act + '" data-id="' + r.id + '"' : '') + '>' +
        r.cells.map(c => '<span>' + c + '</span>').join('') + '</div>').join('')
      : '<div class="empty" style="padding:34px">' + icon('i-search','s26') + '<b>لا صفوف</b></div>') +
    '</div></div>';
}

/* ---------- صفّ القرارات: ما ينتظرك الآن ---------- */
function decisionItems() {
  const items = [];
  openSupport().forEach(s => {
    const t = taskById(s.taskId) || {}, L = userById(s.by) || {};
    items.push({
      kind: 'bad', ic: 'i-send', t: 'طلب دعم — ' + (t.kt || ''),
      s: (L.name || '') + ' يطلب ' + AR(s.count) + ' محسن · ' + s.why,
      at: s.at,
      acts: '<button class="btn d sm" data-a="spno" data-id="' + s.id + '">اعتذار</button>' +
            '<button class="btn p sm" data-a="spok" data-id="' + s.id + '">إسناد من الاحتياط</button>'
    });
  });
  V.reports.filter(r => r.room && r.status !== 'مغلق').forEach(r => items.push({
    kind: 'warn', ic: 'i-key', t: 'تعديل بيانات غرفة — ' + r.kt,
    s: r.room.floor + ' · غرفة ' + r.room.no + ' — ' + r.title, at: r.at,
    acts: '<button class="btn p sm" data-a="roomapply" data-id="' + r.id + '">تحديث قاعدة البيانات</button>'
  }));
  escalatedReports().filter(r => !r.room).forEach(r => items.push({
    kind: 'warn', ic: 'i-flag', t: 'تقرير مصعَّد — ' + r.kt,
    s: r.title + ' — ' + r.body.slice(0, 70), at: r.at,
    acts: '<button class="btn l sm" data-a="go" data-n="reports">فتح التقرير</button>'
  }));
  V.tickets.filter(k => k.pri === 'حرجة' && k.status !== 'مغلقة').forEach(k => items.push({
    kind: 'bad', ic: 'i-ticket', t: 'تذكرة حرجة — ' + k.kt,
    s: k.title + ' · ' + k.from, at: k.at,
    acts: '<button class="btn l sm" data-a="go" data-n="tickets">متابعة</button>'
  }));
  items.sort((a, b) => (a.kind === 'bad' ? -1 : 1) - (b.kind === 'bad' ? -1 : 1) || b.at - a.at);
  return items;
}

function decisionQueue() {
  const items = decisionItems();
  return '<div class="card gold queue">' +
    head('يحتاج قرارك الآن', items.length ? 'رتّبتُها بالأولوية ثم بالأحدث' : 'لا شيء معلّق',
      items.length ? pill(AR(items.length) + ' بند', 'no') : pill('نظيف', 'live')) +
    (items.length ? '<div class="qlist">' + items.slice(0, 5).map((x, i) =>
      '<div class="qrow ' + x.kind + '" style="animation-delay:' + (i * 60) + 'ms">' +
        '<span class="qi">' + icon(x.ic, 's18') + '</span>' +
        '<span class="nm"><b>' + E(x.t) + '</b><span>' + E(x.s) + '</span></span>' +
        '<span class="tiny faint">' + ago(x.at) + '</span>' +
        '<span class="qa">' + x.acts + '</span>' +
      '</div>').join('') + '</div>' +
      (items.length > 5 ? '<div class="tiny faint" style="margin-top:10px">و' +
        AR(items.length - 5) + ' بندًا آخر في أقسامها</div>' : '')
      : '<div class="empty" style="padding:30px">' + icon('i-checkc','s26') +
        '<b>لا قرار معلّقًا</b><div class="tiny" style="margin-top:6px">' +
        'كل ما رفعه الميدان بُتَّ فيه.</div></div>') +
  '</div>';
}

/* ---------- حِمل الساعات: كم مهمة تعمل في كل ساعة اليوم ---------- */
function loadByHour() {
  const d0 = dayStart(now()), out = [];
  for (let h = 0; h < 24; h += 2) {
    const a = d0 + h * HR, b = a + 2 * HR;
    const n = V.tasks.filter(t => t.start < b && t.end > a).length;
    out.push({ l: AR(h), v: n, hot: now() >= a && now() < b });
  }
  return out;
}

/* ---------- توزيع حالات المهام ---------- */
function statusMix() {
  const run = runningTasks().length;
  const done = V.tasks.filter(t => t.status === 'done').length;
  const next = V.tasks.filter(t => t.start > now()).length;
  const auto = V.tasks.filter(t => t.autoStarted).length;
  return [
    { l:'جارية',  v:run,  c:'var(--live)' },
    { l:'قادمة',  v:next, c:'var(--blue)' },
    { l:'منجزة',  v:done - auto, c:'var(--gold)' },
    { l:'بدأها النظام', v:auto, c:'var(--red)' }
  ].filter(d => d.v > 0);
}

/* ---------- مقارنة الفرق ---------- */
function ktTable() {
  const rows = leaders().map(L => {
    const ts = V.tasks.filter(t => t.leaderId === L.id);
    const done = ts.filter(t => t.status === 'done');
    const live = ts.filter(t => now() >= t.start && now() < t.end && t.status !== 'done').length;
    const tk = openTickets().filter(k => k.leaderId === L.id).length;
    const sp = V.support.filter(s => (taskById(s.taskId) || {}).leaderId === L.id).length;
    const auto = ts.filter(t => t.autoStarted).length;
    const rate = done.length ? Number((done.reduce((a, t) => a + (t.rating || 0), 0) / done.length).toFixed(1)) : 0;
    return {
      id: L.id, act: 'ktopen',
      sort: [L.kt, L.pilgrims, live, tk, sp, rate],
      cells: [
        '<span class="fl">' + avatar(L, 'sm') +
          '<span class="nm"><b>' + E(L.kt) + '</b><span>' + E(L.name) + '</span></span></span>',
        '<b class="num">' + AR(L.pilgrims) + '</b>',
        live ? pill(AR(live) + ' جارية', 'live') : '<span class="faint">—</span>',
        tk ? pill(AR(tk), 'wait') : '<span class="faint">—</span>',
        sp ? pill(AR(sp), 'no') : '<span class="faint">—</span>',
        auto ? pill(AR(auto), 'no') : '<span class="faint">—</span>',
        rate ? stars(rate) : '<span class="faint">—</span>'
      ]
    };
  });
  return dataTable({
    key: 'kt', defaultCol: 0,
    cols: [{ t:'الفريق', w:'1.6fr' }, { t:'حجاج', w:'.6fr' }, { t:'الآن', w:'.8fr' },
           { t:'تذاكر', w:'.6fr' }, { t:'دعم', w:'.6fr' }, { t:'بدأها النظام', w:'.9fr' },
           { t:'التقييم', w:'1.2fr' }],
    rows
  });
}

/* ============================================================
   لوحة العمليات — الشاشة التي تُدار منها الغرفة
   ترتيبها يتبع سؤال المشغّل: ماذا يحتاج قراري؟ ثم أين نحن؟
   ثم كيف نسير؟ ثم من يحتاج انتباهي؟
   ============================================================ */

/* عقد الخريطة: مواضع تقريبية للمشاعر ومكة وجدة */
const MAP_NODES = [
  { k:'jeddah',  x:13, y:72, l:'مطار جدة' },
  { k:'makkah',  x:43, y:50, l:'مكة — الحرم' },
  { k:'aziziah', x:53, y:64, l:'العزيزية — السكن' },
  { k:'mina',    x:70, y:42, l:'منى' },
  { k:'muzd',    x:80, y:52, l:'مزدلفة' },
  { k:'arafah',  x:91, y:64, l:'عرفة' }
];
const KIND_NODE = { airport:'jeddah', checkout:'jeddah', checkin:'aziziah',
  umrah:'makkah', wada:'makkah', tour:'makkah', mina:'mina', jamarat:'mina', arafah:'arafah' };
const LEG = [['jeddah','makkah'],['makkah','aziziah'],['aziziah','mina'],['mina','muzd'],['muzd','arafah']];

function mapPath(a, b) {
  const A = MAP_NODES.find(n => n.k === a), B = MAP_NODES.find(n => n.k === b);
  return 'M' + A.x + ' ' + A.y + ' Q' + ((A.x + B.x) / 2) + ' ' + (Math.min(A.y, B.y) - 10) +
    ' ' + B.x + ' ' + B.y;
}

function opsMap() {
  const live = runningTasks();
  const busy = {}, late = {};
  live.forEach(t => {
    const k = KIND_NODE[t.kind] || 'makkah';
    busy[k] = (busy[k] || 0) + 1;
    if (now() > t.end) late[k] = 1;
  });
  /* المسارات القادمة خلال ٦ ساعات تُرسم أخفت — الغرفة ترى ما هو آتٍ */
  const soon = {};
  V.tasks.filter(t => t.start > now() && t.start < now() + 6 * HR).forEach(t => {
    const k = KIND_NODE[t.kind] || 'makkah'; soon[k] = (soon[k] || 0) + 1;
  });
  const hot = LEG.filter(l => busy[l[1]] || busy[l[0]]);
  const warm = LEG.filter(l => !hot.includes(l) && (soon[l[1]] || soon[l[0]]));

  return '<div class="map"><span class="radar"></span>' +
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
      '<g stroke="currentColor" stroke-width=".45" fill="none" style="color:var(--line2)">' +
        LEG.map(l => '<path d="' + mapPath(l[0], l[1]) + '"/>').join('') + '</g>' +
      '<g stroke="currentColor" stroke-width=".8" fill="none" class="dash" style="color:var(--live)">' +
        hot.map(l => '<path d="' + mapPath(l[0], l[1]) + '"/>').join('') + '</g>' +
      '<g stroke="currentColor" stroke-width=".55" fill="none" class="dash slow" ' +
        'style="color:var(--gold2);opacity:.5">' +
        warm.map(l => '<path d="' + mapPath(l[0], l[1]) + '"/>').join('') + '</g>' +
      hot.slice(0, 3).map((l, i) =>
        '<circle class="convoy" r="1.2"><animateMotion dur="' + (7 + i * 2) + 's" ' +
        'repeatCount="indefinite" path="' + mapPath(l[0], l[1]) + '"/></circle>').join('') +
      warm.slice(0, 2).map((l, i) =>
        '<circle class="convoy warm" r="1"><animateMotion dur="' + (13 + i * 3) + 's" ' +
        'repeatCount="indefinite" path="' + mapPath(l[0], l[1]) + '"/></circle>').join('') +
    '</svg>' +
    MAP_NODES.map(n => {
      const cls = late[n.k] ? 'bad' : busy[n.k] ? 'warn' : soon[n.k] ? 'soon' : '';
      return '<span class="node ' + cls + '" style="inset-inline-end:' + n.x + '%;top:' + n.y + '%">' +
        '<span class="pin"></span><span class="lbl">' + E(n.l) +
        (busy[n.k] ? ' · ' + AR(busy[n.k]) : '') + '</span></span>';
    }).join('') +
  '</div>';
}

/* ---------- صفّ الأدوات العلوي ---------- */
function opsBar() {
  const rng = S.tab.rng || 'today';
  return '<div class="opsbar">' +
    '<div class="hello"><b>غرفة العمليات</b>' +
      '<span class="tiny faint">' + dayName(now()) + ' · ' + hijri(now()) + ' — ' +
      AR(leaders().length) + ' فرق · ' + AR(allPilgrims()) + ' حاجًّا تحت الإشراف</span></div>' +
    '<span class="sp"></span>' +
    segmented('rng', [['today','اليوم'],['week','الأسبوع'],['season','الموسم']], rng) +
    '<button class="btn l sm" data-a="go" data-n="timeline">' + icon('i-hist','s16') + 'الخط الزمني</button>' +
    '<button class="btn p sm" data-a="palette">' + icon('i-search','s16') + 'أمر سريع' +
      '<span class="kbd2">Ctrl K</span></button>' +
  '</div>';
}

/* نطاق المدة المختارة */
function rangeTasks() {
  const r = S.tab.rng || 'today';
  if (r === 'season') return V.tasks.slice();
  if (r === 'week') {
    const a = dayStart(now()) - 3 * DAY, b = a + 7 * DAY;
    return V.tasks.filter(t => t.start >= a && t.start < b);
  }
  return todayTasks();
}

function screenOps() {
  const rng = S.tab.rng || 'today';
  const scope = rangeTasks();
  const live = runningTasks();
  const done = scope.filter(t => t.status === 'done');
  const auto = scope.filter(t => t.autoStarted).length;
  const crit = openTickets().filter(k => k.pri === 'حرجة').length;
  const queue = decisionItems();
  const pend = queue.length;
  const rngName = rng === 'today' ? 'اليوم' : rng === 'week' ? 'هذا الأسبوع' : 'الموسم';

  return opsBar() +

    '<div class="grid g4">' +
      stat({ label:'مهام ' + rngName, n:scope.length, delta:scope.length - 8, ic:'i-tasks',
        sub:AR(done.length) + ' منجزة · ' + AR(live.length) + ' جارية',
        series:[6,8,7,11,9,13,10,Math.max(1,scope.length)] }) +
      stat({ label:'قرارات تنتظرك', n:pend, delta:pend ? pend - 1 : 0, ic:'i-send',
        cls:pend ? 'warn' : '', sub:AR(openSupport().length) + ' دعم · ' +

/* ---------- درج الفريق ---------- */
function ktDrawer(id) {
  const L = userById(id); if (!L) return;
  const org = orgById(L.orgId) || {}, team = teamOf(L.id);
  const ts = V.tasks.filter(t => t.leaderId === L.id);
  const done = ts.filter(t => t.status === 'done');
  const live = ts.filter(t => now() >= t.start && now() < t.end && t.status !== 'done');
  const next = ts.filter(t => t.start > now()).sort((a, b) => a.start - b.start).slice(0, 4);
  const tk = openTickets().filter(k => k.leaderId === L.id);
  const rate = done.length ? (done.reduce((a, t) => a + (t.rating || 0), 0) / done.length).toFixed(1) : '—';

  openDrawer(L.kt + ' · ' + L.name, org.ar + ' · ' + org.country, 'i-shield',
    '<div class="grid g2" style="gap:12px">' +
      ['حجاج,' + L.pilgrims, 'محسنون,' + team.length, 'مهام منجزة,' + done.length].map(x => {
        const p = x.split(',');
        return '<div class="card mini"><span class="tiny faint">' + p[0] + '</span>' +
          '<b class="num" data-n="' + p[1] + '">٠</b></div>';
      }).join('') +
      '<div class="card mini"><span class="tiny faint">متوسط التقييم</span>' +
        '<b style="color:var(--gold3)">' + AR(rate) + '</b></div>' +
    '</div>' +

    (live.length ? '<div class="card live">' + head('جارية الآن', live[0].place) +
      '<b>' + E(live[0].title) + '</b>' +
      '<div class="tiny faint" style="margin-top:5px">تنتهي ' + t12(live[0].end) + '</div>' +
      '<div class="meter" style="margin-top:10px"><i data-w="' +
        Math.min(100, Math.round((now() - live[0].start) / (live[0].end - live[0].start) * 100)) +
        '"></i></div></div>' : '') +

    '<div class="card">' + head('المهام القادمة', AR(next.length) + ' مهمة') +
      '<div class="rows">' + (next.length ? next.map(t => {
        const c = CAT[t.kind] || {};
        return '<div class="row" data-a="tlopen" data-id="' + t.id + '">' +
          '<span class="ico" style="color:' + (c.c || 'var(--dim)') + '">' + icon(c.i || 'i-tasks','s16') + '</span>' +
          '<span class="nm"><b>' + E(t.title) + '</b><span>' + hijri(t.start) + ' · ' + t12(t.start) + '</span></span>' +
          pill(untilTxt(t.start), 'wait') + '</div>';
      }).join('') : '<div class="empty" style="padding:20px"><b>لا مهام قادمة</b></div>') + '</div></div>' +

    head('الفريق', AR(team.length) + ' محسن') +
    '<div class="plist">' + team.map(m => {
      const r = muhsenRating(m.id), nt = muhsenNotes(m.id);
      return '<div class="prow">' + avatar(m) +
        '<span class="nm"><b>' + E(m.name) + '</b>' +
          '<span>' + LTR(m.code) + ' · ' + E(m.specialty) + '</span></span>' +
        '<span class="end">' + stars(r) + '</span></div>';
    }).join('') + '</div>' +

    (tk.length ? '<div class="card">' + head('تذاكر مفتوحة', AR(tk.length)) +
      tk.slice(0, 4).map(k => '<div class="evt ' + (k.pri === 'حرجة' ? 'bad' : 'warn') + '">' +
        '<span class="dot"></span><span class="sp"><b>' + E(k.title) + '</b>' +
        '<p>' + E(k.from) + ' · ' + E(k.cat) + '</p></span></div>').join('') + '</div>' : ''));
}

function screenPilgrims() {
  const all = allPilgrimRows();
  const q = qOf('pil');
  let list = all.slice();
  const pk = fOf('pil','kt'), po = fOf('pil','org'), ps = fOf('pil','state'), pf = fOf('pil','flag');
  if (pk) list = list.filter(p => p.kt === pk);
  if (po) { const o = orgById(po) || {}; list = list.filter(p => p.kt === o.kt); }
  if (ps) list = list.filter(p => p.state === ps);
  if (pf) list = list.filter(p => pf === 'y' ? !!p.flag : !p.flag);
  if (q) list = list.filter(p => (p.name + ' ' + p.no + ' ' + p.room + ' ' + p.kt).indexOf(q) >= 0);
  const arrived = all.filter(p => p.state === 'وصل').length;
  const flagged = all.filter(p => p.flag).length;

  return '<div class="grid g4">' +
      stat({ label:'إجمالي الحجاج', n:all.length, ic:'i-users',
        sub:'عبر ' + AR(leaders().length) + ' فرق', series:[380,420,455,490,520,548,562,all.length] }) +
      stat({ label:'وصلوا', n:arrived, ic:'i-checkc', cls:'up',
        sub:AR(Math.round(arrived / all.length * 100)) + '٪ من الكشف',
        series:[40,120,220,310,390,460,510,arrived] }) +
      stat({ label:'لم يصلوا بعد', n:all.filter(p => p.state === 'لم يصل').length, ic:'i-hour',
        cls:'warn', sub:'تُتابَع مع البعثات', series:[520,430,340,250,180,120,80,60] }) +
      stat({ label:'حالات تحتاج رعاية', n:flagged, ic:'i-flag', cls:flagged ? 'bad' : '',
        sub:'صحية أو كرسي متحرّك', series:[3,5,4,7,6,9,8,flagged] }) +
    '</div>' +

    '<div class="card">' +
      head('السجل الأصل', 'منه يقرأ التطبيق أسماء الحجاج وغرفهم — والتعديل هنا يصل الأجهزة',
        pill(AR(list.length) + ' معروض', 'gold')) +
      filterBar('pil', [
        { k:'kt',    label:'الـKT',   opts:optKT() },
        { k:'org',   label:'الجهة',   opts:optOrgs() },
        { k:'state', label:'الحالة',  opts:[['وصل','وصل'],['لم يصل','لم يصل'],['غادر','غادر']] },
        { k:'flag',  label:'رعاية',   opts:[['y','يحتاج رعاية'],['n','بلا']] }
      ], list.length, all.length, 'ابحث باسم أو رقم حاجّ أو رقم غرفة…') +
      (list.length ? dataTable({
        key: 'pil', defaultCol: 1,
        cols: [{ t:'الحاجّ', w:'1.7fr' }, { t:'الفريق', w:'.7fr' }, { t:'البعثة', w:'1.1fr' },
               { t:'السكن', w:'1fr' }, { t:'العمر', w:'.5fr' }, { t:'الحالة', w:'.8fr' }],
        rows: list.slice(0, 40).map(p => ({
          id: p.id, act: 'pilopen',
          sort: [p.name, p.kt + '·' + String(p.room).padStart(4, '0'),
                 p.org, p.room, p.age, p.state],
          cells: [
            '<span class="fl">' + avatar({ g:p.g, av:p.g === 'f' ? 'p5' : 'p2' }, 'sm') +

            '<b>' + E(p.kt) + '</b>',
            '<span class="tiny">' + E(p.org) + '<br><span class="faint">' + E(p.country) + '</span></span>',
            '<span class="tiny">' + E(p.floor) + '<br><b class="num">غرفة ' + AR(p.room) + '</b></span>',

/* ══════════════ ٢) الجودة والتقييم ══════════════ */
function screenQuality() {
  const done = V.tasks.filter(t => t.status === 'done' && t.rating);
  const avg = done.length ? done.reduce((a, t) => a + t.rating, 0) / done.length : 0;
  const board = leaders().map(L => {
    const d = V.tasks.filter(t => t.leaderId === L.id && t.status === 'done' && t.rating);
    return { L, n:d.length, r:ktRating(L.id),
      low:d.filter(t => t.rating < 3.5).length,
      auto:V.tasks.filter(t => t.leaderId === L.id && t.autoStarted).length };
  }).sort((a, b) => b.r - a.r);
  /* توزيع الدرجات على خمس درجات */
  const STARN = { 1:'نجمة', 2:'نجمتان', 3:'٣ نجوم', 4:'٤ نجوم', 5:'٥ نجوم' };
  const dist = [5, 4, 3, 2, 1].map(n => ({
    l: STARN[n],
    v: done.filter(t => Math.round(t.rating) === n).length
  }));
  const worst = done.slice().sort((a, b) => a.rating - b.rating).slice(0, 5);

  return '<div class="grid g4">' +
      stat({ label:'المتوسط التراكمي', n:avg.toFixed(1), ic:'i-star', cls:'up',
        sub:'من ' + AR(done.length) + ' مهمة مقيَّمة', series:[3.6,3.7,3.9,4,4.1,4,4.2,avg] }) +
      stat({ label:'مهام دون ٣٫٥', n:done.filter(t => t.rating < 3.5).length, ic:'i-flag',
        cls:'warn', sub:'تستحق مراجعة سببها', series:[6,5,7,4,6,3,5,4] }) +
      stat({ label:'الفريق الأعلى', n:board[0] ? board[0].r.toFixed(1) : '0.0',
        ic:'i-shield', cls:'up',
        sub:board[0] ? board[0].L.kt + ' · ' + board[0].L.name : '—',
        series:[3.9,4,4.1,4.2,4.3,4.2,4.4,board[0] ? board[0].r : 0] }) +
      stat({ label:'بدأها النظام', n:V.tasks.filter(t => t.autoStarted).length, ic:'i-play',
        cls:'bad', sub:'تُخصم من التزام الفريق', series:[1,2,2,3,4,5,6,7] }) +
    '</div>' +

    '<div class="grid g23">' +
      '<div class="card hov">' +
        head('ترتيب الفرق', 'بالمتوسط التراكمي — والعمود الأخير ما يحتاج مراجعة', '', 'i-star') +
        '<div class="board">' + board.map((b, i) =>
          '<div class="brow" style="animation-delay:' + (i * 70) + 'ms" ' +
            'data-a="ktopen" data-id="' + b.L.id + '">' +
            '<span class="rk' + (i === 0 ? ' top' : '') + '">' + AR(i + 1) + '</span>' +
            avatar(b.L, 'sm') +
            '<span class="nm"><b>' + E(b.L.kt) + '</b><span>' + E(b.L.name) + '</span></span>' +
            '<span class="bar2"><i data-w="' + (b.r / 5 * 100) + '"></i></span>' +
            stars(b.r) +
            (b.low ? pill(AR(b.low) + ' دون ٣٫٥', 'no') : pill('نظيف', 'live')) +
          '</div>').join('') + '</div>' +
      '</div>' +
      '<div class="card hov">' +
        head('توزيع الدرجات', 'أين تتكدّس المهام', '', 'i-pie') +
        chartBars({ data: dist.map(d => ({ l:d.l, v:d.v, hot:false })),
          foot: 'الكتلة في الأربع نجوم — والصعود إلى الخمس هو الهدف.' }) +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      head('أدنى خمس مهام', 'تُراجَع بسببها لا برقمها', '', 'i-flag') +
      '<div class="plist">' + worst.map(t => {
        const L = userById(t.leaderId) || {}, c = CAT[t.kind] || {};
        return '<div class="prow">' +
          '<span class="ico" style="color:' + (c.c || 'var(--dim)') + '">' +
            icon(c.i || 'i-tasks', 's18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(t.title) + '</b>' +
          '<span>' + E(t.kt) + ' · ' + E(L.name || '') + ' · ' + hijri(t.start) + '</span></span>' +
          stars(t.rating) + '</div>';
      }).join('') + '</div>' +
    '</div>';
}

/* ---------- فلاتر: صفّ واحد يخدم كل الشاشات ---------- */
const fOf = (key, k) => ((S.flt && S.flt[key]) || {})[k] || '';
function fltSet(key, k, v) {
  S.flt = S.flt || {}; S.flt[key] = S.flt[key] || {};
  if (v) S.flt[key][k] = v; else delete S.flt[key][k];
}
const fltCount = key => Object.keys((S.flt && S.flt[key]) || {}).length;

/* defs: [{ k, label, opts:[[value,label],…] }] */
function filterBar(key, defs, n, total, ph) {
  const active = fltCount(key) + (qOf(key) ? 1 : 0);
  return '<div class="fbar">' +
    (ph === false ? '' : search(key, ph || 'ابحث…', total)) +
    defs.map(d => '<label class="fsel' + (fOf(key, d.k) ? ' on' : '') + '">' +
      '<span>' + E(d.label) + '</span>' +
      '<select data-f="' + key + '" data-fk="' + d.k + '">' +
        '<option value="">الكل</option>' +
        d.opts.map(o => '<option value="' + E(o[0]) + '"' +
          (fOf(key, d.k) === String(o[0]) ? ' selected' : '') + '>' + E(o[1]) + '</option>').join('') +
      '</select>' + icon('i-fwd', 's14') + '</label>').join('') +
    '<span class="fsp"></span>' +
    (n != null ? '<span class="fcount"><b class="num">' + AR(n) + '</b> من ' + AR(total) + '</span>' : '') +
    (active ? '<button class="btn l sm" data-a="fclear" data-k="' + key + '">' +
      icon('i-x','s14') + 'مسح الفلاتر' + '</button>' : '') +
  '</div>';
}

const optOrgs   = () => V.orgs.map(o => [o.id, o.kt + ' · ' + o.ar]);
const optKT     = () => V.orgs.map(o => [o.kt, o.kt + ' · ' + (o.type || '')]);

const optSpecs  = () => SPECS.map(s => [s, s]);

/* ---------- أدوات الموظف ---------- */
const ROLE_AR = { supervisor:'مشرف', leader:'ليدر', muhsen:'محسن' };
function staffGroup(u) {
  if (u.role === 'leader') return groupsOf(u.id)[0] || null;
  return u.groupId ? groupById(u.groupId) : null;
}
function staffHotel(u) {
  if (u.role === 'supervisor') return hotelById(u.hotelId);
  const g = staffGroup(u);
  return g ? hotelById(g.hotelId) : {};
}
function staffOrg(u) {
  const g = staffGroup(u);
  return g ? orgById(g.orgId) : (u.orgId ? orgById(u.orgId) : null);
}
/* كل ما أُسند إليه من الأنواع الأربعة */
function staffTasks(id) {
  const u = userById(id); if (!u) return [];
  const out = [];
  V.tasks.forEach(t => {
    if (t.leaderId === id || (t.assigned || []).indexOf(id) >= 0)
      out.push({ type:'hajj', at:t.start, title:t.title, sub:t.kt + ' · ' + t.place,
        state:t.status === 'done' ? 'منجزة' : now() >= t.start ? 'جارية' : 'قادمة', id:t.id });
  });
  V.enrich.forEach(x => { if (x.muhsenId === id) {
    const si = siteById(x.siteId);
    out.push({ type:'enrich', at:x.start, title:si.ar, sub:x.ref + ' · ' + si.city,
      state:x.status === 'done' ? 'منتهية' : 'مسكَّنة', id:x.id });
  }});
  V.nusuk.forEach(c => { if (c.assignedTo === id) {
    out.push({ type:'nusuk', at:c.at, title:NUSUK_SVC[c.svc].ar + ' — ' + c.pilgrim,
      sub:c.no + ' · ' + c.kt, state:NUSUK_STATE[c.state].ar, id:c.id });
  }});
  V.subs.forEach(b => { if (b.by === id) {
    const f = formById(b.formId) || {};
    out.push({ type:'comply', at:b.at, title:f.title + ' — ' + b.target,
      sub:'الزيارة ' + AR(b.visit) + ' · ' + AR(b.score) + '٪', state:'مُعبَّأ', id:b.id });
  }});
  V.assigns.forEach(a => { if (a.to === id) {
    out.push({ type:a.type, at:a.at, title:a.title, sub:a.sub, state:a.state, id:a.id });
  }});
  return out.sort((a, b) => b.at - a.at);
}

/* ما يقع عند الاختيار — لكل نوع أثره */
function applyPick(kind, id, u) {
  if (kind === 'enrich') {
    const x = V.enrich.find(e => e.id === id); if (!x) return;
    const g = staffGroup(u), L = g ? userById(g.leaderId) : null;
    x.muhsenId = u.id; x.leaderId = g ? g.leaderId : x.leaderId;
    x.kt = g ? (orgById(g.orgId) || {}).kt : x.kt; x.status = 'assigned';
    logIt('سُكِّنت رحلة ' + x.ref + ' — ' + siteById(x.siteId).ar + ' على ' + u.name +
      (L ? ' · ' + L.kt : ''), 'assign');
    toast('أُسندت إلى ' + u.name);
  } else if (kind === 'nusuk') {
    const c = V.nusuk.find(x => x.id === id); if (!c) return;
    c.assignedTo = u.id;
    c.trail = c.trail || [];
    c.trail.push({ at:now(), by:'الكنترول', text:'أُسندت إلى ' + u.name, file:null });
    logIt('أُسندت ' + c.no + ' (' + NUSUK_SVC[c.svc].ar + ') إلى ' + u.name, 'assign');
    toast('أُسندت إلى ' + u.name);
  } else if (kind === 'comply') {
    const a = S.pendForm; if (!a) return;
    const f = formById(a.formId) || {};
    S.assigns.unshift({ id:uid('A'), type:'comply', to:u.id, at:now(),
      title:f.title + ' — ' + a.target, sub:'نموذج امتثال · ' + a.target, state:'بانتظار التعبئة',
      formId:a.formId, target:a.target });
    logIt('أُسند نموذج «' + f.title + '» على ' + a.target + ' إلى ' + u.name, 'assign');
    toast('أُسند إلى ' + u.name);
    S.pendForm = null;
  } else if (kind === 'ticket') {
    const k = V.tickets.find(x => x.id === id); if (!k) return;
    k.assignedTo = u.id; k.status = 'قيد المعالجة';
    k.thread = k.thread || [];
    k.thread.push({ at:now(), by:'الكنترول', text:'أُسندت إلى ' + u.name });
    logIt('أُسندت تذكرة ' + k.no + ' إلى ' + u.name, 'ticket');
    toast('أُسندت إلى ' + u.name);
  } else if (kind === 'report') {
    const r = V.reports.find(x => x.id === id); if (!r) return;
    r.assignedTo = u.id; r.status = 'قيد المعالجة';
    r.thread = r.thread || [];
    r.thread.push({ at:now(), by:'الكنترول', text:'أُسند إلى ' + u.name });
    logIt('أُسند تقرير ' + r.no + ' إلى ' + u.name, 'assign');
    toast('أُسند إلى ' + u.name);
  } else if (kind === 'sup') {
    /* لكل فندق مشرف واحد: يُزاح السابق، ويُترك فندق المختار الأوّل */
    const h = hotelById(id);
    const prev = S.users.find(x => x.role === 'supervisor' && x.hotelId === id && x.id !== u.id);
    if (prev) prev.hotelId = null;
    const old = u.hotelId;
    u.hotelId = id;
    if (old && old !== id)
      S.groups.forEach(g => { if (g.hotelId === old) g.supervisorId = null; });
    S.groups.forEach(g => { if (g.hotelId === id) g.supervisorId = u.id; });
    logIt('سُكِّن المشرف ' + u.name + ' على ' + h.ar +
      (prev ? ' بدل ' + prev.name : ''), 'assign');
    toast(u.name + ' → ' + h.ar + (prev ? ' — وأُزيح ' + prev.name : ''));
  } else if (kind === 'glead') {
    const g = S.groups.find(x => x.id === id); if (!g) return;
    const org = orgById(g.orgId) || {};
    g.leaderId = u.id;
    g.members.forEach(m => { const mu = userById(m.id);
      if (mu) { mu.leaderId = u.id; mu.kt = org.kt; } });
    logIt('صار ' + u.name + ' ليدر ' + g.no, 'assign');
    toast(g.no + ' → ' + u.name);
  } else if (kind === 'rider') {
    const t = S.trips.find(x => x.id === id); if (!t) return;
    if (t.riders.indexOf(u.id) < 0) t.riders.push(u.id);
    logIt('أُضيف ' + u.name + ' راكبًا في ' + t.no, 'info');
    toast(u.name + ' → ' + t.no);
  } else if (kind === 'mseat') {
    const g = S.groups.find(x => x.id === id); if (!g) return;
    if (g.members.length >= 5) { toast('المجموعة مكتملة', 'r'); return; }
    const org = orgById(g.orgId) || {};
    g.members.push({ id:u.id, spec:u.specialty || SPECS[0] });
    u.groupId = g.id; u.leaderId = g.leaderId; u.kt = org.kt;
    let n = 0;
    S.tasks.forEach(t => { if (t.leaderId === g.leaderId) {
      t.assigned = t.assigned || [];
      if (t.assigned.indexOf(u.id) < 0) { t.assigned.push(u.id); n++; }
    } });
    logIt('دخل ' + u.name + ' مجموعة ' + g.no + ' وسُكِّن على ' + AR(n) + ' مهمة', 'assign');
    toast(u.name + ' → ' + g.no + ' · ' + AR(n) + ' مهمة');
  }
}

/* مرشّحو كل نوع */
function candFor(kind, ref) {
  const all = V.users.filter(u => u.role === 'muhsen');
  if (kind === 'enrich') {
    const x = ref;
    const g = x.leaderId ? groupsOf(x.leaderId)[0] : null;
    const inGrp = g ? g.members.map(m => userById(m.id)).filter(Boolean) : [];
    return inGrp.length ? inGrp : all.filter(u => staffGroup(u));
  }
  if (kind === 'nusuk') {
    const c = ref, team = teamOf(c.leaderId);
    const L = userById(c.leaderId);
    return team.concat(L ? [L] : []).concat(reserveTeam());
  }
  if (kind === 'comply') {
    /* المحسن يُختار حسب الفندق الذي تسكن فيه مجموعته */
    const hid = ref;
    const gs = V.groups.filter(g => g.hotelId === hid);
    const ids = [];
    gs.forEach(g => { ids.push(g.leaderId); g.members.forEach(m => ids.push(m.id)); });
    const sup = supervisors().filter(u => u.hotelId === hid);
    return [...new Set(ids)].map(userById).filter(Boolean).concat(sup);
  }
  if (kind === 'ticket' || kind === 'report') {
    const t = ref, team = teamOf(t.leaderId), L = userById(t.leaderId);
    return team.concat(L ? [L] : []).concat(reserveTeam());
  }
  return all;
}
function pickerBody() {
  const p = S.picker; if (!p) return '';
  const q = (p.q || '').trim();
  let list = p.cands.map(userById).filter(Boolean);
  if (q) list = list.filter(u => (u.name + ' ' + u.code + ' ' + (u.specialty || '')).indexOf(q) >= 0);
  return '<div class="find" style="margin-bottom:14px">' + icon('i-search','s18') +
      '<input id="q-pick" data-q="pick" value="' + E(p.q || '') + '" ' +
      'placeholder="ابحث باسم أو تخصّص…" autocomplete="off">' +
      '<span class="tiny faint">' + AR(list.length) + '</span></div>' +
    (p.note ? '<div class="quote">' + E(p.note) + '</div>' : '') +
    (list.length ? '<div class="plist" style="margin-top:12px">' + list.map(u => {
      const g = staffGroup(u), h = staffHotel(u);
      const load = staffTasks(u.id).length;
      return '<button class="prow pick" data-a="pickdo" data-id="' + u.id + '">' +

          (g ? ' · ' + g.no : '') + (h && h.ar ? ' · ' + h.ar : '') + '</span></span>' +

}

/* ============================================================
   الصلاحيات وأمن مستوى الصفّ (RLS)
   ─────────────────────────────────────────────────────────────
   قاعدتان تحكمان كل شيء:
     ١) لا يرى أحدٌ شاشةً لم تُسنَد لصفته — والافتراض: لا شيء.
     ٢) لا يُعدّل إلا من مُنح التعديل — والافتراض: الإدارة العليا وحدها.
   والنطاق يُطبَّق على الصفوف نفسها لا على الشاشات فقط:
   الشركة ترى محسنيها وحجاجها ومهامها، والمحسن يرى نفسه.
   ============================================================ */

const PERMS = [
  { k:'admin',   ar:'إدارة عليا',      i:'i-shield', scope:'all',   edit:true,
    d:'ترى كل شيء وتعدّل كل شيء — وهي وحدها كذلك' },
  { k:'mission', ar:'بعثة',            i:'i-flag',   scope:'org',   edit:false,
    d:'ترى محسنيها وحجاجها ومهامها — اطّلاع بلا تعديل' },
  { k:'company', ar:'شركة',            i:'i-flag',   scope:'org',   edit:false,
    d:'ترى محسنيها وحجاجها ومهامها — اطّلاع بلا تعديل' },
  { k:'sup',     ar:'مشرف',            i:'i-key',    scope:'hotel', edit:false,
    d:'يرى كل من تحته في الفندق' },
  { k:'leader',  ar:'ليدر',            i:'i-star',   scope:'team',  edit:false,
    d:'يرى فريقه ومهامه' },
  { k:'muh_mk',  ar:'محسن مكة',        i:'i-user',   scope:'self',  edit:false,
    d:'يرى بياناته ومهامه وحدها' },
  { k:'muh_md',  ar:'محسن المدينة',    i:'i-user',   scope:'self',  edit:false,
    d:'يرى بياناته ومهامه وحدها' },
  { k:'mashaer', ar:'مشاعر',           i:'i-tent',   scope:'domain', edit:false, prov:true,
    d:'مهام منى وعرفة والجمرات وحوادث التفويج' },
  { k:'food',    ar:'إعاشة',           i:'i-food',   scope:'domain', edit:false, prov:true,
    d:'تذاكر الإعاشة وحوادثها ونماذج امتثالها' },
  { k:'trans',   ar:'نقل',             i:'i-bus',    scope:'domain', edit:false, prov:true,
    d:'المطار والمغادرة والجولات ورحلات المزارات' },
  { k:'centers', ar:'مراكز',           i:'i-target', scope:'domain', edit:false, prov:true,
    d:'كل الحوادث والتذاكر والتقارير — بلا بيانات أشخاص' },
  { k:'medina',  ar:'مشرفو المدينة',   i:'i-pin',    scope:'domain', edit:false, prov:true,
    d:'المدينة المنوّرة — لا بيانات لها في هذه النسخة' },
  { k:'afasha',  ar:'مقاول عفاشة',     i:'i-truck',  scope:'deal',   edit:false,
    d:'يرى عقده وحده — وصلاحيته الموافقة عليه' }
];
const permOf = k => PERMS.find(p => p.k === k) || PERMS[0];
const SCOPE_AR = { all:'كل النظام', org:'جهته وحدها', hotel:'فندقه ومن فيه',
  team:'فريقه ومهامه', self:'بياناته وحدها', domain:'اختصاصه عبر الجهات',
  deal:'عقده وحده', none:'لم يُحدَّد بعد' };

/* الصفة الفاعلة الآن، ومن تُمثِّله */
const curPerm = () => permOf(S.actor && S.actor.perm);
const canEdit = () => !!curPerm().edit;
/* الشاشات المسموحة لهذه الصفة — والافتراض لا شيء */
function allowed() {
  const p = curPerm();
  if (p.scope === 'all') return navItems().map(x => x.k);
  const g = S.grants && S.grants[p.k];
  return g ? g : (DEFAULT_GRANTS[p.k] || []).slice();
}
/* هل خُصِّصت هذه الصفة أم ما زالت على افتراضها؟ */
const isCustom = k => !!(S.grants && S.grants[k]);
const grantsOf = k => (S.grants && S.grants[k]) || (DEFAULT_GRANTS[k] || []).slice();
const maySee = k => allowed().indexOf(k) >= 0;


/* ============================================================
   الصلاحيات الافتراضية — لكل صفة ما يخدم عملها لا أكثر
   القاعدة في اختيار الشاشات:
     · يرى ما يخصّ عمله.
     · لا يرى أدوات قرار الكنترول (الدعم · الشِفتات · الاحتياط · التشكيل).
     · لا يرى إدارة النظام (الصلاحيات · الإعدادات · السجل · البثّ).
   ============================================================ */
const DEFAULT_GRANTS = {
  admin:   null,                     /* لا تُقيَّد أصلًا */

  /* الجهات: بياناتها التشغيلية كاملة — اطّلاعًا */
  mission: ['ops','tasks','timeline','staff','teams','pilgrims','quality','tickets','reports'],
  company: ['ops','tasks','timeline','staff','teams','pilgrims','quality','tickets','reports'],

  /* المشرف: فندقه ومن فيه — ومعه ما يُرفع عن السكن */
  sup:     ['ops','tasks','timeline','staff','teams','pilgrims','tickets','reports',
            'incidents','quality','guides'],

  /* الليدر: فريقه ومهامه — ولا يرى الاحتياط ولا يختار منه */
  leader:  ['ops','tasks','timeline','staff','teams','pilgrims','tickets','reports',
            'incidents','guides','shifts'],

  /* المحسن: نفسه ومهامه ودليل تنفيذها */
  muh_mk:  ['tasks','staff','guides'],
  muh_md:  ['tasks','staff','guides'],

  /* الخمس المؤجَّلة: نطاقها وظيفي مؤقّت حتى تُوصَف */
  mashaer: ['ops','tasks','timeline','incidents','guides'],
  food:    ['tasks','tickets','incidents','quality','guides'],
  trans:   ['ops','tasks','timeline','tickets','incidents','guides'],
  centers: ['ops','incidents','tickets','reports','timeline'],
  medina:  ['ops','tasks','staff','teams','pilgrims','incidents'],
  /* المقاول: شاشة واحدة — عقده */
  afasha:  ['afasha']
};

/* ============================================================
   النطاق الوظيفي — للصفات التي تقطع الجهات ولا تتبع واحدة
   مؤقّت حتى يصف صاحب النظام حدودها.
   ============================================================ */
const DOMAIN = {
  mashaer: { ar:'المشاعر',  kinds:['mina','arafah','jamarat'], inc:['crowd','sec'],
             tkt:['تنظيم'],  form:['مشاعر','تفويج'], enrich:false },
  food:    { ar:'الإعاشة',  kinds:[],                          inc:['food'],
             tkt:['إعاشة'],  form:['إعاشة'],          enrich:false },
  trans:   { ar:'النقل',    kinds:['airport','checkout','tour'], inc:['trans'],
             tkt:['نقل','تنظيم'], form:['نقل'],       enrich:true },
  centers: { ar:'المراكز',  kinds:[], all:true,                inc:null,
             tkt:null,      form:[],                  enrich:false },
  medina:  { ar:'المدينة',  kinds:[], city:'المدينة المنوّرة', inc:[],
             tkt:[],        form:[],                  enrich:false }
};
const domainOf = k => DOMAIN[k];

/* ============================================================
   بناء الرؤية V — نسخة مُصفّاة من S يقرأ منها كل عرض
   الإدارة العليا تقرأ S نفسه: صفر كلفة وصفر اختلاف.
   ============================================================ */
let V = null;

function buildView() {
  const p = curPerm(), a = S.actor || {};
  if (p.scope === 'all') { V = S; return; }

  /* من يدخل في النطاق: مجموعات وأشخاص وجهات */
  let groups = [], userIds = [], kts = [], orgIds = [];

  if (p.scope === 'org' && a.orgId) {
    const o = orgById(a.orgId) || {};
    orgIds = [a.orgId]; kts = [o.kt];
    groups = S.groups.filter(g => g.orgId === a.orgId);
  } else if (p.scope === 'hotel' && a.hotelId) {
    groups = S.groups.filter(g => g.hotelId === a.hotelId);
    orgIds = [...new Set(groups.map(g => g.orgId))];
    kts = orgIds.map(id => (orgById(id) || {}).kt).filter(Boolean);
  } else if (p.scope === 'team' && a.leaderId) {
    groups = S.groups.filter(g => g.leaderId === a.leaderId);
    orgIds = [...new Set(groups.map(g => g.orgId))];
    kts = orgIds.map(id => (orgById(id) || {}).kt).filter(Boolean);
  } else if (p.scope === 'domain') {
    buildDomainView(p);
    return;
  } else if (p.scope === 'deal') {
    /* المقاول لا يرى إلا نفسه وعقده */
    V = Object.create(S);
    V.contractors = S.contractors.filter(c => c.id === a.contractorId);
    V.deals = S.deals.filter(d => d.contractorId === a.contractorId);
    ['users','groups','orgs','tasks','tickets','reports','support','nusuk','enrich',
     'subs','assigns','swaps','feed','log','buses','trips'].forEach(k => { V[k] = []; });
    V.pilgrims = {};
    return;
  } else if (p.scope === 'self' && a.userId) {
    const u = userById(a.userId);
    const g = u && u.groupId ? groupById(u.groupId) : null;
    groups = g ? [g] : [];
    kts = u ? [u.kt] : [];
  }

  groups.forEach(g => { userIds.push(g.leaderId); g.members.forEach(m => userIds.push(m.id)); });
  if (p.scope === 'hotel' && a.hotelId)
    supervisors().filter(u => u.hotelId === a.hotelId).forEach(u => userIds.push(u.id));
  if (p.scope === 'team' && a.leaderId) userIds.push(a.leaderId);
  if (p.scope === 'self') userIds = a.userId ? [a.userId] : [];
  userIds = [...new Set(userIds.filter(Boolean))];

  const leaderIds = groups.map(g => g.leaderId);
  const has = (arr, v) => arr.indexOf(v) >= 0;
  const mine = u => has(userIds, u.id);
  /* المحسن يرى مهامه هو، ومن فوقه يرى مهام فريقه كلّها */
  const taskMine = t => p.scope === 'self'
    ? (t.assigned || []).indexOf(a.userId) >= 0 || t.leaderId === a.userId
    : has(leaderIds, t.leaderId);

  const pil = {};
  kts.forEach(k => { if (S.pilgrims[k]) pil[k] = S.pilgrims[k]; });

  V = Object.create(S);          /* ما لا يُصفّى يُقرأ من الأصل */
  V.users    = S.users.filter(mine);
  V.groups   = groups;
  V.orgs     = orgIds.length ? S.orgs.filter(o => has(orgIds, o.id)) : [];
  V.tasks    = S.tasks.filter(taskMine);
  V.pilgrims = p.scope === 'self' ? {} : pil;
  V.tickets  = S.tickets.filter(k => has(kts, k.kt));
  V.reports  = S.reports.filter(r => has(kts, r.kt));
  V.support  = S.support.filter(s => has(leaderIds, (taskById(s.taskId) || {}).leaderId));
  V.nusuk    = S.nusuk.filter(c => p.scope === 'self'
    ? c.assignedTo === a.userId : has(kts, c.kt));
  V.enrich   = S.enrich.filter(x => p.scope === 'self'
    ? x.muhsenId === a.userId : has(kts, x.kt));
  V.subs     = S.subs.filter(b => has(userIds, b.by));
  V.assigns  = S.assigns.filter(x => has(userIds, x.to));
  V.swaps    = S.swaps.filter(w => has(userIds, w.from) || has(userIds, w.to));
  V.feed     = S.feed.filter(f => !f.kt || has(kts, f.kt));
  V.log      = p.scope === 'self' ? [] : S.log;
  V.forms    = S.forms;
  V.guides   = S.guides;
  V.casts    = S.casts;
  /* العفاشة والنقل: الكنترول وحده يديرهما، وغيره يرى رحلاته */
  V.contractors = p.scope === 'all' ? S.contractors : [];
  V.deals    = p.scope === 'all' ? S.deals : [];
  V.buses    = S.buses;
  V.trips    = p.scope === 'self'
    ? S.trips.filter(t => t.riders.indexOf(a.userId) >= 0)
    : S.trips.filter(t => !t.taskId || V.tasks.some(x => x.id === t.taskId));
}

/* رؤية الاختصاص: تقطع الجهات ولا تتبع واحدة —
   ترى نوع العمل الذي تختصّ به، بلا بيانات أشخاص. */
function buildDomainView(p) {
  const d = domainOf(p.k) || {};
  const inArr = (arr, v) => !arr || arr.indexOf(v) >= 0;
  V = Object.create(S);
  V.tasks    = d.all ? S.tasks : S.tasks.filter(t => (d.kinds || []).indexOf(t.kind) >= 0);
  V.enrich   = d.enrich ? S.enrich : [];
  V.incidents = null;
  V.feed     = d.inc === null ? S.feed : S.feed.filter(f => (d.inc || []).indexOf(f.cat) >= 0);
  V.tickets  = d.tkt === null ? S.tickets : S.tickets.filter(k => (d.tkt || []).indexOf(k.cat) >= 0);
  V.reports  = d.all ? S.reports : [];
  V.forms    = S.forms.filter(f => (d.form || []).indexOf(f.scope) >= 0);
  V.subs     = S.subs.filter(b => V.forms.some(f => f.id === b.formId));
  V.nusuk    = [];
  /* لا بيانات أشخاص لهذه الصفات */
  V.users    = [];
  V.groups   = [];
  V.orgs     = [];
  V.pilgrims = {};
  V.support  = [];
  V.swaps    = [];
  V.assigns  = [];
  V.log      = [];
  V.contractors = [];
  V.deals = [];
  V.buses = d.enrich || d.all ? S.buses : [];
  V.trips = d.enrich || d.all ? S.trips : [];
}

/* ---------- المرفقات: يُلتقط الملف الحقيقي ويُحفظ وصفه ---------- */
function fileChip(f) {
  if (!f) return '';
  const kb = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + ' م.ب'
    : Math.max(1, Math.round(f.size / 1024)) + ' ك.ب';
  return '<span class="fchip">' + icon(/image/.test(f.type || '') ? 'i-photo' : 'i-doc', 's14') +
    '<b>' + E(f.name) + '</b><span>' + E(kb) + '</span></span>';
}
function filePick(key) {
  const f = (S.files || {})[key];
  return '<label class="fpick">' + icon('i-clip','s16') +
    '<span>' + (f ? 'تغيير المرفق' : 'إرفاق ملف') + '</span>' +
    '<input type="file" data-file="' + key + '" hidden></label>' +
    (f ? fileChip(f) : '');
}

/* ══════════════ الامتثال: باني القالب ══════════════ */
function formBuilder(id) {
  S.fb = S.fb || (id ? Object.assign({ editing:id }, JSON.parse(JSON.stringify(formById(id))))
    : { title:'', scope:'فندق', icon:'i-clip', color:'#0B7A4B', qs:[],
        intro:'', pledge:'', editing:null });
  const b = S.fb;
  const qt = fOf('fb','qt') || 'yn';
  const scored = b.qs.filter(q => q.w && QT_NOSCORE.indexOf(q.t) < 0).length;

  S.drawer = { title:b.editing ? 'تعديل قالب' : 'قالب امتثال جديد',
    sub:'يُبنى مرّة، ويُسنَد مرارًا، ولكل إجابة نوعها ووزنها', icon:'i-clip', body:
    '<div class="card">' + head('١ · هوية القالب', 'اسمه ونطاقه ومقدّمته') +
      '<label class="fl2" style="margin-top:0">العنوان</label>' +
      '<input class="fld" id="q-fbt" data-q="fbt" value="' + E(b.title) + '" ' +
        'placeholder="مثال: التزام الفندق بالعقد">' +
      '<label class="fl2">النطاق</label>' +
      '<div class="chips">' + ['فندق','نقل','إعاشة','تفويج','مشاعر'].map(s2 =>
        '<button class="chip2' + (b.scope === s2 ? ' on' : '') + '" data-a="fbscope" data-v="' + s2 + '">' +
        E(s2) + '</button>').join('') + '</div>' +
      '<label class="fl2">مقدّمة تُقرأ قبل التعبئة <span class="faint">(اختيارية)</span></label>' +
      '<textarea class="fld" id="q-fbi" data-q="fbi" rows="2" ' +
        'placeholder="ما الذي يُراجعه المحسن؟ ومتى؟">' + E(b.intro || '') + '</textarea>' +
    '</div>' +

    '<div class="card">' + head('٢ · الأسئلة',
        AR(b.qs.length) + ' سؤالًا · ' + AR(scored) + ' منها يُحتسب في الدرجة') +
      (b.qs.length ? '<div class="plist">' + b.qs.map((q, i) =>
        '<div class="prow" style="flex-wrap:wrap">' +
          '<span class="sn">' + AR(i + 1) + '</span>' +
          '<span class="ico sm" style="color:var(--gold2)">' + icon(QT_IC[q.t] || 'i-list','s14') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(q.q) + '</b>' +
          '<span>' + E(QT[q.t]) +
            (QT_NOSCORE.indexOf(q.t) < 0 && q.w ? ' · وزن ' + AR(q.w) : ' · توثيق') +
            (q.req ? ' · إلزامي' : '') + '</span></span>' +
          '<span class="fl" style="gap:5px">' +
            (i > 0 ? '<button class="xbtn" data-a="fbup" data-v="' + i + '" title="أعلى">' +
              icon('i-back','s14') + '</button>' : '') +
            '<button class="xbtn" data-a="fbdel" data-v="' + i + '">' + icon('i-x','s14') + '</button>' +
          '</span></div>').join('') + '</div>'
        : '<div class="tiny faint">لا سؤال بعد — أضف أوّل سؤال من الأسفل.</div>') +

      '<div class="qadd">' +
        '<input class="fld" id="q-fbq" data-q="fbq" value="' + E(qOf('fbq')) + '" ' +
          'placeholder="نصّ السؤال…">' +
        '<div class="fl" style="gap:9px;margin-top:10px;flex-wrap:wrap">' +
          '<label class="fsel on"><span>الإجابة</span>' +
            '<select data-f="fb" data-fk="qt">' + Object.keys(QT).map(k2 =>
              '<option value="' + k2 + '"' + (qt === k2 ? ' selected' : '') + '>' +
              E(QT[k2]) + '</option>').join('') + '</select>' + icon('i-fwd','s14') + '</label>' +
          (QT_NOSCORE.indexOf(qt) < 0
            ? '<label class="fsel"><span>الوزن</span>' +
              '<select data-f="fb" data-fk="qw">' + [1,2,3].map(w =>
                '<option value="' + w + '"' + (String(fOf('fb','qw') || 2) === String(w) ? ' selected' : '') +
                '>' + AR(w) + '</option>').join('') + '</select>' + icon('i-fwd','s14') + '</label>'
            : '<span class="mchip">' + icon('i-info','s14') + 'توثيق — لا يُحتسب</span>') +
          '<label class="fsel' + (fOf('fb','qr') ? ' on' : '') + '"><span>إلزامي</span>' +
            '<select data-f="fb" data-fk="qr">' +
              '<option value=""' + (fOf('fb','qr') ? '' : ' selected') + '>لا</option>' +
              '<option value="1"' + (fOf('fb','qr') ? ' selected' : '') + '>نعم</option>' +
            '</select>' + icon('i-fwd','s14') + '</label>' +
          '<button class="btn l sm" data-a="fbadd">' + icon('i-plus','s14') + 'أضف سؤالًا</button>' +
        '</div></div>' +
    '</div>' +

    '<div class="card">' + head('٣ · التعهّد', 'يُوقّعه المحسن قبل الإرسال — اتركه فارغًا لتخطّيه') +
      '<textarea class="fld" id="q-fbp" data-q="fbp" rows="3" ' +
        'placeholder="أتعهّد بأن ما أثبتُّه أعلاه مطابق لما عاينتُه بنفسي في الموقع.">' +
        E(b.pledge || '') + '</textarea>' +
    '</div>' +

    '<div class="card gold">' + head('٤ · المعاينة', 'هكذا يراه المحسن في التطبيق', '', 'i-eye') +
      formPreview(b) +
    '</div>' +

    '<button class="btn p" style="width:100%" data-a="fbsave">' + icon('i-checkc','s16') +
      (b.editing ? 'حفظ التعديل' : 'حفظ القالب') + '</button>'
  };
  renderDrawer();
}

/* معاينة النموذج كما يُعبَّأ في الميدان — لا وصف له بل هو نفسه */
function formPreview(f) {
  if (!f.title && !f.qs.length) return empty('لا شيء بعد', 'اكتب عنوانًا وأضف سؤالًا', 'i-clip');
  return '<div class="fprev">' +
    '<div class="fpt"><b>' + E(f.title || 'بلا عنوان') + '</b>' +
      '<span>' + E(f.scope) + ' · ' + AR(f.qs.length) + ' أسئلة</span></div>' +
    (f.intro ? '<div class="quote">' + E(f.intro) + '</div>' : '') +
    f.qs.map((q, i) => '<div class="fq">' +
      '<b>' + AR(i + 1) + ' · ' + E(q.q) + (q.req ? ' <i class="req">*</i>' : '') + '</b>' +
      (q.t === 'yn' ? '<div class="chips"><span class="chip2">نعم</span>' +
          '<span class="chip2">لا</span></div>'
        : q.t === 'rate' ? '<div class="stars">' + [1,2,3,4,5].map(() =>
            icon('i-star','s18 off')).join('') + '</div>'
        : q.t === 'num' ? '<div class="fbox num">٠٠</div>'
        : q.t === 'photo' ? '<div class="fbox photo">' + icon('i-photo','s18') +
            'يلتقط صورة أو يرفعها</div>'
        : q.t === 'sign' ? '<div class="fbox sign">' + icon('i-shield','s18') +
            'أتعهّد بصحّة ما أثبتُّه</div>'
        : '<div class="fbox">يكتب إجابته…</div>') +
    '</div>').join('') +
    (f.pledge ? '<div class="pledge">' + icon('i-shield','s16') +
      '<span>' + E(f.pledge) + '</span></div>' : '') +
  '</div>';
}

/* إسناد نموذج: يُختار الفندق أوّلًا، ثم المحسن من ساكنيه */
function formAssign(id) {
  const f = formById(id); if (!f) return;
  S.pendForm = { formId:id, target:null };
  S.drawer = { title:'إسناد «' + f.title + '»', sub:'اختر الجهة، ثم من ينفّذها من ساكنيها',
    icon:f.icon, body:
    '<div class="card">' + head('الجهة', 'المحسن يُختار من مجموعة تسكن فيها') +
      '<div class="plist">' + HOTELS.map(h => {
        const gs = V.groups.filter(g => g.hotelId === h.id);
        const n = gs.reduce((a, g) => a + g.members.length + 1, 0);
        return '<button class="prow pick" data-a="fatarget" data-id="' + h.id + '"' +
          (n ? '' : ' disabled') + '>' +
          '<span class="ico">' + icon('i-key','s16') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(h.ar) + '</b>' +
          '<span>' + E(h.city) + ' · ' + AR(h.rooms) + ' غرفة</span></span>' +
          pill(AR(gs.length) + ' مجموعة', gs.length ? 'live' : 'grey') +
          pill(AR(n) + ' موظفًا', n ? 'gold' : 'grey') + '</button>';
      }).join('') + '</div></div>'
  };
  renderDrawer();
}

/* ══════════════ التذاكر والتقارير: إجراء حقيقي ══════════════ */
function ticketDrawer(id) {
  const k = V.tickets.find(x => x.id === id); if (!k) return;
  const to = k.assignedTo ? userById(k.assignedTo) : null;
  const closed = k.status === 'مغلقة';
  S.drawer = { title:k.title, sub:k.no + ' · ' + k.from + ' · ' + k.kt, icon:'i-ticket', body:
    '<div class="fl" style="gap:9px;flex-wrap:wrap">' +
      pill(k.cat, 'grey') +
      pill(k.pri, k.pri === 'حرجة' ? 'no' : k.pri === 'عاجلة' ? 'wait' : 'grey') +
      pill(k.status, closed ? 'live' : 'wait') +
      '<span class="sp"></span><span class="tiny faint">' + ago(k.at) + '</span></div>' +
    '<div class="quote">' + E(k.body) + '</div>' +

    '<div class="card">' + head('التصنيف والأولوية', 'يُغيَّران من هنا') +
      '<label class="fl2">التصنيف</label>' +
      '<div class="chips">' + [...new Set(V.tickets.map(x => x.cat))].map(c =>
        '<button class="chip2' + (k.cat === c ? ' on' : '') + '" data-a="tkcat" data-id="' + k.id +
        '" data-v="' + E(c) + '">' + E(c) + '</button>').join('') + '</div>' +
      '<label class="fl2">الأولوية</label>' +
      '<div class="chips">' + ['حرجة','عاجلة','عادية'].map(p =>
        '<button class="chip2' + (k.pri === p ? ' on' : '') + '" data-a="tkpri" data-id="' + k.id +
        '" data-v="' + E(p) + '">' + E(p) + '</button>').join('') + '</div>' +
    '</div>' +

    '<div class="card">' + head('المُسنَد إليه', to ? '' : 'لم تُسنَد بعد') +
      (to ? '<div class="prow">' + avatar(to, 'sm') +
          '<span class="nm" style="flex:1"><b>' + E(to.name) + '</b>' +
          '<span>' + LTR(to.code) + ' · ' + E(ROLE_AR[to.role] || '') + '</span></span>' +
          '<button class="btn l sm" data-a="tkassign" data-id="' + k.id + '">تغيير</button></div>'
        : '<button class="btn p" style="width:100%" data-a="tkassign" data-id="' + k.id + '">' +
          icon('i-users','s16') + 'إسناد لمحسن أو ليدر</button>') +
    '</div>' +

    '<div class="card gold">' + head('الردّ', 'يصل صاحب التذكرة في التطبيق') +
      '<textarea class="fld" id="q-tkreply" data-q="tkreply" rows="3" ' +
        'placeholder="اكتب ردًّا واضحًا يُغني عن سؤال آخر…">' + E(qOf('tkreply')) + '</textarea>' +
      '<div style="margin-top:11px">' + filePick('tkReply') + '</div>' +
      '<div class="fl" style="gap:10px;margin-top:13px">' +
        '<button class="btn p" style="flex:1" data-a="tkreply" data-id="' + k.id + '">' +
          icon('i-send','s16') + 'إرسال الردّ</button>' +
        (closed ? '<button class="btn l" data-a="tkopen" data-id="' + k.id + '">إعادة فتح</button>'
          : '<button class="btn l" data-a="tkclose" data-id="' + k.id + '">' +
            icon('i-checkc','s16') + 'إغلاق</button>') +
      '</div></div>' +

    '<div class="card">' + head('المحادثة', AR((k.thread || []).length) + ' رسالة') +
      ((k.thread || []).length ? '<div class="tline">' + k.thread.slice().reverse().map(t =>
        '<div class="tev"><span class="tdot gold">' + icon('i-send','s14') + '</span>' +
        '<div class="tbody"><b style="font-size:12.5px">' + E(t.text) + '</b>' +
        (t.file ? '<div style="margin-top:7px">' + fileChip(t.file) + '</div>' : '') +
        '<span class="tiny faint">' + E(t.by) + ' · ' + t12(t.at) + ' · ' + ago(t.at) + '</span>' +
        '</div></div>').join('') + '</div>'
        : empty('لا ردّ بعد', 'أوّل ردّ يبدأ المحادثة', 'i-send')) +
    '</div>'
  };
  renderDrawer();
}

/* ============================================================
   البوّابة — يُدخَل بصفة، ويُمثَّل بها شخصٌ بعينه
   ============================================================ */
function renderGate() {
  const w = document.getElementById('gatewrap');
  if (!w) return;
  if (S.auth) { w.innerHTML = ''; return; }
  const a = S.gate = S.gate || { perm:'admin', orgId:null, hotelId:null, leaderId:null, userId:null };
  const p = permOf(a.perm);
  const gr = p.scope === 'all' ? navItems().length : ((S.grants || {})[p.k] || []).length;

  /* من تُمثِّل؟ يُسأل عنه حسب النطاق */
  let who = '', ready = true;
  if (p.scope === 'org') {
    ready = !!a.orgId;
    who = pickRow('الجهة', S.orgs.filter(o => p.k === 'mission' ? o.type === 'بعثة' : o.type === 'شركة')
      .map(o => [o.id, o.kt + ' · ' + o.ar]), a.orgId, 'gorg');
  } else if (p.scope === 'hotel') {
    ready = !!a.hotelId;
    who = pickRow('الفندق', HOTELS.map(h => [h.id, h.ar]), a.hotelId, 'ghotel');
  } else if (p.scope === 'team') {
    ready = !!a.leaderId;
    who = pickRow('الليدر', leaders().map(l => [l.id, l.kt + ' · ' + l.name]), a.leaderId, 'glead');
  } else if (p.scope === 'deal') {
    ready = !!a.contractorId;
    who = pickRow('المقاول', S.contractors.map(c => [c.id, c.name + ' · ' + c.company]),
      a.contractorId, 'gct');
  } else if (p.scope === 'self') {
    ready = !!a.userId;
    who = pickRow('المحسن', S.users.filter(u => u.role === 'muhsen' && !u.reserve)
      .slice(0, 60).map(u => [u.id, u.name + ' · ' + u.code]), a.userId, 'guser');
  }

  w.innerHTML =
    '<div id="gate">' +
      '<div class="bg"><span class="grid"></span><span class="sweep"></span></div>' +
      '<button class="themebtn gtheme" data-a="theme">' +
        '<span>' + (S.theme === 'day' ? 'الوضع النهاري' : 'الوضع الليلي') + '</span>' +
        '<span class="knob">' + icon(S.theme === 'day' ? 'i-sun' : 'i-hour', 's14') + '</span></button>' +
      '<div class="gwrap wide">' +
        '<div class="gbrand">' +
          '<span class="gmark"><i style="background-image:url(' + (IMG.logo_white || '') + ')"></i></span>' +
          '<span><h1>مُحسن · الكنترول</h1>' +
          '<div class="gsub">غرفة عمليات موسم الحجّ ١٤٤٨ هـ</div></span>' +
        '</div>' +
        '<div class="gcard">' +
          '<label class="fl2" style="margin-top:0">ادخل بصفتك</label>' +
          '<div class="roles">' + PERMS.map(x => {
            const n = x.scope === 'all' ? navItems().length : ((S.grants || {})[x.k] || []).length;
            return '<button class="role' + (x.k === a.perm ? ' on' : '') + '" ' +
              'data-a="grole" data-v="' + x.k + '">' +
              '<span class="fl" style="gap:8px;width:100%">' + icon(x.i, 's18') +
                '<b style="flex:1">' + E(x.ar) + '</b>' +
                (x.edit ? pill('تعديل','gold') : (n ? pill(AR(n),'live') : pill('بلا','no'))) +
              '</span>' +
              '<span>' + E(SCOPE_AR[x.scope]) + '</span></button>';
          }).join('') + '</div>' +

          (who ? '<div class="whobox">' + who + '</div>' : '') +

          '<div class="gnote">' + icon(gr ? 'i-checkc' : 'i-warn','s16') +
            '<span>' + (p.scope === 'all'
              ? 'الإدارة العليا ترى كل شيء وتعدّل كل شيء.'
              : gr ? 'لهذه الصفة ' + AR(gr) + ' شاشة، ونطاقها: ' + SCOPE_AR[p.scope] + '. اطّلاع بلا تعديل.'
                   : 'لم تُسنَد لهذه الصفة أي شاشة — ستدخل ولا ترى شيئًا. هذا هو السلوك المقصود.') +
            '</span></div>' +

          '<button class="btn p" style="width:100%;margin-top:16px"' +
            (ready ? '' : ' disabled') + ' data-a="gin">' +
            icon('i-logout','s16') + 'دخول' + (ready ? '' : ' — اختر من تُمثِّل') + '</button>' +
        '</div>' +
        '<div class="gfoot">' + icon('i-shield','s14') + 'نظام مُحسن · نُزلي · ' + APP_VER + '</div>' +
      '</div>' +
    '</div>';
}

function pickRow(label, opts, cur, act) {
  return '<label class="fl2">' + E(label) + '</label>' +
    '<label class="fsel wide' + (cur ? ' on' : '') + '"><span>' + E(label) + '</span>' +
      '<select data-g="' + act + '">' +
        '<option value="">— اختر —</option>' +
        opts.map(o => '<option value="' + E(o[0]) + '"' +
          (cur === o[0] ? ' selected' : '') + '>' + E(o[1]) + '</option>').join('') +
      '</select>' + icon('i-fwd','s14') + '</label>';
}

/* ============================================================
   المهام بأنواعها الأربعة
   حجّ · إثراء التجربة · نُسك · امتثال
   ============================================================ */

function typeSwitch() {
  const cur = S.tab.tt || 'hajj';
  const n = {
    hajj: V.tasks.length,
    enrich: V.enrich.length,
    nusuk: openNusuk().length,
    comply: V.forms.length
  };
  return '<div class="tswitch">' + Object.keys(TASKTYPE).map(k => {
    const T = TASKTYPE[k];
    return '<button class="tcard' + (k === cur ? ' on' : '') + '" data-a="seg" data-k="tt" data-v="' + k + '">' +
      '<span class="tico" style="color:' + T.c + '">' + icon(T.i, 's18') + '</span>' +
      '<span class="nm"><b>' + E(T.ar) + '</b><span>' + E(T.d) + '</span></span>' +
      '<b class="tn num">' + AR(n[k]) + '</b></button>';
  }).join('') + '</div>';
}

function screenTasks() {
  const t = S.tab.tt || 'hajj';
  /* النوع يُختار من القائمة الجانبية — فلا يُكرَّر هنا */
  return (t === 'enrich' ? tabEnrich() : t === 'nusuk' ? tabNusuk()
      : t === 'comply' ? tabComply() : tabHajj());
}

/* ══════════════ ١) مهام الحجّ ══════════════ */
function taskRow(t) {
  const c = CAT[t.kind] || {}, L = userById(t.leaderId) || {};
  const running = now() >= t.start && now() < t.end && t.status !== 'done';
  return '<div class="prow trow" data-a="tlopen" data-id="' + t.id + '">' +
    '<span class="krail" style="background:' + (c.c || 'var(--dim)') + '"></span>' +
    '<span class="ico" style="color:' + (c.c || 'var(--dim)') + '">' +
      icon(c.i || 'i-tasks', 's18') + '</span>' +
    '<span class="nm" style="flex:1"><b>' + E(t.title) + '</b>' +
      '<span>' + E(t.kt) + ' · ' + E(L.name || '') + ' · ' + E(t.place) + '</span></span>' +
    '<span class="when"><b>' + hijri(t.start) + '</b>' +
      '<span class="num">' + t12(t.start) + ' — ' + t12(t.end) + '</span></span>' +
    '<span class="fl" style="gap:9px">' +
      avatar(L, 'sm') + pill(AR(t.assigned.length) + ' محسن', 'grey') + '</span>' +
    '<span class="end">' +
      (t.status === 'done' ? stars(t.rating || 0)
        : running ? pill('جارية الآن', 'live') : pill(untilTxt(t.start), 'wait')) +
      (t.autoStarted ? '<div style="margin-top:6px">' + pill('بدأها النظام', 'no') + '</div>' : '') +
    '</span></div>';
}

function tabHajj() {
  const f = S.tab.tf || 'today';
  const all = V.tasks.slice().sort((a, b) => a.start - b.start);
  const list = f === 'today' ? all.filter(t => dayStart(t.start) === dayStart(now()))
    : f === 'live' ? all.filter(t => now() >= t.start && now() < t.end && t.status !== 'done')
    : f === 'next' ? all.filter(t => t.start > now())
    : f === 'done' ? all.filter(t => t.status === 'done') : all;
  const rated = all.filter(t => t.rating);
  const avg = rated.length ? (rated.reduce((a, t) => a + t.rating, 0) / rated.length).toFixed(1) : '0.0';
  return '<div class="grid g4">' +
      stat({ label:'مهام الموسم', n:all.length, ic:'i-tasks',
        sub:'تُسكَّن تلقائيًّا على المجموعات', series:[12,24,36,44,50,55,58,all.length] }) +
      stat({ label:'اليوم', n:todayTasks().length, ic:'i-cal', sub:dayName(now()),
        series:[6,8,7,11,9,13,10,Math.max(1, todayTasks().length)] }) +
      stat({ label:'جارية', n:runningTasks().length, ic:'i-play',
        cls:runningTasks().length ? 'up' : '', sub:'الآن',
        series:[0,1,2,1,3,2,1,Math.max(1, runningTasks().length)] }) +
      stat({ label:'منجزة', n:all.filter(t => t.status === 'done').length, ic:'i-checkc',
        cls:'up', sub:'بمتوسط تقييم ' + AR(avg), series:[4,9,14,19,23,26,28,30] }) +
    '</div>' +
    '<div class="card">' +
      head('جدول مهام الحجّ', 'المصدر الذي يقرأ منه التطبيق',
        pill(AR(list.length) + ' معروضة', 'gold'), 'i-kaaba') +
      '<div class="tools">' + segmented('tf',
        [['today','اليوم'],['live','جارية'],['next','قادمة'],['done','منجزة'],['all','الكل']], f) +
      '</div>' +
      (list.length ? '<div class="plist">' + list.map(taskRow).join('') + '</div>'
        : empty('لا مهام في هذا التصنيف', 'جرّب تصنيفًا آخر', 'i-cal')) +
    '</div>';
}

/* ══════════════ ٢) إثراء التجربة ══════════════ */
function tabEnrich() {
  const f = S.tab.ef || 'open';
  const q = qOf('enr');
  let list = V.enrich.slice().sort((a, b) => a.start - b.start);
  if (f === 'open') list = list.filter(x => x.status === 'unassigned');
  else if (f === 'assigned') list = list.filter(x => x.status === 'assigned');
  else if (f === 'done') list = list.filter(x => x.status === 'done');
  if (q) list = list.filter(x => (siteById(x.siteId).ar + ' ' + x.ref).indexOf(q) >= 0);
  const fc = fOf('enr','city'), fk = fOf('enr','kt'), ft = fOf('enr','type');
  if (fc) list = list.filter(x => siteById(x.siteId).city === fc);
  if (fk) list = list.filter(x => x.kt === fk);
  if (ft) list = list.filter(x => { const o = x.kt ? V.orgs.find(z => z.kt === x.kt) : null;
    return o && o.type === ft; });
  const byCity = {};
  V.enrich.forEach(x => { const c = siteById(x.siteId).city; byCity[c] = (byCity[c] || 0) + 1; });
  const seats = V.enrich.reduce((a, x) => a + x.seats, 0);
  const booked = V.enrich.reduce((a, x) => a + x.booked, 0);

  return '<div class="grid g4">' +
      stat({ label:'رحلات واردة', n:V.enrich.length, ic:'i-bus',
        sub:'من نظام المزارات', series:[4,7,9,11,13,14,15,V.enrich.length] }) +
      stat({ label:'بلا تسكين', n:freeEnrich().length, ic:'i-flag',
        cls:freeEnrich().length ? 'warn' : 'up', sub:'تنتظر مجموعة',
        series:[1,2,2,3,3,4,3,Math.max(1, freeEnrich().length)] }) +
      stat({ label:'إشغال المقاعد', n:Math.round(booked / Math.max(1, seats) * 100), suffix:'٪',
        ic:'i-users', cls:'up', sub:AR(booked) + ' من ' + AR(seats) + ' مقعدًا',
        series:[52,58,61,66,70,73,76,Math.round(booked / Math.max(1, seats) * 100)] }) +
      stat({ label:'مدن المزارات', n:Object.keys(byCity).length, ic:'i-pin',
        sub:Object.keys(byCity).join(' · '), series:[1,2,2,3,3,4,4,Object.keys(byCity).length] }) +
    '</div>' +

    '<div class="card gold">' +
      head('واردة من نظام المزارات', 'لا تُنشأ هنا — تصل جاهزة وتُسكَّن على المجموعات',
        '<span class="fl" style="gap:10px">' +
        '<span class="synced">' + icon('i-reset','s14') + 'آخر مزامنة ' + ago(S.enrichSync) + '</span>' +
        '<button class="btn l sm" data-a="xsync">' + icon('i-reset','s16') + 'مزامنة الآن</button></span>',
        'i-bus') +
      '<div class="tools">' + segmented('ef',
        [['open','بلا تسكين'],['assigned','مسكَّنة'],['done','منتهية'],['all','الكل']], f) + '</div>' +
      filterBar('enr', [
        { k:'city', label:'المدينة', opts:optCities() },
        { k:'kt',   label:'الـKT',   opts:optKT() },
        { k:'type', label:'النوع',   opts:optTypes() }
      ], list.length, V.enrich.length, 'ابحث بمزار أو رقم رحلة…') +
      (list.length ? '<div class="plist">' + list.map((x, i) => {
        const si = siteById(x.siteId);
        const M = x.muhsenId ? userById(x.muhsenId) : null;
        const full = Math.round(x.booked / x.seats * 100);
        return '<div class="prow" style="flex-wrap:wrap;animation-delay:' + (i * 45) + 'ms">' +
          '<span class="krail" style="background:#1B6E9C"></span>' +
          '<span class="ico" style="color:#1B6E9C">' + icon('i-pin','s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(si.ar) + '</b>' +
          '<span>' + LTR(x.ref) + ' · ' + E(si.city) + ' · ' + AR(si.dur) + ' ساعات</span></span>' +
          '<span class="when"><b>' + hijri(x.start) + '</b>' +
            '<span class="num">' + t12(x.start) + ' — ' + t12(x.end) + '</span></span>' +
          '<span class="end">' + (M ? '<span class="fl" style="gap:8px">' + avatar(M, 'sm') +
              '<span class="tiny"><b>' + E(M.name) + '</b><br><span class="faint">' +
              E(x.kt || '') + '</span></span></span>' : pill('بلا تسكين', 'no')) + '</span>' +
          '<div style="width:100%;margin-top:10px">' +
            '<div class="fl" style="gap:11px">' +
              '<span class="meter" style="flex:1"><i data-w="' + full + '"></i></span>' +
              '<span class="tiny faint num">' + AR(x.booked) + '/' + AR(x.seats) + ' مقعدًا</span>' +
              (x.status === 'done' ? pill('انتهت', 'grey')
                : '<button class="btn ' + (M ? 'l' : 'p') + ' sm" data-a="xassign" data-id="' +
                  x.id + '">' + (M ? 'تغيير المحسن' : 'إسناد لمحسن') + '</button>') +
            '</div></div></div>';
      }).join('') + '</div>' : empty('لا رحلات في هذا التصنيف', '', 'i-bus')) +
    '</div>';
}

/* ══════════════ ٣) نُسك ══════════════ */
function tabNusuk() {
  const f = S.tab.nf || 'open';
  const q = qOf('nsk');
  let list = V.nusuk.slice().sort((a, b) => b.at - a.at);
  if (f !== 'all') list = list.filter(c => f === 'open' ? c.state !== 'delivered' : c.state === f);
  if (q) list = list.filter(c => (c.pilgrim + ' ' + c.passport + ' ' + c.kt + ' ' + c.no).indexOf(q) >= 0);
  const nk = fOf('nsk','kt'), ns = fOf('nsk','svc'), nb = fOf('nsk','by');
  if (nk) list = list.filter(c => c.kt === nk);
  if (ns) list = list.filter(c => c.svc === ns);
  if (nb) list = list.filter(c => c.openedBy === nb);
  const svcN = k => V.nusuk.filter(c => c.svc === k && c.state !== 'delivered').length;

  return '<div class="grid g4">' +
      stat({ label:'حالات مفتوحة', n:openNusuk().length, ic:'i-idcard',
        cls:openNusuk().length ? 'warn' : 'up', sub:'تنتظر إجراءً منك',
        series:[2,3,4,3,5,4,6,Math.max(1, openNusuk().length)] }) +
      stat({ label:'بدل فاقد', n:svcN('lost'), ic:'i-idcard', cls:svcN('lost') ? 'bad' : '',
        sub:'مهلة ' + AR(NUSUK_SVC.lost.sla) + ' ساعة', series:[1,1,2,1,2,2,3,Math.max(1, svcN('lost'))] }) +
      stat({ label:'إصدار جديد', n:svcN('issue'), ic:'i-plus',
        sub:'مهلة ' + AR(NUSUK_SVC.issue.sla) + ' ساعة', series:[0,1,1,2,1,2,2,Math.max(1, svcN('issue'))] }) +
      stat({ label:'تفعيل بطاقة', n:svcN('enable'), ic:'i-checkc',
        sub:'مهلة ' + AR(NUSUK_SVC.enable.sla) + ' ساعات', series:[1,2,1,2,2,3,2,Math.max(1, svcN('enable'))] }) +
    '</div>' +

    '<div class="card gold">' +
      head('خدمات بطاقة نُسك', 'ابحث عن الحاجّ ثم افتح له حالة — والكنترول من يُسندها',
        '<button class="btn p sm" data-a="nnew">' + icon('i-plus','s16') + 'فتح حالة جديدة</button>',
        'i-idcard') +
      '<div class="tools">' + segmented('nf', [['open','مفتوحة'],['new','جديدة'],
        ['processing','قيد الإصدار'],['issued','تنتظر التسليم'],['delivered','سُلّمت'],['all','الكل']], f) +
      '</div>' +
      filterBar('nsk', [
        { k:'kt',  label:'الـKT',   opts:optKT() },
        { k:'svc', label:'الخدمة', opts:Object.keys(NUSUK_SVC).map(k => [k, NUSUK_SVC[k].ar]) },
        { k:'by',  label:'فتحها',  opts:[['محسن','محسن'],['ليدر','ليدر'],['مشرف','مشرف'],['الكنترول','الكنترول']] }
      ], list.length, V.nusuk.length, 'ابحث باسم الحاجّ أو رقم جوازه…') +
      (list.length ? '<div class="plist">' + list.map((c, i) => {
        const SV = NUSUK_SVC[c.svc], ST = NUSUK_STATE[c.state];
        const to = c.assignedTo ? userById(c.assignedTo) : null;
        const pct = Math.round(c.step / SV.steps.length * 100);
        return '<div class="prow trow" data-a="nopen" data-id="' + c.id + '" ' +
          'style="flex-wrap:wrap;animation-delay:' + (i * 45) + 'ms">' +
          '<span class="krail ' + (c.svc === 'lost' ? 'r' : c.svc === 'issue' ? 'a' : '') + '"></span>' +
          '<span class="ico" style="color:' + TASKTYPE.nusuk.c + '">' + icon(SV.i,'s18') + '</span>' +
          '<span class="nm" style="flex:1"><b>' + E(c.pilgrim) + '</b>' +
          '<span>' + LTR(c.no) + ' · جواز ' + LTR(c.passport) + ' · ' + E(c.kt) + '</span></span>' +
          '<span class="fl" style="gap:7px">' + pill(SV.ar, SV.c) + pill(ST.ar, ST.c) + '</span>' +
          '<span class="tiny faint">' + ago(c.at) + '</span>' +
          '<div style="width:100%;margin-top:10px">' +
            '<div class="quote">' + E(c.note) + ' — فتحها ' + E(c.openedBy) + '</div>' +
            '<div class="steps2">' + SV.steps.map((s, k) =>
              '<span class="st2' + (k < c.step ? ' done' : k === c.step ? ' now' : '') + '">' +
              '<i></i>' + E(s) + '</span>').join('') + '</div>' +
            '<div class="fl" style="gap:11px;margin-top:11px;flex-wrap:wrap">' +
              '<span class="meter" style="flex:1;min-width:120px"><i data-w="' + pct + '"></i></span>' +
              (to ? '<span class="fl" style="gap:8px">' + avatar(to, 'sm') +
                  '<span class="tiny"><b>' + E(to.name) + '</b><br>' +
                  '<span class="faint">' + E(to.role === 'leader' ? 'ليدر' : 'محسن') + ' — مُسنَدة إليه</span></span></span>'
                : '<button class="btn p sm" data-a="nassign" data-id="' + c.id + '">إسناد لمحسن أو ليدر</button>') +
              (c.state !== 'delivered'
                ? '<button class="btn l sm" data-a="nstep" data-id="' + c.id + '">تقديم الخطوة</button>' : '') +
            '</div></div></div>';
      }).join('') + '</div>' : empty('لا حالات في هذا التصنيف', 'افتح حالة جديدة من الأعلى', 'i-idcard')) +
    '</div>';
}

/* ══════════════ ٤) الامتثال ══════════════ */

      stat({ label:'قوالب منشورة', n:V.forms.length, ic:'i-clip',
        sub:'تُبنى مرّة وتُسنَد مرارًا', series:[1,1,2,2,3,3,3,V.forms.length] }) +
      stat({ label:'إدخالات', n:V.subs.length, ic:'i-checkc', cls:'up',
        sub:'زيارات مسجّلة بإجاباتها', series:[3,6,9,12,14,16,18,V.subs.length] }) +

    '</div>' +

    '<div class="card gold">' +
      head('قوالب الامتثال', 'القالب يُبنى مرّة، ويُسنَد لكل مجموعة، ويُعبَّأ كلّما لزم',

        return '<div class="prow" data-a="fsub" data-id="' + b.id + '" ' +

              '" style="flex:1"><i data-w="' + b.score + '"></i></span>' +
            '<b class="num" style="min-width:34px">' + AR(b.score) + '٪</b></span>' +
          '<span class="tiny faint">' + ago(b.at) + '</span></div>';
