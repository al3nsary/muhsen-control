<title>مُحسن · الكنترول</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════
   مُحسن · الكنترول — نظام التصميم
   وضعان: ليلي (أخضر يميل إلى السواد) · نهاري (أبيض وأخضر كالتطبيق)
   كل لون يُعرَّف مرة واحدة كرمز، ولا لون خام في الشيفرة.
   ══════════════════════════════════════════════════════════════ */

/* ───────── الوضع الليلي — الافتراضي ───────── */
:root, :root[data-theme="night"]{
  --void:#060C09;   --deep:#0A140F;   --panel:#0F1C16;  --panel2:#14261F;
  --raise:#183026;  --line:#1C3128;   --line2:#27473A;  --hair:rgba(198,168,111,.16);

  --g:#14593F;      --g2:#0C3A29;     --g3:#1D7452;     --live:#14C273;
  --gold:#A8875A;   --gold2:#C6A86F;  --gold3:#E7D1A2;
  --amber:#E5A62F;  --red:#EC4F54;    --blue:#3FA3DC;   --violet:#9276DA;

  --ink:#EDF5F0;    --dim:#9FB6A9;    --dim2:#6B857A;   --faint:#405549;
  --onGold:#1A1206;

  --sheen:rgba(255,255,255,.045);
  --sheen2:rgba(255,255,255,.08);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 20px 52px -30px rgba(0,0,0,.95);
  --lift:0 1px 0 rgba(255,255,255,.06) inset, 0 30px 64px -32px rgba(0,0,0,1);
  --glowLive:0 0 0 1px rgba(20,194,115,.24), 0 0 44px -14px rgba(20,194,115,.42);
  --glowGold:0 0 16px 1px rgba(198,168,111,.55);
  --scrim:rgba(4,9,7,.72);
  --cardEdge:1px solid var(--line);
  --starOff:#24382E;
  /* لوح التنقّل في الليل امتداد للسطح نفسه */
  --navBg:linear-gradient(180deg,var(--deep),var(--void));
  --navInk:#EDF5F0;   --navDim:#9FB6A9;  --navDim2:#6B857A; --navFaint:#405549;
  --navLine:#1C3128;  --navSheen:rgba(255,255,255,.045); --navSheen2:rgba(255,255,255,.09);
  --navOnBg:linear-gradient(90deg,color-mix(in srgb,var(--live) 18%,transparent),transparent);
  --navOnRing:color-mix(in srgb,var(--live) 26%,transparent);
  --navOnInk:#EDF5F0; --markBg:linear-gradient(150deg,var(--g3),var(--g2));
  --wash:radial-gradient(48% 40% at 80% 6%, color-mix(in srgb,var(--live) 14%,transparent), transparent 62%),
         radial-gradient(44% 36% at 10% 92%, color-mix(in srgb,var(--gold) 14%,transparent), transparent 60%);
  --pLiveB:rgba(20,194,115,.15);  --pLiveT:#4FE49F;
  --pWaitB:rgba(229,166,47,.16);  --pWaitT:#F2C069;
  --pNoB:rgba(236,79,84,.16);     --pNoT:#FF8E91;
  --pBlueB:rgba(63,163,220,.16);  --pBlueT:#82C8ED;
  --pGoldB:rgba(198,168,111,.16); --pGoldT:#E7D1A2;
  --pGreyB:rgba(255,255,255,.07); --pGreyT:#9FB6A9;
  --mapBg:radial-gradient(120% 90% at 50% 18%, #0F241B, #060C09);
  --gridLine:rgba(38,70,58,.34);
  --spark:rgba(237,245,240,.55);
  color-scheme:dark;
}

/* ───────── الوضع النهاري — قريب من التطبيق ───────── */
:root[data-theme="day"]{
  --railInk:#5A6C63;
  --void:#EDF4EF;   --deep:#F7FBF8;   --panel:#FFFFFF;  --panel2:#F2F9F4;
  --raise:#E7F1EA;  --line:#DDE9E1;   --line2:#C6DACE;  --hair:rgba(20,89,63,.20);

  --g:#14593F;      --g2:#0C3A29;     --g3:#1D7452;     --live:#0B8A4B;
  --gold:#A8875A;   --gold2:#B4935F;  --gold3:#8A6C3C;
  --amber:#B8791A;  --red:#C0392B;    --blue:#1B6E9C;   --violet:#6B4E9E;

  --ink:#0D1A13;    --dim:#4C635A;    --dim2:#7A8F84;   --faint:#9AB0A3;
  --onGold:#FFFFFF;

  --sheen:rgba(20,89,63,.045);
  --sheen2:rgba(20,89,63,.09);
  /* ظلّ التطبيق حرفيًّا — ثلاث طبقات، والبطاقة بلا حدّ */
  --shadow:0 1px 2px rgba(11,53,39,.05), 0 4px 10px -4px rgba(11,53,39,.07), 0 18px 34px -22px rgba(11,53,39,.3);
  --cardEdge:1px solid transparent;
  --starOff:#D7E0D9;
  /* النهار: لوح التنقّل أخضر عميق — هوية مُحسن كما في ترويسة التطبيق */
  --navBg:linear-gradient(168deg,#1A6B4C 0%,#12513A 52%,#0D3E2C 100%);
  --navInk:#F4FAF6;   --navDim:rgba(244,250,246,.82); --navDim2:rgba(244,250,246,.62);
  --navFaint:rgba(244,250,246,.44);
  --navLine:rgba(255,255,255,.11); --navSheen:rgba(255,255,255,.08);
  --navSheen2:rgba(255,255,255,.15);
  --navOnBg:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.03));
  --navOnRing:rgba(231,209,162,.55); --navOnInk:#FFFFFF;
  --markBg:linear-gradient(150deg,#E7D1A2,#A8875A);
  /* الأرضية خضراء لا ذهبية — الذهبي حدّ وفصل، لا غلالة */
  --wash:radial-gradient(48% 40% at 80% 6%, color-mix(in srgb,var(--live) 15%,transparent), transparent 62%),
         radial-gradient(44% 36% at 10% 92%, color-mix(in srgb,var(--g3) 13%,transparent), transparent 60%);
  /* تدرّجات الحبوب كما هي في التطبيق حرفًا بحرف */
  --pLiveB:#E4F2E9;  --pLiveT:#0B6540;
  --pWaitB:#FBF1DE;  --pWaitT:#7F5310;
  --pNoB:#FBE9E7;    --pNoT:#93261C;
  --pBlueB:#E7EEF6;  --pBlueT:#2A4A73;
  --pGoldB:#F5EDDF;  --pGoldT:#6E5729;
  --pGreyB:#EFF1ED;  --pGreyT:#5A6C63;
  --lift:0 2px 6px rgba(11,53,39,.07), 0 18px 34px -14px rgba(11,53,39,.22);
  --glowLive:0 0 0 1px rgba(11,138,75,.22), 0 12px 30px -16px rgba(11,138,75,.4);
  --glowGold:0 0 12px 1px rgba(168,135,90,.32);
  --scrim:rgba(16,25,20,.42);
  --mapBg:radial-gradient(120% 90% at 50% 18%, #E4EFE8, #F5FAF7);
  --gridLine:rgba(20,89,63,.085);
  --spark:rgba(20,89,63,.42);
  color-scheme:light;
}

:root{
  --r:18px; --r2:24px; --r3:14px;
  --f:"IBM Plex Sans Arabic","SF Arabic","Segoe UI",system-ui,sans-serif;
  --rail:80px; --side:268px; --top:66px;
  --e:cubic-bezier(.22,.7,.2,1);
  --e2:cubic-bezier(.34,1.4,.44,1);
  --e3:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0}
body{
  direction:rtl; font-family:var(--f); font-size:14px; line-height:1.75;
  font-feature-settings:"tnum" 1;
  color:var(--ink); background:var(--void); overflow:hidden;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  transition:background .5s var(--e), color .5s var(--e);
}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-align:right}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--gold2); outline-offset:3px; border-radius:10px}
::selection{background:color-mix(in srgb, var(--live) 30%, transparent)}

/* ══ الشبكة — grid-template-rows:100% و min-height:0 وإلا لا يعمل أي تمرير ══ */


/* ══ الخلفية الحيّة ══ */
.bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.bg::before{content:""; position:absolute; inset:-25%;
  background:var(--wash);
  animation:drift 30s var(--e) infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(-4%,3%,0) scale(1.08)}}
.bg .grid{position:absolute; inset:0;
  background-image:linear-gradient(var(--gridLine) 1px,transparent 1px),
    linear-gradient(90deg,var(--gridLine) 1px,transparent 1px);
  background-size:60px 60px;
  -webkit-mask-image:radial-gradient(72% 62% at 50% 38%, #000 18%, transparent 76%);
  mask-image:radial-gradient(72% 62% at 50% 38%, #000 18%, transparent 76%)}
/* شعاع يمسح الشاشة ببطء — إحساس «حيّ» بلا ضجيج */
.bg .sweep{position:absolute; inset:-40% -10%; opacity:.5;
  background:linear-gradient(105deg,transparent 42%,
    color-mix(in srgb, var(--live) 9%, transparent) 50%, transparent 58%);
  animation:sweep 14s linear infinite}
@keyframes sweep{from{transform:translateX(-60%)} to{transform:translateX(60%)}}


/* ═══════════════════════════════════════════════════
   القائمة الواحدة — حالتان لا لوحان
   ═══════════════════════════════════════════════════ */
#room{display:grid; grid-template-columns:var(--sidew) 1fr;
  grid-template-rows:100%; height:100%; overflow:hidden}
#room > *{min-height:0; min-width:0}
:root{--sidew:276px; --sidemini:74px}
#room.wide{--sidew:var(--sidemini)}
#room.wall{--sidew:var(--sidemini)}

.side{position:relative; z-index:6; display:flex; flex-direction:column; overflow:hidden;
  background:var(--navBg); border-inline-start:1px solid var(--navLine);
  transition:none}
.side::after{content:""; position:absolute; inset-block:0; inset-inline-end:0; width:1px;
  background:linear-gradient(180deg,transparent,var(--gold2),transparent); opacity:.55}

.sidehead{display:flex; align-items:center; gap:11px; padding:15px 14px 13px; flex:none;
  border-bottom:1px solid var(--navLine)}
.side .mark{width:42px; height:42px; border-radius:13px; flex:none; display:grid; place-items:center;
  background:var(--markBg); box-shadow:0 0 0 1px var(--hair), 0 10px 22px -12px rgba(0,0,0,.9);
  transition:transform .5s var(--e2)}
.side .mark:hover{transform:rotate(-8deg) scale(1.06)}
.side .mark i{display:block; width:23px; height:23px; background-size:contain;
  background-repeat:no-repeat; background-position:center}
.brandtxt{flex:1; min-width:0; overflow:hidden}
.brandtxt b{display:block; font-size:14px; letter-spacing:-.3px; color:var(--navInk); white-space:nowrap}
.brandtxt span{display:block; font-size:10.5px; color:var(--navDim2); white-space:nowrap}
.fold{width:30px; height:30px; border-radius:10px; flex:none; display:grid; place-items:center;
  color:var(--navDim2); transition:all .2s var(--e)}
.fold:hover{color:var(--navInk); background:var(--navSheen)}

.sidescroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:10px 12px 18px}
.sidescroll::-webkit-scrollbar{width:0}

.grp{font-size:10.5px; color:var(--navFaint); letter-spacing:.5px; margin:16px 6px 8px;
  display:flex; align-items:center; gap:9px; white-space:nowrap}
.grp::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--navLine),transparent)}

.nav{display:flex; align-items:center; gap:11px; width:100%; padding:10px 11px; border-radius:13px;
  color:var(--navDim); position:relative; overflow:hidden; white-space:nowrap;
  transition:color .18s var(--e), background .18s var(--e), transform .18s var(--e)}
.nav::before{content:""; position:absolute; inset:0; border-radius:inherit; opacity:0;
  background:var(--navOnBg); transition:opacity .24s var(--e)}
.nav:hover{color:var(--navInk); background:var(--navSheen); transform:translateX(-2px)}
.nav:active{transform:translateX(-2px) scale(.985)}
.nav.on{color:var(--navOnInk); box-shadow:inset 0 0 0 1px var(--navOnRing)}
.nav.on::before{opacity:1}
.nav > *{position:relative}
.nav .ic{width:18px; height:18px; flex:none}
.nav b{font-size:13px; font-weight:700; flex:1; text-align:right; overflow:hidden;
  text-overflow:ellipsis}
.nav .n{font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:99px; flex:none;
  background:var(--pNoB); color:var(--pNoT); font-variant-numeric:tabular-nums}
.nav .n.q{background:var(--pWaitB); color:var(--pWaitT)}

/* ══ التابات الفرعية ══ */
.kids{display:flex; flex-direction:column; gap:2px; margin:4px 0 8px;
  padding-inline-start:13px; position:relative;
  animation:kidsin .34s var(--e3) both}
@keyframes kidsin{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.kids::before{content:""; position:absolute; inset-block:4px; inset-inline-start:20px; width:2px;
  border-radius:2px; background:linear-gradient(180deg,var(--gold2),transparent)}
.kid{display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border-radius:11px;
  color:var(--navDim2); white-space:nowrap;
  transition:color .18s var(--e), background .18s var(--e), transform .18s var(--e)}
.kid:hover{color:var(--navInk); background:var(--navSheen); transform:translateX(-2px)}
.kid.on{color:var(--navOnInk); background:var(--navSheen2)}
.kid b{font-size:12px; font-weight:700; flex:1; text-align:right}
.kid .ic{flex:none; opacity:.85}
.kid .n{font-size:9.5px; font-weight:700; padding:1px 6px; border-radius:99px; flex:none;
  background:var(--pNoB); color:var(--pNoT)}
.kid .n.q{background:var(--pWaitB); color:var(--pWaitT)}

.brandfoot{display:flex; align-items:center; justify-content:center; gap:9px;
  padding:18px 0 4px; color:var(--navFaint); font-size:10.5px; white-space:nowrap}

/* ══ الحالة المطويّة: أيقونات فقط، والاسم يظهر عند المرور ══ */
.side.mini .brandtxt, .side.mini .grp span, .side.mini .nav b, .side.mini .nav .n,
.side.mini .kids, .side.mini .brandfoot span{display:none}
.side.mini .sidehead{flex-direction:column; gap:9px; padding:14px 8px 12px}
.side.mini .sidescroll{padding:10px 9px 18px}
.side.mini .grp{margin:14px 4px 7px}
.side.mini .grp::after{flex:1}
.side.mini .nav{justify-content:center; padding:11px 0; gap:0}
.side.mini .nav .ic{width:20px; height:20px}
/* نقطة تنبيه بدل العدد */
.side.mini .nav.hasn::after{content:""; position:absolute; top:7px; inset-inline-start:14px;
  width:7px; height:7px; border-radius:50%; background:var(--red);
  box-shadow:0 0 0 2px rgba(0,0,0,.35); animation:tick 2.4s var(--e) infinite}

/* ══ الشريط العلوي ══ */
.stage{position:relative; z-index:4; display:flex; flex-direction:column; overflow:hidden}
.top{height:var(--top); flex:none; display:flex; align-items:center; gap:12px; padding:0 20px;
  border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--deep) 78%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px)}
.top h2{font-size:16.5px; margin:0; letter-spacing:-.3px; animation:slideIn .4s var(--e) both}
.top .crumb{font-size:11px; color:var(--dim2); animation:slideIn .4s var(--e) .05s both}
@keyframes slideIn{from{opacity:0; transform:translateX(10px)} to{opacity:1; transform:none}}
.top .sp{flex:1}
.top{transition:box-shadow .3s var(--e), background .3s var(--e)}
.top.deep{box-shadow:0 1px 0 var(--line2), 0 14px 26px -22px rgba(0,0,0,.9)}
.chip{display:flex; align-items:center; gap:9px; padding:6px 12px; border-radius:12px;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line); white-space:nowrap}
.chip b{font-size:13px; font-variant-numeric:tabular-nums; letter-spacing:.3px}
.chip span{font-size:10.5px; color:var(--dim2)}
.pulse{width:8px; height:8px; border-radius:50%; background:var(--live); position:relative; flex:none}
.pulse::after{content:""; position:absolute; inset:-5px; border-radius:50%;
  border:1px solid var(--live); animation:ping 2.4s var(--e) infinite}
@keyframes ping{0%{transform:scale(.5); opacity:.8} 70%{transform:scale(1.7); opacity:0} 100%{opacity:0}}
.iconbtn{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; flex:none;
  color:var(--dim); background:var(--sheen); position:relative;
  transition:all .18s var(--e)}
.iconbtn:hover{color:var(--ink); background:var(--sheen2); transform:translateY(-1px)}
.iconbtn:active{transform:scale(.93)}
.iconbtn .bdg{position:absolute; top:-4px; inset-inline-start:-4px; min-width:18px; height:18px;
  border-radius:99px; background:var(--red); color:#fff; font-size:10px; font-weight:700;
  display:grid; place-items:center; padding:0 5px; border:2px solid var(--deep)}
/* مفتاح الوضع */
.themebtn{width:auto; min-width:118px; padding:0 6px 0 12px; display:flex; align-items:center;
  justify-content:space-between; gap:8px; font-size:11.5px; font-weight:700; color:var(--dim);
  height:38px; border-radius:99px; flex:none; position:relative;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:background .3s var(--e), color .2s var(--e)}
.themebtn:hover{color:var(--ink); background:var(--sheen2)}
.themebtn .knob{width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
  color:var(--onGold); flex:none;
  background:linear-gradient(150deg,var(--gold2),var(--gold));
  transition:transform .42s var(--e2)}
:root[data-theme="day"] .themebtn .knob{transform:rotate(180deg)}
.themebtnOLD{width:62px; height:34px; border-radius:99px; flex:none; position:relative;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line); transition:background .3s var(--e)}
.themebtn i{position:absolute; top:3px; width:28px; height:28px; border-radius:50%;
  display:grid; place-items:center; color:var(--onGold);
  background:linear-gradient(150deg,var(--gold2),var(--gold));
  transition:inset-inline-end .42s var(--e2), transform .42s var(--e2);
  inset-inline-end:3px}
:root[data-theme="day"] .themebtn i{inset-inline-end:33px; transform:rotate(180deg)}
.themebtn .ic{width:15px; height:15px}

/* ══ المسرح ══ */
.view{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:22px 24px 40px;
  display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth}
.view > *{flex:none}
.view::-webkit-scrollbar{width:11px}
.view::-webkit-scrollbar-track{background:transparent}
.view::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px;
  border:3.5px solid transparent; background-clip:content-box}
.view::-webkit-scrollbar-thumb:hover{background:var(--dim2); background-clip:content-box}
.view > *{animation:rise .46s var(--e) both}
.view > *:nth-child(1){animation-delay:0ms}   .view > *:nth-child(2){animation-delay:46ms}
.view > *:nth-child(3){animation-delay:88ms}  .view > *:nth-child(4){animation-delay:126ms}
.view > *:nth-child(5){animation-delay:158ms} .view > *:nth-child(n+6){animation-delay:184ms}
@keyframes rise{from{opacity:0; transform:translateY(18px) scale(.985)} to{opacity:1; transform:none}}
#stagewrap.nofx .view > *{animation:none}

/* ══ البطاقات ══ */
.card{position:relative; border-radius:var(--r); padding:18px; overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border:var(--cardEdge); box-shadow:var(--shadow);
  transition:transform .28s var(--e), box-shadow .28s var(--e), border-color .28s var(--e)}
.card::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
  transition:opacity .3s var(--e);
  background:radial-gradient(240px 180px at var(--mx,50%) var(--my,0%), var(--sheen2), transparent 70%)}
.card:hover::after{opacity:1}
.card.hov:hover{transform:translateY(-3px); box-shadow:var(--lift); border-color:var(--line2)}
.card.gold::before{content:""; position:absolute; inset-inline:22px; top:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.card.live{border-color:color-mix(in srgb, var(--live) 32%, transparent); box-shadow:var(--shadow), var(--glowLive)}

.h{display:flex; align-items:center; gap:11px; margin-bottom:15px}
.h b{font-size:15px; letter-spacing:-.2px; display:block}
.h .sp{flex:1; min-width:0}
.h > .ic{color:var(--gold2); flex:none}
/* علامة القسم: خطّ ذهبي رفيع — لا أيقونة معمّمة */
.h .hm{width:3px; height:17px; border-radius:99px; flex:none;
  background:linear-gradient(180deg,var(--gold3),var(--gold));
  box-shadow:0 0 12px -2px var(--gold)}
.card.gold .h .hm{height:20px}
.muted{color:var(--dim)} .faint{color:var(--dim2)}
.tiny{font-size:11.5px} .sm{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:1.7fr 1fr}
@media (max-width:1280px){ .g23{grid-template-columns:1fr} }
@media (max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:1fr} }

/* ══ المؤشّرات ══ */
.kpi{padding:17px 19px 42px; min-height:150px; cursor:default;
  display:flex; flex-direction:column; justify-content:flex-start; gap:2px}
.kpi .lab{font-size:11.5px; color:var(--dim2); display:flex; align-items:center; gap:6px}
.kpi b{display:block; font-size:36px; font-weight:700; line-height:1.2; letter-spacing:-1.4px;
  font-variant-numeric:tabular-nums; margin-top:5px}
.kpi .sub{font-size:11px; color:var(--dim2); position:relative; z-index:2; margin-top:auto}
.kpi .spark{position:absolute; inset-inline:0; bottom:0; height:38px; color:var(--spark);
  opacity:.7; z-index:1; pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 55%);
  mask-image:linear-gradient(180deg,transparent,#000 55%)}
.kpi .spark path{stroke-dasharray:400; stroke-dashoffset:400; animation:draw 1.4s var(--e) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.kpi.up b{color:var(--live)} .kpi.warn b{color:var(--amber)} .kpi.bad b{color:var(--red)}
.kpi.up .spark{color:var(--live)} .kpi.warn .spark{color:var(--amber)} .kpi.bad .spark{color:var(--red)}

/* ══ الحبوب والأزرار ══ */
.pill{display:inline-flex; align-items:center; justify-content:center; gap:5px;
  font-size:11px; font-weight:700; line-height:1.5; border-radius:99px; padding:4px 11px;
  white-space:nowrap; flex:none; vertical-align:middle}
.pill.live{background:var(--pLiveB); color:var(--pLiveT)}
.pill.wait{background:var(--pWaitB); color:var(--pWaitT)}
.pill.no{background:var(--pNoB); color:var(--pNoT)}
.pill.blue{background:var(--pBlueB); color:var(--pBlueT)}
.pill.gold{background:var(--pGoldB); color:var(--pGoldT); box-shadow:inset 0 0 0 1px rgba(198,168,111,.45)}
.pill.grey{background:var(--pGreyB); color:var(--pGreyT)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px;
  padding:0 16px; border-radius:13px; font-weight:700; font-size:13px; position:relative; overflow:hidden;
  transition:transform .14s var(--e), box-shadow .24s var(--e), background .24s var(--e)}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(150deg,var(--g3),var(--g2)); color:#fff;
  box-shadow:0 0 0 1px var(--hair), 0 14px 28px -16px var(--g3)}
.btn.p:hover{box-shadow:0 0 0 1px var(--gold2), 0 18px 34px -14px var(--g3); transform:translateY(-1px)}
.btn.l{background:var(--sheen); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line2)}
.btn.l:hover{background:var(--sheen2)}
.btn.d{background:color-mix(in srgb,var(--red) 14%,transparent); color:var(--red);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 34%,transparent)}
.btn.sm{min-height:34px; font-size:12px; padding:0 12px; border-radius:11px}
/* موجة ضغط */
.btn .rip{position:absolute; border-radius:50%; transform:translate(-50%,-50%);
  background:currentColor; opacity:.28; pointer-events:none; animation:rip .55s var(--e) forwards}
@keyframes rip{from{width:0;height:0;opacity:.3} to{width:320px;height:320px;opacity:0}}

/* ══ الصفوف ══ */
.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--line);
  border-radius:10px; transition:background .18s var(--e), transform .18s var(--e)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sheen); transform:translateX(-2px)}
.av{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line2); color:var(--dim)}
.nm{flex:1; min-width:0}
.nm b{display:block; font-size:13.5px}
.nm span{display:block; font-size:11px; color:var(--dim2)}

/* ══ الأيقونات ══ */
.ic{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; display:block}
.ic.s14{width:14px;height:14px;stroke-width:2} .ic.s16{width:16px;height:16px;stroke-width:1.9}
.ic.s18{width:18px;height:18px;stroke-width:1.85} .ic.s26{width:26px;height:26px}
.ic.f{fill:currentColor; stroke:none}

/* ══ التدفّق ══ */
.feed{display:flex; flex-direction:column; gap:10px; max-height:512px; overflow:auto; padding-inline-end:4px}
/* بطاقة تملأ ارتفاع صفّها — فلا ينقطع آخر حدث في منتصفه */
.card.fillcol{display:flex; flex-direction:column}
.card.fillcol .feed{flex:1; min-height:0; max-height:none;
  -webkit-mask-image:linear-gradient(180deg,#000 88%,transparent);
  mask-image:linear-gradient(180deg,#000 88%,transparent)}
.feed::-webkit-scrollbar{width:6px}
.feed::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.evt{display:flex; gap:11px; padding:12px; border-radius:14px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line); animation:land .5s var(--e) both;
  transition:transform .2s var(--e), box-shadow .2s var(--e)}
.evt:hover{transform:translateX(-3px); box-shadow:inset 0 0 0 1px var(--line2)}
@keyframes land{from{opacity:0; transform:translateX(20px)} to{opacity:1; transform:none}}
.evt .dot{width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none; background:var(--dim2)}
.evt.bad{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 34%,transparent)}
.evt.bad .dot{background:var(--red); box-shadow:0 0 10px 1px color-mix(in srgb,var(--red) 70%,transparent)}
.evt.warn{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amber) 30%,transparent)}
.evt.warn .dot{background:var(--amber)}
.evt.ok .dot{background:var(--live)}
.evt b{display:block; font-size:12.5px}
.evt p{margin:3px 0 0; font-size:11.5px; color:var(--dim); line-height:1.65}
.evt .t{font-size:10.5px; color:var(--faint); white-space:nowrap}

/* ══ العدّادات والأشرطة ══ */
.meter{height:6px; border-radius:99px; background:var(--sheen2); overflow:hidden}
.meter i{display:block; height:100%; border-radius:99px; width:0;
  background:linear-gradient(90deg,var(--g3),var(--live)); transition:width .9s var(--e)}
.meter.gold i{background:linear-gradient(90deg,var(--gold),var(--gold3))}
.meter.red i{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 60%,#000),var(--red))}

/* ══ الخريطة ══ */
.map{position:relative; height:352px; border-radius:var(--r); overflow:hidden;
  background:var(--mapBg); box-shadow:inset 0 0 0 1px var(--line)}
.map svg{position:absolute; inset:0; width:100%; height:100%}
.map::before{content:""; position:absolute; inset:0; opacity:.5;
  background-image:radial-gradient(var(--gridLine) 1px, transparent 1px);
  background-size:26px 26px}
.map .radar{position:absolute; inset:0; opacity:.35;
  background:conic-gradient(from 0deg, transparent 0deg,
    color-mix(in srgb,var(--live) 22%,transparent) 22deg, transparent 44deg);
  animation:spin 9s linear infinite;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 12%, transparent 66%);
  mask-image:radial-gradient(circle at 50% 50%, #000 12%, transparent 66%)}
@keyframes spin{to{transform:rotate(360deg)}}
.node{position:absolute; transform:translate(50%,-50%); z-index:2}
.node .pin{width:13px; height:13px; border-radius:50%; background:var(--live); position:relative;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--live) 18%,transparent), 0 0 22px 2px color-mix(in srgb,var(--live) 55%,transparent)}
.node .pin::after{content:""; position:absolute; inset:-7px; border-radius:50%;
  border:1px solid currentColor; color:var(--live); opacity:0; animation:ripple 3s var(--e) infinite}
@keyframes ripple{0%{transform:scale(.5); opacity:.7} 70%{transform:scale(2); opacity:0} 100%{opacity:0}}
.node.warn .pin{background:var(--amber);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--amber) 18%,transparent), 0 0 22px 2px color-mix(in srgb,var(--amber) 55%,transparent)}
.node.warn .pin::after{color:var(--amber)}
.node.bad .pin{background:var(--red); animation:beat 1.5s var(--e) infinite;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 20%,transparent), 0 0 26px 3px color-mix(in srgb,var(--red) 60%,transparent)}
.node.bad .pin::after{color:var(--red)}
.node.soon .pin{background:var(--gold2); box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 16%,transparent)}
.node.soon .pin::after{color:var(--gold2)}
@keyframes beat{0%,100%{transform:scale(1)} 50%{transform:scale(1.34)}}
.node .lbl{position:absolute; inset-inline-end:22px; top:-7px; white-space:nowrap; font-size:11px;
  background:color-mix(in srgb,var(--deep) 86%,transparent); padding:4px 10px; border-radius:9px;
  box-shadow:inset 0 0 0 1px var(--line2); backdrop-filter:blur(6px)}
.dash{stroke-dasharray:5 8; animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.convoy{fill:var(--live); filter:drop-shadow(0 0 4px var(--live))}
.convoy.warm{fill:var(--gold2); filter:drop-shadow(0 0 3px var(--gold)); opacity:.7}
.dash.slow{stroke-dasharray:3 10; animation-duration:3s}

/* ══ الخط الزمني للموسم ══ */
.tl{overflow:auto; padding-bottom:6px}
.tl::-webkit-scrollbar{height:8px}
.tl::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.tlgrid{min-width:940px}
.tlhead{display:flex; gap:0; padding-inline-start:118px; margin-bottom:8px}
.tlhead span{flex:1; font-size:10px; color:var(--faint); text-align:center;
  border-inline-start:1px solid var(--line); padding:2px 0}
.tlrow{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.tlname{width:108px; flex:none; font-size:12px; font-weight:700}
.tlbar{flex:1; position:relative; height:34px; border-radius:10px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line); overflow:hidden}
.tlbar .now{position:absolute; top:0; bottom:0; width:2px; background:var(--red); z-index:3;
  box-shadow:0 0 10px 1px color-mix(in srgb,var(--red) 70%,transparent)}
.seg{position:absolute; top:5px; bottom:5px; border-radius:7px; min-width:7px;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-size:9.5px; font-weight:700; color:#fff; cursor:pointer;
  transform:scaleX(0); transform-origin:right center;
  animation:grow .7s var(--e) both; transition:filter .2s var(--e), transform .2s var(--e)}
.seg:hover{filter:brightness(1.25); z-index:4}
@keyframes grow{to{transform:scaleX(1)}}

/* ══ لوحة الأوامر ══ */
.scrim{position:fixed; inset:0; z-index:90; background:var(--scrim);
  backdrop-filter:blur(6px); animation:fade .24s var(--e) both}
@keyframes fade{from{opacity:0} to{opacity:1}}
.palette{position:fixed; z-index:91; inset-inline:0; top:14vh; margin:0 auto; width:min(620px,92vw);
  border-radius:var(--r2); overflow:hidden; background:var(--panel);
  border:1px solid var(--line2); box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
  animation:pop .3s var(--e2) both}
@keyframes pop{from{opacity:0; transform:translateY(-18px) scale(.97)} to{opacity:1; transform:none}}
.palette .pin{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line)}
.palette input{flex:1; background:none; border:0; outline:0; color:var(--ink); font:inherit; font-size:15px}
.palette input::placeholder{color:var(--dim2)}
.palette .kbd{font-size:10px; color:var(--faint); padding:3px 7px; border-radius:7px;
  box-shadow:inset 0 0 0 1px var(--line2)}
.palette .res{max-height:44vh; overflow:auto; padding:8px}
.palette .res::-webkit-scrollbar{width:6px}
.palette .res::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.pit{display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px; border-radius:12px;
  color:var(--dim); transition:all .14s var(--e)}
.pit:hover, .pit.sel{background:var(--sheen2); color:var(--ink)}
.pit b{font-size:13.5px; flex:1}
.pit span{font-size:11px; color:var(--dim2)}

/* ══ الدرج الجانبي ══ */
.drawer{position:fixed; z-index:92; inset-block:0; inset-inline-start:0; width:min(460px,94vw);
  background:linear-gradient(180deg,var(--panel),var(--deep)); border-inline-end:1px solid var(--line2);
  box-shadow:-40px 0 90px -30px rgba(0,0,0,.9); display:flex; flex-direction:column;
  animation:slideL .34s var(--e) both}
@keyframes slideL{from{transform:translateX(-100%)} to{transform:none}}
.drawer .dh{display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line)}
.drawer .db{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:18px 20px;
  display:flex; flex-direction:column; gap:14px}
/* حاسم: بلا هذا ينكمش كل ابن فيُقصّ محتواه ويبدو الدرج معطوبًا */
.drawer .db > *{flex:none}
.drawer .db .card{overflow:visible}
.drawer .db .grid{overflow:visible}
.drawer .db::-webkit-scrollbar{width:8px}
.drawer .db::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}

/* ══ جدار العرض ══ */
#room.wall .top{height:52px}
#room.wall .top .crumb, #room.wall .top .chip:nth-of-type(2){display:none}
#room.wall .view{padding:26px 30px}
.wallbar{position:fixed; inset-inline:0; top:0; z-index:8; height:4px; background:var(--line)}
.wallexit{position:fixed; z-index:9; inset-inline-start:22px; bottom:22px;
  display:flex; align-items:center; gap:9px; padding:11px 16px; border-radius:14px;
  background:color-mix(in srgb,var(--panel) 94%,transparent); color:var(--ink);
  font-size:12.5px; font-weight:700; backdrop-filter:blur(12px);
  box-shadow:0 0 0 1px var(--gold2), 0 22px 44px -18px rgba(0,0,0,.9);
  animation:pop .3s var(--e2) both}
.wallexit:hover{background:var(--panel2)}
.wallbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--live));
  animation:wallgo 12s linear infinite}
@keyframes wallgo{from{width:0} to{width:100%}}

/* ══ حالة فارغة ══ */
.empty{text-align:center; padding:46px 20px; color:var(--dim2)}
.empty .ic{width:34px; height:34px; margin:0 auto 12px; color:var(--faint)}
.empty b{display:block; font-size:14.5px; color:var(--ink)}

/* ══ رسالة عابرة ══ */
#toastwrap{position:fixed; inset-inline:0; bottom:26px; z-index:95; display:flex; justify-content:center;
  pointer-events:none}
.toast{display:flex; align-items:center; gap:11px; padding:13px 20px; border-radius:15px; overflow:hidden;
  background:color-mix(in srgb,var(--panel) 96%,transparent); color:var(--ink);
  font-size:13px; font-weight:700; position:relative;
  box-shadow:0 0 0 1px var(--line2), 0 26px 54px -22px rgba(0,0,0,.9);
  backdrop-filter:blur(14px); animation:toastin .34s var(--e2) both}
.toast.r{box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 45%,transparent), 0 26px 54px -22px rgba(0,0,0,.9);
  color:var(--red)}
.toast i.bar{position:absolute; inset-inline:0; bottom:0; height:2px; background:currentColor; opacity:.5;
  animation:shrink 2.8s linear forwards; transform-origin:right center}
@keyframes shrink{from{transform:scaleX(1)} to{transform:scaleX(0)}}
@keyframes toastin{from{opacity:0; transform:translateY(20px) scale(.95)} to{opacity:1; transform:none}}

.brandfoot{display:flex; align-items:center; justify-content:center; gap:9px;
  padding:16px 0 4px; color:var(--navFaint); font-size:10.5px}

/* ══ هيكل تحميل ══ */
.skel{border-radius:10px; background:linear-gradient(90deg,var(--sheen),var(--sheen2),var(--sheen));
  background-size:200% 100%; animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}


/* ═══════════════════════════════════════════════════
   طبقة الـ CRM — أدوات القراءة والقرار
   ═══════════════════════════════════════════════════ */

/* ══ صفّ الأدوات فوق اللوحة ══ */
.opsbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:2px 2px 0; animation:rise .5s var(--e3) both}
.opsbar .sp{flex:1; min-width:12px}
.hello b{display:block; font-size:19px; letter-spacing:-.5px; line-height:1.35}
.hello .tiny{display:block; margin-top:1px}
.kbd2{font-size:9.5px; font-weight:700; letter-spacing:.4px; padding:2px 6px; border-radius:6px;
  background:rgba(255,255,255,.16); color:inherit; margin-inline-start:2px}

/* ══ مبدّل مدى بمؤشّر ينزلق ══ */
.sw{position:relative; display:inline-flex; align-self:flex-start; padding:4px;
  border-radius:13px; flex:none;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line)}
.sw > button{position:relative; z-index:2; display:flex; align-items:center; gap:6px;
  height:32px; padding:0 15px; border-radius:10px; font-size:12px; font-weight:700;
  color:var(--dim2); white-space:nowrap; transition:color .26s var(--e)}
.sw > button:hover{color:var(--ink)}
.sw > button.on{color:var(--ink)}
.sw > button i{font-style:normal; font-size:10px; opacity:.7; font-variant-numeric:tabular-nums}
.swmark{position:absolute; z-index:1; top:4px; bottom:4px; border-radius:10px;
  inset-inline-start:calc(4px + (100% - 8px) / var(--n) * var(--i));
  width:calc((100% - 8px) / var(--n));
  background:var(--panel2); box-shadow:0 0 0 1px var(--line2), 0 8px 18px -12px rgba(0,0,0,.8);
  transition:inset-inline-start .46s var(--e2)}

/* ══ فارق عن المدة السابقة ══ */
.delta{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700;
  padding:2px 8px; border-radius:99px; font-variant-numeric:tabular-nums; flex:none;
  animation:rise .5s var(--e3) .3s both}
.delta.up{color:var(--live); background:color-mix(in srgb,var(--live) 14%,transparent)}
.delta.dn{color:var(--red); background:color-mix(in srgb,var(--red) 14%,transparent)}
.delta.flat{color:var(--dim2); background:var(--sheen2)}
.kpi .kv{display:flex; align-items:baseline; gap:9px}
.kpi .kv b{flex:none}

/* ══ رسم الأعمدة ══ */
.chart{padding-top:4px}
.bars{display:flex; align-items:flex-end; gap:7px; height:186px}
.barwrap{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-end;
  align-items:center; gap:8px; height:100%; cursor:default}
.bar{width:100%; max-width:34px; border-radius:8px 8px 4px 4px; height:0; position:relative;
  background:linear-gradient(180deg,var(--g2),color-mix(in srgb,var(--g3) 55%,transparent));
  box-shadow:inset 0 0 0 1px var(--hair);
  transition:height .8s var(--e3), background .3s var(--e), box-shadow .3s var(--e);
  animation:barin .5s var(--e3) both}
@keyframes barin{from{opacity:0} to{opacity:1}}
.barwrap:hover .bar{background:linear-gradient(180deg,var(--live),var(--g2))}
.bar.hot{background:linear-gradient(180deg,var(--gold3),var(--gold));
  box-shadow:0 0 0 1px var(--gold2), 0 0 26px -4px var(--gold)}
.bar.hot::after{content:""; position:absolute; inset-inline:0; top:-9px; height:4px; border-radius:99px;
  background:var(--gold3); animation:tick 2.4s var(--e) infinite}
.bl{font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums}
.barwrap:hover .bl{color:var(--ink)}

/* ══ القرص ══ */
.donutwrap{display:flex; flex-direction:column; align-items:center; gap:16px}
.donut{position:relative; width:172px; height:172px; flex:none}
.donut svg{width:100%; height:100%; overflow:visible}
.arc{opacity:0; transform-origin:70px 70px; animation:arcin .8s var(--e3) both}
@keyframes arcin{from{opacity:0; transform:scale(.72)} to{opacity:1; transform:none}}
.donut .dc{position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none}
.donut .dc b{font-size:32px; font-weight:700; letter-spacing:-1.2px; line-height:1.1;
  font-variant-numeric:tabular-nums}
.donut .dc span{font-size:11px; color:var(--dim2)}
.legend{display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px; width:100%}
.legend span{display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--dim)}
.legend i{width:9px; height:9px; border-radius:3px; flex:none}
.legend b{color:var(--ink); font-variant-numeric:tabular-nums}

/* ══ الجدول ══ */
.tbl{margin:0 -4px}
.tbl .th{display:grid; gap:10px; padding:0 10px 9px; border-bottom:1px solid var(--line)}
.tbl .th button{display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
  letter-spacing:.2px; color:var(--faint); transition:color .2s var(--e)}
.tbl .th button:hover{color:var(--ink)}
.tbl .th button.on{color:var(--gold2)}
.tbl .tb{display:flex; flex-direction:column}
/* جدول طويل: تدخل الكتلة مرّة واحدة — لا أربعون حركة */
.tbl .tb.bulk{animation:trin .5s var(--e3) both}
.tbl .tb.bulk .tr{animation:none}
.tbl .tr{display:grid; gap:10px; align-items:center; padding:11px 10px; border-radius:12px;
  border-bottom:1px solid var(--line); cursor:pointer; animation:trin .5s var(--e3) both;
  transition:background .2s var(--e), transform .22s var(--e), box-shadow .22s var(--e)}
@keyframes trin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.tbl .tr:last-child{border-bottom:0}
.tbl .tr:hover{background:var(--sheen); transform:translateX(-3px);
  box-shadow:inset 0 0 0 1px var(--line2)}
.tbl .tr > span{min-width:0; display:flex; align-items:center; gap:8px}
.tbl .tr .ico{width:32px; height:32px; border-radius:10px}
.tbl .tr .av{width:34px; height:34px}
.tbl .tr .nm b{font-size:12.5px} .tbl .tr .nm span{font-size:10.5px}
.fl{display:flex; align-items:center; gap:10px; min-width:0}
.tbl .tr > span > .fl{flex:1; width:100%}
.tbl .tr .meter{min-width:44px}

/* ══ صفّ القرارات ══ */
.qlist{display:flex; flex-direction:column; gap:9px}
.qrow{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:15px;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  animation:land .55s var(--e3) both;
  transition:transform .24s var(--e), box-shadow .24s var(--e), background .24s var(--e)}
.qrow:hover{transform:translateX(-3px); background:var(--sheen2)}
.qrow .qi{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center}
.qrow.bad{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 30%,transparent)}
.qrow.bad .qi{color:var(--red); background:color-mix(in srgb,var(--red) 13%,transparent)}
.qrow.warn{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amber) 28%,transparent)}
.qrow.warn .qi{color:var(--amber); background:color-mix(in srgb,var(--amber) 13%,transparent)}
.qrow .nm b{font-size:13px} .qrow .nm span{font-size:11.5px; color:var(--dim)}
.qrow .qa{display:flex; align-items:center; gap:8px; flex:none;
  opacity:.55; transform:translateX(-4px);
  transition:opacity .26s var(--e), transform .26s var(--e)}
.qrow:hover .qa{opacity:1; transform:none}
@media (max-width:900px){
  .qrow{flex-wrap:wrap} .qrow .qa{opacity:1; transform:none; width:100%}
}

/* ══ مفتاح الخريطة ══ */
.maplegend{display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  margin-top:12px; font-size:11px; color:var(--dim2)}
.maplegend span{display:inline-flex; align-items:center; gap:7px}
.maplegend i{width:9px; height:9px; border-radius:50%; flex:none}
.maplegend i.ok{background:var(--live)} .maplegend i.wr{background:var(--amber)}
.maplegend i.bd{background:var(--red)}
.maplegend i.sn{background:var(--gold2)}

/* ══ بطاقة مصغّرة ══ */
.card.mini{padding:13px 14px; min-height:0}
.card.mini b{display:block; font-size:23px; font-weight:700; letter-spacing:-.9px; margin-top:2px;
  font-variant-numeric:tabular-nums}

/* ══ نعومة: الحركة الطويلة تسير بمنحنى أسّي ══ */
.view > *{animation-duration:.55s; animation-timing-function:var(--e3)}
.card{transition:transform .34s var(--e3), box-shadow .34s var(--e3), border-color .34s var(--e)}
.card.hov:hover{transform:translateY(-4px)}
.view, .feed, .drawer .db, .palette .res, .side{overscroll-behavior:contain}


/* ═══════════════════════════════════════════════════
   الصنعة المنقولة من التطبيق — بقيمها الحرفية
   الفصل بالظلّ لا بالحدّ · حلقة ذهبية حول الوجه ·
   نجوم لا أشرطة · علامة قسم بخطّ ذهبي متلاشٍ
   ═══════════════════════════════════════════════════ */

/* ══ الأفاتار المرسوم — نفس هندسة التطبيق ══ */
.av{width:42px; height:42px; border-radius:50%; flex:none; overflow:hidden; display:block;
  box-shadow:0 0 0 1.5px rgba(198,168,111,.55), 0 4px 12px -5px rgba(11,53,39,.45)}
.av svg{width:100%; height:100%; display:block}
.av.sm{width:34px; height:34px} .av.lg{width:56px; height:56px} .av.xl{width:74px; height:74px}
.av.p1{--skin:#EDC59B;--beard:#382D22;--check:#BE4B40;--thobe:#6B6047;--avbg:#E9F1EB}
.av.p2{--skin:#D9A87B;--beard:#4A3B2C;--check:transparent;--thobe:#77694D;--avbg:#EDF2EC}
.av.p3{--skin:#C68B5E;--beard:#241D16;--check:#BE4B40;--thobe:#5F5641;--avbg:#E8EFE9}
.av.p4{--skin:#F1CDA6;--beard:#7A6247;--check:transparent;--thobe:#6E6349;--avbg:#EFF3ED}
.av.p5{--skin:#EDC59B;--hijab:#1E1A17;--abaya:#57452F;--avbg:#F0EAE1}
.av.p6{--skin:#D9A87B;--hijab:#23322B;--abaya:#4B5A50;--avbg:#EBEFEA}
.av.p7{--skin:#C68B5E;--hijab:#2C2320;--abaya:#5E4C39;--avbg:#F0EAE1}

/* ══ حاملة أيقونة — ما كان يُسمّى av وليس وجهًا ══ */
.ico{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line2); color:var(--dim)}
.ico.sm{width:32px; height:32px; border-radius:10px}

/* ══ النجوم — التقييم يُقرأ لا يُقاس ══ */
.stars{display:inline-flex; align-items:center; gap:2px}
.stars .ic{fill:var(--starOff); stroke:none}
.stars .ic.on{fill:#E3B341}
.stars .ic.half{fill:#EEDCA8}
.stars b{font-size:12px; margin-inline-start:5px; color:var(--ink); font-variant-numeric:tabular-nums}
.stars.lg .ic{width:18px; height:18px}
.stars.lg b{font-size:15px}

/* ══ صفّ شخص — بطاقة قائمة بذاتها كما في التطبيق ══ */
.prow{display:flex; align-items:center; gap:11px; border-radius:17px; padding:11px 13px;
  background:var(--panel); box-shadow:var(--shadow); border:var(--cardEdge); width:100%;
  text-align:right; transition:transform .18s var(--e), box-shadow .26s var(--e3)}
.prow:hover{box-shadow:var(--lift)}
.prow:active{transform:scale(.985)}
.prow .nm b{display:block; font-size:13.5px; line-height:1.45}
.prow .nm span{display:block; font-size:11px; color:var(--dim2); line-height:1.5}
.prow .end{margin-inline-start:auto; text-align:left; flex:none}
.plist{display:flex; flex-direction:column; gap:9px}
/* حاسم — وهو الدرس نفسه الذي لدغنا في الأدراج: ابن المرن ينكمش ما لم
   يُمنَع. وقائمةٌ في صندوقٍ محدّد الارتفاع كانت تسحق صفوفها إلى ٢٤ بكسل
   فيفيض نصّها خارجها ويبدو الصفّ ممزّقًا. */
.plist > *{flex:none}
/* سطر الحصيلة أسفل الصفّ: المنجَز يمينًا والملاحظات يسارًا */
.pfoot{display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:11.5px}
.pfoot .ok{color:var(--dim)}
.pfoot .no{color:var(--red); font-weight:700}

/* ══ شريط حصيلة ثلاثي — كما في التطبيق ══ */
.meta{display:flex; padding:13px 2px; border-radius:16px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line)}
.meta > div{flex:1; text-align:center; padding:0 5px; border-inline-start:1px solid var(--line)}
.meta > div:first-child{border:0}
.meta .k{display:block; font-size:10px; color:var(--dim2); margin-bottom:4px}
.meta b{display:block; font-size:15px; font-weight:700; line-height:1.35}

/* ══ ضلع النوع على حافّة البطاقة ══ */
.prow{position:relative; overflow:hidden}
.krail{position:absolute; inset-block:0; inset-inline-start:0; width:3px;
  background:var(--line2); border-radius:0 3px 3px 0}
.krail.r{background:var(--red)} .krail.a{background:var(--amber)}
.prow.trow{cursor:pointer}
.when{flex:none; text-align:center; min-width:132px; line-height:1.5}
.when b{display:block; font-size:11.5px}
.when span{display:block; font-size:11px; color:var(--dim2)}
/* اقتباس ما كتبه الميدان — نصّه لا نصّنا */
.quote{margin-top:10px; padding:10px 13px; border-radius:12px; font-size:12px;
  line-height:1.8; color:var(--dim); background:var(--sheen2);
  border-inline-start:2px solid var(--gold2)}

/* ══ علامة القسم — خطّ ذهبي يتلاشى، هوية التطبيق ══ */
.h .hm{display:none}
.h b::after{content:""; display:block; width:34px; height:2px; border-radius:2px; margin-top:6px;
  background:linear-gradient(90deg,var(--gold2),rgba(198,168,111,0))}
.h.plain b::after{display:none}

/* ══ استجابة الضغط — نفس مقدار التطبيق ══ */
.card.hov:active, .row:active, .qrow:active, .tbl .tr:active, .pit:active, .nav:active{
  transform:scale(.985)}


/* ═══════════════════════════════════════════════════
   الشاشات الستّ — أدوات البحث والتحرير والسجل
   ═══════════════════════════════════════════════════ */

/* ══ صفّ أدوات فوق الجدول ══ */
.tools{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:15px}

/* ══ حقل بحث ══ */
.find{display:flex; align-items:center; gap:10px; flex:1; min-width:230px; height:42px;
  padding:0 14px; border-radius:13px; background:var(--sheen); color:var(--dim2);
  box-shadow:inset 0 0 0 1px var(--line); transition:box-shadow .26s var(--e), background .26s var(--e)}
.find:focus-within{background:var(--panel2); box-shadow:inset 0 0 0 1px var(--gold2)}
.find input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--ink);
  font:inherit; font-size:13px}
.find input::placeholder{color:var(--dim2)}
.find .x{display:grid; place-items:center; width:24px; height:24px; border-radius:8px;
  color:var(--dim2); transition:color .2s var(--e), background .2s var(--e)}
.find .x:hover{color:var(--red); background:var(--sheen2)}

/* ══ حقول التحرير ══ */
.compose{display:flex; flex-direction:column}
.fl2{display:block; font-size:11px; font-weight:700; color:var(--dim2); margin:14px 2px 7px}
.fl2:first-child{margin-top:0}
.fld{width:100%; background:var(--sheen); border:0; outline:0; color:var(--ink); font:inherit;
  font-size:13px; padding:12px 14px; border-radius:13px; resize:vertical;
  box-shadow:inset 0 0 0 1px var(--line); transition:box-shadow .26s var(--e), background .26s var(--e)}
.fld:focus{background:var(--panel2); box-shadow:inset 0 0 0 1px var(--gold2)}
.fld::placeholder{color:var(--dim2)}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip2{font-size:11.5px; font-weight:700; padding:7px 13px; border-radius:99px; color:var(--dim);
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:all .22s var(--e)}
.chip2:hover{color:var(--ink); background:var(--sheen2)}
.chip2.on{color:var(--onGold); background:linear-gradient(150deg,var(--gold2),var(--gold));
  box-shadow:0 6px 16px -8px var(--gold)}

/* ══ ترتيب الفرق ══ */
.board{display:flex; flex-direction:column; gap:8px}
.brow{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:14px;
  cursor:pointer; background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  animation:trin .5s var(--e3) both;
  transition:transform .22s var(--e), background .22s var(--e), box-shadow .22s var(--e)}
.brow:hover{transform:translateX(-3px); background:var(--sheen2); box-shadow:inset 0 0 0 1px var(--line2)}
.brow:active{transform:scale(.985)}
.rk{width:26px; height:26px; border-radius:9px; flex:none; display:grid; place-items:center;
  font-size:12px; font-weight:700; color:var(--dim2); background:var(--sheen2)}
.rk.top{color:var(--onGold); background:linear-gradient(150deg,var(--gold3),var(--gold));
  box-shadow:0 0 14px -3px var(--gold)}
.bar2{flex:1; min-width:52px; height:6px; border-radius:99px; background:var(--sheen2); overflow:hidden}
.bar2 i{display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--gold3)); transition:width .9s var(--e3)}

/* ══ بطاقات الأدلة ══ */
.gcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:13px}
.gcard{position:relative; display:flex; flex-direction:column;
  padding:15px 15px 0; border-radius:16px; overflow:hidden;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  animation:trin .55s var(--e3) both;
  transition:transform .26s var(--e3), box-shadow .26s var(--e3)}
.gcard:hover{transform:translateY(-3px); box-shadow:inset 0 0 0 1px var(--line2), var(--lift)}
.gtop{position:absolute; inset-inline:0; top:0; height:3px; opacity:.9}
.mrow{display:flex; flex-wrap:wrap; gap:6px}
.mchip{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700;
  padding:4px 9px; border-radius:8px; color:var(--dim); background:var(--sheen2)}
.gcard .pfoot{margin-top:auto; padding-top:12px}
.gcard .mrow{margin-bottom:2px}

/* ══ خطوات الدليل ══ */
.steps{display:flex; flex-direction:column; gap:7px}
.step{display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:12px;
  background:var(--sheen); animation:trin .45s var(--e3) both}
.sn{width:24px; height:24px; border-radius:8px; flex:none; display:grid; place-items:center;
  font-size:11px; font-weight:700; color:var(--onGold);
  background:linear-gradient(150deg,var(--g3),var(--g2))}
.step .nm b{font-size:12.5px; font-weight:400; line-height:1.6}

/* ══ بطاقة وردية ══ */
.shift{display:flex; flex-direction:column; align-items:flex-start; padding:15px; border-radius:15px;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line)}
.shift .ico{margin-bottom:11px}
.shift b{font-size:14px; display:block}
.shift .meter{width:100%}
.swapfaces{gap:6px; flex:none}
.swapfaces .arrow{color:var(--gold2); display:grid; place-items:center}
.prow.swap{align-items:flex-start}

/* ══ السجل: خطّ زمني ══ */
/* السكة عند بداية السطر — أي اليمين في العربية */
.tline{position:relative; padding-inline-start:46px}
.tline::before{content:""; position:absolute; inset-block:10px; inset-inline-start:22px; width:2px;
  border-radius:2px; background:linear-gradient(180deg,var(--gold2),var(--line),transparent)}
.tev{position:relative; display:flex; gap:13px; padding:11px 0;
  animation:land .5s var(--e3) both}
.tdot{position:absolute; inset-inline-start:-38px; top:11px; width:30px; height:30px; border-radius:50%;
  display:grid; place-items:center; z-index:2; background:var(--panel);
  box-shadow:0 0 0 3px var(--panel), inset 0 0 0 1px var(--line2)}
.tdot.live{color:var(--pLiveT)} .tdot.no{color:var(--pNoT)} .tdot.wait{color:var(--pWaitT)}
.tdot.gold{color:var(--pGoldT)} .tdot.blue{color:var(--pBlueT)} .tdot.grey{color:var(--dim2)}
.tbody{flex:1; min-width:0; padding:2px 0}
.tbody .tiny{display:block; margin-top:5px}


/* ═══════════════════════════════════════════════════
   أنواع المهام · التشكيل والتسكين
   ═══════════════════════════════════════════════════ */

/* ══ مبدّل الأنواع الأربعة ══ */
.tswitch{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
@media (max-width:1180px){ .tswitch{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tcard{display:flex; align-items:center; gap:12px; padding:14px 15px; border-radius:var(--r);
  text-align:right; position:relative; overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--deep)); border:var(--cardEdge);
  box-shadow:var(--shadow); color:var(--dim);
  transition:transform .3s var(--e3), box-shadow .3s var(--e3), color .2s var(--e)}
.tcard:hover{transform:translateY(-3px); box-shadow:var(--lift); color:var(--ink)}
.tcard:active{transform:scale(.985)}
.tcard::before{content:""; position:absolute; inset-inline:0; top:0; height:3px; opacity:0;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  transition:opacity .3s var(--e)}
.tcard.on{color:var(--ink); box-shadow:var(--lift), inset 0 0 0 1px var(--gold2)}
.tcard.on::before{opacity:1}
.tico{width:40px; height:40px; border-radius:13px; flex:none; display:grid; place-items:center;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line)}
.tcard.on .tico{background:var(--sheen2)}
.tcard .nm b{font-size:13.5px} .tcard .nm span{font-size:10.5px; line-height:1.5}
.tn{font-size:19px; font-weight:700; letter-spacing:-.6px; flex:none;
  font-variant-numeric:tabular-nums; color:var(--dim2)}
.tcard.on .tn{color:var(--gold2)}

/* ══ مزامنة نظام خارجي ══ */
.synced{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--live);
  padding:4px 10px; border-radius:99px; background:var(--pLiveB)}
.synced .ic{animation:spin 8s linear infinite}

/* ══ خطوات الخدمة ══ */
.steps2{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.st2{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700;
  padding:5px 10px; border-radius:9px; color:var(--dim2); background:var(--sheen)}
.st2 i{width:7px; height:7px; border-radius:50%; background:var(--line2); flex:none}
.st2.done{color:var(--pLiveT); background:var(--pLiveB)}
.st2.done i{background:var(--live)}
.st2.now{color:var(--pWaitT); background:var(--pWaitB)}
.st2.now i{background:var(--amber); animation:tick 2s var(--e) infinite}

/* ══ كتلة سؤال في لوحة القالب ══ */
.qblock{padding:13px 0; border-bottom:1px solid var(--line)}
.qblock:last-child{border-bottom:0}
.qblock .bars{height:96px}

/* ══ مسار الزيارات ══ */
.visits{display:flex; flex-direction:column; gap:8px}
.vis{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:12px;
  background:var(--sheen)}
.vis.on{box-shadow:inset 0 0 0 1px var(--gold2)}
.vis > b{width:24px; height:24px; border-radius:8px; flex:none; display:grid; place-items:center;
  font-size:11px; color:var(--onGold); background:linear-gradient(150deg,var(--gold2),var(--gold))}
.vis .meter{flex:1}

/* ══════════ لوح التشكيل ══════════ */
.board3{display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:16px; align-items:start}
@media (max-width:1420px){ .board3{grid-template-columns:1fr 1fr} .buildbox{grid-column:1/-1; order:-1} }
@media (max-width:980px){ .board3{grid-template-columns:1fr} }
.card.src{max-height:760px; overflow:auto; padding-top:18px}
.card.src::-webkit-scrollbar{width:8px}
.card.src::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.srcgrp{margin-bottom:18px}
.slab{display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:700;
  color:var(--faint); letter-spacing:.3px; margin:0 2px 9px}
.slab .cnt{font-style:normal; margin-inline-start:auto; font-size:10px; padding:1px 7px;
  border-radius:99px; background:var(--sheen2); color:var(--dim2)}

.pcard{display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; margin-bottom:7px;
  border-radius:13px; text-align:right; color:var(--dim); background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .2s var(--e), background .2s var(--e), box-shadow .2s var(--e)}
.pcard:hover{transform:translateX(-3px); color:var(--ink); background:var(--sheen2);
  box-shadow:inset 0 0 0 1px var(--gold2)}
.pcard:active{transform:scale(.985)}
.pcard.off{opacity:.42; cursor:not-allowed}
.pcard.off:hover{transform:none; box-shadow:inset 0 0 0 1px var(--line)}
.pcard .nm b{font-size:12.5px} .pcard .nm span{font-size:10.5px}

/* ══ الصندوق ══ */
.buildbox{position:sticky; top:0}
.cnt2{font-size:12px; font-weight:700; padding:4px 12px; border-radius:99px;
  color:var(--dim2); background:var(--sheen2); font-variant-numeric:tabular-nums}
.cnt2.ok{color:var(--onGold); background:linear-gradient(150deg,var(--g3),var(--g2))}
.slot{display:flex; align-items:center; gap:11px; min-height:56px; padding:9px 12px;
  border-radius:14px; margin-bottom:8px;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:box-shadow .26s var(--e), background .26s var(--e)}
.slot.lead{background:var(--pGoldB); box-shadow:inset 0 0 0 1px var(--gold2)}
.slot.full{box-shadow:inset 0 0 0 1px var(--line2); background:var(--panel2)}
.slot .sl{font-size:10.5px; font-weight:700; color:var(--dim2); min-width:56px; flex:none}
.slot.lead .sl{color:var(--pGoldT)}
.slot .ph{font-size:11.5px; color:var(--faint)}
.slot .nm b{font-size:12.5px} .slot .nm span{font-size:10.5px}
.slots{margin-bottom:14px}
.xbtn{width:26px; height:26px; border-radius:9px; flex:none; display:grid; place-items:center;
  color:var(--dim2); transition:all .18s var(--e)}
.xbtn:hover{color:var(--red); background:color-mix(in srgb,var(--red) 12%,transparent)}
.spec{font:inherit; font-size:11px; font-weight:700; color:var(--dim); padding:5px 8px;
  border-radius:9px; border:0; outline:0; flex:none; max-width:104px;
  background:var(--sheen2); box-shadow:inset 0 0 0 1px var(--line)}
.pickrow{margin-bottom:12px}
.pickrow .sl{display:block; font-size:10.5px; font-weight:700; color:var(--dim2); margin:0 2px 8px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn[disabled]:hover{transform:none; box-shadow:0 0 0 1px var(--hair)}

/* ══ المجموعات القائمة ══ */
.gitem{padding:13px; border-radius:15px; margin-bottom:10px;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:box-shadow .26s var(--e), transform .24s var(--e)}
.gitem:hover{transform:translateX(-3px); box-shadow:inset 0 0 0 1px var(--line2)}
.gitem.on{box-shadow:inset 0 0 0 1px var(--gold2)}
.faces{display:flex; gap:-6px; margin:11px 0 0; padding:0 2px}
.fw{margin-inline-start:-9px; border-radius:50%; transition:transform .22s var(--e2)}
.fw:first-child{margin-inline-start:0}
.fw:hover{transform:translateY(-3px) scale(1.08); z-index:2}
.gitem .pfoot{margin-top:11px}

/* ══ الفنادق ══ */
.hotel{padding:15px; border-radius:16px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line)}
.hgroups{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding-top:12px;
  border-top:1px solid var(--line)}
.hchip{display:inline-flex; align-items:center; gap:8px; padding:6px 11px 6px 8px;
  border-radius:99px; background:var(--sheen2)}


/* ═══════════════════════════════════════════════════
   الفلاتر · المسار · المرفقات · شاشة الدخول
   ═══════════════════════════════════════════════════ */

/* ══ صفّ الفلاتر ══ */
.fbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:15px}
.fbar .find{flex:1 1 240px; min-width:200px}
.fsp{flex:1}
.fcount{font-size:11.5px; color:var(--dim2); white-space:nowrap}
.fcount b{color:var(--ink); font-variant-numeric:tabular-nums}
.fsel{position:relative; display:inline-flex; align-items:center; gap:7px; height:42px;
  padding:0 12px 0 34px; border-radius:13px; cursor:pointer; flex:none;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:box-shadow .24s var(--e), background .24s var(--e)}
.fsel:hover{background:var(--sheen2)}
.fsel.on{box-shadow:inset 0 0 0 1px var(--gold2); background:var(--pGoldB)}
.fsel > span{font-size:10.5px; font-weight:700; color:var(--dim2); white-space:nowrap}
.fsel.on > span{color:var(--pGoldT)}
select{color-scheme:inherit}
.fsel select option, .spec option{background:var(--panel); color:var(--ink)}
.fsel select{appearance:none; -webkit-appearance:none; border:0; outline:0; background:none;
  font:inherit; font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer;
  max-width:150px; text-overflow:ellipsis; padding:0}
.fsel .ic{position:absolute; inset-inline-start:12px; color:var(--dim2);
  transform:rotate(90deg); pointer-events:none}

/* ══ مسار الخطوات في الدرج ══ */
.wf{display:flex; flex-direction:column; gap:0}
.wfs{display:flex; align-items:center; gap:12px; padding:10px 0; position:relative}
.wfs::before{content:""; position:absolute; inset-inline-start:14px; top:32px; bottom:-4px; width:2px;
  background:var(--line)}
.wfs:last-child::before{display:none}
.wfn{width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; z-index:2;
  color:var(--dim2); background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line)}
.wfs.done .wfn{color:#fff; background:linear-gradient(150deg,var(--g3),var(--g2)); box-shadow:none}
.wfs.done::before{background:var(--g3)}
.wfs.now .wfn{color:var(--onGold); background:linear-gradient(150deg,var(--gold3),var(--gold));
  box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent);
  animation:tick 2.2s var(--e) infinite}
.wfs .nm b{font-size:12.5px}
.wfs.done .nm b{color:var(--dim)}
.wfs.now .nm b{color:var(--ink)}

/* ══ المرفقات ══ */
.fpick{display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:12px;
  font-size:12px; font-weight:700; color:var(--dim); cursor:pointer;
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:all .2s var(--e)}
.fpick:hover{color:var(--ink); background:var(--sheen2); box-shadow:inset 0 0 0 1px var(--gold2)}
.fchip{display:inline-flex; align-items:center; gap:8px; margin-inline-start:9px;
  padding:7px 12px; border-radius:11px; font-size:11.5px;
  background:var(--pGoldB); color:var(--pGoldT)}
.fchip b{font-weight:700; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fchip span{opacity:.75; font-variant-numeric:tabular-nums}

/* ══ إضافة سؤال ══ */
.qadd{margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}
.prow .sn{width:26px; height:26px; border-radius:9px; flex:none; display:grid; place-items:center;
  font-size:11px; font-weight:700; color:var(--onGold);
  background:linear-gradient(150deg,var(--g3),var(--g2))}
.prow.pick{cursor:pointer; text-align:right}
.prow.pick:hover{box-shadow:var(--lift), inset 0 0 0 1px var(--gold2)}
.prow.pick[disabled]{opacity:.45; cursor:not-allowed}

/* ══ قائمة بيانات في البروفايل ══ */
.kvlist{display:flex; flex-direction:column}
.kv2{display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line)}
.kv2:last-child{border-bottom:0}
.kv2 .ico.sm{width:28px; height:28px; border-radius:9px}
.kv2 .k{font-size:11.5px; color:var(--dim2); min-width:66px}
.kv2 b{font-size:12.5px; flex:1; text-align:left}

/* ══ شاشة الدخول ══ */
#gate{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:24px;
  background:var(--void); overflow:auto}
#gate .gwrap{width:min(420px,100%); position:relative; z-index:2;
  animation:rise .7s var(--e3) both}
#gate .gbrand{display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:26px}
#gate .gmark{width:76px; height:76px; border-radius:24px; display:grid; place-items:center;
  background:var(--markBg); box-shadow:0 0 0 1px var(--hair), 0 24px 50px -20px rgba(0,0,0,.7);
  animation:gmark 1.1s var(--e2) both}
@keyframes gmark{from{opacity:0; transform:translateY(-14px) rotate(-12deg) scale(.8)}
  to{opacity:1; transform:none}}
#gate .gmark i{display:block; width:40px; height:40px; background-size:contain;
  background-repeat:no-repeat; background-position:center}
#gate h1{font-size:24px; margin:0; letter-spacing:-.8px; text-align:center}
#gate .gsub{font-size:12.5px; color:var(--dim2); text-align:center}
#gate .gcard{padding:26px 24px; border-radius:var(--r2);
  background:linear-gradient(180deg,var(--panel),var(--deep));
  border:var(--cardEdge); box-shadow:var(--shadow)}
#gate .gcard::before{content:""; display:block; height:2px; margin:-26px -24px 22px;
  border-radius:2px 2px 0 0;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
#gate .roles{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:16px}
#gate .role{display:flex; flex-direction:column; align-items:flex-start; gap:5px; padding:13px;
  border-radius:14px; text-align:right; color:var(--dim);
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:all .24s var(--e)}
#gate .role:hover{color:var(--ink); background:var(--sheen2)}
#gate .role.on{color:var(--ink); box-shadow:inset 0 0 0 1px var(--gold2); background:var(--pGoldB)}
#gate .role b{font-size:13px} #gate .role span{font-size:10.5px}
#gate .gfoot{display:flex; align-items:center; justify-content:center; gap:9px; margin-top:20px;
  font-size:10.5px; color:var(--faint)}
#gate .gtheme{position:fixed; top:20px; inset-inline-start:20px; z-index:3}
@media (max-width:520px){ #gate .roles{grid-template-columns:1fr} }

/* ══ بطاقة فريق تُطوى وتُفتح ══ */
.teamhead{width:100%; text-align:right; gap:12px}
.teamhead .chev{color:var(--dim2); transition:transform .3s var(--e2)}
.teamcard.open .teamhead .chev{transform:rotate(90deg); color:var(--gold2)}
.teamcard{transition:box-shadow .3s var(--e3)}
.teamcard.open{box-shadow:var(--lift), inset 0 0 0 1px var(--gold2)}

/* ══ معاينة النموذج كما يُعبَّأ في الميدان ══ */
.fprev{padding:15px; border-radius:15px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line)}
.fpt{margin-bottom:12px}
.fpt b{display:block; font-size:14px}
.fpt span{display:block; font-size:10.5px; color:var(--dim2)}
.fq{padding:11px 0; border-top:1px solid var(--line)}
.fq > b{display:block; font-size:12.5px; font-weight:700; margin-bottom:9px; line-height:1.7}
.fq .req{color:var(--red); font-style:normal}
.fq .chips .chip2{cursor:default}
.fq .stars .ic{fill:var(--starOff); stroke:none}
.fbox{display:flex; align-items:center; gap:9px; padding:11px 13px; border-radius:11px;
  font-size:11.5px; color:var(--dim2); background:var(--panel2);
  box-shadow:inset 0 0 0 1px var(--line)}
.fbox.num{font-variant-numeric:tabular-nums; letter-spacing:2px}
.fbox.photo{border:1.5px dashed var(--line2); box-shadow:none; background:none}
.fbox.sign{color:var(--pGoldT); background:var(--pGoldB);
  box-shadow:inset 0 0 0 1px var(--gold2)}
.pledge{display:flex; align-items:flex-start; gap:10px; margin-top:13px; padding:12px 14px;
  border-radius:13px; font-size:11.5px; line-height:1.8;
  color:var(--pGoldT); background:var(--pGoldB); box-shadow:inset 0 0 0 1px var(--gold2)}
.ico.sm{width:26px; height:26px; border-radius:9px}

bdi.ltr{unicode-bidi:isolate; direction:ltr}

/* ══ شبكة منح الشاشات ══ */
.permgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:8px}
.pchk{display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:12px;
  text-align:right; color:var(--dim); background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line); transition:all .2s var(--e)}
.pchk:hover{color:var(--ink); background:var(--sheen2)}
.pchk b{font-size:12px; flex:1; font-weight:700}
.pchk .box{width:20px; height:20px; border-radius:7px; flex:none; display:grid;
  place-items:center; box-shadow:inset 0 0 0 1.5px var(--line2); color:var(--onGold)}
.pchk.on{color:var(--ink); box-shadow:inset 0 0 0 1px var(--gold2); background:var(--pGoldB)}
.pchk.on .box{background:linear-gradient(150deg,var(--g3),var(--g2)); box-shadow:none}
.prow.pick.on{box-shadow:inset 0 0 0 1px var(--gold2); background:var(--pGoldB)}
/* البوّابة الأوسع: اثنتا عشرة صفة */
#gate .gwrap.wide{width:min(560px,100%)}
#gate .roles{grid-template-columns:1fr 1fr; gap:8px}
#gate .role{gap:6px}
.whobox{margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}
.fsel.wide{width:100%; justify-content:space-between}
.fsel.wide select{max-width:none; flex:1; text-align:left}
.gnote{display:flex; align-items:flex-start; gap:9px; margin-top:14px; padding:11px 13px;
  border-radius:12px; font-size:11.5px; line-height:1.8; color:var(--dim);
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line)}

/* ══ خطوات التسكين الثلاث ══ */
.asgsteps{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
@media (max-width:1080px){ .asgsteps{grid-template-columns:1fr} }
.astep{display:flex; align-items:center; gap:12px; padding:14px 15px; border-radius:var(--r);
  text-align:right; position:relative; overflow:hidden; color:var(--dim);
  background:linear-gradient(180deg,var(--panel),var(--deep)); border:var(--cardEdge);
  box-shadow:var(--shadow); transition:all .3s var(--e3)}
.astep:hover{transform:translateY(-3px); box-shadow:var(--lift); color:var(--ink)}
.astep.on{color:var(--ink); box-shadow:var(--lift), inset 0 0 0 1px var(--gold2)}
.astep .an{width:26px; height:26px; border-radius:9px; flex:none; display:grid;
  place-items:center; font-size:12px; font-weight:700; color:var(--dim2);
  background:var(--sheen2)}
.astep.on .an{color:var(--onGold); background:linear-gradient(150deg,var(--gold3),var(--gold))}
.astep .nm{flex:1} .astep .nm b{font-size:13px} .astep .nm span{font-size:10.5px}
.astep .ae{flex:none; text-align:left; min-width:64px}
.astep .ae b{display:block; font-size:12px}
.astep .ae .meter{margin-top:5px; width:60px}
/* ══ مقاعد المجموعة ══ */
.gseat{padding:14px; border-radius:16px; margin-bottom:11px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line)}
/* المقعد يحمل اسمًا وتخصّصًا وشِفتًا — و١٦٨ بكسلًا تقصّ الاسم.
   خمسةٌ في صفٍّ من ثلاثة أوضح من خمسةٍ مقصوصة في أربعة. */
.seats{display:grid; grid-template-columns:repeat(auto-fill,minmax(216px,1fr)); gap:8px}
.seat{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:12px;
  text-align:right; color:var(--dim2); background:var(--panel2);
  box-shadow:inset 0 0 0 1px var(--line); transition:all .2s var(--e)}
.seat:hover{color:var(--ink); box-shadow:inset 0 0 0 1px var(--gold2)}
.seat.full{color:var(--ink)}
.seat .nm{flex:1; min-width:0}
.seat .nm b{display:block; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seat .nm span{display:block; font-size:10px; color:var(--dim2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seat .x{background:transparent; border:0; cursor:pointer; padding:0}
.seat .plus{width:32px; height:32px; border-radius:11px; flex:none; display:grid;
  place-items:center; border:1.5px dashed var(--line2)}
.seat .x{color:var(--dim2); flex:none; opacity:0; transition:opacity .2s var(--e)}
.seat.full:hover .x{opacity:1; color:var(--red)}


/* ═══════════════════════════════════════════════════
   الحاويات · الهوية · العفاشة · النقل
   ═══════════════════════════════════════════════════ */

/* ══ حاوية في القائمة ══ */
.grpnav .chev{color:var(--navFaint); flex:none; transition:transform .3s var(--e2)}
.grpnav.open .chev{transform:rotate(90deg); color:var(--gold2)}
.grpnav.inside:not(.on){color:var(--navInk)}
.grpnav.inside::before{opacity:.45}
.side.mini .grpnav .chev{display:none}

/* ══ هوية الداخل في الشريط ══ */
.who{display:flex; align-items:center; gap:9px; padding:5px 11px 5px 7px; border-radius:99px;
  flex:none; max-width:210px; color:var(--dim);
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:all .22s var(--e)}
.who:hover{color:var(--ink); background:var(--sheen2); box-shadow:inset 0 0 0 1px var(--gold2)}
.who .nm{min-width:0; text-align:right}
.who .nm b{display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.who .nm span{display:block; font-size:10px; color:var(--dim2); white-space:nowrap}
.who .ic{flex:none; opacity:.6}
.who .av{width:30px; height:30px}
@media (max-width:1180px){ .who .nm{display:none} .who{max-width:none; padding:5px} }

/* ══ حالة الرسالة النصية ══ */
.smsbox{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:500;
  padding:4px 10px; border-radius:99px; flex:none;
  color:var(--dim2); background:var(--sheen2)}
.smsbox.live{color:var(--pLiveT); background:var(--pLiveB)}
.smsbox.wait{color:var(--pWaitT); background:var(--pWaitB)}
.smsbox.no{color:var(--pNoT); background:var(--pNoB)}
.smsbox.grey{color:var(--dim2); background:var(--sheen2)}

/* ══ شريط أيام الموسم ══ */
.daystrip{display:flex; gap:9px; overflow-x:auto; padding-bottom:6px}
.daystrip::-webkit-scrollbar{height:6px}
.daystrip::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.dchip{flex:none; min-width:96px; padding:11px 13px; border-radius:14px; text-align:center;
  color:var(--dim); background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:all .22s var(--e)}
.dchip:hover{color:var(--ink); background:var(--sheen2)}
.dchip.on{color:var(--ink); box-shadow:inset 0 0 0 1px var(--gold2); background:var(--pGoldB)}
.dchip.today b::after{content:"•"; color:var(--live); margin-inline-start:5px}
.dchip b{display:block; font-size:12.5px; font-weight:600}
.dchip span{display:block; font-size:10px; color:var(--dim2); margin-top:2px}
.dchip i{display:inline-block; margin-top:6px; font-style:normal; font-size:10px;
  padding:1px 8px; border-radius:99px; background:var(--sheen2)}
.dchip.on i{background:var(--panel)}

/* ══ مسار الباصات ══ */
.gantt{margin-top:4px}
.ghead{position:relative; height:20px; margin-inline-start:74px; margin-bottom:6px}
.ghead span{position:absolute; transform:translateX(50%); font-size:9.5px; color:var(--faint);
  white-space:nowrap}
.grow{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.glabel{width:64px; flex:none; display:flex; align-items:center; gap:7px;
  padding-inline-start:8px; border-inline-start:3px solid var(--bc); border-radius:2px}
.glabel b{font-size:11.5px; font-weight:600}
.glabel span{font-size:9.5px; color:var(--dim2); font-variant-numeric:tabular-nums}
.gtrack{position:relative; flex:1; height:32px; border-radius:9px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line); overflow:hidden}
.gnow{position:absolute; inset-block:0; width:2px; background:var(--red); z-index:3;
  box-shadow:0 0 10px 1px color-mix(in srgb,var(--red) 70%,transparent)}
.gtrip{position:absolute; inset-block:4px; border-radius:6px; overflow:hidden;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
  font-size:9px; font-weight:600; color:#fff; white-space:nowrap;
  background:var(--bc); opacity:.9; transition:all .2s var(--e)}
.gtrip:hover{opacity:1; transform:scaleY(1.12); z-index:4;
  box-shadow:0 4px 14px -4px rgba(0,0,0,.7)}
.gtrip span{overflow:hidden; text-overflow:ellipsis}
.gtrip.done{opacity:.42}
.gtrip.late{box-shadow:inset 0 0 0 1.5px var(--red)}
.gtrip.running{box-shadow:0 0 0 1.5px var(--live), 0 0 14px -2px var(--live)}

/* ══ بطاقة باص ══ */
.busbox{padding:14px; border-radius:16px; background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line); border-inline-start:3px solid var(--bc)}

/* ══ شبكة الصلاحيات ══ */
.permgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:8px}
.pchk{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:12px;
  text-align:right; color:var(--dim); background:var(--sheen);
  box-shadow:inset 0 0 0 1px var(--line); transition:all .2s var(--e)}
.pchk:hover{color:var(--ink); background:var(--sheen2)}
.pchk.on{color:var(--ink); box-shadow:inset 0 0 0 1px var(--gold2); background:var(--pGoldB)}
.pchk b{font-size:11.5px; font-weight:600; flex:1}
.pchk .box{width:18px; height:18px; border-radius:6px; flex:none; display:grid; place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--line2)}
.pchk.on .box{color:var(--onGold); box-shadow:none;
  background:linear-gradient(150deg,var(--gold2),var(--gold))}
.fsel.wide{width:100%; justify-content:space-between}
.fsel.wide select{max-width:none; flex:1}
.whobox{margin-top:6px}
.gnote{display:flex; align-items:flex-start; gap:9px; margin-top:14px; padding:11px 13px;
  border-radius:12px; font-size:11.5px; line-height:1.8;
  color:var(--dim); background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line)}
.gwrap.wide{width:min(560px,100%)}

/* ══ وجهات الإشعار ══ */
.dests{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px}
@media (max-width:900px){ .dests{grid-template-columns:1fr} }
.dest{display:flex; flex-direction:column; align-items:flex-start; gap:5px; padding:12px;
  border-radius:14px; text-align:right; color:var(--dim);
  background:var(--sheen); box-shadow:inset 0 0 0 1px var(--line);
  transition:all .24s var(--e)}
.dest:hover{color:var(--ink); background:var(--sheen2)}
.dest.on{color:var(--ink); box-shadow:inset 0 0 0 1px var(--dc);
  background:color-mix(in srgb,var(--dc) 10%,transparent)}
.dest b{font-size:12.5px} .dest span{font-size:10px; line-height:1.6}
/* ══ مفتاح تشغيل ══ */
.tgl{width:42px; height:24px; border-radius:99px; flex:none; position:relative;
  background:var(--sheen2); box-shadow:inset 0 0 0 1px var(--line2);
  transition:background .26s var(--e)}
.tgl i{position:absolute; top:3px; inset-inline-start:3px; width:18px; height:18px;
  border-radius:50%; background:var(--dim2);
  transition:inset-inline-start .28s var(--e2), background .26s var(--e)}
.tgl.on{background:color-mix(in srgb,var(--live) 22%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--live) 45%,transparent)}
.tgl.on i{inset-inline-start:21px; background:var(--live)}

/* ══ شبكة اللوحة المخصَّصة — لا تُسمَّ dash فذاك صنف خطوط الخريطة ══ */
.dashgrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px;
  align-items:start}
.dw{min-width:0; animation:rise .55s var(--e3) both}
.dw.w1{grid-column:span 1} .dw.w2{grid-column:span 2}
.dw.w3{grid-column:span 3} .dw.w4{grid-column:span 4}
.dw > .card{margin:0; height:100%}
@media (max-width:1500px){ .dashgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dw.w3,.dw.w4{grid-column:span 3} }
@media (max-width:1180px){ .dashgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dw.w2,.dw.w3,.dw.w4{grid-column:span 2} }
@media (max-width:760px){ .dashgrid{grid-template-columns:1fr}
  .dw,.dw.w2,.dw.w3,.dw.w4{grid-column:span 1} }

/* ══ أشرطة اللوحة — كل شريط متجانس فلا تتمزّق الحوافّ ══ */
.band{display:block}
.bandhead{display:flex; align-items:center; gap:10px; margin:2px 2px 11px}
.bandhead span{font-size:10.5px; font-weight:600; color:var(--faint); letter-spacing:.4px;
  white-space:nowrap}
.bandhead::after{content:""; flex:1; height:1px;
  background:linear-gradient(90deg,var(--line2),transparent)}
.bandgrid{display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  gap:16px; grid-auto-flow:dense; align-items:stretch}
.dw{min-width:0; height:var(--wh); animation:rise .5s var(--e3) both}
.dw.w1{grid-column:span 1} .dw.w2{grid-column:span 2} .dw.w3{grid-column:span 3}
/* البطاقة تملأ خانتها، وجسمها هو ما يُمرَّر */
.dw > .card{height:100%; display:flex; flex-direction:column; overflow:hidden}
.dw > .card > .h{flex:none}
.wbody{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden}
.wbody::-webkit-scrollbar{width:6px}
