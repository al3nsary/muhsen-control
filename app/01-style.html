.wbody::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.dw .tbl{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden}
.dw .tbl::-webkit-scrollbar{width:6px}
.dw .tbl::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.dw .tbl .th{position:sticky; top:0; z-index:2; background:var(--panel)}
.dw .queue .qlist{flex:1; min-height:0; overflow-y:auto}
.dw .gantt{flex:1; min-height:0; overflow-y:auto}
.dw .heat{flex:1; min-height:0; overflow:auto}
.dw .map{height:100%; min-height:230px}
/* ما زاد عن صندوقه كان يُقطع في منتصف سطرٍ فيبدو معطوبًا. التلاشي
   يقول «تحتَه مزيد» بدل أن يقول «انكسر هنا». */
.dw > .card{position:relative}
/* العريض: سقفٌ للجسد لا قالبٌ للبطاقة — فالقصير يقصر والطويل يُمرَّر */
.band.bwide .dw{height:auto}
.band.bwide .wbody{max-height:410px}
.dw .wbody{-webkit-mask:linear-gradient(#000 calc(100% - 26px), #0000);
        mask:linear-gradient(#000 calc(100% - 26px), #0000)}
.dw .wbody.full{-webkit-mask:none; mask:none}
.dw .donutwrap{justify-content:center; height:100%; gap:12px}
.dw .donut{width:min(168px,80%); height:auto; aspect-ratio:1}
/* بطاقةٌ عريضة وحلقةٌ صغيرة وسطها = فراغٌ مهيب. فإذا اتّسع الصندوق
   اصطفّت الحلقة ومفتاحُها جنبًا إلى جنب وملآه. */
.dw.wide2 .donutwrap{flex-direction:row; justify-content:center; gap:34px; align-items:center}
.dw.wide2 .donut{width:min(200px,42%)}
.dw.wide2 .donutwrap .legend{flex-direction:column; align-items:flex-start; gap:9px}
.dw.wide2 .donutwrap .legend span{font-size:12.5px}

/* شريط اليوم: قطعةٌ لكل حالة بعرض نصيبها */
/* ما ينقص يُكتب بلونه لا بحبّةٍ مجاوِرة */
.prow .miss{display:flex; align-items:center; gap:4px; margin-top:5px; font-size:10.5px;
  color:var(--amber); line-height:1.5}
.prow .miss b{font-weight:800}

.dayline{display:flex; gap:3px; height:26px; border-radius:9px; overflow:hidden;
  background:var(--sheen); margin-top:6px}
.dseg{display:block; border-radius:4px; min-width:6px;
  animation:growx .7s var(--e3) both; transform-origin:right}
@keyframes growx{from{transform:scaleX(0)} to{transform:none}}
.dw .bars{height:100%; min-height:120px}
.dw .chart{height:100%; display:flex; flex-direction:column; justify-content:flex-end}
@media (max-width:1500px){ .band{--cols:min(3,var(--cols))}
  .bandgrid{grid-template-columns:repeat(min(3,var(--cols)),minmax(0,1fr))} }
@media (max-width:1180px){ .bandgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dw.w2,.dw.w3{grid-column:span 2} }
@media (max-width:760px){ .bandgrid{grid-template-columns:1fr}
  .dw,.dw.w2,.dw.w3{grid-column:span 1} }
/* ══ مقياس نصف دائري ══ */
.gauge{position:relative; display:grid; place-items:center; height:100%}
.gauge svg{width:100%; max-width:210px; overflow:visible}
.gv{position:absolute; bottom:6px; text-align:center}
.gv b{display:block; font-size:30px; font-weight:700; letter-spacing:-1.2px;
  font-variant-numeric:tabular-nums}
.gv span{display:block; font-size:10.5px; color:var(--dim2)}
/* ══ خريطة الكثافة ══ */
.heat{overflow-x:auto; padding-bottom:4px}
.hhead,.hrow{display:grid; grid-template-columns:34px repeat(12,minmax(24px,1fr)); gap:3px;
  align-items:center; margin-bottom:3px; min-width:520px}
.hhead span{font-size:9px; color:var(--faint); text-align:center}
.hl{font-size:10.5px; color:var(--dim2); font-weight:600}
.hc{height:26px; border-radius:6px; display:grid; place-items:center; font-size:9.5px;
  font-weight:600; color:var(--onGold);
  background:color-mix(in srgb, var(--g3) calc(var(--v) * 92%), var(--sheen));
  transition:transform .18s var(--e)}
.hc:hover{transform:scale(1.14); z-index:2}
.hrow.today .hl{color:var(--gold2)}
.hrow.today .hc{box-shadow:inset 0 0 0 1px var(--gold2)}

/* ══ المهمّة كاملةً ══════════════════════════════════════════
   سطر المهمة صار يحمل عدّاداته ونسبتيه، ودرجُها يُوسَّع لأن
   بياناته لا تسع أربعمئة بكسل. */

/* حلقة النسبة: القوس لونه من الحالة، والرقم في قلبه */
.tring{position:relative; display:inline-grid; place-items:center; flex:none}
/* القوس تدرّجٌ مخروطي، والقناع يثقب وسطه فيظهر ما تحته أيًّا كان لونه.
   وهذا أرخص من SVG بأربع عقد لكل حلقة، والجدول فيه مئات. */
.tring i{position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(var(--rc,var(--gold2)) calc(var(--p,0) * 1%), var(--line2) 0);
  /* closest-side لازم: بدونه يقيس التدرّج إلى أبعد ركن فيصير الثقب
     أوسع من العنصر — فتختفي الحلقة أو تمتلئ قرصًا. */
  -webkit-mask:radial-gradient(circle closest-side, #0000 calc(100% - 3.4px), #000 calc(100% - 3px));
          mask:radial-gradient(circle closest-side, #0000 calc(100% - 3.4px), #000 calc(100% - 3px))}
.tring b{position:relative; z-index:1; font-size:10.5px; font-weight:700; color:var(--ink); line-height:1}
.tring b::after{content:'٪'; font-size:8px; color:var(--dim2); margin-inline-start:1px}

/* عدّادات السطر: أيقونة ورقم، متساوية العرض فتُقرأ عموديًّا */
.tcnts{display:flex; align-items:center; gap:5px; flex:none}
.tcnt{display:inline-flex; align-items:center; gap:3px; padding:4px 7px; border-radius:9px;
  background:var(--sheen); color:var(--dim2); min-width:44px; justify-content:center}
.tcnt b{font-size:11.5px; font-weight:700; color:var(--ink)}
.tcnt.ok{color:var(--live)} .tcnt.ok b{color:var(--live)}
.tcnt.warn{background:color-mix(in srgb,var(--red) 14%,transparent); color:var(--red)}
.tcnt.warn b{color:var(--red)}
.tprogs{display:flex; align-items:center; gap:12px; flex:none}
.tprogs .tp{display:flex; flex-direction:column; align-items:center; gap:4px;
  white-space:nowrap; min-width:54px}
.trow .krail{width:4px}
.lgd{display:inline-block; width:8px; height:8px; border-radius:3px;
  margin-inline-end:3px; margin-inline-start:7px; vertical-align:-1px}

/* حقل تاريخ في شريط الفلاتر */
.fsel.fdate{position:relative}
.fsel.fdate .dv{font-size:12px; font-weight:600; color:var(--ink)}
.fsel.fdate:not(.on) .dv{color:var(--dim2); font-weight:500}
.fsel.fdate input{position:absolute; inset:0; width:100%; height:100%; opacity:0;
  cursor:pointer; border:0; padding:0}

/* أقسام الدرج المطويّة */
.xfold{border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--panel)}
.xfold.on{border-color:var(--line2)}
.xfold .xh{display:flex; align-items:center; gap:10px; width:100%; padding:13px 14px;
  background:transparent; border:0; color:var(--ink); font:inherit; cursor:pointer; text-align:right}
.xfold .xh:hover{background:var(--sheen)}
.xfold .xh .sp{flex:1; min-width:0}
.xfold .xh .sp b{display:block; font-size:13.5px}
.xfold .xh > svg:last-child{transition:transform .25s var(--e); flex:none}
.xfold.on .xh > svg:last-child{transform:rotate(180deg)}
.xfold .xb{padding:0 14px 14px; border-top:1px solid var(--line);
  animation:fade .3s var(--e3) both}

/* المتطلّبات: مربّع تشييك يملؤه الكنترول بنفسه */
.reqs{display:flex; flex-direction:column; gap:7px; margin-top:12px}
.req{display:flex; align-items:flex-start; gap:10px; width:100%; padding:10px 11px;
  border-radius:13px; background:var(--sheen); border:1px solid transparent; color:var(--ink);
  font:inherit; cursor:pointer; text-align:right}
.req:hover{border-color:var(--line2)}
.req .tick{width:19px; height:19px; border-radius:7px; border:1.6px solid var(--line2);
  flex:none; display:grid; place-items:center; margin-top:1px; transition:all .2s var(--e)}
.req.on .tick{background:var(--live); border-color:var(--live); color:#062}
.req.on{background:color-mix(in srgb,var(--live) 9%,transparent)}
.req .sp{flex:1; min-width:0}
.req .sp b{display:block; font-size:12.5px; font-weight:600; line-height:1.5}
.req.on .sp b{color:var(--dim)}
.req .rx{width:22px; height:22px; border-radius:8px; display:grid; place-items:center;
  color:var(--dim2); flex:none; opacity:0}
.req:hover .rx{opacity:1}
.req .rx:hover{background:color-mix(in srgb,var(--red) 18%,transparent); color:var(--red)}

/* المهام الفرعية وصورها */
.xsubs{display:flex; flex-direction:column; gap:7px; margin-top:12px}
.xsub{display:flex; align-items:stretch; gap:8px}
.xsub .xt{flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:9px 11px;
  border-radius:13px; background:var(--sheen); border:0; color:var(--ink); font:inherit;
  cursor:pointer; text-align:right}
.xsub .xt:hover{background:var(--raise)}
.xsub .tick{width:22px; height:22px; border-radius:8px; border:1.6px solid var(--line2);
  flex:none; display:grid; place-items:center; font-size:10.5px; font-weight:700; color:var(--dim2)}
.xsub.on .tick{background:var(--live); border-color:var(--live); color:#062}
.xsub.on .xt b{color:var(--dim)}
.xsub .xt .sp{flex:1; min-width:0}
.xsub .xt .sp b{display:block; font-size:12.5px; line-height:1.5}
.shot{width:74px; flex:none; border-radius:13px; border:1px solid var(--line2); cursor:pointer;
  background-size:cover; background-position:center; position:relative; overflow:hidden; padding:0}
.shot:hover{border-color:var(--gold2)}
.shot .sh{position:absolute; inset-inline:0; inset-block-end:0; display:flex; align-items:center;
  gap:3px; justify-content:center; padding:3px 0;
  background:linear-gradient(transparent,rgba(0,0,0,.8)); color:#fff}
.shot .sh b{font-size:8.5px; font-weight:700}
.shotbig{height:280px; border-radius:18px; border:1px solid var(--line2);
  background-size:cover; background-position:center}

/* الملفات والعقود */
.xfiles{display:flex; flex-direction:column; gap:7px; margin-top:12px}
.xfile{display:flex; align-items:stretch; gap:7px}
.xfile .fi{flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:10px 11px;
  border-radius:13px; background:var(--sheen); border:0; color:var(--ink); font:inherit;
  cursor:pointer; text-align:right}
.xfile .fi:hover{background:var(--raise)}
.xfile .ft{width:34px; height:40px; border-radius:7px; flex:none; display:grid; place-items:center;
  background:var(--panel2); border:1px solid var(--line2); color:var(--gold2)}
.xfile .ft b{font-size:9px; font-weight:800; letter-spacing:.4px}
.xfile .sp{flex:1; min-width:0}
.xfile .sp b{display:block; font-size:12.5px}
.xfile .fx{width:34px; flex:none; border-radius:11px; background:var(--sheen); border:0;
  color:var(--dim2); cursor:pointer; display:grid; place-items:center}
.xfile .fx:hover{background:color-mix(in srgb,var(--red) 18%,transparent); color:var(--red)}

/* رقاقة فعل صغيرة */
.chipbtn{display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:10px;
  background:var(--sheen); border:1px solid transparent; color:var(--dim); font:inherit;
  font-size:11.5px; font-weight:600; cursor:pointer; flex:none}
.chipbtn:hover{border-color:var(--line2); color:var(--ink)}
.chipbtn.on{background:color-mix(in srgb,var(--live) 14%,transparent); color:var(--live)}
.chipbtn.bad:hover{background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red)}

/* رأس الدرج: حلقتان كبيرتان تُقرآن قبل أي سطر */
.xtop .xrings{display:flex; gap:16px; margin-top:14px; padding-top:14px;
  border-top:1px solid var(--line)}
.xtop .xr{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
.xtop .xr > span:last-child{min-width:0}
.xtop .xr b{display:block; font-size:12.5px}

/* العقد: وثيقة تُقرأ لا بطاقة */
.doc{background:var(--panel); border:1px solid var(--line2); border-radius:18px;
  padding:22px 20px; line-height:1.85}
.doc h4{font-size:16px; margin:0 0 3px; text-align:center}
.doc .dsub{font-size:11px; color:var(--dim2); text-align:center; padding-bottom:14px;
  border-bottom:1px solid var(--line); margin-bottom:16px}
.doc h5{font-size:12.5px; color:var(--gold2); margin:18px 0 8px}
.doc p{font-size:12.5px; color:var(--dim); margin:0 0 10px}
.doc ol{margin:0; padding-inline-start:20px; list-style-type:arabic-indic}
.doc li{font-size:12.5px; color:var(--dim); margin-bottom:6px}
.doc .dkv{display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line)}
.doc .dkv span{font-size:11.5px; color:var(--dim2); min-width:132px; flex:none}
.doc .dkv b{font-size:12.5px; font-weight:600}
.doc .dsign{display:flex; gap:22px; margin-top:26px}
.doc .dsign span{flex:1; text-align:center}
.doc .dsign b{display:block; font-size:11.5px; color:var(--dim2); margin-bottom:26px}
.doc .dsign i{display:block; border-top:1px solid var(--line2)}

/* الدرج الموسَّع: البيانات كثيرة فالعرض يتبعها، والأقسام عمودان */
.drawer.xl{width:min(1020px,96vw)}
/* التقرير ورقةٌ لا بطاقة: جداولُه سبعة أعمدة، فيحتاج عرض ورقةٍ لا عرض درج */
.drawer.paper{width:min(1340px,98vw)}
.drawer.paper .db{display:block}
.drawer.xl .db{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:start;
  /* قِيس لا خُمِّن: صفوف auto تنهار إلى حدّ الإطار هنا، و min-content تُعيدها
     إلى ارتفاع محتواها. و align-items:start يمنع مطّ الأقصر إلى طول الأطول. */
  grid-auto-rows:min-content; align-items:start}
.drawer.xl .db > .xtop, .drawer.xl .db > .doc,
.drawer.xl .db > .shotbig{grid-column:1 / -1}
@media (max-width:860px){ .drawer.xl{width:94vw} .drawer.xl .db{grid-template-columns:1fr} }

/* ══ هاتف داخل الدرج: شاشة التطبيق كما يراها الميدان ══════════
   ليست صورةً ولا لقطة — هي بيانات المهمّة نفسها مرسومةً بلغة التطبيق:
   أبيضُ على أخضر، وحوافُّ أنعم، وخطٌّ أصغر. ولذلك رموزُها هنا محلّية
   لا تتبع سمة الغرفة، فالهاتف لا يتبدّل بتبدّل وضع الشاشة. */
.phonewrap{display:flex; justify-content:center; padding:4px 0}
.phone{width:318px; flex:none; border-radius:34px; overflow:hidden;
  background:#0B1712; border:7px solid #1A1A1C;
  box-shadow:0 30px 70px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.05) inset;
  display:flex; flex-direction:column; max-height:640px;
  --pi:#EAF3ED; --pd:#9FB6A9; --pd2:#6E8779; --pln:#1B3329; --psh:#122820; --pg:#14C273}
.phone.live{border-color:#7A5F1E; box-shadow:0 30px 70px -24px rgba(0,0,0,.8), 0 0 0 2px var(--gold) inset}
.phone .pbar{display:flex; align-items:center; gap:10px; padding:13px 15px 11px;
  background:linear-gradient(180deg,#14332A,#0E241D); color:var(--pi);
  border-bottom:1px solid var(--pln)}
.phone .pbar b{flex:1; font-size:13.5px; text-align:center}
.phone .pbody{flex:1; min-height:0; overflow-y:auto; padding:12px 13px 16px;
  display:flex; flex-direction:column; gap:10px; color:var(--pi)}
.phone .pbody::-webkit-scrollbar{width:0}
.phone .pbody > *{flex:none}
.phone .av{width:28px; height:28px}
.phone .av.sm{width:28px; height:28px}

.phone .pc{border-radius:18px; padding:13px; background:var(--psh); border:1px solid var(--pln)}
.phone .pc.gold{border-color:rgba(198,168,111,.34);
  background:linear-gradient(165deg,rgba(198,168,111,.10),var(--psh))}
.phone .prow2{display:flex; gap:11px; align-items:flex-start}
.phone .prow2 .sp{flex:1; min-width:0}
.phone .prow2 b{display:block; font-size:14px; line-height:1.5}
.phone .ps{display:block; font-size:11px; line-height:1.6; color:var(--pd)}
.phone .ps.dim{color:var(--pd2)}
.phone .ps.gold{color:var(--gold3)}
.phone .pthumb{width:62px; height:62px; border-radius:14px; flex:none;
  background-size:cover; background-position:center; border:1px solid var(--pln)}
.phone .prow3{display:flex; align-items:center; justify-content:space-between;
  gap:6px; flex-wrap:wrap; margin-top:10px}

.phone .pmeta{display:grid; grid-template-columns:1fr 1fr; gap:1px; border-radius:16px;
  overflow:hidden; background:var(--pln)}
.phone .pmeta > div{background:var(--psh); padding:10px 12px}
.phone .pmeta span{display:block; font-size:9.5px; color:var(--pd2); margin-bottom:3px}
.phone .pmeta b{font-size:12px; font-weight:600}

.phone .pn{display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:14px;
  background:var(--psh); border:1px solid var(--pln); font-size:11px; line-height:1.65; color:var(--pd)}
.phone .pn.ok{border-color:rgba(20,194,115,.4); color:#8FE3B8}
.phone .pn.bad{border-color:rgba(236,79,84,.4); color:#F0A0A2}
.phone .pn > svg{flex:none; margin-top:2px}

.phone .pcta{display:flex; align-items:center; gap:11px; width:100%; padding:14px;
  border-radius:18px; border:0; cursor:pointer; text-align:right; font:inherit;
  background:linear-gradient(135deg,#177E52,#0E5738); color:#fff}
.phone .pcta.sm{padding:11px 13px}
.phone .pcta.stop{background:linear-gradient(135deg,#B3403F,#7E2A2A)}
.phone .pcta:disabled{opacity:.5; cursor:default}
.phone .pcta b{display:block; font-size:13.5px}
.phone .pcta i{display:block; font-size:10.5px; font-style:normal; opacity:.85; margin-top:2px}

.phone .plbl{display:flex; align-items:baseline; justify-content:space-between;
  font-size:11px; font-weight:700; color:var(--pd); margin:4px 2px -2px}
.phone .plbl small{font-size:10px; font-weight:500; color:var(--pd2)}
.phone .psubs{display:flex; flex-direction:column; gap:6px}
.phone .psub{display:flex; gap:7px; align-items:stretch}
.phone .psub .pt{flex:1; min-width:0; display:flex; align-items:center; gap:9px;
  padding:10px 11px; border-radius:14px; background:var(--psh); border:1px solid var(--pln);
  color:var(--pi); font:inherit; font-size:11.5px; cursor:pointer; text-align:right}
.phone .psub .pt:disabled{cursor:default}
.phone .psub .pt .sp{flex:1; min-width:0; line-height:1.55}
.phone .psub.next .pt{border-color:rgba(198,168,111,.5)}
.phone .psub.on .pt .sp{color:var(--pd2)}
.phone .ptick{width:19px; height:19px; border-radius:7px; flex:none; display:grid;
  place-items:center; border:1.5px solid var(--pln); color:#062}
.phone .psub.on .ptick{background:var(--pg); border-color:var(--pg)}
.phone .pshot{width:46px; flex:none; border-radius:13px; background-size:cover;
  background-position:center; border:1px solid var(--pln)}

.phone .pteam{display:flex; flex-direction:column; gap:6px}
.phone .pmate{display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:14px;
  background:var(--psh); border:1px solid var(--pln)}
.phone .pmate .sp{flex:1; min-width:0}
.phone .pmate b{display:block; font-size:11.5px}

.phone .ptabs{display:flex; border-top:1px solid var(--pln); background:#0E241D;
  padding:9px 0 13px}
.phone .ptabs span{flex:1; text-align:center; font-size:10px; color:var(--pd2)}
.phone .ptabs span.on{color:var(--gold3); font-weight:700}

/* ══ ترقيم الصفحات: القائمة الطويلة تُقطَّع فلا تُثقل كل ضغطة ══ */
.pager{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:14px;
  padding-top:14px; border-top:1px solid var(--line)}
.pgb{display:inline-flex; align-items:center; gap:5px; padding:7px 12px; border-radius:11px;
  background:var(--sheen); border:1px solid transparent; color:var(--dim); font:inherit;
  font-size:12px; font-weight:600; cursor:pointer}
.pgb:hover:not(:disabled){border-color:var(--line2); color:var(--ink)}
.pgb:disabled{opacity:.4; cursor:default}
.pgn{display:flex; align-items:center; gap:4px}
.pgi{min-width:30px; height:30px; border-radius:9px; background:transparent; border:0;
  color:var(--dim2); font:inherit; font-size:12px; font-weight:700; cursor:pointer}
.pgi:hover{background:var(--sheen); color:var(--ink)}
.pgi.on{background:var(--gold); color:#1a1205}
.pgd{color:var(--dim2); padding:0 2px}
.pgc{margin-inline-start:auto; font-size:11px; color:var(--dim2)}

/* ══ حالة المهمّة تُقرأ من الصندوق نفسه لا من حبّةٍ في طرفه ══
   الطرف الملوّن وحده لا يكفي: نصبغ حافّة الصفّ وأرضيّته بلون حالته
   صبغًا خفيفًا، فيُعرف من بعيدٍ أيُّ صفٍّ جارٍ وأيُّهما فات وقته. */
.trow{--tsc:var(--dim)}
.trow{border-color:color-mix(in srgb, var(--tsc) 26%, var(--line)) !important;
  background:linear-gradient(90deg, color-mix(in srgb, var(--tsc) 7%, transparent), transparent 42%)}
.trow:hover{background:linear-gradient(90deg, color-mix(in srgb, var(--tsc) 13%, transparent), transparent 52%)}
.trow .krail{width:5px; background:var(--tsc) !important}
.trow .tst{display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px;
  font-size:10.5px; font-weight:700; white-space:nowrap;
  color:var(--tsc); background:color-mix(in srgb, var(--tsc) 15%, transparent);
  border:1px solid color-mix(in srgb, var(--tsc) 34%, transparent)}
.trow .tst i{width:6px; height:6px; border-radius:50%; background:var(--tsc); display:block}
.trow.live .tst i{animation:pulse 1.8s var(--e3) infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.45; transform:scale(.72)}}

/* ══ سجلّ المهمّة: يومٌ يومًا، وخطٌّ واحد يجمعها ══ */
.hislog{position:relative; padding-inline-start:18px; margin-top:12px}
.hislog::before{content:''; position:absolute; inset-block:6px 6px; inset-inline-start:5px;
  width:1.5px; background:linear-gradient(var(--line2), transparent)}
.hisday{position:relative; font-size:10.5px; font-weight:700; color:var(--gold2);
  margin:14px 0 8px; letter-spacing:.2px}
.hisday:first-child{margin-top:0}
.hisday::before{content:''; position:absolute; inset-inline-start:-17px; top:5px;
  width:9px; height:9px; border-radius:50%; background:var(--gold); border:2px solid var(--panel)}
.hisrow{position:relative; display:flex; gap:10px; align-items:flex-start; padding:8px 0}
.hisrow::before{content:''; position:absolute; inset-inline-start:-15px; top:14px;
  width:5px; height:5px; border-radius:50%; background:var(--line2)}
.hisrow.ok::before{background:var(--live)}
.hisrow.bad::before{background:var(--red)}
.hisrow .histm{font-size:10.5px; color:var(--dim2); min-width:58px; flex:none;
  font-variant-numeric:tabular-nums; padding-top:1px}
.hisrow .histx{flex:1; min-width:0; font-size:12px; line-height:1.65; color:var(--dim)}
.hisrow.ok .histx, .hisrow.bad .histx{color:var(--ink)}

/* ══ تنبيهات المهام: الجرس وقائمته ══
   الإشعار يتبع مهمّته لا يتيه في بثٍّ عام، فعدده على الجرس وتفصيله تحته. */
.bellbtn{position:relative; width:34px; height:34px; border-radius:11px; flex:none;
  display:grid; place-items:center; background:var(--sheen); border:1px solid transparent;
  color:var(--dim2); cursor:pointer}
.bellbtn:hover{border-color:var(--line2); color:var(--ink)}
.bellbtn.has{color:var(--gold2); border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.bellbtn i{position:absolute; top:-5px; inset-inline-end:-5px; min-width:17px; height:17px;
  padding:0 4px; border-radius:99px; background:var(--red); color:#fff; font-size:9.5px;
  font-weight:800; font-style:normal; display:grid; place-items:center;
  border:2px solid var(--panel)}
.alist{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.alrow{display:flex; align-items:flex-start; gap:10px; padding:10px 11px; border-radius:14px;
  background:var(--sheen); border:1px solid transparent; cursor:pointer}
.alrow:hover{border-color:var(--line2)}
.alrow.seen{opacity:.62}
.alrow .ali{width:30px; height:30px; border-radius:10px; flex:none; display:grid;
  place-items:center}
.alrow .alx{flex:1; min-width:0}
.alrow .alx b{display:block; font-size:12.5px; font-weight:600; line-height:1.55}
.alrow .aldot{width:7px; height:7px; border-radius:50%; background:var(--red); flex:none;
  margin-top:11px}

/* ══ تقويم الجدولة: أربعة عشر يومًا × ثلاث نوافذ ══
   الخانة تقول شِفتها وعدد من يغطّيه، فيُختار الوقت وأنت تعرف من فيه. */
.calgrid{margin-top:12px; border:1px solid var(--line); border-radius:16px; overflow:hidden}
.calhead{display:grid; grid-template-columns:62px repeat(3,1fr); gap:1px;
  background:var(--line); border-bottom:1px solid var(--line)}
.calhead span{background:var(--panel2); padding:8px 6px; font-size:10.5px; font-weight:700;
  color:var(--dim2); text-align:center}
.calrow{display:grid; grid-template-columns:62px repeat(3,1fr); gap:1px; background:var(--line)}
.cald{background:var(--panel2); display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:7px 4px; gap:2px}
.cald b{font-size:10.5px; color:var(--ink)}
.cald span{font-size:12px; font-weight:700; color:var(--gold2);
  font-variant-numeric:tabular-nums}
.calc{background:var(--panel); border:0; cursor:pointer; padding:8px 4px;
  display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--dim2);
  font:inherit; transition:background .18s var(--e)}
.calc b{font-size:10px; font-weight:600}
.calc span{font-size:11px; font-weight:700; color:var(--dim)}
.calc:hover:not(.off){background:var(--raise); color:var(--ink)}
.calc.on{background:linear-gradient(160deg,var(--g3),var(--g)); color:#fff}
.calc.on b, .calc.on span{color:#fff}
.calc.off{opacity:.28; cursor:default}

/* صفّ رقاقات يلتفّ */
.chipwrap{display:flex; flex-wrap:wrap; gap:7px; margin-top:11px}
.chipwrap .chipbtn i{display:inline-block; flex:none}

/* ══ جدول التأشيرة: ثلاثة عشر عمودًا تُقرأ ولا تتزاحم ══
   لا يُطوى ولا يُقصّ — يُمرَّر أفقيًّا داخل وعائه وحده، ويبقى الصفّ
   كاملًا بأعمدته لأن كل عمود هنا يقابل عمودًا في الكشف الرسمي. */
.xtwrap{margin-top:14px; overflow-x:auto; border-radius:16px;
  border:1px solid var(--line); background:var(--panel)}
.xtwrap::-webkit-scrollbar{height:9px}
.xtwrap::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
.xtbl{min-width:1580px; display:flex; flex-direction:column}
.xtbl > *{flex:none}
.xhead{display:grid; grid-template-columns:230px 120px 170px 130px 66px 190px 74px 170px 120px 130px 94px 120px 150px;
  gap:0; position:sticky; top:0; z-index:2; background:var(--panel2);
  border-bottom:1px solid var(--line2)}
.xth{padding:11px 12px; font-size:10.5px; font-weight:700; color:var(--dim2);
  white-space:nowrap; border-inline-start:1px solid var(--line)}
.xth:first-child{border-inline-start:0}
.xrow{display:grid; grid-template-columns:230px 120px 170px 130px 66px 190px 74px 170px 120px 130px 94px 120px 150px;
  border-bottom:1px solid var(--line); cursor:pointer; transition:background .16s var(--e)}
.xrow:hover{background:var(--sheen)}
.xrow:last-child{border-bottom:0}
.xc{padding:10px 12px; font-size:11.5px; color:var(--dim); display:flex; align-items:center;
  gap:7px; min-width:0; border-inline-start:1px solid var(--line)}
.xc:first-child{border-inline-start:0}
/* رقمٌ لاتينيّ في خليّة عربية: يُقصّ من رأسه إن لم يُعطَ اتجاهه.
   والقصّ عند الطرف الصحيح بـ ellipsis لا بلا أثر. */
.xc.num{font-variant-numeric:tabular-nums; color:var(--ink); direction:ltr;
  justify-content:flex-end; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.xc.num > *{overflow:hidden; text-overflow:ellipsis}
.xc.ltr{direction:ltr; justify-content:flex-end}
.xc > b{font-size:11.5px; color:var(--ink)}
.xc .tiny{display:block}
.xc.nmc{position:relative}
.xc.nmc .nm{flex:1; min-width:0}
.xc.nmc .nm b{display:block; font-size:12px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}
.xc.nmc .nm span{display:block; font-size:10px; color:var(--dim2)}
.hdot{width:8px; height:8px; border-radius:50%; flex:none}
.xc.act{gap:8px}
.wchip{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700;
  white-space:nowrap}
.eyebtn{width:30px; height:30px; border-radius:10px; flex:none; display:grid;
  place-items:center; background:var(--sheen); border:1px solid transparent;
  color:var(--gold2); cursor:pointer}
.eyebtn:hover{border-color:var(--gold2); background:var(--raise)}
.eyebtn.big{width:40px; height:40px; border-radius:13px}

/* جدول الاكسترا كوتا: ثمانية أعمدة */
/* عقود النقل: أحد عشر عمودًا — والأرقام هي ما يُقرأ في الصفّ */
/* تضيق الأعمدة حتى تبقى أيقونات الملفّ والكشف في الشاشة — وهي المقصودة */
.xtbl.ctbl{min-width:1170px}
.xtbl.ctbl .xhead, .xtbl.ctbl .xrow{
  grid-template-columns:210px 150px 112px 66px 66px 66px 66px 124px 72px 84px 146px}
.xtbl.ctbl .xc{flex-direction:column; align-items:flex-start; justify-content:center; gap:2px}
.xtbl.ctbl .xc.num{align-items:flex-end; justify-content:center}
.xtbl.ctbl .xc.act{flex-direction:row; align-items:center; gap:7px}
/* كشف المرشدين: ستة أعمدة داخل الدرج */
.xtbl.gtbl{min-width:820px}
.xtbl.gtbl .xhead, .xtbl.gtbl .xrow{
  grid-template-columns:minmax(150px,1.4fr) 128px 140px 112px 104px 96px}

/* زرّ الرفع: لصيقةٌ تتقمّص زرًّا — والمدخل مخفيٌّ داخلها */
.eyebtn.up{cursor:pointer; position:relative}
.eyebtn.up:hover{border-color:var(--gold2); background:var(--raise)}

/* معاينة العقد كصورة: إطارٌ يُشعر أنها لقطةٌ لا صفحة */
.ctrimg{padding:16px; border-radius:18px; background:var(--panel2,var(--panel));
  border:1px solid var(--line2); box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.ctrimg .report{box-shadow:0 18px 44px rgba(0,0,0,.34); border-radius:6px}

/* العقد على ورقةٍ بيضاء: ألوان الوثيقة لا ألوان اللوحة */
/* وثيقةٌ تُقرأ: عرض الورقة لا عرض الدرج */
.report.doc2{max-width:920px; margin-inline:auto}
.doc2 h4{font-size:16.5px; margin:0 0 3px; text-align:center; color:#12201A}
.doc2 .dsub{font-size:11px; color:#5D6B63; text-align:center; padding-bottom:14px;
  border-bottom:1px solid #E3EAE4; margin-bottom:16px}
.doc2 h5{font-size:12.5px; color:#8A6A22; margin:18px 0 8px}
.doc2 p{font-size:12.5px; color:#31423A; margin:0 0 10px; line-height:1.95}
.doc2 ol{margin:0; padding-inline-start:20px; list-style-type:arabic-indic}
.doc2 li{font-size:12.5px; color:#31423A; margin-bottom:6px; line-height:1.9}
.doc2 .dkv{display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed #E3EAE4}
.doc2 .dkv span{font-size:11.5px; color:#5D6B63; min-width:180px; flex:none}
.doc2 .dkv b{font-size:12.5px; font-weight:600; color:#12201A}
.doc2 .dsign{display:flex; gap:22px; margin-top:28px}
.doc2 .dsign span{flex:1; text-align:center}
.doc2 .dsign b{display:block; font-size:11.5px; color:#5D6B63; margin-bottom:28px}
.doc2 .dsign i{display:block; border-top:1px solid #C9D4CC}

/* مصفوفة الصلاحيات: صفٌّ لكل مورد، وعمودٌ لكل فعل */
.mxlegend{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 12px}
.mxlegend span{display:inline-flex; align-items:center; gap:6px; flex:none;
  padding:6px 10px; border-radius:11px; background:var(--raise);
  border:1px solid var(--line); font-size:10.5px; color:var(--dim2)}
.mxlegend b{font-size:11px; color:var(--ink); font-weight:600}
.mx{min-width:700px; max-width:840px; margin-inline:auto; display:flex; flex-direction:column}
.mx > *{flex:none}
.mxhead, .mxr{display:grid; align-items:center;
  grid-template-columns:minmax(210px,1fr) repeat(5,78px) 66px}
.mxhead{position:sticky; top:0; z-index:2; background:var(--panel);
  border-bottom:1px solid var(--line2)}
.mxhead > span{padding:10px 8px; font-size:10.5px; font-weight:700; color:var(--dim2);
  text-align:center; letter-spacing:.2px}
.mxhead .mxn, .mxhead .mxn2{text-align:start}
.mxhead .mxn2{text-align:center}
.mxg{padding:11px 12px 6px; font-size:10.5px; font-weight:700; color:var(--gold2);
  letter-spacing:.6px; border-top:1px solid var(--line)}
.mxg:first-of-type{border-top:0}
.mxr{border-bottom:1px solid var(--line)}
.mxr:hover{background:var(--sheen)}
.mxn{display:flex; align-items:center; gap:8px; padding:9px 12px;
  font-size:12px; color:var(--ink); min-width:0}
.mxn svg{color:var(--dim2); flex:none}
.mxc{justify-self:center; width:30px; height:30px; border-radius:9px; display:grid;
  place-items:center; cursor:pointer; background:var(--raise);
  border:1px solid var(--line2); color:var(--dim2); transition:.13s}
.mxc:hover{border-color:var(--gold2)}
.mxc.on{background:color-mix(in srgb,var(--g3) 22%,transparent);
  border-color:var(--g3); color:var(--g3)}
.mxc.on.danger{background:color-mix(in srgb,var(--red) 18%,transparent);
  border-color:var(--red); color:var(--red)}
.mxall{justify-self:center; width:30px; height:30px; border-radius:9px; display:grid;
  place-items:center; cursor:pointer; background:transparent;
  border:1px dashed var(--line2); color:var(--dim2)}
.mxall:hover{border-color:var(--gold2); color:var(--gold2); border-style:solid}

.xtbl.qtbl{min-width:1080px}
.xtbl.qtbl .xhead, .xtbl.qtbl .xrow{grid-template-columns:repeat(8,minmax(120px,1fr))}
.xtbl.qtbl .xrow.bad{background:color-mix(in srgb,var(--red) 10%,transparent)}
.xtbl.qtbl .xrow.bad .xc{color:var(--red)}

/* ══ مسار إصدار البطاقة: عشر محطّات، المقطوعة منها مضيئة ══ */
