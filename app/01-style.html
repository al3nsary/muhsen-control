<title>مُحسن · الكنترول</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap">

<style>
  /* ============================================================
     مُحسن · الكنترول — نظام التصميم
     غرفة عمليات لا صفحة إدارة: سطح داكن، بيانات تتنفّس،
     خيوط ذهبية تفصل ولا تزخرف، وحركة تخدم القراءة.
     ============================================================ */
  :root{
    /* الأرضية: أخضر يميل إلى السواد — يريح العين ساعات طويلة */
    --void:#070D0A;      --deep:#0B1611;     --panel:#101E17;
    --panel2:#142620;    --line:#1D3329;     --line2:#26463A;

    /* هوية مُحسن */
    --g:#14593F;  --g2:#0C3A29;  --g3:#1D7452;  --live:#12B76A;
    --gold:#A8875A; --gold2:#C6A86F; --gold3:#E4CB98;

    /* دلالات الحالة */
    --amber:#E0A32E; --red:#E5484D; --blue:#3B9BD6; --violet:#8B6FD1;

    /* النص */
    --ink:#EAF3ED; --dim:#9DB3A7; --dim2:#6C8579; --faint:#43594D;

    --r:18px; --r2:26px;
    --f:"Almarai","SF Arabic","Segoe UI",system-ui,sans-serif;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 48px -28px rgba(0,0,0,.9);
    --glow:0 0 0 1px rgba(198,168,111,.16), 0 0 34px -12px rgba(18,183,106,.28);
    --rail:82px; --side:270px; --top:64px;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    direction:rtl; font-family:var(--f); font-size:14px; line-height:1.7;
    color:var(--ink); background:var(--void);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-align:right}
  a{color:inherit; text-decoration:none}
  :focus-visible{outline:2px solid var(--gold2); outline-offset:3px; border-radius:10px}
  ::selection{background:rgba(18,183,106,.28)}

  /* شبكة الغرفة: سكة أيقونات · لوح تنقّل · مسرح المحتوى */
  #room{display:grid; grid-template-columns:var(--rail) var(--side) 1fr; height:100%}
  #room.wide{grid-template-columns:var(--rail) 0 1fr}

  /* ---------- الخلفية الحيّة ---------- */
  .bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .bg::before{
    content:""; position:absolute; inset:-20%;
    background:
      radial-gradient(50% 40% at 78% 8%, rgba(18,183,106,.10), transparent 62%),
      radial-gradient(46% 38% at 12% 88%, rgba(168,135,90,.09), transparent 60%);
    animation:drift 26s var(--ease) infinite alternate;
  }
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(-3%,2%,0) scale(1.06)}}
  .bg .grid{
    position:absolute; inset:0; opacity:.4;
    background-image:
      linear-gradient(rgba(38,70,58,.30) 1px, transparent 1px),
      linear-gradient(90deg, rgba(38,70,58,.30) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(70% 60% at 50% 40%, #000 20%, transparent 78%);
  }

  /* ---------- سكة الأيقونات ---------- */
  .rail{
    position:relative; z-index:3; background:linear-gradient(180deg,var(--deep),var(--void));
    border-inline-start:1px solid var(--line); display:flex; flex-direction:column;
    align-items:center; padding:14px 0 12px; gap:6px;
  }
  .rail .mark{width:44px; height:44px; border-radius:14px; display:grid; place-items:center;
    background:linear-gradient(150deg,var(--g3),var(--g2));
    box-shadow:0 0 0 1px rgba(198,168,111,.4), 0 10px 24px -10px rgba(0,0,0,.9); margin-bottom:10px}
  .rail .mark i{display:block; width:24px; height:24px; background-size:contain;
    background-repeat:no-repeat; background-position:center}
  .rail button{
    width:46px; height:46px; border-radius:14px; display:grid; place-items:center;
    color:var(--dim2); position:relative; transition:color .18s var(--ease), background .18s var(--ease);
  }
  .rail button:hover{color:var(--ink); background:rgba(255,255,255,.04)}
  .rail button.on{color:var(--gold3); background:rgba(168,135,90,.12)}
  .rail button.on::before{
    content:""; position:absolute; inset-inline-end:-14px; top:12px; bottom:12px; width:3px;
    border-radius:3px; background:var(--gold2); box-shadow:0 0 14px 1px rgba(198,168,111,.7);
  }
  .rail .sp{flex:1}
  .rail .dot{position:absolute; top:9px; inset-inline-start:9px; width:7px; height:7px;
    border-radius:50%; background:var(--red); box-shadow:0 0 0 2px var(--deep)}

  /* ---------- لوح التنقّل ---------- */
  .side{
    position:relative; z-index:2; background:linear-gradient(180deg,var(--deep) 0%, var(--void) 100%);
    border-inline-start:1px solid var(--line); overflow:hidden auto; padding:16px 14px 20px;
    transition:opacity .2s var(--ease);
  }
  #room.wide .side{opacity:0; pointer-events:none}
  .side::-webkit-scrollbar{width:0}
  .side h1{font-size:16.5px; margin:2px 4px 2px; letter-spacing:-.2px}
  .side .sub{font-size:11px; color:var(--dim2); margin:0 4px 16px}
  .side .grp{font-size:10.5px; color:var(--faint); letter-spacing:.4px; margin:16px 6px 7px;
    display:flex; align-items:center; gap:8px}
  .side .grp::after{content:""; flex:1; height:1px;
    background:linear-gradient(90deg,rgba(38,70,58,.9),transparent)}
  .nav{display:flex; align-items:center; gap:10px; width:100%; padding:10px 11px; border-radius:13px;
    color:var(--dim); transition:all .16s var(--ease); position:relative}
  .nav:hover{background:rgba(255,255,255,.04); color:var(--ink)}
  .nav.on{background:linear-gradient(90deg, rgba(18,183,106,.16), rgba(18,183,106,.04));
    color:var(--ink); box-shadow:inset 0 0 0 1px rgba(18,183,106,.24)}
  .nav .ic{width:18px; height:18px; flex:none}
  .nav b{font-size:13px; font-weight:700; flex:1}
  .nav .n{font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:99px;
    background:rgba(229,72,77,.18); color:#FF9B9E; font-variant-numeric:tabular-nums}
  .nav .n.q{background:rgba(224,163,46,.16); color:#F0C46A}

  /* ---------- الشريط العلوي ---------- */
  .stage{position:relative; z-index:1; display:flex; flex-direction:column; min-width:0; overflow:hidden}
  .top{
    height:var(--top); flex:none; display:flex; align-items:center; gap:14px; padding:0 20px;
    border-bottom:1px solid var(--line); background:rgba(11,22,17,.72); backdrop-filter:blur(14px);
  }
  .top .burger{width:36px; height:36px; border-radius:11px; display:grid; place-items:center;
    color:var(--dim); background:rgba(255,255,255,.04)}
  .top .burger:hover{color:var(--ink)}
  .top h2{font-size:16px; margin:0; letter-spacing:-.2px}
  .top .crumb{font-size:11px; color:var(--dim2)}
  .top .sp{flex:1}
  .clockbox{display:flex; align-items:center; gap:9px; padding:6px 12px; border-radius:12px;
    background:rgba(255,255,255,.04); box-shadow:inset 0 0 0 1px var(--line)}
  .clockbox b{font-size:13px; font-variant-numeric:tabular-nums; letter-spacing:.4px}
  .clockbox span{font-size:10.5px; color:var(--dim2)}
  .pulse{width:8px; height:8px; border-radius:50%; background:var(--live); position:relative}
  .pulse::after{content:""; position:absolute; inset:-5px; border-radius:50%;
    border:1px solid var(--live); opacity:.6; animation:ping 2.2s var(--ease) infinite}
  @keyframes ping{0%{transform:scale(.6); opacity:.7} 70%{transform:scale(1.5); opacity:0} 100%{opacity:0}}
  .iconbtn{width:38px; height:38px; border-radius:12px; display:grid; place-items:center;
    color:var(--dim); background:rgba(255,255,255,.04); position:relative;
    transition:all .16s var(--ease)}
  .iconbtn:hover{color:var(--ink); background:rgba(255,255,255,.08)}
  .iconbtn .bdg{position:absolute; top:-4px; inset-inline-start:-4px; min-width:18px; height:18px;
    border-radius:99px; background:var(--red); color:#fff; font-size:10px; font-weight:800;
    display:grid; place-items:center; padding:0 5px; border:2px solid var(--deep)}

  /* ---------- المسرح ---------- */
  .view{flex:1; min-height:0; overflow:auto; padding:22px 24px 30px; position:relative}
  .view::-webkit-scrollbar{width:10px}
  .view::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px;
    border:3px solid transparent; background-clip:content-box}
  .view > *{animation:enter .34s var(--ease) both}
  .view > *:nth-child(1){animation-delay:0ms}
  .view > *:nth-child(2){animation-delay:40ms}
  .view > *:nth-child(3){animation-delay:78ms}
  .view > *:nth-child(4){animation-delay:112ms}
  .view > *:nth-child(n+5){animation-delay:140ms}
  @keyframes enter{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  #stagewrap.nofx .view > *{animation:none}
  @media (prefers-reduced-motion:reduce){ .view > *{animation:none} .bg::before{animation:none} }

  /* ---------- اللبنات ---------- */
  .card{
    position:relative; background:linear-gradient(180deg,var(--panel),var(--deep));
    border-radius:var(--r); padding:18px; box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .card.gold::before{
    content:""; position:absolute; inset-inline:22px; top:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  }
  .card.live{border-color:rgba(18,183,106,.30); box-shadow:var(--shadow), var(--glow)}
  .h{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .h b{font-size:15px; letter-spacing:-.2px}
  .h .sp{flex:1}
  .h .ic{color:var(--gold2)}
  .muted{color:var(--dim)} .faint{color:var(--dim2)}
  .tiny{font-size:11.5px} .sm{font-size:12.5px}
  .num{font-variant-numeric:tabular-nums}

  .grid{display:grid; gap:16px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g23{grid-template-columns:2fr 1fr}
  @media (max-width:1180px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23,.g3{grid-template-columns:1fr} }

  /* شريط المؤشّرات */
  .kpi{position:relative; overflow:hidden; padding:16px 18px}
  .kpi .lab{font-size:11.5px; color:var(--dim2); display:flex; align-items:center; gap:6px}
  .kpi b{display:block; font-size:34px; font-weight:800; line-height:1.25; letter-spacing:-1px;
    font-variant-numeric:tabular-nums; margin-top:4px}
  .kpi .sub{font-size:11px; color:var(--dim2)}
  .kpi .spark{position:absolute; inset-inline:0; bottom:0; height:38px; opacity:.5}
  .kpi.up b{color:var(--live)} .kpi.warn b{color:var(--amber)} .kpi.bad b{color:var(--red)}

  /* الحبوب */
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    border-radius:99px; padding:3px 10px; white-space:nowrap}
  .pill.live{background:rgba(18,183,106,.14); color:#5BE0A0}
  .pill.wait{background:rgba(224,163,46,.14); color:#F0C46A}
  .pill.no{background:rgba(229,72,77,.14); color:#FF9B9E}
  .pill.blue{background:rgba(59,155,214,.14); color:#8FD0F5}
  .pill.gold{background:rgba(168,135,90,.16); color:var(--gold3)}
  .pill.grey{background:rgba(255,255,255,.06); color:var(--dim)}

  /* الأزرار */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:42px;
    padding:0 16px; border-radius:13px; font-weight:700; font-size:13px;
    transition:transform .12s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease)}
  .btn:active{transform:scale(.98)}
  .btn.p{background:linear-gradient(150deg,var(--g3),var(--g2)); color:#fff;
    box-shadow:0 0 0 1px rgba(198,168,111,.32), 0 12px 26px -14px rgba(18,183,106,.8)}
  .btn.p:hover{box-shadow:0 0 0 1px rgba(198,168,111,.5), 0 16px 30px -12px rgba(18,183,106,.9)}
  .btn.l{background:rgba(255,255,255,.05); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line2)}
  .btn.l:hover{background:rgba(255,255,255,.09)}
  .btn.d{background:rgba(229,72,77,.12); color:#FF9B9E; box-shadow:inset 0 0 0 1px rgba(229,72,77,.3)}
  .btn.sm{min-height:34px; font-size:12px; padding:0 12px; border-radius:11px}

  /* الصفوف والجداول */
  .rows{display:flex; flex-direction:column}
  .row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row:hover{background:rgba(255,255,255,.02)}
  .av{width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center;
    background:rgba(255,255,255,.05); box-shadow:inset 0 0 0 1px var(--line2); overflow:hidden}
  .av svg{width:100%; height:100%}
  .nm{flex:1; min-width:0}
  .nm b{display:block; font-size:13.5px}
  .nm span{display:block; font-size:11px; color:var(--dim2)}

  /* الأيقونات */
  .ic{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round; display:block}
  .ic.s14{width:14px;height:14px;stroke-width:2} .ic.s16{width:16px;height:16px;stroke-width:1.9}
  .ic.s18{width:18px;height:18px;stroke-width:1.85} .ic.s26{width:26px;height:26px}
  .ic.f{fill:currentColor; stroke:none}

  /* تدفّق الحوادث */
  .feed{display:flex; flex-direction:column; gap:10px; max-height:520px; overflow:auto}
  .feed::-webkit-scrollbar{width:6px}
  .feed::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px}
  .evt{display:flex; gap:11px; padding:12px; border-radius:14px; background:rgba(255,255,255,.03);
    box-shadow:inset 0 0 0 1px var(--line); animation:land .4s var(--ease) both}
  @keyframes land{from{opacity:0; transform:translateX(14px)} to{opacity:1; transform:none}}
  .evt .dot{width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none; background:var(--dim2)}
  .evt.bad{box-shadow:inset 0 0 0 1px rgba(229,72,77,.34)} .evt.bad .dot{background:var(--red)}
  .evt.warn{box-shadow:inset 0 0 0 1px rgba(224,163,46,.3)} .evt.warn .dot{background:var(--amber)}
  .evt.ok .dot{background:var(--live)}
  .evt b{display:block; font-size:12.5px}
  .evt p{margin:3px 0 0; font-size:11.5px; color:var(--dim); line-height:1.65}
  .evt .t{font-size:10.5px; color:var(--faint); white-space:nowrap}

  /* شريط تقدّم */
  .meter{height:6px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden}
  .meter i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--g3),var(--live)); transition:width .6s var(--ease)}
  .meter.gold i{background:linear-gradient(90deg,var(--gold),var(--gold3))}
  .meter.red i{background:linear-gradient(90deg,#A32E32,var(--red))}

  /* خريطة المشاعر */
  .map{position:relative; height:340px; border-radius:var(--r); overflow:hidden;
    background:radial-gradient(120% 90% at 50% 20%, #10241B, #070D0A);
    box-shadow:inset 0 0 0 1px var(--line)}
  .map svg{position:absolute; inset:0; width:100%; height:100%}
  .node{position:absolute; transform:translate(50%,-50%)}
  .node .pin{width:14px; height:14px; border-radius:50%; background:var(--live);
    box-shadow:0 0 0 4px rgba(18,183,106,.16), 0 0 20px 2px rgba(18,183,106,.5)}
  .node.warn .pin{background:var(--amber); box-shadow:0 0 0 4px rgba(224,163,46,.16), 0 0 20px 2px rgba(224,163,46,.5)}
  .node.bad .pin{background:var(--red); box-shadow:0 0 0 4px rgba(229,72,77,.16), 0 0 20px 2px rgba(229,72,77,.5);
    animation:beat 1.5s var(--ease) infinite}
  @keyframes beat{0%,100%{transform:scale(1)} 50%{transform:scale(1.35)}}
  .node .lbl{position:absolute; inset-inline-end:22px; top:-6px; white-space:nowrap;
    font-size:11px; background:rgba(7,13,10,.8); padding:3px 9px; border-radius:9px;
    box-shadow:inset 0 0 0 1px var(--line2); backdrop-filter:blur(6px)}
  .dash{stroke-dasharray:5 7; animation:march 1.4s linear infinite}
  @keyframes march{to{stroke-dashoffset:-24}}

  /* حالة فارغة */
  .empty{text-align:center; padding:44px 20px; color:var(--dim2)}
  .empty .ic{width:34px; height:34px; margin:0 auto 12px; color:var(--faint)}
  .empty b{display:block; font-size:14.5px; color:var(--ink)}

  /* شريط الشعار السفلي */
  .brandfoot{display:flex; align-items:center; justify-content:center; gap:9px;
    padding:14px 0 4px; color:var(--faint); font-size:10.5px}
</style>
<style>
  /* رسالة عابرة */
  #toastwrap{position:fixed; inset-inline:0; bottom:24px; z-index:80; display:flex; justify-content:center;
    pointer-events:none}
  .toast{display:flex; align-items:center; gap:10px; padding:12px 18px; border-radius:14px;
    background:rgba(11,22,17,.94); color:var(--ink); font-size:13px; font-weight:700;
    box-shadow:0 0 0 1px var(--line2), 0 24px 50px -20px rgba(0,0,0,.9);
    backdrop-filter:blur(14px); animation:toastin .3s var(--ease) both}
  .toast.r{box-shadow:0 0 0 1px rgba(229,72,77,.4), 0 24px 50px -20px rgba(0,0,0,.9); color:#FF9B9E}
  @keyframes toastin{from{opacity:0; transform:translateY(16px) scale(.96)} to{opacity:1; transform:none}}
</style>
